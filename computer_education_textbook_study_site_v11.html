<script>

window.STUDY_DATA = {"subjects":[["🧠","컴퓨터구조","CPU·메모리·명령어 처리 원리",[["컴퓨터 기본 구조와 폰 노이만 구조","컴퓨터는 CPU, 주기억장치, 보조기억장치, 입출력장치 등으로 구성된다. 폰 노이만 구조는 명령어와 데이터를 같은 메모리에 저장하고 CPU가 이를 가져와 실행하는 프로그램 내장 방식이다.\n\n컴퓨터가 프로그램을 실행한다는 것은 명령어와 데이터를 저장장치에서 가져와 해석하고, 연산한 뒤 결과를 저장한다는 뜻이다. CPU는 명령어를 실행하고, 주기억장치는 현재 필요한 명령어와 데이터를 보관하며, 보조기억장치는 전원이 꺼져도 프로그램과 파일을 유지한다. 입출력 장치는 키보드·화면·네트워크 등 외부와 정보를 주고받는다. 이들은 주소·데이터·제어 신호로 연결된다. 폰 노이만 구조는 명령어와 데이터를 같은 메모리에 저장하므로 프로그램을 메모리에 적재해 실행하기 쉽다. 반면 명령어 인출과 데이터 접근이 같은 통로를 공유하면 폰 노이만 병목이 발생한다. 하버드 구조는 명령어와 데이터 메모리 및 경로를 분리해 동시에 접근할 수 있다. 실제 범용 CPU는 명령어·데이터 캐시를 분리한 수정 하버드 구조 등 혼합 형태를 사용하기도 한다.\n\n프로그램을 메모리에 적재해 다양한 작업을 실행할 수 있다. 다만 명령어와 데이터가 같은 통로를 사용해 전송 병목이 생길 수 있다.\n\n하버드 구조는 명령어와 데이터의 메모리 및 경로를 분리해 동시에 접근할 수 있다.\n\n폰 노이만 구조는 명령어와 데이터를 같은 메모리에 저장하고 CPU가 이를 가져와 실행하는 프로그램 내장 방식이다. 반면 명령어 인출과 데이터 접근이 같은 경로에서 경쟁할 수 있는 폰 노이만 병목이 발생한다.","프로그램을 메모리에 적재해 다양한 작업을 실행할 수 있다. 다만 명령어와 데이터가 같은 통로를 사용해 전송 병목이 생길 수 있다.","컴퓨터는 CPU, 주기억장치, 보조기억장치, 입출력장치 등으로 구성된다. 폰 노이만 구조는 명령어와 데이터를 같은 메모리에 저장하고 CPU가 이를 가져와 실행하는 프로그램 내장 방식이다.  명령어와 데이터가 동일한 주기억장치 및 전송 경로를 사용하므로 프로그램을 메모리에 적재해 실행하기 쉽다. 반면 명령어 인출과 데이터 접근이 같은 경로에서 경쟁할 수 있는 폰 노이만 병목이 발생한다. 캐시, 명령어 파이프라이닝, 메모리 대역폭 개선 등은 이 병목의 영향을 줄이는 방법이다.",["폰 노이만 구조와 하버드 구조의 차이는?","폰 노이만 병목이란?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["CPU 구성요소: ALU·제어장치·레지스터","ALU는 산술·논리 연산을 수행하고 제어장치는 명령어를 해석해 제어 신호를 보낸다. 레지스터는 CPU 내부의 고속 임시 저장공간이다.\n\nALU는 덧셈·뺄셈·비교·AND·OR·XOR·시프트 같은 산술·논리 연산을 수행한다. 결과와 함께 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그를 갱신할 수 있으며 조건 분기 명령은 이 정보를 이용한다. 제어장치는 명령어의 연산 코드와 CPU 상태를 해석해 레지스터 읽기, ALU 기능 선택, 메모리 읽기·쓰기, 분기 등에 필요한 제어 신호를 만든다. 하드와이어드 제어는 논리회로로 신호를 만들고 마이크로프로그램 제어는 마이크로명령을 사용한다. 레지스터는 CPU 내부의 고속 저장 공간이다. 범용 레지스터는 피연산자와 중간 결과를 보관하고 PC는 다음 명령어 주소, SP는 스택 위치, 상태 레지스터는 연산 결과의 조건 정보를 관리한다. 실제 레지스터 구성과 명칭은 ISA와 CPU 구현에 따라 다르다.\n\n연산, 실행 순서 통제, 데이터 임시 저장이 함께 이루어져야 명령어를 처리할 수 있다.\n\nPC는 다음 명령어 주소, IR은 현재 명령어, MAR은 메모리 주소, MDR은 메모리에서 읽거나 쓸 데이터를 저장한다.\n\nALU는 산술·논리 연산을 수행하고 제어장치는 명령어를 해석해 제어 신호를 보낸다. ALU는 덧셈·뺄셈 같은 산술 연산과 AND·OR·XOR·NOT, 비교, 시프트 같은 논리·비트 연산을 수행한다. 제어장치는 명령어의 연산 코드와 현재 CPU 상태를 바탕으로 레지스터 읽기·쓰기, ALU 연산 선택, 메모리 접근, 분기 등 각 구성요소의 동작을 제어 신호로 조정한다. 레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다.","연산, 실행 순서 통제, 데이터 임시 저장이 함께 이루어져야 명령어를 처리할 수 있다.","ALU는 산술·논리 연산을 수행하고 제어장치는 명령어를 해석해 제어 신호를 보낸다. 레지스터는 CPU 내부의 고속 임시 저장공간이다.  ALU는 덧셈·뺄셈 같은 산술 연산과 AND·OR·XOR·NOT, 비교, 시프트 같은 논리·비트 연산을 수행한다. 연산 결과뿐 아니라 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그가 조건 분기나 후속 명령에 활용될 수 있다.\n\n제어장치는 명령어의 연산 코드와 현재 CPU 상태를 바탕으로 레지스터 읽기·쓰기, ALU 연산 선택, 메모리 접근, 분기 등 각 구성요소의 동작을 제어 신호로 조정한다. 하드와이어드 제어와 마이크로프로그램 제어는 제어 신호를 생성하는 대표적인 설계 방식이다.\n\n레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["ALU와 제어장치의 차이는?","레지스터가 RAM보다 빠른 이유는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["명령어 사이클","CPU는 일반적으로 인출(Fetch), 해독(Decode), 실행(Execute), 저장(Write-back) 단계를 반복한다. PC가 가리키는 위치에서 명령어를 가져와 해석하고 연산을 수행한다.\n\n명령어 사이클은 CPU가 명령어를 가져와 해석하고 실행하는 반복 과정이다. 인출 단계에서 PC가 가리키는 주소의 명령어를 읽고, 해독 단계에서 연산 코드와 피연산자 위치를 해석한다. 실행 단계에서는 ALU 연산, 레지스터 이동, 메모리 접근, 분기 판단 등이 수행되며 결과 기록 단계에서 결과가 레지스터나 메모리에 반영된다. 순차 실행에서는 PC가 다음 명령어 위치로 이동하지만 분기·점프는 PC를 다른 주소로 바꾼다. 인터럽트와 예외가 발생하면 실행 상태를 보존하고 처리 루틴으로 이동한 뒤 복귀할 수 있다. 이 단계 모델은 설명을 위한 단순화이며 실제 CPU는 여러 명령어의 단계를 겹쳐 실행하는 파이프라이닝을 사용한다.\n\n프로그램의 명령어가 실제 하드웨어 동작으로 이어지는 기본 과정이다.\n\n인터럽트 처리 후 저장했던 실행 상태를 복원해 원래 작업으로 돌아간다.","프로그램의 명령어가 실제 하드웨어 동작으로 이어지는 기본 과정이다.","CPU는 일반적으로 인출(Fetch), 해독(Decode), 실행(Execute), 저장(Write-back) 단계를 반복한다. PC가 가리키는 위치에서 명령어를 가져와 해석하고 연산을 수행한다.  분기 명령, 인터럽트, 예외가 발생하면 다음 PC가 순차 주소가 아닌 다른 주소로 바뀌거나 정상 흐름이 중단될 수 있다. 따라서 인출·해독·실행은 기본 모델이며, 실제 CPU에서는 메모리 접근·쓰기 단계가 구분되고 여러 명령의 단계가 겹쳐 실행되기도 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["PC 레지스터의 역할은?","인터럽트가 발생하면?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["데이터 표현: 2진수·보수·부동소수점","컴퓨터는 정보를 0과 1의 비트로 표현한다. 음수는 대표적으로 2의 보수로 표현하고 실수는 부호·지수·가수로 구성된 부동소수점으로 표현한다.\n\n비트는 0 또는 1을 표현하는 최소 정보 단위이며 여러 비트를 묶어 정수·문자·이미지·명령어 등을 표현한다. n비트 2의 보수 정수의 범위는 -2^(n-1)부터 2^(n-1)-1까지다. 음수를 비트 반전 후 1을 더해 표현하면 덧셈 회로를 양수·음수에 공통으로 사용할 수 있다. 범위를 넘는 정수 연산에서는 오버플로가 발생한다. 부동소수점은 부호·지수·가수로 실수를 근사 표현한다. IEEE 754 단정도는 1/8/23비트, 배정도는 1/11/52비트의 부호/지수/fraction 필드를 사용한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수 비교에 허용 오차를 고려해야 한다. 금융처럼 10진 자릿수의 정확성이 중요하면 정수 단위나 decimal 자료형을 사용할 수 있다.\n\n정수 범위와 실수 오차 등 컴퓨터 연산의 특성을 이해하는 기반이다.\n\n2의 보수는 비트를 반전한 뒤 1을 더한다. 덧셈 회로를 재사용해 음수 연산을 단순화할 수 있다.\n\n음수는 대표적으로 2의 보수로 표현하고 실수는 부호·지수·가수로 구성된 부동소수점으로 표현한다. 부호 없는 n비트 정수의 범위는 0부터 2^n-1이고, 2의 보수 부호 있는 정수의 범위는 -2^(n-1)부터 2^(n-1)-1이다. IEEE 754 부동소수점은 부호, 지수, 가수(유효숫자)로 실수를 근사 표현한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수의 동등 비교보다 허용 오차를 둔 비교가 안전하다.","정수 범위와 실수 오차 등 컴퓨터 연산의 특성을 이해하는 기반이다.","컴퓨터는 정보를 0과 1의 비트로 표현한다. 음수는 대표적으로 2의 보수로 표현하고 실수는 부호·지수·가수로 구성된 부동소수점으로 표현한다.  2진수는 각 자릿수가 2의 거듭제곱 가중치를 갖는다. 부호 없는 n비트 정수의 범위는 0부터 2^n-1이고, 2의 보수 부호 있는 정수의 범위는 -2^(n-1)부터 2^(n-1)-1이다. 비트 폭을 벗어난 연산은 오버플로를 일으킬 수 있으므로 자료형 범위와 부호 확장을 구분해야 한다.\n\nIEEE 754 부동소수점은 부호, 지수, 가수(유효숫자)로 실수를 근사 표현한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수의 동등 비교보다 허용 오차를 둔 비교가 안전하다. NaN, 무한대, 부호 있는 0도 표현한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["2의 보수를 사용하는 이유는?","부동소수점 오차가 생기는 이유는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["기억장치 계층과 캐시","일반적인 속도 순서는 레지스터, 캐시, RAM, 보조기억장치다. 캐시는 CPU와 RAM 사이의 속도 차이를 줄이기 위해 자주 쓰는 데이터·명령어를 저장한다.\n\n레지스터·캐시·RAM·SSD/HDD는 속도·용량·가격이 다르다. CPU와 가까운 저장소일수록 빠르지만 용량이 작고 비트당 비용이 높으므로 자주 쓰는 데이터를 상위 계층에 복사해 두는 계층 구조를 사용한다. 캐시 적중은 요청 데이터가 캐시에 있는 경우이고 실패는 하위 계층에서 블록을 가져와야 하는 경우다. 시간 지역성은 최근 접근한 데이터가 다시 사용될 가능성, 공간 지역성은 접근 주소 주변의 데이터가 이어서 사용될 가능성이다. 배열 순회는 공간 지역성이 좋지만 포인터를 따라가는 연결 리스트는 캐시 미스가 늘 수 있다. 평균 접근 시간은 `AMAT = hit time + miss rate × miss penalty`로 단순화할 수 있다. 적중률뿐 아니라 실패했을 때 하위 메모리에서 가져오는 비용도 중요하다.\n\n시간적 지역성과 공간적 지역성을 활용해 평균 메모리 접근 시간을 줄인다.\n\n캐시는 일반적으로 SRAM, 주기억장치는 DRAM을 사용한다. SRAM은 빠르지만 비싸고, DRAM은 주기적 재충전이 필요하다.\n\n캐시는 CPU와 RAM 사이의 속도 차이를 줄이기 위해 자주 쓰는 데이터·명령어를 저장한다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다.","시간적 지역성과 공간적 지역성을 활용해 평균 메모리 접근 시간을 줄인다.","일반적인 속도 순서는 레지스터, 캐시, RAM, 보조기억장치다. 캐시는 CPU와 RAM 사이의 속도 차이를 줄이기 위해 자주 쓰는 데이터·명령어를 저장한다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["SRAM과 DRAM의 차이는?","지역성 원리란?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["버스와 입출력","데이터 버스는 데이터, 주소 버스는 접근 위치, 제어 버스는 읽기·쓰기 등의 제어 신호를 전달한다.\n\n폴링은 CPU가 장치 상태를 반복 확인하는 방식이고, 인터럽트 기반 I/O는 장치가 처리가 필요할 때 CPU에 신호를 보내도록 한다. CPU는 현재 문맥을 보존하고 인터럽트 서비스 루틴을 실행한 뒤 복귀한다. DMA는 장치와 메모리 사이의 데이터 블록 전송을 DMA 컨트롤러가 수행하게 해 CPU의 복사 부담을 줄인다. CPU는 전송 주소·길이·방향을 설정하고 완료 시 인터럽트를 처리할 수 있다. DMA가 CPU를 완전히 제거하는 것은 아니며 버스 대역폭 경쟁, 캐시와 DMA 버퍼의 일관성, 장치가 접근 가능한 메모리 영역 등을 고려해야 한다.\n\n버스는 주소·데이터·제어 신호를 전달한다. 주소 버스 폭은 표현 가능한 주소 공간과 관련되고 데이터 버스 폭은 한 번에 전달할 수 있는 데이터 양에 영향을 준다. 다만 실제 대역폭은 버스 폭뿐 아니라 전송 주파수, 프로토콜, 동시 전송, 장치 지연에 좌우된다. 폴링은 구현이 단순하지만 CPU가 상태를 계속 확인하고, 인터럽트는 CPU가 다른 작업을 수행하다 알림을 받을 수 있다. 대량 전송은 DMA가 효율적이지만 CPU와 장치가 메모리 버스를 공유하므로 대역폭 경쟁이 발생할 수 있다.\n\nCPU·메모리·입출력장치가 정보를 주고받는 통로다.\n\nn비트 주소는 이론상 2의 n제곱 개 주소를 표현할 수 있다.","CPU·메모리·입출력장치가 정보를 주고받는 통로다.","데이터 버스는 데이터, 주소 버스는 접근 위치, 제어 버스는 읽기·쓰기 등의 제어 신호를 전달한다.  이 개념을 실제 CPU에서 설명할 때는 ISA가 소프트웨어에 보이는 명령어·레지스터·주소 체계를 정의하고, 마이크로아키텍처가 이를 내부 회로와 실행 단계로 구현한다는 구분을 유지해야 한다. 구현 방식은 프로세서마다 다를 수 있으므로 특정 구현의 세부사항을 모든 CPU의 공통 규칙으로 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["주소 버스 폭이 커지면?","폴링과 인터럽트 차이는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["파이프라이닝과 병렬처리","파이프라이닝은 명령어 실행 단계를 나누고 서로 다른 명령어를 겹쳐 처리해 처리량을 높이는 기법이다.\n\n파이프라인의 이상적 처리량은 단계 수와 클럭 주기에 따라 높아질 수 있지만 실제 속도 향상은 단계별 지연 균형, 파이프라인 레지스터 오버헤드, 해저드와 분기 예측 실패에 의해 제한된다. 데이터 해저드에는 RAW(Read After Write), WAR(Write After Read), WAW(Write After Write)가 있으며 단순한 5단계 파이프라인에서는 RAW가 대표적이다. 레지스터 리네이밍은 WAR·WAW처럼 이름이 같아서 생기는 가짜 의존성을 줄일 수 있다. 파이프라인 깊이를 늘리면 클럭을 높일 여지가 있지만 분기 오예측 시 비워야 할 단계가 많아질 수 있다.\n\nCPU의 각 처리 단계를 효율적으로 활용한다.\n\n데이터 해저드는 이전 명령의 결과가 필요한 경우, 제어 해저드는 분기, 구조적 해저드는 자원 충돌에서 발생한다.","CPU의 각 처리 단계를 효율적으로 활용한다.","파이프라이닝은 명령어 실행 단계를 나누고 서로 다른 명령어를 겹쳐 처리해 처리량을 높이는 기법이다.  이 개념을 실제 CPU에서 설명할 때는 ISA가 소프트웨어에 보이는 명령어·레지스터·주소 체계를 정의하고, 마이크로아키텍처가 이를 내부 회로와 실행 단계로 구현한다는 구분을 유지해야 한다. 구현 방식은 프로세서마다 다를 수 있으므로 특정 구현의 세부사항을 모든 CPU의 공통 규칙으로 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["파이프라인 해저드의 종류는?","파이프라이닝과 멀티코어의 차이는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["명령어 집합 구조(ISA)와 RISC·CISC","명령어 집합 구조(ISA)는 소프트웨어가 CPU에 요청할 수 있는 명령어, 레지스터, 데이터 형식, 주소 지정 방식 등을 정의한 하드웨어와 소프트웨어 사이의 약속이다. RISC는 비교적 단순하고 규칙적인 명령어를 사용하며, CISC는 복잡한 명령어를 제공해 한 명령어가 여러 작업을 수행할 수 있도록 설계하는 경향이 있다. 현대 CPU는 두 방식의 장점을 혼합하기도 한다.\n\nISA는 명령어 종류·형식·레지스터·데이터 형식·주소 지정·예외 처리 등 소프트웨어가 관찰하는 CPU의 규격이다. 같은 ISA를 구현한 CPU는 내부 구조가 달라도 동일한 기계어 프로그램을 실행할 수 있다. 마이크로아키텍처는 해당 ISA를 실제 파이프라인·캐시·실행 유닛·제어 회로로 구현한 방식이다. RISC는 단순하고 규칙적인 명령어를 통해 파이프라인과 하드웨어 설계를 단순화하려는 철학이고, CISC는 복잡한 명령어와 다양한 주소 지정으로 한 명령어가 더 많은 작업을 표현하도록 발전했다. 현대 CPU는 복잡한 명령어를 내부의 단순한 마이크로 연산으로 바꾸기도 하므로 RISC/CISC를 단순히 속도 우열로 구분하면 부정확하다.\n\n같은 프로그램이라도 ISA와 구현 방식에 따라 명령어 수, 실행 시간, 전력 소모가 달라진다. ISA는 명령어의 규칙이고 마이크로아키텍처는 그 규칙을 실제 회로로 구현하는 방식이라는 구분도 중요하다.\n\nARM과 x86은 대표적인 ISA 계열로 볼 수 있다. 같은 ISA를 구현한 CPU라도 코어 수, 캐시 크기, 파이프라인 설계에 따라 성능이 다르다.\n\n명령어 집합 구조(ISA)는 소프트웨어가 CPU에 요청할 수 있는 명령어, 레지스터, 데이터 형식, 주소 지정 방식 등을 정의한 하드웨어와 소프트웨어 사이의 약속이다. RISC는 비교적 단순하고 규칙적인 명령어를 사용하며, CISC는 복잡한 명령어를 제공해 한 명령어가 여러 작업을 수행할 수 있도록 설계하는 경향이 있다. 레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다.","같은 프로그램이라도 ISA와 구현 방식에 따라 명령어 수, 실행 시간, 전력 소모가 달라진다. ISA는 명령어의 규칙이고 마이크로아키텍처는 그 규칙을 실제 회로로 구현하는 방식이라는 구분도 중요하다.","명령어 집합 구조(ISA)는 소프트웨어가 CPU에 요청할 수 있는 명령어, 레지스터, 데이터 형식, 주소 지정 방식 등을 정의한 하드웨어와 소프트웨어 사이의 약속이다. RISC는 비교적 단순하고 규칙적인 명령어를 사용하며, CISC는 복잡한 명령어를 제공해 한 명령어가 여러 작업을 수행할 수 있도록 설계하는 경향이 있다. 현대 CPU는 두 방식의 장점을 혼합하기도 한다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["ISA와 마이크로아키텍처는 어떻게 다른가?","RISC가 항상 CISC보다 빠른가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["주소 지정 방식과 명령어 형식","명령어는 연산 코드와 피연산자 정보를 포함한다. 주소 지정 방식은 연산에 사용할 데이터가 어디에 있는지 지정하는 방법으로 즉시, 직접, 간접, 레지스터, 레지스터 간접, 인덱스 방식 등이 있다.\n\n주소 지정 방식은 명령어의 피연산자 위치를 해석하는 규칙이다. 즉시값은 상수 자체가 명령어에 들어가므로 추가 메모리 읽기가 필요 없지만 표현 가능한 상수 크기에 제한이 있다. 레지스터 방식은 빠르지만 레지스터 수에 제한이 있다. 베이스+오프셋은 배열 주소 계산과 스택 프레임 접근에 자주 사용된다. PC 상대 주소 지정은 현재 PC를 기준으로 상대 오프셋을 더해 분기 목적지를 계산하므로 코드가 메모리의 다른 위치로 이동해도 상대적 배치가 유지되면 재배치에 유리하다.\n\n명령어의 길이와 주소 지정 방식은 명령어 해독의 복잡도, 코드 크기, 메모리 접근 횟수에 영향을 준다.\n\n주소 지정 방식은 배열, 포인터, 스택 접근 등 고급 언어의 표현이 기계 명령어로 변환되는 과정을 이해하는 데 연결된다.\n\n주소 지정 방식은 연산에 사용할 데이터가 어디에 있는지 지정하는 방법으로 즉시, 직접, 간접, 레지스터, 레지스터 간접, 인덱스 방식 등이 있다. 레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다.","명령어의 길이와 주소 지정 방식은 명령어 해독의 복잡도, 코드 크기, 메모리 접근 횟수에 영향을 준다.","명령어는 연산 코드와 피연산자 정보를 포함한다. 주소 지정 방식은 연산에 사용할 데이터가 어디에 있는지 지정하는 방법으로 즉시, 직접, 간접, 레지스터, 레지스터 간접, 인덱스 방식 등이 있다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["즉시 주소 지정과 직접 주소 지정의 차이는?","간접 주소 지정은 어떤 장점과 비용이 있는가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["캐시 매핑과 쓰기 정책","캐시는 메모리 블록을 캐시의 어느 위치에 둘지 정하는 매핑 방식을 사용한다. 직접 사상은 한 블록이 특정 캐시 라인에만 들어가고, 완전 연관 사상은 어느 라인에도 들어갈 수 있으며, 집합 연관 사상은 집합 내 여러 라인 중 하나를 선택한다. 쓰기 정책에는 write-through와 write-back 등이 있다.\n\n레지스터·캐시·RAM·SSD/HDD는 속도·용량·가격이 다르다. CPU와 가까운 저장소일수록 빠르지만 용량이 작고 비트당 비용이 높으므로 자주 쓰는 데이터를 상위 계층에 복사해 두는 계층 구조를 사용한다. 캐시 적중은 요청 데이터가 캐시에 있는 경우이고 실패는 하위 계층에서 블록을 가져와야 하는 경우다. 시간 지역성은 최근 접근한 데이터가 다시 사용될 가능성, 공간 지역성은 접근 주소 주변의 데이터가 이어서 사용될 가능성이다. 배열 순회는 공간 지역성이 좋지만 포인터를 따라가는 연결 리스트는 캐시 미스가 늘 수 있다. 평균 접근 시간은 `AMAT = hit time + miss rate × miss penalty`로 단순화할 수 있다. 적중률뿐 아니라 실패했을 때 하위 메모리에서 가져오는 비용도 중요하다.\n\n캐시 주소는 태그·인덱스·블록 오프셋으로 나누어 해석할 수 있다. 인덱스는 집합을 선택하고 태그는 해당 라인이 요청한 메모리 블록인지 확인하며 오프셋은 블록 안의 바이트를 고른다. 직접 사상은 충돌 미스가 발생하기 쉽고 완전 연관은 탐색 회로가 복잡하며 집합 연관은 절충안이다. 쓰기 미스 때 블록을 캐시에 가져오는 write-allocate와 캐시를 거치지 않는 no-write-allocate, 하위 계층까지 즉시 쓰는 write-through와 교체 때 반영하는 write-back은 서로 다른 정책 축이다.\n\n캐시 용량뿐 아니라 충돌 미스, 교체 정책, 쓰기 정책이 실제 성능에 영향을 준다.\n\n캐시 미스는 처음 접근하는 compulsory miss, 용량 부족에 따른 capacity miss, 같은 위치를 두고 경쟁하는 conflict miss로 구분할 수 있다.\n\n캐시는 메모리 블록을 캐시의 어느 위치에 둘지 정하는 매핑 방식을 사용한다. 직접 사상은 한 블록이 특정 캐시 라인에만 들어가고, 완전 연관 사상은 어느 라인에도 들어갈 수 있으며, 집합 연관 사상은 집합 내 여러 라인 중 하나를 선택한다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다.","캐시 용량뿐 아니라 충돌 미스, 교체 정책, 쓰기 정책이 실제 성능에 영향을 준다.","캐시는 메모리 블록을 캐시의 어느 위치에 둘지 정하는 매핑 방식을 사용한다. 직접 사상은 한 블록이 특정 캐시 라인에만 들어가고, 완전 연관 사상은 어느 라인에도 들어갈 수 있으며, 집합 연관 사상은 집합 내 여러 라인 중 하나를 선택한다. 쓰기 정책에는 write-through와 write-back 등이 있다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["캐시 미스의 종류를 설명해보세요.","write-through와 write-back의 차이는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["인터럽트·DMA·입출력 제어","인터럽트는 CPU가 현재 실행 흐름을 잠시 중단하고 우선 처리해야 할 사건을 처리하도록 알리는 신호다. DMA는 CPU가 데이터 한 단위씩 옮기지 않아도 입출력 장치와 메모리 사이의 데이터 전송을 담당하는 방식이다.\n\n폴링은 CPU가 장치 상태를 반복 확인하는 방식이고, 인터럽트 기반 I/O는 장치가 처리가 필요할 때 CPU에 신호를 보내도록 한다. CPU는 현재 문맥을 보존하고 인터럽트 서비스 루틴을 실행한 뒤 복귀한다. DMA는 장치와 메모리 사이의 데이터 블록 전송을 DMA 컨트롤러가 수행하게 해 CPU의 복사 부담을 줄인다. CPU는 전송 주소·길이·방향을 설정하고 완료 시 인터럽트를 처리할 수 있다. DMA가 CPU를 완전히 제거하는 것은 아니며 버스 대역폭 경쟁, 캐시와 DMA 버퍼의 일관성, 장치가 접근 가능한 메모리 영역 등을 고려해야 한다.\n\n대용량 입출력에서 CPU 부담을 줄이고 장치 응답을 효율적으로 처리할 수 있다.\n\nDMA도 버스와 메모리 대역폭을 사용하므로 CPU와 메모리 접근 경쟁이 생길 수 있다.\n\n인터럽트는 CPU가 현재 실행 흐름을 잠시 중단하고 우선 처리해야 할 사건을 처리하도록 알리는 신호다. DMA는 CPU가 데이터 한 단위씩 옮기지 않아도 입출력 장치와 메모리 사이의 데이터 전송을 담당하는 방식이다. DMA는 CPU가 데이터의 모든 바이트를 직접 복사하지 않고 장치와 메모리 사이의 전송을 DMA 컨트롤러에 맡기는 방식이다. CPU는 전송 주소·크기·방향을 설정하고 다른 작업을 수행할 수 있으며, 전송 완료 시 인터럽트 등으로 통지받는다. 인터럽트는 장치나 내부 예외가 CPU의 현재 실행 흐름에 개입하도록 알리는 메커니즘이다. 폴링과 비교하면 불필요한 반복 확인을 줄일 수 있지만, 우선순위·마스킹·중첩 인터럽트 관리가 중요하다.","대용량 입출력에서 CPU 부담을 줄이고 장치 응답을 효율적으로 처리할 수 있다.","인터럽트는 CPU가 현재 실행 흐름을 잠시 중단하고 우선 처리해야 할 사건을 처리하도록 알리는 신호다. DMA는 CPU가 데이터 한 단위씩 옮기지 않아도 입출력 장치와 메모리 사이의 데이터 전송을 담당하는 방식이다.  DMA는 CPU가 데이터의 모든 바이트를 직접 복사하지 않고 장치와 메모리 사이의 전송을 DMA 컨트롤러에 맡기는 방식이다. CPU는 전송 주소·크기·방향을 설정하고 다른 작업을 수행할 수 있으며, 전송 완료 시 인터럽트 등으로 통지받는다. 캐시 일관성 및 버퍼 관리가 필요할 수 있다.\n\n인터럽트는 장치나 내부 예외가 CPU의 현재 실행 흐름에 개입하도록 알리는 메커니즘이다. CPU는 실행 문맥을 보존하고 인터럽트 서비스 루틴을 수행한 뒤 복귀한다. 폴링과 비교하면 불필요한 반복 확인을 줄일 수 있지만, 우선순위·마스킹·중첩 인터럽트 관리가 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["폴링과 인터럽트의 장단점은?","DMA가 CPU를 완전히 사용하지 않는다는 뜻인가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["메모리 계층·지역성·평균 접근 시간","기억장치는 속도, 용량, 가격의 상충 관계에 따라 레지스터·캐시·주기억장치·보조기억장치 계층으로 구성된다. 평균 메모리 접근 시간(AMAT)은 캐시 적중 시간과 미스 발생 확률 및 미스 페널티를 고려해 계산한다.\n\n레지스터·캐시·RAM·SSD/HDD는 속도·용량·가격이 다르다. CPU와 가까운 저장소일수록 빠르지만 용량이 작고 비트당 비용이 높으므로 자주 쓰는 데이터를 상위 계층에 복사해 두는 계층 구조를 사용한다. 캐시 적중은 요청 데이터가 캐시에 있는 경우이고 실패는 하위 계층에서 블록을 가져와야 하는 경우다. 시간 지역성은 최근 접근한 데이터가 다시 사용될 가능성, 공간 지역성은 접근 주소 주변의 데이터가 이어서 사용될 가능성이다. 배열 순회는 공간 지역성이 좋지만 포인터를 따라가는 연결 리스트는 캐시 미스가 늘 수 있다. 평균 접근 시간은 `AMAT = hit time + miss rate × miss penalty`로 단순화할 수 있다. 적중률뿐 아니라 실패했을 때 하위 메모리에서 가져오는 비용도 중요하다.\n\n빠른 기억장치는 비싸고 용량이 작으므로 계층 구조로 비용 대비 성능을 높인다.\n\n배열을 순차적으로 순회하는 코드는 공간적 지역성을 잘 활용하지만, 포인터를 따라 무작위로 접근하는 코드는 캐시 효율이 낮을 수 있다.\n\n기억장치는 속도, 용량, 가격의 상충 관계에 따라 레지스터·캐시·주기억장치·보조기억장치 계층으로 구성된다. 평균 메모리 접근 시간(AMAT)은 캐시 적중 시간과 미스 발생 확률 및 미스 페널티를 고려해 계산한다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 시간 지역성은 최근 접근한 데이터가 다시 접근될 가능성이 높다는 성질이고, 공간 지역성은 접근한 주소 주변의 데이터가 곧 사용될 가능성이 높다는 성질이다. 순차 배열 접근은 공간 지역성을, 반복문에서 같은 변수 재사용은 시간 지역성을 활용하는 예다.","빠른 기억장치는 비싸고 용량이 작으므로 계층 구조로 비용 대비 성능을 높인다.","기억장치는 속도, 용량, 가격의 상충 관계에 따라 레지스터·캐시·주기억장치·보조기억장치 계층으로 구성된다. 평균 메모리 접근 시간(AMAT)은 캐시 적중 시간과 미스 발생 확률 및 미스 페널티를 고려해 계산한다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다.\n\n시간 지역성은 최근 접근한 데이터가 다시 접근될 가능성이 높다는 성질이고, 공간 지역성은 접근한 주소 주변의 데이터가 곧 사용될 가능성이 높다는 성질이다. 순차 배열 접근은 공간 지역성을, 반복문에서 같은 변수 재사용은 시간 지역성을 활용하는 예다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["캐시 적중률이 90%에서 95%로 오르면 어떤 의미인가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["파이프라인 해저드와 성능 한계","파이프라인 해저드는 다음 명령어를 계획한 시점에 실행하기 어렵게 만드는 상황이다. 데이터 해저드는 이전 명령어의 결과가 필요할 때, 제어 해저드는 분기 결과를 알기 전, 구조적 해저드는 하드웨어 자원을 동시에 요구할 때 발생한다.\n\n파이프라이닝은 명령어 실행을 인출·해독·실행·메모리 접근·결과 기록 단계로 나누고 서로 다른 명령어의 단계를 겹쳐 처리해 처리량을 높인다. 한 명령어가 실행 단계에 있을 때 다음 명령어는 해독 단계에 있을 수 있다. 파이프라이닝은 단위 시간당 완료하는 명령어 수를 높이지만 한 명령어의 시작부터 완료까지 걸리는 지연 시간을 반드시 줄이지는 않는다. 구조적 해저드는 같은 하드웨어 자원을 동시에 요구할 때, 데이터 해저드는 앞 명령의 결과를 뒤 명령이 필요로 할 때, 제어 해저드는 분기 결과에 따라 다음 명령어가 달라질 때 발생한다. 포워딩은 결과를 레지스터에 기록하기 전에 전달하고, 스톨은 필요한 값이 준비될 때까지 대기하며, 분기 예측은 실행 경로를 추정한다.\n\n파이프라인 단계 수를 늘리는 것만으로 성능이 계속 향상되지는 않는다. 해저드와 분기 예측 실패, 단계 간 불균형이 성능을 제한한다.\n\n파이프라이닝은 여러 명령어를 겹쳐 처리해 단위 시간당 완료되는 명령어 수를 늘리는 데 초점이 있다.\n\n파이프라인 해저드는 다음 명령어를 계획한 시점에 실행하기 어렵게 만드는 상황이다. 단계 수가 늘어도 한 명령어의 지연시간이 같은 비율로 줄어드는 것은 아니며, 해저드와 분기 실패, 메모리 지연이 성능 향상을 제한한다.","파이프라인 단계 수를 늘리는 것만으로 성능이 계속 향상되지는 않는다. 해저드와 분기 예측 실패, 단계 간 불균형이 성능을 제한한다.","파이프라인 해저드는 다음 명령어를 계획한 시점에 실행하기 어렵게 만드는 상황이다. 데이터 해저드는 이전 명령어의 결과가 필요할 때, 제어 해저드는 분기 결과를 알기 전, 구조적 해저드는 하드웨어 자원을 동시에 요구할 때 발생한다.  파이프라이닝은 명령어 실행을 인출·해독·실행·메모리 접근·쓰기 등의 단계로 나누고 서로 다른 명령어의 단계를 중첩해 처리량을 높인다. 단계 수가 늘어도 한 명령어의 지연시간이 같은 비율로 줄어드는 것은 아니며, 해저드와 분기 실패, 메모리 지연이 성능 향상을 제한한다.\n\n구조적 해저드는 하드웨어 자원을 동시에 요구할 때, 데이터 해저드는 앞선 명령의 결과를 뒤 명령이 필요로 할 때, 제어 해저드는 분기 결과가 확정되기 전에 다음 실행 경로를 정해야 할 때 발생한다. 포워딩, 스톨, 명령어 재배치, 분기 예측 등으로 완화한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["포워딩과 스톨은 각각 무엇인가?","파이프라인이 명령어 하나의 실행 시간을 반드시 줄이는가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["부동소수점 IEEE 754와 표현 오차","실수는 부호 비트, 지수부, 가수부로 나누어 근사 표현한다. IEEE 754는 단정도와 배정도 형식을 정의하며, 10진 소수 중 일부는 2진수로 유한하게 표현되지 않아 반올림 오차가 생긴다.\n\n비트는 0 또는 1을 표현하는 최소 정보 단위이며 여러 비트를 묶어 정수·문자·이미지·명령어 등을 표현한다. n비트 2의 보수 정수의 범위는 -2^(n-1)부터 2^(n-1)-1까지다. 음수를 비트 반전 후 1을 더해 표현하면 덧셈 회로를 양수·음수에 공통으로 사용할 수 있다. 범위를 넘는 정수 연산에서는 오버플로가 발생한다. 부동소수점은 부호·지수·가수로 실수를 근사 표현한다. IEEE 754 단정도는 1/8/23비트, 배정도는 1/11/52비트의 부호/지수/fraction 필드를 사용한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수 비교에 허용 오차를 고려해야 한다. 금융처럼 10진 자릿수의 정확성이 중요하면 정수 단위나 decimal 자료형을 사용할 수 있다.\n\n실수 비교, 금융·과학 계산, 오버플로와 언더플로 등 프로그램 결과를 이해하는 데 필요하다.\n\n실수 동등 비교 대신 |a-b|가 작은 허용 오차보다 작은지 확인하는 방식이 활용된다.\n\nIEEE 754는 단정도와 배정도 형식을 정의하며, 10진 소수 중 일부는 2진수로 유한하게 표현되지 않아 반올림 오차가 생긴다. IEEE 754 부동소수점은 부호, 지수, 가수(유효숫자)로 실수를 근사 표현한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수의 동등 비교보다 허용 오차를 둔 비교가 안전하다.","실수 비교, 금융·과학 계산, 오버플로와 언더플로 등 프로그램 결과를 이해하는 데 필요하다.","실수는 부호 비트, 지수부, 가수부로 나누어 근사 표현한다. IEEE 754는 단정도와 배정도 형식을 정의하며, 10진 소수 중 일부는 2진수로 유한하게 표현되지 않아 반올림 오차가 생긴다.  2진수는 각 자릿수가 2의 거듭제곱 가중치를 갖는다. 부호 없는 n비트 정수의 범위는 0부터 2^n-1이고, 2의 보수 부호 있는 정수의 범위는 -2^(n-1)부터 2^(n-1)-1이다. 비트 폭을 벗어난 연산은 오버플로를 일으킬 수 있으므로 자료형 범위와 부호 확장을 구분해야 한다.\n\nIEEE 754 부동소수점은 부호, 지수, 가수(유효숫자)로 실수를 근사 표현한다. 0.1처럼 2진수로 유한하게 표현되지 않는 값은 반올림 오차가 생기므로 실수의 동등 비교보다 허용 오차를 둔 비교가 안전하다. NaN, 무한대, 부호 있는 0도 표현한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정수와 부동소수점은 어떻게 다른가?","부동소수점에서 0.1+0.2가 0.3과 다르게 나올 수 있는 이유는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["메모리 주소 공간과 주소 변환","프로그램이 사용하는 가상 주소는 페이지 테이블을 통해 물리 주소로 변환된다. MMU가 변환을 담당하고 TLB는 최근 주소 변환 결과를 캐시해 변환 비용을 줄인다.\n\n프로세스 격리, 메모리 보호, 가상 메모리의 실제 동작을 연결해 이해할 수 있다.\n\nTLB 미스는 변환 정보가 TLB에 없어 페이지 테이블을 확인하는 상황이고, 페이지 폴트는 필요한 페이지가 현재 메모리에 없거나 접근 권한 문제가 있는 상황이다.\n\n프로그램이 사용하는 가상 주소는 페이지 테이블을 통해 물리 주소로 변환된다. MMU가 변환을 담당하고 TLB는 최근 주소 변환 결과를 캐시해 변환 비용을 줄인다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 주소 변환은 페이지 테이블 접근 비용이 들 수 있어 TLB가 최근 변환 결과를 캐시한다. TLB는 가상 페이지 번호와 물리 프레임 번호의 변환 정보를 저장하는 고속 캐시다. TLB 적중이면 페이지 테이블을 매번 메모리에서 조회하지 않아도 되지만, 미스가 나면 페이지 테이블 탐색이 필요하다. 문맥 전환 때 주소 공간 식별자(ASID) 사용 여부 등에 따라 TLB 관리 방식이 달라진다.","프로세스 격리, 메모리 보호, 가상 메모리의 실제 동작을 연결해 이해할 수 있다.","프로그램이 사용하는 가상 주소는 페이지 테이블을 통해 물리 주소로 변환된다. MMU가 변환을 담당하고 TLB는 최근 주소 변환 결과를 캐시해 변환 비용을 줄인다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다.\n\n가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 프로세스마다 주소 공간을 분리하면 보호와 재배치가 쉬워진다. 주소 변환은 페이지 테이블 접근 비용이 들 수 있어 TLB가 최근 변환 결과를 캐시한다.\n\nTLB는 가상 페이지 번호와 물리 프레임 번호의 변환 정보를 저장하는 고속 캐시다. TLB 적중이면 페이지 테이블을 매번 메모리에서 조회하지 않아도 되지만, 미스가 나면 페이지 테이블 탐색이 필요하다. 문맥 전환 때 주소 공간 식별자(ASID) 사용 여부 등에 따라 TLB 관리 방식이 달라진다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["가상 주소와 물리 주소의 차이는?","TLB 미스와 페이지 폴트는 같은가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["명령어 수준 병렬성과 멀티코어","명령어 수준 병렬성은 한 코어 안에서 서로 의존성이 없는 명령어를 겹치거나 동시에 처리하는 특성이다. 멀티코어는 여러 처리 코어를 두어 스레드나 작업을 병렬 실행한다.\n\n멀티코어의 성능은 코어 수만으로 결정되지 않는다. 스레드가 공유하는 데이터에 잠금이 많으면 동기화 대기 때문에 병렬성이 낮아지고, 여러 코어가 같은 캐시 라인을 반복 수정하면 캐시 일관성 트래픽이 증가한다. 메모리 대역폭이 포화되면 코어를 더 추가해도 처리량이 늘지 않을 수 있다. 병렬 프로그램에서는 작업 분할의 균형, 데이터 지역성, 통신량, 순차 구간의 비율을 함께 최적화해야 한다.\n\n병렬처리의 성능 향상과 한계, 프로그램의 병렬화 필요성을 이해하는 핵심이다.\n\n암달의 법칙은 병렬화할 수 없는 순차 부분이 전체 성능 향상의 상한을 제한한다는 점을 설명한다.\n\n명령어 수준 병렬성은 한 코어 안에서 서로 의존성이 없는 명령어를 겹치거나 동시에 처리하는 특성이다.","병렬처리의 성능 향상과 한계, 프로그램의 병렬화 필요성을 이해하는 핵심이다.","명령어 수준 병렬성은 한 코어 안에서 서로 의존성이 없는 명령어를 겹치거나 동시에 처리하는 특성이다. 멀티코어는 여러 처리 코어를 두어 스레드나 작업을 병렬 실행한다.  이 개념을 실제 CPU에서 설명할 때는 ISA가 소프트웨어에 보이는 명령어·레지스터·주소 체계를 정의하고, 마이크로아키텍처가 이를 내부 회로와 실행 단계로 구현한다는 구분을 유지해야 한다. 구현 방식은 프로세서마다 다를 수 있으므로 특정 구현의 세부사항을 모든 CPU의 공통 규칙으로 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["병렬처리의 오버헤드는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["캐시 일관성과 멀티프로세서","여러 코어가 동일한 메모리 주소의 데이터를 각자 캐시에 보관하면 한 코어의 변경이 다른 코어 캐시와 불일치할 수 있다. 캐시 일관성 프로토콜은 캐시 복사본의 상태와 갱신을 조정한다.\n\n레지스터·캐시·RAM·SSD/HDD는 속도·용량·가격이 다르다. CPU와 가까운 저장소일수록 빠르지만 용량이 작고 비트당 비용이 높으므로 자주 쓰는 데이터를 상위 계층에 복사해 두는 계층 구조를 사용한다. 캐시 적중은 요청 데이터가 캐시에 있는 경우이고 실패는 하위 계층에서 블록을 가져와야 하는 경우다. 시간 지역성은 최근 접근한 데이터가 다시 사용될 가능성, 공간 지역성은 접근 주소 주변의 데이터가 이어서 사용될 가능성이다. 배열 순회는 공간 지역성이 좋지만 포인터를 따라가는 연결 리스트는 캐시 미스가 늘 수 있다. 평균 접근 시간은 `AMAT = hit time + miss rate × miss penalty`로 단순화할 수 있다. 적중률뿐 아니라 실패했을 때 하위 메모리에서 가져오는 비용도 중요하다.\n\n캐시 일관성 프로토콜은 동일한 메모리 블록의 여러 캐시 사본이 서로 모순된 값을 제공하지 않도록 상태를 조정한다. MESI의 Modified는 해당 캐시만 수정된 최신 값을 보유하고, Exclusive는 다른 캐시와 공유되지 않은 깨끗한 사본이며, Shared는 여러 캐시에 읽기 사본이 있고, Invalid는 사용할 수 없는 상태다. 한 코어가 Shared 라인을 쓰려면 다른 사본을 무효화해 독점 권한을 얻는다. false sharing은 서로 다른 변수라도 같은 캐시 라인에 놓여 코어 간 무효화가 반복되는 성능 문제다.\n\n멀티코어 환경에서 공유 데이터가 왜 복잡해지는지 설명할 수 있다.\n\n캐시 일관성은 같은 메모리 위치에 대한 캐시 복사본의 일관성을 다루고, 메모리 일관성 모델은 여러 메모리 연산이 관찰되는 순서의 규칙을 다룬다.\n\n여러 코어가 동일한 메모리 주소의 데이터를 각자 캐시에 보관하면 한 코어의 변경이 다른 코어 캐시와 불일치할 수 있다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다.","멀티코어 환경에서 공유 데이터가 왜 복잡해지는지 설명할 수 있다.","여러 코어가 동일한 메모리 주소의 데이터를 각자 캐시에 보관하면 한 코어의 변경이 다른 코어 캐시와 불일치할 수 있다. 캐시 일관성 프로토콜은 캐시 복사본의 상태와 갱신을 조정한다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["캐시 일관성과 메모리 일관성은 같은가?","공유 변수를 사용할 때 동기화가 필요한 이유는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["성능 평가: CPI·클럭·처리시간","CPU 실행 시간은 명령어 수, 명령어당 평균 사이클(CPI), 클럭 주파수의 영향을 받는다. 대략 CPU 시간은 명령어 수×CPI÷클럭 주파수로 표현할 수 있다.\n\nCPU 실행 시간은 `명령어 수 × CPI × 클럭 주기`로 나타낼 수 있다. CPI는 명령어당 평균 사이클 수이며 클럭 주파수는 클럭 주기의 역수다. 같은 주파수라도 프로그램의 명령어 수와 CPI가 다르면 실행 시간은 달라진다. 캐시 미스가 늘면 CPU가 데이터를 기다리며 CPI가 높아질 수 있고 컴파일러 최적화는 명령어 수를 줄일 수 있다. 처리량은 단위 시간에 완료한 작업 수, 응답 시간은 요청부터 결과까지 걸린 시간이다. 벤치마크는 특정 작업 집합의 성능을 측정하므로 실제 사용 환경과 다른 경우 결과를 일반화하면 안 된다.\n\n성능 비교는 동일한 작업과 입력, 컴파일 옵션, 시스템 환경에서 측정해야 한다. CPU 시간은 명령어 수·CPI·클럭 주기의 곱이므로 한 요소만 보고 결론을 내리면 안 된다. 평균 실행 시간 외에 반복 측정의 분산, p95/p99 지연, 캐시 미스, 분기 오예측, 메모리 대역폭을 살펴야 병목을 찾을 수 있다. Amdahl의 법칙은 전체 실행 시간 중 개선 가능한 부분의 비율이 속도 향상의 상한을 결정함을 보여준다.\n\n클럭 속도 하나만으로 CPU 성능을 판단할 수 없다는 점을 설명할 수 있다.\n\n벤치마크는 실제 사용 환경과 작업 유형을 반영해야 하며 단일 점수만으로 모든 용도의 성능을 대표하기 어렵다.\n\nCPU 실행 시간은 명령어 수, 명령어당 평균 사이클(CPI), 클럭 주파수의 영향을 받는다.","클럭 속도 하나만으로 CPU 성능을 판단할 수 없다는 점을 설명할 수 있다.","CPU 실행 시간은 명령어 수, 명령어당 평균 사이클(CPI), 클럭 주파수의 영향을 받는다. 대략 CPU 시간은 명령어 수×CPI÷클럭 주파수로 표현할 수 있다.  이 개념을 실제 CPU에서 설명할 때는 ISA가 소프트웨어에 보이는 명령어·레지스터·주소 체계를 정의하고, 마이크로아키텍처가 이를 내부 회로와 실행 단계로 구현한다는 구분을 유지해야 한다. 구현 방식은 프로세서마다 다를 수 있으므로 특정 구현의 세부사항을 모든 CPU의 공통 규칙으로 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["클럭 주파수가 두 배면 성능도 두 배인가?","벤치마크를 사용할 때 주의할 점은?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["불 대수와 조합논리회로","디지털 회로는 0과 1의 논리값을 다루며 AND·OR·NOT 등의 기본 게이트를 조합해 연산 기능을 만든다. 드모르간 법칙과 불 대수의 항등식을 이용하면 논리식을 단순화할 수 있다.\n\n드모르간 법칙은 NOT(A AND B)=NOT A OR NOT B, NOT(A OR B)=NOT A AND NOT B를 나타내며 논리식을 다른 게이트 조합으로 바꿀 때 사용한다. XOR는 두 입력이 서로 다를 때 1이므로 반가산기의 합 비트에 사용된다. 조합회로는 입력 변화가 전파 지연을 거쳐 출력에 반영되며, 순차회로는 클럭 에지에서 상태를 저장한다. 실제 회로는 논리값뿐 아니라 전파 지연과 setup/hold 시간도 고려해야 한다.\n\nCPU 내부의 연산 장치와 제어 회로가 논리 게이트의 조합으로 구현된다는 점을 이해하는 기초다.\n\n순차논리회로는 플립플롭 등 기억 요소를 포함해 이전 상태가 다음 출력에 영향을 준다.","CPU 내부의 연산 장치와 제어 회로가 논리 게이트의 조합으로 구현된다는 점을 이해하는 기초다.","디지털 회로는 0과 1의 논리값을 다루며 AND·OR·NOT 등의 기본 게이트를 조합해 연산 기능을 만든다. 드모르간 법칙과 불 대수의 항등식을 이용하면 논리식을 단순화할 수 있다.  이 개념을 실제 CPU에서 설명할 때는 ISA가 소프트웨어에 보이는 명령어·레지스터·주소 체계를 정의하고, 마이크로아키텍처가 이를 내부 회로와 실행 단계로 구현한다는 구분을 유지해야 한다. 구현 방식은 프로세서마다 다를 수 있으므로 특정 구현의 세부사항을 모든 CPU의 공통 규칙으로 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["조합논리회로와 순차논리회로의 차이는?","드모르간 법칙은 회로 설계에 어떻게 쓰이는가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["가산기와 ALU의 연산 원리","반가산기는 두 비트의 합과 자리올림을 계산하고 전가산기는 입력 자리올림까지 포함한다. 여러 비트 가산기를 연결해 정수 덧셈을 수행하며 ALU는 산술·논리 연산과 상태 플래그 생성을 담당한다.\n\nALU는 덧셈·뺄셈·비교·AND·OR·XOR·시프트 같은 산술·논리 연산을 수행한다. 결과와 함께 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그를 갱신할 수 있으며 조건 분기 명령은 이 정보를 이용한다. 제어장치는 명령어의 연산 코드와 CPU 상태를 해석해 레지스터 읽기, ALU 기능 선택, 메모리 읽기·쓰기, 분기 등에 필요한 제어 신호를 만든다. 하드와이어드 제어는 논리회로로 신호를 만들고 마이크로프로그램 제어는 마이크로명령을 사용한다. 레지스터는 CPU 내부의 고속 저장 공간이다. 범용 레지스터는 피연산자와 중간 결과를 보관하고 PC는 다음 명령어 주소, SP는 스택 위치, 상태 레지스터는 연산 결과의 조건 정보를 관리한다. 실제 레지스터 구성과 명칭은 ISA와 CPU 구현에 따라 다르다.\n\n고수준의 덧셈 연산이 하드웨어 회로에서 어떻게 구현되는지 설명할 수 있다.\n\n부호 없는 연산에서는 캐리 플래그가 중요하고, 2의 보수 부호 있는 연산에서는 표현 범위를 벗어났는지 오버플로 플래그를 확인한다.\n\n여러 비트 가산기를 연결해 정수 덧셈을 수행하며 ALU는 산술·논리 연산과 상태 플래그 생성을 담당한다. ALU는 덧셈·뺄셈 같은 산술 연산과 AND·OR·XOR·NOT, 비교, 시프트 같은 논리·비트 연산을 수행한다. 연산 결과뿐 아니라 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그가 조건 분기나 후속 명령에 활용될 수 있다.","고수준의 덧셈 연산이 하드웨어 회로에서 어떻게 구현되는지 설명할 수 있다.","반가산기는 두 비트의 합과 자리올림을 계산하고 전가산기는 입력 자리올림까지 포함한다. 여러 비트 가산기를 연결해 정수 덧셈을 수행하며 ALU는 산술·논리 연산과 상태 플래그 생성을 담당한다.  ALU는 덧셈·뺄셈 같은 산술 연산과 AND·OR·XOR·NOT, 비교, 시프트 같은 논리·비트 연산을 수행한다. 연산 결과뿐 아니라 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그가 조건 분기나 후속 명령에 활용될 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["오버플로와 캐리의 차이는?","반가산기와 전가산기의 차이는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["명령어 집합 구조(ISA)와 마이크로아키텍처","ISA는 명령어 종류, 레지스터, 데이터 형식, 주소 지정 방식 등 소프트웨어와 프로세서 사이의 규약이다. 마이크로아키텍처는 그 ISA를 실제 회로와 파이프라인으로 구현하는 내부 설계다.\n\nISA는 명령어 종류·형식·레지스터·데이터 형식·주소 지정·예외 처리 등 소프트웨어가 관찰하는 CPU의 규격이다. 같은 ISA를 구현한 CPU는 내부 구조가 달라도 동일한 기계어 프로그램을 실행할 수 있다. 마이크로아키텍처는 해당 ISA를 실제 파이프라인·캐시·실행 유닛·제어 회로로 구현한 방식이다. RISC는 단순하고 규칙적인 명령어를 통해 파이프라인과 하드웨어 설계를 단순화하려는 철학이고, CISC는 복잡한 명령어와 다양한 주소 지정으로 한 명령어가 더 많은 작업을 표현하도록 발전했다. 현대 CPU는 복잡한 명령어를 내부의 단순한 마이크로 연산으로 바꾸기도 하므로 RISC/CISC를 단순히 속도 우열로 구분하면 부정확하다.\n\n같은 ISA를 서로 다른 프로세서가 구현할 수 있고 소프트웨어 호환성과 하드웨어 설계가 분리되는 이유를 이해할 수 있다.\n\n컴파일러는 대상 ISA에 맞는 기계어를 생성하며, 마이크로아키텍처는 그 명령어를 실행하는 내부 효율을 좌우한다.\n\nISA는 명령어 종류, 레지스터, 데이터 형식, 주소 지정 방식 등 소프트웨어와 프로세서 사이의 규약이다. 마이크로아키텍처는 그 ISA를 실제 회로와 파이프라인으로 구현하는 내부 설계다. 레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 파이프라이닝은 명령어 실행을 인출·해독·실행·메모리 접근·쓰기 등의 단계로 나누고 서로 다른 명령어의 단계를 중첩해 처리량을 높인다. 단계 수가 늘어도 한 명령어의 지연시간이 같은 비율로 줄어드는 것은 아니며, 해저드와 분기 실패, 메모리 지연이 성능 향상을 제한한다.","같은 ISA를 서로 다른 프로세서가 구현할 수 있고 소프트웨어 호환성과 하드웨어 설계가 분리되는 이유를 이해할 수 있다.","ISA는 명령어 종류, 레지스터, 데이터 형식, 주소 지정 방식 등 소프트웨어와 프로세서 사이의 규약이다. 마이크로아키텍처는 그 ISA를 실제 회로와 파이프라인으로 구현하는 내부 설계다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n파이프라이닝은 명령어 실행을 인출·해독·실행·메모리 접근·쓰기 등의 단계로 나누고 서로 다른 명령어의 단계를 중첩해 처리량을 높인다. 단계 수가 늘어도 한 명령어의 지연시간이 같은 비율로 줄어드는 것은 아니며, 해저드와 분기 실패, 메모리 지연이 성능 향상을 제한한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["ISA와 기계어는 어떤 관계인가?","같은 ISA를 쓰는 CPU의 성능이 다른 이유는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["RISC와 CISC 설계 철학","RISC는 비교적 단순하고 규칙적인 명령어와 레지스터 중심 연산을 지향하고, CISC는 복합적인 명령어와 다양한 주소 지정 방식을 제공하는 경향이 있다. 현대 프로세서는 두 설계의 특징을 절충하기도 한다.\n\nISA는 명령어 종류·형식·레지스터·데이터 형식·주소 지정·예외 처리 등 소프트웨어가 관찰하는 CPU의 규격이다. 같은 ISA를 구현한 CPU는 내부 구조가 달라도 동일한 기계어 프로그램을 실행할 수 있다. 마이크로아키텍처는 해당 ISA를 실제 파이프라인·캐시·실행 유닛·제어 회로로 구현한 방식이다. RISC는 단순하고 규칙적인 명령어를 통해 파이프라인과 하드웨어 설계를 단순화하려는 철학이고, CISC는 복잡한 명령어와 다양한 주소 지정으로 한 명령어가 더 많은 작업을 표현하도록 발전했다. 현대 CPU는 복잡한 명령어를 내부의 단순한 마이크로 연산으로 바꾸기도 하므로 RISC/CISC를 단순히 속도 우열로 구분하면 부정확하다.\n\n명령어 집합 설계의 역사와 현대 CPU 내부 구현을 단순한 이분법 없이 설명할 수 있다.\n\n성능은 명령어 개수만이 아니라 CPI, 클럭, 메모리 접근, 구현 방식과 컴파일러 최적화에 의해 결정된다.\n\nRISC는 비교적 단순하고 규칙적인 명령어와 레지스터 중심 연산을 지향하고, CISC는 복합적인 명령어와 다양한 주소 지정 방식을 제공하는 경향이 있다.","명령어 집합 설계의 역사와 현대 CPU 내부 구현을 단순한 이분법 없이 설명할 수 있다.","RISC는 비교적 단순하고 규칙적인 명령어와 레지스터 중심 연산을 지향하고, CISC는 복합적인 명령어와 다양한 주소 지정 방식을 제공하는 경향이 있다. 현대 프로세서는 두 설계의 특징을 절충하기도 한다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["RISC가 파이프라이닝에 유리한 이유는?","CISC가 무조건 느리다고 할 수 있는가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["폰 노이만 구조와 하버드 구조 비교","폰 노이만 구조는 명령어와 데이터를 같은 주기억장치와 전송 경로에서 다루는 저장 프로그램 방식이다. 하버드 구조는 명령어와 데이터의 저장 공간 또는 접근 경로를 분리해 동시에 접근할 수 있도록 설계한다. 현대 프로세서는 두 방식의 장점을 절충한 구조도 사용한다.\n\n컴퓨터가 프로그램을 실행한다는 것은 명령어와 데이터를 저장장치에서 가져와 해석하고, 연산한 뒤 결과를 저장한다는 뜻이다. CPU는 명령어를 실행하고, 주기억장치는 현재 필요한 명령어와 데이터를 보관하며, 보조기억장치는 전원이 꺼져도 프로그램과 파일을 유지한다. 입출력 장치는 키보드·화면·네트워크 등 외부와 정보를 주고받는다. 이들은 주소·데이터·제어 신호로 연결된다. 폰 노이만 구조는 명령어와 데이터를 같은 메모리에 저장하므로 프로그램을 메모리에 적재해 실행하기 쉽다. 반면 명령어 인출과 데이터 접근이 같은 통로를 공유하면 폰 노이만 병목이 발생한다. 하버드 구조는 명령어와 데이터 메모리 및 경로를 분리해 동시에 접근할 수 있다. 실제 범용 CPU는 명령어·데이터 캐시를 분리한 수정 하버드 구조 등 혼합 형태를 사용하기도 한다.\n\n두 구조의 차이는 메모리 접근 병목, 설계 복잡도, 명령어 처리 효율을 이해하는 출발점이다.\n\n마이크로컨트롤러나 디지털 신호 처리기에서는 명령어와 데이터 접근을 분리한 구조가 유용할 수 있다.\n\n폰 노이만 구조는 명령어와 데이터를 같은 주기억장치와 전송 경로에서 다루는 저장 프로그램 방식이다. 하버드 구조는 명령어와 데이터의 저장 공간 또는 접근 경로를 분리해 동시에 접근할 수 있도록 설계한다. 반면 명령어 인출과 데이터 접근이 같은 경로에서 경쟁할 수 있는 폰 노이만 병목이 발생한다.","두 구조의 차이는 메모리 접근 병목, 설계 복잡도, 명령어 처리 효율을 이해하는 출발점이다.","폰 노이만 구조는 명령어와 데이터를 같은 주기억장치와 전송 경로에서 다루는 저장 프로그램 방식이다. 하버드 구조는 명령어와 데이터의 저장 공간 또는 접근 경로를 분리해 동시에 접근할 수 있도록 설계한다. 현대 프로세서는 두 방식의 장점을 절충한 구조도 사용한다.  명령어와 데이터가 동일한 주기억장치 및 전송 경로를 사용하므로 프로그램을 메모리에 적재해 실행하기 쉽다. 반면 명령어 인출과 데이터 접근이 같은 경로에서 경쟁할 수 있는 폰 노이만 병목이 발생한다. 캐시, 명령어 파이프라이닝, 메모리 대역폭 개선 등은 이 병목의 영향을 줄이는 방법이다.\n\n명령어 메모리와 데이터 메모리 또는 경로를 분리해 명령어 인출과 데이터 접근을 동시에 수행하기 쉽다. 마이크로컨트롤러나 DSP 등에서 활용되며, 실제 범용 CPU는 성능을 위해 캐시 수준에서 분리하고 하위 메모리에서는 통합하는 변형 구조도 사용한다.",["폰 노이만 병목은 왜 발생합니까?","하버드 구조가 항상 더 좋은 구조입니까?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["CPU 레지스터와 프로그램 실행 상태","레지스터는 CPU 내부에 있는 매우 빠른 저장 공간으로 연산 피연산자, 주소, 명령어, 실행 상태 등을 임시 보관한다. 범용 레지스터 외에 PC, IR, SP, 상태 레지스터 등 목적이 정해진 레지스터가 있다.\n\nALU는 덧셈·뺄셈·비교·AND·OR·XOR·시프트 같은 산술·논리 연산을 수행한다. 결과와 함께 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그를 갱신할 수 있으며 조건 분기 명령은 이 정보를 이용한다. 제어장치는 명령어의 연산 코드와 CPU 상태를 해석해 레지스터 읽기, ALU 기능 선택, 메모리 읽기·쓰기, 분기 등에 필요한 제어 신호를 만든다. 하드와이어드 제어는 논리회로로 신호를 만들고 마이크로프로그램 제어는 마이크로명령을 사용한다. 레지스터는 CPU 내부의 고속 저장 공간이다. 범용 레지스터는 피연산자와 중간 결과를 보관하고 PC는 다음 명령어 주소, SP는 스택 위치, 상태 레지스터는 연산 결과의 조건 정보를 관리한다. 실제 레지스터 구성과 명칭은 ISA와 CPU 구현에 따라 다르다.\n\n레지스터는 CPU가 메모리 접근을 줄이고 명령어를 빠르게 실행하도록 돕는다.\n\n레지스터는 명령어가 직접 지정하거나 CPU 제어에 사용되는 소규모 저장소이며 캐시는 주기억장치 블록을 보관해 메모리 접근 지연을 줄인다.\n\n레지스터는 CPU 내부에 있는 매우 빠른 저장 공간으로 연산 피연산자, 주소, 명령어, 실행 상태 등을 임시 보관한다. 범용 레지스터 외에 PC, IR, SP, 상태 레지스터 등 목적이 정해진 레지스터가 있다. 레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다.","레지스터는 CPU가 메모리 접근을 줄이고 명령어를 빠르게 실행하도록 돕는다.","레지스터는 CPU 내부에 있는 매우 빠른 저장 공간으로 연산 피연산자, 주소, 명령어, 실행 상태 등을 임시 보관한다. 범용 레지스터 외에 PC, IR, SP, 상태 레지스터 등 목적이 정해진 레지스터가 있다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.",["PC와 IR의 역할 차이는?","레지스터와 캐시의 차이는?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["가상 메모리 주소 변환과 TLB","가상 주소는 프로세스가 사용하는 논리적 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 가상 주소는 페이지 번호와 페이지 오프셋으로 나뉘며, 페이지 테이블은 가상 페이지와 물리 프레임의 대응 관계 및 유효·보호 비트 등을 관리한다. 페이지 크기가 2의 거듭제곱이면 오프셋 비트 수는 log2(페이지 크기)다.\n\n가상 주소는 프로세스가 사용하는 논리적 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 가상 주소는 페이지 번호와 페이지 오프셋으로 나뉘며, 페이지 테이블은 가상 페이지와 물리 프레임의 대응 관계 및 유효·보호 비트 등을 관리한다. TLB(Translation Lookaside Buffer)는 최근 사용한 주소 변환 정보를 저장하는 하드웨어 캐시다. TLB hit이면 페이지 테이블을 매번 메모리에서 조회하지 않아 변환이 빠르고, miss이면 페이지 테이블을 조회한 뒤 TLB를 갱신한다. 유효하지 않은 페이지 접근은 페이지 폴트를 발생시킬 수 있으며, 운영체제가 해당 페이지를 메모리에 적재하거나 접근 오류를 처리한다. TLB는 캐시 메모리와 달리 데이터 자체가 아니라 주소 변환 결과를 캐싱한다. 프로세스 전환 시 주소 공간 식별자(ASID) 지원 여부 등에 따라 TLB를 비우거나 구분해 사용한다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 주소 변환은 페이지 테이블 접근 비용이 들 수 있어 TLB가 최근 변환 결과를 캐시한다. TLB는 가상 페이지 번호와 물리 프레임 번호의 변환 정보를 저장하는 고속 캐시다. TLB 적중이면 페이지 테이블을 매번 메모리에서 조회하지 않아도 되지만, 미스가 나면 페이지 테이블 탐색이 필요하다. 문맥 전환 때 주소 공간 식별자(ASID) 사용 여부 등에 따라 TLB 관리 방식이 달라진다.","","가상 주소는 프로세스가 사용하는 논리적 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 가상 주소는 페이지 번호와 페이지 오프셋으로 나뉘며, 페이지 테이블은 가상 페이지와 물리 프레임의 대응 관계 및 유효·보호 비트 등을 관리한다. 페이지 크기가 2의 거듭제곱이면 오프셋 비트 수는 log2(페이지 크기)다.\n\nTLB(Translation Lookaside Buffer)는 최근 사용한 주소 변환 정보를 저장하는 하드웨어 캐시다. TLB hit이면 페이지 테이블을 매번 메모리에서 조회하지 않아 변환이 빠르고, miss이면 페이지 테이블을 조회한 뒤 TLB를 갱신한다. 유효하지 않은 페이지 접근은 페이지 폴트를 발생시킬 수 있으며, 운영체제가 해당 페이지를 메모리에 적재하거나 접근 오류를 처리한다.\n\nTLB는 캐시 메모리와 달리 데이터 자체가 아니라 주소 변환 결과를 캐싱한다. 프로세스 전환 시 주소 공간 식별자(ASID) 지원 여부 등에 따라 TLB를 비우거나 구분해 사용한다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다.\n\n가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 프로세스마다 주소 공간을 분리하면 보호와 재배치가 쉬워진다. 주소 변환은 페이지 테이블 접근 비용이 들 수 있어 TLB가 최근 변환 결과를 캐시한다.\n\nTLB는 가상 페이지 번호와 물리 프레임 번호의 변환 정보를 저장하는 고속 캐시다. TLB 적중이면 페이지 테이블을 매번 메모리에서 조회하지 않아도 되지만, 미스가 나면 페이지 테이블 탐색이 필요하다. 문맥 전환 때 주소 공간 식별자(ASID) 사용 여부 등에 따라 TLB 관리 방식이 달라진다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["TLB와 캐시 메모리의 차이는?","페이지 폴트는 언제 발생하는가?"],"",[["CMU Computer Systems: A Programmer’s Perspective","https://csapp.cs.cmu.edu/3e/perspective.html"]]]]],["⚙️","운영체제","프로세스·스레드·메모리·자원 관리",[["운영체제와 커널","운영체제는 CPU·메모리·파일·입출력 등 자원을 관리하고 응용 프로그램에 실행 환경을 제공한다. 커널은 하드웨어 자원 관리와 시스템 호출 처리 등을 담당하는 핵심 부분이다.\n\n운영체제는 응용 프로그램이 하드웨어를 직접 제어하지 않고 CPU·메모리·파일·입출력 장치를 사용할 수 있도록 추상화와 자원 관리를 제공한다. 여러 프로그램이 함께 실행되도록 CPU 시간을 나누고 각 프로그램의 메모리 접근과 파일 권한을 통제한다. 운영체제는 셸·GUI·시스템 도구까지 포함하는 넓은 개념이고 커널은 권한이 높은 영역에서 프로세스·메모리·파일·장치 관리 등 핵심 기능을 수행한다. 시스템 호출은 응용 프로그램이 커널 기능을 요청하는 인터페이스다. 모놀리식 커널은 많은 서비스를 커널 공간에서 실행하고 마이크로커널은 핵심 기능을 최소화해 일부 서비스를 사용자 공간으로 분리한다.\n\n운영체제는 자원을 추상화하는 동시에 경쟁을 조정한다. 예를 들어 파일 시스템은 디스크 블록을 파일 이름과 디렉터리로 추상화하고, 가상 메모리는 물리 RAM을 프로세스별 주소 공간으로 추상화한다. 커널은 자원 소유자와 접근 권한을 추적하며 프로세스가 잘못된 주소에 접근하거나 허가되지 않은 파일을 읽으려 하면 예외나 오류를 반환한다. 운영체제 설계의 핵심은 편리한 추상화와 안전한 격리, 낮은 관리 오버헤드 사이의 균형이다.\n\n여러 프로그램이 제한된 하드웨어를 안전하고 효율적으로 공유하게 한다.\n\n사용자 모드와 커널 모드를 분리해 일반 프로그램의 직접적인 하드웨어 접근을 제한한다.\n\n커널은 하드웨어 자원 관리와 시스템 호출 처리 등을 담당하는 핵심 부분이다.","여러 프로그램이 제한된 하드웨어를 안전하고 효율적으로 공유하게 한다.","운영체제는 CPU·메모리·파일·입출력 등 자원을 관리하고 응용 프로그램에 실행 환경을 제공한다. 커널은 하드웨어 자원 관리와 시스템 호출 처리 등을 담당하는 핵심 부분이다.",["운영체제와 커널의 차이는?","시스템 호출이란?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["프로세스와 스레드","프로그램은 디스크에 저장된 실행 파일이고, 프로세스(Process)는 그 프로그램이 메모리에 적재되어 실행 중인 상태를 말한다. 같은 프로그램을 두 번 실행하면 일반적으로 서로 다른 프로세스가 만들어진다. 각 프로세스는 운영체제로부터 실행에 필요한 자원을 할당받고, 다른 프로세스와 구별되는 가상 주소 공간과 실행 상태를 가진다. 스레드(Thread)는 프로세스 안에서 실제 명령어를 실행하는 흐름이다. 한 프로세스에는 하나 이상의 스레드가 존재할 수 있으며, 스레드가 여러 개면 여러 실행 흐름이 같은 프로세스 자원을 활용할 수 있다.\n\n프로세스와 스레드를 구분하는 핵심은 '자원의 소유·보호 단위'와 'CPU 실행 흐름'이다. 프로세스는 주소 공간과 자원 격리의 단위이고, 스레드는 그 주소 공간 안에서 명령어를 수행하는 실행 단위다. 운영체제는 프로세스와 스레드의 상태를 각각 관리하며, CPU 스케줄러는 실행 가능한 스레드 중 하나를 선택해 CPU에 배정한다.\n\n**프로세스의 메모리 구조**\n각 프로세스는 자신만의 가상 주소 공간을 가진다. 일반적인 프로세스 주소 공간은 다음 영역으로 설명한다.\n- 코드(Text): 실행할 기계어 명령이 저장되는 영역이다. 보통 읽기·실행 권한을 갖고, 실행 중 임의 변경을 제한한다.\n- 데이터(Data/BSS): 전역 변수와 정적 변수처럼 프로그램 실행 기간 동안 유지되는 데이터가 저장된다. 초기값이 있는 데이터와 초기값이 없거나 0으로 초기화되는 데이터 영역을 구분하기도 한다.\n- 힙(Heap): 실행 중 동적으로 할당하는 메모리 영역이다. C의 malloc, C++의 new, 런타임의 객체 할당 등이 이에 해당한다. 할당과 해제를 적절히 관리하지 않으면 메모리 누수나 단편화가 생길 수 있다.\n- 스택(Stack): 함수 호출에 필요한 매개변수, 지역 변수, 복귀 주소, 저장 레지스터 등의 정보를 관리한다. 함수가 호출되면 스택 프레임이 쌓이고 반환되면 제거된다. 재귀 호출이 지나치게 깊으면 스택 오버플로가 발생할 수 있다.\n\n**스레드가 공유하는 것과 독립적으로 갖는 것**\n같은 프로세스의 스레드는 코드·전역 데이터·힙 및 프로세스가 연 파일과 같은 자원을 공유한다. 따라서 한 스레드가 힙에 만든 객체를 다른 스레드가 참조할 수 있고, 데이터 교환을 위해 별도의 프로세스 간 통신을 거칠 필요가 적다. 반면 각 스레드는 독립적인 스택, 프로그램 카운터(PC), 레지스터 집합, 스레드 실행 상태를 가진다. 스택과 레지스터가 분리되어야 각 스레드가 서로 다른 함수 호출 경로와 실행 위치를 유지할 수 있다.\n\n**운영체제의 관리 정보**\n운영체제는 프로세스마다 프로세스 제어 블록(PCB)을 두어 프로세스 식별자(PID), 프로세스 상태, 주소 공간 정보, 열린 파일 등 자원 정보, 스케줄링 정보, 문맥 저장 정보를 관리한다. 스레드마다 스레드 제어 블록(TCB)을 두어 스레드 식별자, 실행 상태, 우선순위, 레지스터 문맥, 스택 정보 등을 관리한다. PCB와 TCB의 구체적인 필드는 운영체제 구현에 따라 다르지만, 목적은 실행을 중단했다가 나중에 이어서 수행할 수 있도록 상태를 보존하는 것이다.\n\n**문맥 교환(Context Switch)**\nCPU에서 실행 중인 스레드를 다른 스레드로 바꾸려면 현재 실행 흐름의 레지스터 등 문맥을 저장하고 다음 스레드의 문맥을 복원해야 한다. 이를 문맥 교환이라고 한다. 프로세스가 바뀌는 경우에는 주소 공간 전환이 동반될 수 있어 TLB 처리나 캐시 지역성 측면의 추가 비용이 발생할 수 있다. 같은 프로세스 안에서 스레드만 바뀌는 경우에는 주소 공간을 그대로 사용할 수 있어 일반적으로 전환 부담이 더 작을 수 있지만, 실제 비용은 운영체제와 하드웨어, 스케줄러 구현에 따라 달라진다.\n\n**멀티프로세스와 멀티스레드**\n멀티프로세스는 작업을 여러 프로세스로 분리한다. 한 프로세스의 오류가 다른 프로세스의 주소 공간을 직접 훼손하기 어렵고 격리성이 높다. 대신 프로세스 사이 데이터 공유에는 파이프, 소켓, 공유 메모리 등의 IPC가 필요하고, 생성·전환·통신 비용이 커질 수 있다. 멀티스레드는 하나의 프로세스 안에서 여러 실행 흐름을 운용한다. 공유 메모리를 통해 데이터 전달이 빠르고 자원 사용량이 비교적 적지만, 여러 스레드가 같은 데이터를 동시에 변경하면 경쟁 상태(Race Condition)가 발생할 수 있다.\n\n**동기화가 필요한 이유**\n예를 들어 두 스레드가 공유 변수 count를 동시에 1 증가시키면, 두 스레드가 모두 기존 값 10을 읽고 각각 11을 기록해 최종값이 11이 될 수 있다. 기대한 결과인 12가 나오지 않는 이유는 '읽기-수정-쓰기' 과정이 원자적으로 수행되지 않았기 때문이다. 공유 데이터에 접근하는 코드 구간을 임계영역(Critical Section)이라 하고, 뮤텍스·세마포어·모니터·원자 연산 등으로 동시 접근을 제어한다. 단, 잠금을 잘못 사용하면 교착상태나 성능 저하가 생길 수 있다.\n\n**간단한 예시(C)**\n```c\n#include <pthread.h>\n#include <stdio.h>\n\nint count = 0;\npthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;\n\nvoid* worker(void* arg) {\n    for (int i = 0; i < 100000; i++) {\n        pthread_mutex_lock(&lock); // 임계영역 진입\n        count++;\n        pthread_mutex_unlock(&lock); // 임계영역 종료\n    }\n    return NULL;\n}\n\nint main(void) {\n    pthread_t a, b;\n    pthread_create(&a, NULL, worker, NULL);\n    pthread_create(&b, NULL, worker, NULL);\n    pthread_join(a, NULL);\n    pthread_join(b, NULL);\n    printf(\"%d\\n\", count); // 200000\n    pthread_mutex_destroy(&lock);\n}\n```\n이 예제에서 두 스레드는 전역 변수 count를 공유한다. `count++`는 단일 원자 연산이라고 보장할 수 없으므로 뮤텍스로 보호한다. 잠금과 해제를 생략하면 데이터 경쟁이 발생하고 결과가 달라질 수 있다. 실제 C 프로그램에서 데이터 경쟁은 단순히 값이 틀리는 문제를 넘어 언어 메모리 모델상 정의되지 않은 동작을 유발할 수 있다.\n\n**정리**\n프로세스는 독립된 주소 공간과 자원을 관리하는 실행 환경이고, 스레드는 그 안에서 CPU 명령을 수행하는 실행 흐름이다. 프로세스 간 분리는 안정성과 격리에 유리하고, 스레드 간 공유는 통신 효율에 유리하지만 동기화가 필요하다.","| 구분 | 프로세스 | 스레드 |\n|---|---|---|\n| 핵심 의미 | 자원·주소 공간의 보호 단위 | 프로세스 내부 실행 흐름 |\n| 주소 공간 | 원칙적으로 독립 | 같은 프로세스의 주소 공간 공유 |\n| 공유 자원 | IPC 등 명시적 방법 필요 | 코드·데이터·힙·열린 파일 등 공유 |\n| 독립 상태 | 프로세스 문맥 | 스택·PC·레지스터·스레드 상태 |\n| 오류 영향 | 주소 공간 격리로 전파 제한 가능 | 공유 메모리 손상 등으로 같은 프로세스에 영향 |\n| 통신·동기화 | IPC 중심 | 공유 메모리와 잠금·원자 연산 등 |\n\n멀티프로세스는 격리·장애 대응이 중요할 때 유리하고, 멀티스레드는 데이터 공유와 응답성이 중요할 때 유리하다. 어느 쪽이 항상 빠르다고 단정할 수 없으며, 작업 특성·통신량·동기화 비용·운영체제 구현을 함께 고려해야 한다.","프로세스는 실행 중인 프로그램으로, 독립된 가상 주소 공간과 운영체제 자원을 할당받는 단위입니다. 스레드는 프로세스 내부에서 실제 명령어를 실행하는 흐름입니다. 같은 프로세스의 스레드들은 코드·데이터·힙과 열린 파일 등을 공유하지만, 각자 독립적인 스택과 프로그램 카운터, 레지스터 문맥을 갖습니다. 운영체제는 PCB와 TCB를 통해 각각의 상태와 실행 문맥을 관리합니다. 멀티프로세스는 주소 공간이 분리되어 안정성과 격리성이 높지만 IPC 비용이 발생하고, 멀티스레드는 자원 공유와 통신이 효율적이지만 공유 데이터에 대한 동기화가 필요합니다. 따라서 시스템의 안정성, 데이터 공유 정도, 처리 성능을 고려해 적절한 구조를 선택해야 합니다.",["프로세스와 스레드의 메모리 구조는 어떻게 다른가?","스레드가 스택을 독립적으로 가져야 하는 이유는?","문맥 교환은 무엇이며 프로세스 전환과 스레드 전환은 어떻게 다른가?","경쟁 상태가 발생하는 이유와 해결 방법은?","멀티프로세스가 멀티스레드보다 유리한 상황은?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["CPU 스케줄링","준비 상태의 프로세스 중 다음에 CPU를 할당할 대상을 선택하는 기능이다. FCFS, SJF, 우선순위, 라운드 로빈 등이 있다.\n\nCPU 스케줄링은 준비 상태의 실행 단위 중 다음에 CPU를 배정할 대상을 선택한다. FCFS는 먼저 도착한 순서로 실행해 단순하지만 긴 작업 뒤 짧은 작업이 오래 기다리는 convoy effect가 생길 수 있다. SJF는 실행 시간이 짧은 작업을 우선해 평균 대기 시간을 줄이는 데 유리하지만 실행 시간을 미리 알기 어렵고 긴 작업이 굶을 수 있다. SRTF는 남은 시간이 가장 짧은 작업을 선점 방식으로 선택한다. Round Robin은 각 작업에 시간 할당량을 주어 응답성을 높이지만 quantum이 너무 작으면 문맥 교환이 늘고 너무 크면 FCFS와 비슷해진다. 우선순위 방식은 중요 작업을 먼저 실행하나 기아가 생길 수 있어 aging으로 오래 기다린 작업의 우선순위를 높인다. 반환 시간·대기 시간·응답 시간·처리량은 서로 다른 성능 지표다.\n\n스케줄러는 공정성·응답성·처리량·대기 시간·우선순위 등 서로 다른 목표 사이에서 절충한다. 대화형 시스템은 빠른 첫 응답이 중요하고 일괄 처리 시스템은 전체 작업 처리량과 반환 시간이 중요할 수 있다. 우선순위 역전은 낮은 우선순위 작업이 잠금을 보유해 높은 우선순위 작업이 대기하고 중간 우선순위 작업이 CPU를 점유하는 상황이다. 우선순위 상속은 잠금을 보유한 작업의 우선순위를 대기 중인 높은 우선순위 작업 수준으로 일시적으로 올려 문제를 완화한다.\n\nCPU 이용률·처리량을 높이고 대기시간·응답시간을 줄이는 것이 목적이다.\n\n시간 할당량이 너무 작으면 문맥 교환 오버헤드가 커지고 너무 크면 응답성이 낮아질 수 있다.\n\nSJF는 다음 CPU 버스트가 가장 짧을 것으로 예상되는 작업을 먼저 실행해 평균 대기 시간을 줄이는 알고리즘이다.","CPU 이용률·처리량을 높이고 대기시간·응답시간을 줄이는 것이 목적이다.","준비 상태의 프로세스 중 다음에 CPU를 할당할 대상을 선택하는 기능이다. FCFS, SJF, 우선순위, 라운드 로빈 등이 있다.  라운드 로빈은 준비 큐의 프로세스에 동일한 시간 할당량(time quantum)을 순환 배분한다. 응답성이 좋고 기아 가능성을 낮추지만, 할당량이 너무 작으면 문맥 교환이 잦고 너무 크면 FCFS와 비슷해진다.\n\nSJF는 다음 CPU 버스트가 가장 짧을 것으로 예상되는 작업을 먼저 실행해 평균 대기 시간을 줄이는 알고리즘이다. 실제 다음 버스트 길이를 미리 알기 어려워 과거 실행 시간으로 예측하며, 긴 작업이 계속 밀리는 기아가 발생할 수 있다. 선점형 변형은 SRTF다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["선점형과 비선점형의 차이는?","라운드 로빈 시간 할당량이 너무 작으면?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["교착상태","둘 이상의 프로세스가 서로 상대방이 점유한 자원을 기다리며 진행하지 못하는 상태다.\n\n교착상태는 둘 이상의 실행 주체가 서로가 보유한 자원을 기다리며 진행하지 못하는 상태다. 예를 들어 A가 L1 잠금을 가진 채 L2를 기다리고 B가 L2를 가진 채 L1을 기다리면 순환 대기가 만들어진다. 발생을 위한 네 조건은 상호 배제, 점유와 대기, 비선점, 환형 대기다. 예방은 조건 중 하나를 깨고, 회피는 자원 할당 후에도 안전 상태인지 검사하며 은행원 알고리즘이 대표적이다. 탐지는 교착상태를 허용한 뒤 대기 관계를 분석하고, 복구는 프로세스 종료·자원 회수·롤백 등을 사용한다. 기아는 특정 작업이 계속 자원을 받지 못하는 상태로 교착상태와 구별된다.\n\n자원 할당 그래프에서 프로세스와 자원을 노드로 나타내고 요청 간선과 할당 간선을 구분하면 대기 관계를 시각화할 수 있다. 자원 유형마다 인스턴스가 하나인 경우 사이클은 교착상태의 필요충분 조건이지만 여러 인스턴스가 있으면 사이클이 있다고 항상 교착상태인 것은 아니다. 프로그램에서는 전역 잠금 획득 순서를 정하고, 잠금 안에서 네트워크나 파일 I/O처럼 오래 걸리는 작업을 하지 않으며, 타임아웃과 잠금 진단 도구를 활용하는 것이 실용적이다.\n\n상호배제, 점유와 대기, 비선점, 순환대기 네 조건이 동시에 성립하면 발생할 수 있다.\n\n예방은 네 조건 중 하나가 성립하지 않게 하고, 회피는 자원 요청 후에도 안전 상태가 유지되는지 판단한다.\n\n교착상태는 둘 이상의 프로세스가 서로 상대가 가진 자원을 기다리며 진행하지 못하는 상태다.","상호배제, 점유와 대기, 비선점, 순환대기 네 조건이 동시에 성립하면 발생할 수 있다.","둘 이상의 프로세스가 서로 상대방이 점유한 자원을 기다리며 진행하지 못하는 상태다.  교착상태는 둘 이상의 프로세스가 서로 상대가 가진 자원을 기다리며 진행하지 못하는 상태다. 상호 배제, 점유 대기, 비선점, 순환 대기의 네 조건이 동시에 성립하면 발생 가능하다. 예방은 조건 중 하나를 깨고, 회피는 안전 상태를 확인하며, 탐지는 발생 후 복구한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["교착상태 네 조건은?","예방과 회피의 차이는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["가상 메모리와 페이징","가상 메모리는 프로세스마다 독립적인 가상 주소 공간을 제공한다. 페이징은 가상 메모리를 고정 크기 페이지로 나눠 물리 메모리의 프레임에 매핑한다.\n\n가상 메모리는 프로세스마다 독립된 주소 공간을 제공하고 실제 RAM 위치와 분리한다. 페이징은 가상 공간을 페이지, 물리 메모리를 프레임으로 나누고 페이지 테이블로 대응시킨다. CPU가 참조한 페이지가 RAM에 없으면 페이지 폴트가 발생하며 운영체제는 접근이 유효한지 확인하고 디스크에서 페이지를 적재한다. 빈 프레임이 없으면 기존 페이지를 교체한다. FIFO는 먼저 적재된 페이지, LRU는 가장 오래 사용하지 않은 페이지를 교체하며 OPT는 미래에 가장 늦게 사용할 페이지를 교체하는 이론적 기준이다. 실제 OS는 미래 접근을 알 수 없어 근사 정책을 쓴다. 페이지 폴트가 지나치게 잦아 CPU가 페이지 교체에 대부분의 시간을 쓰는 현상이 스래싱이다.\n\n페이지 교체 정책은 어떤 페이지를 내보낼지 결정한다. FIFO는 오래전에 적재된 페이지를 제거하지만 자주 쓰는 페이지도 교체할 수 있고 Belady의 이상 현상이 나타날 수 있다. LRU는 최근 사용 시점을 기준으로 지역성을 이용하지만 정확한 구현에는 비용이 든다. Clock/Second Chance는 참조 비트를 이용해 LRU를 근사한다. 더티 페이지는 디스크에 반영한 뒤 교체해야 하므로 깨끗한 페이지보다 비용이 크다. 페이지 크기는 페이지 테이블 크기·내부 단편화·TLB 도달 범위·I/O 효율에 영향을 준다.\n\n메모리 보호와 효율적 할당을 지원하고 필요한 부분만 적재할 수 있다.\n\n요청한 페이지가 RAM에 없으면 페이지 폴트가 발생하고 운영체제는 보조기억장치에서 해당 페이지를 가져온다.\n\n페이징은 가상 메모리를 고정 크기 페이지로 나눠 물리 메모리의 프레임에 매핑한다. 가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 페이징은 가상 주소 공간을 고정 크기의 페이지, 물리 메모리를 같은 크기의 프레임으로 나누어 매핑한다.","메모리 보호와 효율적 할당을 지원하고 필요한 부분만 적재할 수 있다.","가상 메모리는 프로세스마다 독립적인 가상 주소 공간을 제공한다. 페이징은 가상 메모리를 고정 크기 페이지로 나눠 물리 메모리의 프레임에 매핑한다.  가상 주소는 프로세스가 사용하는 논리 주소이며, MMU가 페이지 테이블을 참조해 물리 주소로 변환한다. 프로세스마다 주소 공간을 분리하면 보호와 재배치가 쉬워진다. 주소 변환은 페이지 테이블 접근 비용이 들 수 있어 TLB가 최근 변환 결과를 캐시한다.\n\n페이징은 가상 주소 공간을 고정 크기의 페이지, 물리 메모리를 같은 크기의 프레임으로 나누어 매핑한다. 외부 단편화를 줄이고 비연속적인 물리 배치를 가능하게 하지만 페이지 테이블 공간과 내부 단편화가 생길 수 있다. 페이지 크기는 테이블 크기와 내부 단편화, TLB 효율에 영향을 준다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["페이지 폴트란?","페이징과 세그먼테이션의 차이는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["동기화와 임계영역","임계영역은 여러 실행 흐름이 공유 자원에 접근하는 코드 영역이다. 뮤텍스와 세마포어 등으로 접근 순서를 제어한다.\n\n여러 스레드가 공유 데이터를 동시에 읽고 수정하면 실행 순서에 따라 결과가 달라지는 경쟁 상태가 발생한다. `count++`는 읽기·더하기·쓰기의 여러 단계이므로 두 스레드가 같은 값을 읽고 각각 기록하면 증가가 유실될 수 있다. 임계영역은 공유 자원에 접근하는 코드 구간이며 상호 배제는 한 번에 하나의 실행 흐름만 진입하게 한다. 뮤텍스는 소유권이 있는 잠금으로 보통 획득한 스레드가 해제한다. 세마포어는 카운터로 자원 개수나 실행 순서를 제어한다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공한다. 잠금 순서를 일관되게 유지하지 않으면 교착상태가 생길 수 있다.\n\n원자 연산은 읽기·수정·쓰기 전체가 중간에 끼어들 수 없는 하나의 연산처럼 수행되게 한다. compare-and-swap(CAS)은 메모리 값이 예상한 값과 같을 때만 새 값으로 바꾸는 원자 연산으로 잠금 없는 자료구조 구현에 사용된다. 다만 원자 연산만으로 모든 동시성 문제가 해결되지는 않으며 메모리 순서, ABA 문제, 기아와 공정성도 고려해야 한다. 조건 변수는 특정 조건이 참이 될 때까지 스레드를 잠들게 하며, 깨어난 뒤에는 반드시 while 루프로 조건을 다시 검사해야 한다.\n\n동시 실행에서 데이터 손상과 예측할 수 없는 결과를 방지한다.\n\n동기화 설계에서는 교착상태, 기아, 우선순위 역전도 고려해야 한다.\n\n뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다.","동시 실행에서 데이터 손상과 예측할 수 없는 결과를 방지한다.","임계영역은 여러 실행 흐름이 공유 자원에 접근하는 코드 영역이다. 뮤텍스와 세마포어 등으로 접근 순서를 제어한다.  뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다. 일반적으로 잠근 스레드가 해제하는 소유권 개념이 있으며, 잠금 순서가 일관되지 않으면 교착상태가 생길 수 있다. 임계영역은 가능한 짧게 유지해야 한다.\n\n세마포어는 정수 카운터와 원자적 대기·신호 연산으로 자원 접근 수나 실행 순서를 제어한다. 값이 1인 이진 세마포어와 여러 자원 수를 나타내는 계수 세마포어를 구분할 수 있다. 뮤텍스와 달리 소유권이 없는 사용 방식도 가능하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["뮤텍스와 세마포어의 차이는?","임계영역이란?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["프로세스 상태와 문맥 교환","프로세스는 생성, 준비, 실행, 대기, 종료 등의 상태를 거친다. 문맥 교환은 CPU가 실행 대상을 바꿀 때 레지스터, 프로그램 카운터, 스택 포인터 등 실행 상태를 저장하고 다음 프로세스의 상태를 복원하는 과정이다.\n\n프로세스는 생성된 뒤 준비(Ready), 실행(Running), 대기/차단(Waiting/Blocked), 종료(Terminated) 상태 등을 이동한다. 준비 상태는 CPU를 받을 수 있지만 아직 실행되지 않은 상태이고, 입출력 완료나 이벤트를 기다리면 대기 상태로 이동한다. 이벤트가 발생하면 다시 준비 상태가 된다. 문맥 교환은 현재 실행 단위의 레지스터·프로그램 카운터·스택 포인터 등 CPU 문맥을 저장하고 다음 실행 단위의 문맥을 복원하는 과정이다. 타이머 인터럽트, 시스템 호출, 페이지 폴트, 입출력 대기 등이 계기가 될 수 있다. 교환 자체는 유용한 사용자 계산을 하지 않는 오버헤드이며 캐시·TLB 지역성에도 영향을 준다.\n\n동시 실행을 가능하게 하지만 상태 저장·복원과 캐시 영향 등 오버헤드가 발생한다.\n\n입출력 요청으로 대기 상태가 되거나 시간 할당량이 끝나 준비 상태로 돌아가는 등 상태 전이가 일어난다.\n\n문맥 교환은 CPU가 실행 대상을 바꿀 때 레지스터, 프로그램 카운터, 스택 포인터 등 실행 상태를 저장하고 다음 프로세스의 상태를 복원하는 과정이다. 문맥 교환은 실행 중인 작업의 레지스터 등 CPU 상태를 저장하고 다른 작업의 상태를 복원하는 과정이다. 교환 자체는 유용한 계산을 직접 수행하지 않는 오버헤드이며, 캐시·TLB 영향도 성능에 반영된다.","동시 실행을 가능하게 하지만 상태 저장·복원과 캐시 영향 등 오버헤드가 발생한다.","프로세스는 생성, 준비, 실행, 대기, 종료 등의 상태를 거친다. 문맥 교환은 CPU가 실행 대상을 바꿀 때 레지스터, 프로그램 카운터, 스택 포인터 등 실행 상태를 저장하고 다음 프로세스의 상태를 복원하는 과정이다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n문맥 교환은 실행 중인 작업의 레지스터 등 CPU 상태를 저장하고 다른 작업의 상태를 복원하는 과정이다. 교환 자체는 유용한 계산을 직접 수행하지 않는 오버헤드이며, 캐시·TLB 영향도 성능에 반영된다. 타이머 인터럽트, 입출력 대기, 선점 등이 교환의 계기가 된다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["프로세스가 실행 상태에서 대기 상태로 바뀌는 경우는?","문맥 교환이 잦으면 어떤 문제가 생기는가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["스케줄링 알고리즘 비교와 평가 지표","FCFS는 도착 순서, SJF는 짧은 작업 우선, 우선순위 스케줄링은 우선순위, 라운드 로빈은 시간 할당량을 기준으로 CPU를 배분한다. 평가 지표에는 CPU 이용률, 처리량, 반환 시간, 대기 시간, 응답 시간이 있다.\n\nCPU 스케줄링은 준비 상태의 실행 단위 중 다음에 CPU를 배정할 대상을 선택한다. FCFS는 먼저 도착한 순서로 실행해 단순하지만 긴 작업 뒤 짧은 작업이 오래 기다리는 convoy effect가 생길 수 있다. SJF는 실행 시간이 짧은 작업을 우선해 평균 대기 시간을 줄이는 데 유리하지만 실행 시간을 미리 알기 어렵고 긴 작업이 굶을 수 있다. SRTF는 남은 시간이 가장 짧은 작업을 선점 방식으로 선택한다. Round Robin은 각 작업에 시간 할당량을 주어 응답성을 높이지만 quantum이 너무 작으면 문맥 교환이 늘고 너무 크면 FCFS와 비슷해진다. 우선순위 방식은 중요 작업을 먼저 실행하나 기아가 생길 수 있어 aging으로 오래 기다린 작업의 우선순위를 높인다. 반환 시간·대기 시간·응답 시간·처리량은 서로 다른 성능 지표다.\n\n스케줄러는 공정성·응답성·처리량·대기 시간·우선순위 등 서로 다른 목표 사이에서 절충한다. 대화형 시스템은 빠른 첫 응답이 중요하고 일괄 처리 시스템은 전체 작업 처리량과 반환 시간이 중요할 수 있다. 우선순위 역전은 낮은 우선순위 작업이 잠금을 보유해 높은 우선순위 작업이 대기하고 중간 우선순위 작업이 CPU를 점유하는 상황이다. 우선순위 상속은 잠금을 보유한 작업의 우선순위를 대기 중인 높은 우선순위 작업 수준으로 일시적으로 올려 문제를 완화한다.\n\n알고리즘마다 응답성·공정성·처리량의 균형이 다르며 시스템 목적에 맞게 선택해야 한다.\n\n우선순위가 낮은 작업이 계속 실행되지 않는 기아를 막기 위해 기다린 시간에 따라 우선순위를 높이는 에이징을 사용할 수 있다.","알고리즘마다 응답성·공정성·처리량의 균형이 다르며 시스템 목적에 맞게 선택해야 한다.","FCFS는 도착 순서, SJF는 짧은 작업 우선, 우선순위 스케줄링은 우선순위, 라운드 로빈은 시간 할당량을 기준으로 CPU를 배분한다. 평가 지표에는 CPU 이용률, 처리량, 반환 시간, 대기 시간, 응답 시간이 있다.  라운드 로빈은 준비 큐의 프로세스에 동일한 시간 할당량(time quantum)을 순환 배분한다. 응답성이 좋고 기아 가능성을 낮추지만, 할당량이 너무 작으면 문맥 교환이 잦고 너무 크면 FCFS와 비슷해진다.\n\nSJF는 다음 CPU 버스트가 가장 짧을 것으로 예상되는 작업을 먼저 실행해 평균 대기 시간을 줄이는 알고리즘이다. 실제 다음 버스트 길이를 미리 알기 어려워 과거 실행 시간으로 예측하며, 긴 작업이 계속 밀리는 기아가 발생할 수 있다. 선점형 변형은 SRTF다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["SJF의 단점은 무엇인가?","기아 상태와 에이징을 설명해보세요."],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["동기화 도구: 뮤텍스·세마포어·모니터","뮤텍스는 공유 자원에 한 번에 하나의 실행 흐름만 접근하도록 하는 상호 배제 잠금이다. 세마포어는 정수 카운터로 자원 사용 가능 수나 실행 순서를 제어한다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공하는 추상화다.\n\n여러 스레드가 공유 데이터를 동시에 읽고 수정하면 실행 순서에 따라 결과가 달라지는 경쟁 상태가 발생한다. `count++`는 읽기·더하기·쓰기의 여러 단계이므로 두 스레드가 같은 값을 읽고 각각 기록하면 증가가 유실될 수 있다. 임계영역은 공유 자원에 접근하는 코드 구간이며 상호 배제는 한 번에 하나의 실행 흐름만 진입하게 한다. 뮤텍스는 소유권이 있는 잠금으로 보통 획득한 스레드가 해제한다. 세마포어는 카운터로 자원 개수나 실행 순서를 제어한다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공한다. 잠금 순서를 일관되게 유지하지 않으면 교착상태가 생길 수 있다.\n\n원자 연산은 읽기·수정·쓰기 전체가 중간에 끼어들 수 없는 하나의 연산처럼 수행되게 한다. compare-and-swap(CAS)은 메모리 값이 예상한 값과 같을 때만 새 값으로 바꾸는 원자 연산으로 잠금 없는 자료구조 구현에 사용된다. 다만 원자 연산만으로 모든 동시성 문제가 해결되지는 않으며 메모리 순서, ABA 문제, 기아와 공정성도 고려해야 한다. 조건 변수는 특정 조건이 참이 될 때까지 스레드를 잠들게 하며, 깨어난 뒤에는 반드시 while 루프로 조건을 다시 검사해야 한다.\n\n동시성 문제는 단순히 실행 순서가 달라지는 문제가 아니라 데이터 경쟁과 불변식 위반을 일으킬 수 있다.\n\n경쟁 상태는 여러 실행 흐름의 실행 순서에 따라 결과가 달라지는 상황이다. 원자적 연산과 적절한 동기화로 방지한다.\n\n뮤텍스는 공유 자원에 한 번에 하나의 실행 흐름만 접근하도록 하는 상호 배제 잠금이다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공하는 추상화다. 뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다. 세마포어는 정수 카운터와 원자적 대기·신호 연산으로 자원 접근 수나 실행 순서를 제어한다. 값이 1인 이진 세마포어와 여러 자원 수를 나타내는 계수 세마포어를 구분할 수 있다.","동시성 문제는 단순히 실행 순서가 달라지는 문제가 아니라 데이터 경쟁과 불변식 위반을 일으킬 수 있다.","뮤텍스는 공유 자원에 한 번에 하나의 실행 흐름만 접근하도록 하는 상호 배제 잠금이다. 세마포어는 정수 카운터로 자원 사용 가능 수나 실행 순서를 제어한다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공하는 추상화다.  뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다. 일반적으로 잠근 스레드가 해제하는 소유권 개념이 있으며, 잠금 순서가 일관되지 않으면 교착상태가 생길 수 있다. 임계영역은 가능한 짧게 유지해야 한다.\n\n세마포어는 정수 카운터와 원자적 대기·신호 연산으로 자원 접근 수나 실행 순서를 제어한다. 값이 1인 이진 세마포어와 여러 자원 수를 나타내는 계수 세마포어를 구분할 수 있다. 뮤텍스와 달리 소유권이 없는 사용 방식도 가능하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["뮤텍스와 이진 세마포어는 어떻게 다른가?","경쟁 상태란 무엇인가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["가상 메모리와 페이지 교체","가상 메모리는 프로세스에 독립된 주소 공간을 제공하고 실제 물리 메모리와 매핑한다. 필요한 페이지가 메모리에 없으면 페이지 폴트가 발생하며 운영체제는 보조기억장치에서 페이지를 가져온다. FIFO, LRU, 최적 교체 등이 대표적 페이지 교체 알고리즘이다.\n\n가상 메모리는 프로세스마다 독립된 주소 공간을 제공하고 실제 RAM 위치와 분리한다. 페이징은 가상 공간을 페이지, 물리 메모리를 프레임으로 나누고 페이지 테이블로 대응시킨다. CPU가 참조한 페이지가 RAM에 없으면 페이지 폴트가 발생하며 운영체제는 접근이 유효한지 확인하고 디스크에서 페이지를 적재한다. 빈 프레임이 없으면 기존 페이지를 교체한다. FIFO는 먼저 적재된 페이지, LRU는 가장 오래 사용하지 않은 페이지를 교체하며 OPT는 미래에 가장 늦게 사용할 페이지를 교체하는 이론적 기준이다. 실제 OS는 미래 접근을 알 수 없어 근사 정책을 쓴다. 페이지 폴트가 지나치게 잦아 CPU가 페이지 교체에 대부분의 시간을 쓰는 현상이 스래싱이다.\n\n페이지 교체 정책은 어떤 페이지를 내보낼지 결정한다. FIFO는 오래전에 적재된 페이지를 제거하지만 자주 쓰는 페이지도 교체할 수 있고 Belady의 이상 현상이 나타날 수 있다. LRU는 최근 사용 시점을 기준으로 지역성을 이용하지만 정확한 구현에는 비용이 든다. Clock/Second Chance는 참조 비트를 이용해 LRU를 근사한다. 더티 페이지는 디스크에 반영한 뒤 교체해야 하므로 깨끗한 페이지보다 비용이 크다. 페이지 크기는 페이지 테이블 크기·내부 단편화·TLB 도달 범위·I/O 효율에 영향을 준다.\n\n실제 RAM보다 큰 주소 공간을 활용하고 프로세스 간 메모리 보호를 제공하지만 페이지 폴트가 과도하면 성능이 급격히 저하된다.\n\n스래싱은 페이지 폴트가 지나치게 자주 발생해 실제 작업보다 페이지 교체에 시간을 더 쓰는 상태다.\n\n가상 메모리는 프로세스에 독립된 주소 공간을 제공하고 실제 물리 메모리와 매핑한다. 필요한 페이지가 메모리에 없으면 페이지 폴트가 발생하며 운영체제는 보조기억장치에서 페이지를 가져온다. FIFO는 먼저 들어온 페이지, LRU는 가장 오래 사용하지 않은 페이지, OPT는 앞으로 가장 늦게 사용할 페이지를 교체한다.","실제 RAM보다 큰 주소 공간을 활용하고 프로세스 간 메모리 보호를 제공하지만 페이지 폴트가 과도하면 성능이 급격히 저하된다.","가상 메모리는 프로세스에 독립된 주소 공간을 제공하고 실제 물리 메모리와 매핑한다. 필요한 페이지가 메모리에 없으면 페이지 폴트가 발생하며 운영체제는 보조기억장치에서 페이지를 가져온다. FIFO, LRU, 최적 교체 등이 대표적 페이지 교체 알고리즘이다.  빈 프레임이 없을 때 어떤 페이지를 내보낼지 결정한다. FIFO는 먼저 들어온 페이지, LRU는 가장 오래 사용하지 않은 페이지, OPT는 앞으로 가장 늦게 사용할 페이지를 교체한다. OPT는 미래 참조를 알아야 하므로 비교 기준이고, LRU 근사 알고리즘 등이 실제 시스템에서 활용된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["페이지 폴트는 오류인가?","스래싱이란 무엇인가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["파일 시스템과 디스크 스케줄링","파일 시스템은 파일과 디렉터리의 이름, 위치, 메타데이터, 접근 권한 등을 관리한다. 디스크 스케줄링은 HDD의 탐색 시간을 줄이기 위해 요청 순서를 조정하며 FCFS, SSTF, SCAN 등이 있다.\n\n파일 시스템은 저장장치의 블록을 파일과 디렉터리라는 논리 구조로 관리한다. 디렉터리 항목은 이름과 파일 메타데이터를 연결하며 메타데이터에는 크기·소유자·권한·시간·데이터 블록 위치가 포함될 수 있다. 파일을 열면 프로세스에 파일 디스크립터가 반환되고 이후 읽기·쓰기 작업은 이를 통해 수행된다. POSIX 권한은 소유자·그룹·기타 사용자별 읽기·쓰기·실행 비트를 사용하고 ACL은 더 세밀한 권한을 표현한다. HDD 디스크 스케줄링은 헤드 이동을 줄이기 위해 FCFS, SSTF, SCAN, C-SCAN 등을 사용한다. SSD는 기계식 헤드가 없어 HDD의 탐색 시간 최적화와 같은 기준을 그대로 적용하기 어렵다.\n\n스케줄러는 공정성·응답성·처리량·대기 시간·우선순위 등 서로 다른 목표 사이에서 절충한다. 대화형 시스템은 빠른 첫 응답이 중요하고 일괄 처리 시스템은 전체 작업 처리량과 반환 시간이 중요할 수 있다. 우선순위 역전은 낮은 우선순위 작업이 잠금을 보유해 높은 우선순위 작업이 대기하고 중간 우선순위 작업이 CPU를 점유하는 상황이다. 우선순위 상속은 잠금을 보유한 작업의 우선순위를 대기 중인 높은 우선순위 작업 수준으로 일시적으로 올려 문제를 완화한다.\n\n데이터를 지속적으로 저장하고 효율적으로 검색하며 접근 권한을 관리하는 운영체제의 핵심 기능이다.\n\n저널링은 실제 메타데이터 변경 전에 변경 기록을 남겨 비정상 종료 후 일관성 복구를 돕는다.","데이터를 지속적으로 저장하고 효율적으로 검색하며 접근 권한을 관리하는 운영체제의 핵심 기능이다.","파일 시스템은 파일과 디렉터리의 이름, 위치, 메타데이터, 접근 권한 등을 관리한다. 디스크 스케줄링은 HDD의 탐색 시간을 줄이기 위해 요청 순서를 조정하며 FCFS, SSTF, SCAN 등이 있다.  운영체제의 정책과 메커니즘을 구분하는 것이 중요하다. 메커니즘은 어떤 기능을 수행할 수 있는 수단이고, 정책은 그 수단을 언제 누구에게 적용할지 결정한다. 운영체제별 구현과 설정에 따라 세부 동작은 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["파일과 디렉터리의 메타데이터에는 무엇이 있는가?","저널링 파일 시스템의 목적은?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["시스템 호출·커널 모드·사용자 모드","응용 프로그램은 파일 열기, 프로세스 생성, 메모리 요청 등의 운영체제 서비스를 시스템 호출로 요청한다. 사용자 모드는 제한된 권한으로 실행되고 커널 모드는 하드웨어와 핵심 자원에 접근할 수 있는 권한을 가진다.\n\n사용자 모드는 일반 응용 프로그램이 제한된 권한으로 실행되는 모드이고 커널 모드는 운영체제가 메모리 관리·장치 제어 등 특권 명령을 수행하는 모드다. 응용 프로그램이 파일 읽기나 프로세스 생성처럼 커널 기능을 요청할 때 시스템 호출을 이용한다. 시스템 호출은 정해진 명령이나 트랩으로 커널에 제어를 넘기며 커널은 인자와 권한을 검증한 뒤 결과를 반환한다. 시스템 호출은 일반 라이브러리 함수와 다르다. 예를 들어 printf는 포맷 처리와 버퍼링을 수행하고 필요할 때 write 시스템 호출을 호출할 수 있다.\n\n시스템 호출은 사용자 모드에서 커널 모드로 권한을 전환하는 경로이며 인자 검증과 권한 검사가 필요하다. 잘못된 포인터나 크기를 커널에 전달하면 커널이 안전하지 않은 메모리에 접근할 수 있으므로 사용자 메모리 복사와 검증이 중요하다. 시스템 호출은 일반 함수 호출보다 전환 비용이 크므로 버퍼링·배치 처리·비동기 I/O로 호출 횟수를 줄일 수 있다. 시스템 호출 번호와 ABI는 운영체제·아키텍처에 따라 다르다.\n\n권한 분리는 응용 프로그램 오류나 악성 코드가 시스템 전체를 손상시키는 위험을 줄인다.\n\n일반 함수 호출은 같은 권한 수준에서 실행될 수 있지만 시스템 호출은 보호된 커널 기능을 요청한다는 점이 핵심이다.","권한 분리는 응용 프로그램 오류나 악성 코드가 시스템 전체를 손상시키는 위험을 줄인다.","응용 프로그램은 파일 열기, 프로세스 생성, 메모리 요청 등의 운영체제 서비스를 시스템 호출로 요청한다. 사용자 모드는 제한된 권한으로 실행되고 커널 모드는 하드웨어와 핵심 자원에 접근할 수 있는 권한을 가진다.",["함수 호출과 시스템 호출은 어떻게 다른가?","인터럽트와 시스템 호출의 차이는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["교착상태의 발생 조건과 해결","교착상태는 둘 이상의 프로세스가 서로 상대방이 가진 자원을 기다리며 진행하지 못하는 상태다. 상호 배제, 점유와 대기, 비선점, 순환 대기의 네 조건이 동시에 성립할 때 발생할 수 있다.\n\n교착상태는 둘 이상의 실행 주체가 서로가 보유한 자원을 기다리며 진행하지 못하는 상태다. 예를 들어 A가 L1 잠금을 가진 채 L2를 기다리고 B가 L2를 가진 채 L1을 기다리면 순환 대기가 만들어진다. 발생을 위한 네 조건은 상호 배제, 점유와 대기, 비선점, 환형 대기다. 예방은 조건 중 하나를 깨고, 회피는 자원 할당 후에도 안전 상태인지 검사하며 은행원 알고리즘이 대표적이다. 탐지는 교착상태를 허용한 뒤 대기 관계를 분석하고, 복구는 프로세스 종료·자원 회수·롤백 등을 사용한다. 기아는 특정 작업이 계속 자원을 받지 못하는 상태로 교착상태와 구별된다.\n\n자원 할당 그래프에서 프로세스와 자원을 노드로 나타내고 요청 간선과 할당 간선을 구분하면 대기 관계를 시각화할 수 있다. 자원 유형마다 인스턴스가 하나인 경우 사이클은 교착상태의 필요충분 조건이지만 여러 인스턴스가 있으면 사이클이 있다고 항상 교착상태인 것은 아니다. 프로그램에서는 전역 잠금 획득 순서를 정하고, 잠금 안에서 네트워크나 파일 I/O처럼 오래 걸리는 작업을 하지 않으며, 타임아웃과 잠금 진단 도구를 활용하는 것이 실용적이다.\n\n동시성 제어와 자원 할당 정책의 위험을 이해하는 대표 주제다.\n\n자원 획득 순서를 일관되게 정하면 순환 대기 조건을 방지하는 데 도움이 된다.\n\n상호 배제, 점유와 대기, 비선점, 순환 대기의 네 조건이 동시에 성립할 때 발생할 수 있다. 상호 배제, 점유 대기, 비선점, 순환 대기의 네 조건이 동시에 성립하면 발생 가능하다. 예방은 조건 중 하나를 깨고, 회피는 안전 상태를 확인하며, 탐지는 발생 후 복구한다.","동시성 제어와 자원 할당 정책의 위험을 이해하는 대표 주제다.","교착상태는 둘 이상의 프로세스가 서로 상대방이 가진 자원을 기다리며 진행하지 못하는 상태다. 상호 배제, 점유와 대기, 비선점, 순환 대기의 네 조건이 동시에 성립할 때 발생할 수 있다.  교착상태는 둘 이상의 프로세스가 서로 상대가 가진 자원을 기다리며 진행하지 못하는 상태다. 상호 배제, 점유 대기, 비선점, 순환 대기의 네 조건이 동시에 성립하면 발생 가능하다. 예방은 조건 중 하나를 깨고, 회피는 안전 상태를 확인하며, 탐지는 발생 후 복구한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["교착상태와 기아 상태의 차이는?","교착상태 네 조건을 하나씩 설명해보세요."],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["프로세스와 스레드의 메모리 구조","프로세스는 독립된 주소 공간과 자원 정보를 가지며, 같은 프로세스의 스레드는 코드·데이터·힙 등을 공유하고 각자 스택과 레지스터 상태를 가진다.\n\n스레드별 스택은 함수 호출과 지역 변수를 독립적으로 유지하기 위해 필요하다. 같은 프로세스의 두 스레드가 같은 스택을 공유하면 한 스레드의 함수 호출이 다른 스레드의 지역 변수와 복귀 정보를 덮어쓸 수 있다. 반면 힙과 전역 데이터는 공유하므로 스레드 간 포인터를 전달하기 쉽다. 스레드 종료 후에도 다른 스레드가 참조하는 객체를 해제하면 use-after-free가 발생할 수 있어 객체의 수명과 소유권을 설계해야 한다. 프로세스 간 공유 메모리는 빠르지만 동기화 수단과 접근 권한을 별도로 마련해야 한다.\n\n스레드가 가볍지만 동기화 문제가 필요한 이유를 설명할 수 있다.\n\n스레드마다 스택과 레지스터 문맥은 별도로 유지되며, 힙과 전역 데이터는 일반적으로 공유한다.","스레드가 가볍지만 동기화 문제가 필요한 이유를 설명할 수 있다.","프로세스는 독립된 주소 공간과 자원 정보를 가지며, 같은 프로세스의 스레드는 코드·데이터·힙 등을 공유하고 각자 스택과 레지스터 상태를 가진다.  레지스터는 CPU 내부의 매우 빠른 저장 공간으로, 범용 레지스터 외에도 PC(다음 명령어 주소), IR(현재 명령어), SP(스택 위치), 상태 레지스터 등 역할이 정해진 레지스터가 있다. 레지스터 수와 구조는 ISA 및 마이크로아키텍처에 영향을 받는다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스레드마다 독립적인 것은 무엇인가?","프로세스 간 통신과 스레드 간 통신 차이는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["동시성·병렬성·비동기 처리","동시성은 여러 작업이 겹쳐 진행되는 구조이고 병렬성은 여러 작업이 실제로 같은 시점에 실행되는 것이다. 비동기 처리는 작업 완료를 기다리는 동안 다른 일을 진행할 수 있도록 제어 흐름을 구성하는 방식이다.\n\n동시성은 여러 작업이 시간상 겹쳐 진행하거나 번갈아 진전하는 구조이고, 병렬성은 여러 작업이 실제 같은 시간에 서로 다른 처리 자원에서 실행되는 것이다. 단일 코어에서도 문맥 교환으로 동시성을 구현할 수 있지만 실제 병렬 실행에는 여러 코어 또는 실행 유닛이 필요하다. 비동기 처리는 작업 완료를 기다리며 현재 실행 흐름을 막아 두지 않고 완료 이벤트·콜백·future 등을 통해 결과를 처리한다. 비동기는 반드시 멀티스레드나 병렬 실행을 뜻하지 않으며 단일 이벤트 루프에서도 가능하다.\n\n멀티코어, 이벤트 기반 서버, 입출력 대기 처리의 차이를 구분하는 데 필요하다.\n\n비동기는 단일 스레드 이벤트 루프로도 구현할 수 있고, 멀티스레드와 결합할 수도 있다.","멀티코어, 이벤트 기반 서버, 입출력 대기 처리의 차이를 구분하는 데 필요하다.","동시성은 여러 작업이 겹쳐 진행되는 구조이고 병렬성은 여러 작업이 실제로 같은 시점에 실행되는 것이다. 비동기 처리는 작업 완료를 기다리는 동안 다른 일을 진행할 수 있도록 제어 흐름을 구성하는 방식이다.  운영체제의 정책과 메커니즘을 구분하는 것이 중요하다. 메커니즘은 어떤 기능을 수행할 수 있는 수단이고, 정책은 그 수단을 언제 누구에게 적용할지 결정한다. 운영체제별 구현과 설정에 따라 세부 동작은 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["싱글 코어에서도 동시성이 가능한가?","비동기와 멀티스레드는 같은 개념인가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["메모리 단편화와 페이징·세그먼테이션","외부 단편화는 사용 가능한 총 메모리는 충분해도 연속된 큰 공간이 없어 할당하지 못하는 현상이고, 내부 단편화는 할당된 공간 안에 사용하지 않는 영역이 생기는 현상이다. 페이징은 고정 크기 페이지로 외부 단편화를 줄인다.\n\n가상 메모리는 프로세스마다 독립된 주소 공간을 제공하고 실제 RAM 위치와 분리한다. 페이징은 가상 공간을 페이지, 물리 메모리를 프레임으로 나누고 페이지 테이블로 대응시킨다. CPU가 참조한 페이지가 RAM에 없으면 페이지 폴트가 발생하며 운영체제는 접근이 유효한지 확인하고 디스크에서 페이지를 적재한다. 빈 프레임이 없으면 기존 페이지를 교체한다. FIFO는 먼저 적재된 페이지, LRU는 가장 오래 사용하지 않은 페이지를 교체하며 OPT는 미래에 가장 늦게 사용할 페이지를 교체하는 이론적 기준이다. 실제 OS는 미래 접근을 알 수 없어 근사 정책을 쓴다. 페이지 폴트가 지나치게 잦아 CPU가 페이지 교체에 대부분의 시간을 쓰는 현상이 스래싱이다.\n\n메모리 할당 방식과 가상 메모리 설계의 장단점을 비교할 수 있다.\n\n세그먼테이션은 코드·데이터·스택처럼 논리적 의미가 있는 가변 크기 영역으로 나누는 방식이다.\n\n외부 단편화는 사용 가능한 총 메모리는 충분해도 연속된 큰 공간이 없어 할당하지 못하는 현상이고, 내부 단편화는 할당된 공간 안에 사용하지 않는 영역이 생기는 현상이다. 페이징은 가상 주소 공간을 고정 크기의 페이지, 물리 메모리를 같은 크기의 프레임으로 나누어 매핑한다.","메모리 할당 방식과 가상 메모리 설계의 장단점을 비교할 수 있다.","외부 단편화는 사용 가능한 총 메모리는 충분해도 연속된 큰 공간이 없어 할당하지 못하는 현상이고, 내부 단편화는 할당된 공간 안에 사용하지 않는 영역이 생기는 현상이다. 페이징은 고정 크기 페이지로 외부 단편화를 줄인다.  페이징은 가상 주소 공간을 고정 크기의 페이지, 물리 메모리를 같은 크기의 프레임으로 나누어 매핑한다. 외부 단편화를 줄이고 비연속적인 물리 배치를 가능하게 하지만 페이지 테이블 공간과 내부 단편화가 생길 수 있다. 페이지 크기는 테이블 크기와 내부 단편화, TLB 효율에 영향을 준다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["페이징이 외부 단편화를 줄이는 이유는?","세그먼테이션은 어떤 기준으로 나누는가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["컨테이너와 가상머신","가상머신은 하이퍼바이저를 통해 가상 하드웨어와 별도 운영체제를 실행한다. 컨테이너는 호스트 커널을 공유하면서 프로세스와 파일시스템·네트워크 등을 격리한다.\n\n가상머신은 하이퍼바이저가 CPU·메모리·장치를 가상화해 게스트 운영체제가 독립된 컴퓨터처럼 실행되도록 한다. VM마다 별도 커널을 실행하므로 격리가 강하지만 OS 이미지와 자원을 유지하는 비용이 든다. 컨테이너는 호스트 커널을 공유하면서 프로세스·파일시스템·네트워크의 관점을 격리한다. Linux의 namespaces는 자원 가시 범위를 분리하고 cgroups는 CPU·메모리 사용량을 제한한다. 컨테이너는 가볍고 배포가 편리하지만 커널을 공유하므로 권한 설정과 커널 보안이 중요하다.\n\n컨테이너 이미지는 애플리케이션과 실행 의존성을 층(layer)으로 묶어 동일한 환경을 배포하게 한다. 이미지와 실행 중 컨테이너는 구분되며 컨테이너는 이미지에서 만들어진 격리된 프로세스 실행 환경이다. 영속 데이터는 컨테이너 내부 파일 시스템에만 두기보다 볼륨을 이용해 수명과 분리할 수 있다. VM과 컨테이너 모두 자원 격리를 제공하지만 격리 경계와 커널 공유 여부가 다르므로 위협 모델에 따라 선택한다.\n\n클라우드와 배포 환경에서 운영체제 가상화 개념을 이해하는 데 중요하다.\n\n컨테이너의 네임스페이스와 cgroups는 격리와 자원 제한에 활용된다.","클라우드와 배포 환경에서 운영체제 가상화 개념을 이해하는 데 중요하다.","가상머신은 하이퍼바이저를 통해 가상 하드웨어와 별도 운영체제를 실행한다. 컨테이너는 호스트 커널을 공유하면서 프로세스와 파일시스템·네트워크 등을 격리한다.  운영체제의 정책과 메커니즘을 구분하는 것이 중요하다. 메커니즘은 어떤 기능을 수행할 수 있는 수단이고, 정책은 그 수단을 언제 누구에게 적용할지 결정한다. 운영체제별 구현과 설정에 따라 세부 동작은 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컨테이너가 가상머신보다 가벼운 이유는?","컨테이너가 완전히 독립된 운영체제인가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["시스템 호출과 사용자 모드·커널 모드","응용 프로그램은 파일 읽기, 프로세스 생성, 네트워크 통신 등 운영체제의 보호된 기능을 이용할 때 시스템 호출을 사용한다. CPU는 사용자 모드와 커널 모드를 구분해 권한을 제한한다.\n\n사용자 모드는 일반 응용 프로그램이 제한된 권한으로 실행되는 모드이고 커널 모드는 운영체제가 메모리 관리·장치 제어 등 특권 명령을 수행하는 모드다. 응용 프로그램이 파일 읽기나 프로세스 생성처럼 커널 기능을 요청할 때 시스템 호출을 이용한다. 시스템 호출은 정해진 명령이나 트랩으로 커널에 제어를 넘기며 커널은 인자와 권한을 검증한 뒤 결과를 반환한다. 시스템 호출은 일반 라이브러리 함수와 다르다. 예를 들어 printf는 포맷 처리와 버퍼링을 수행하고 필요할 때 write 시스템 호출을 호출할 수 있다.\n\n시스템 호출은 사용자 모드에서 커널 모드로 권한을 전환하는 경로이며 인자 검증과 권한 검사가 필요하다. 잘못된 포인터나 크기를 커널에 전달하면 커널이 안전하지 않은 메모리에 접근할 수 있으므로 사용자 메모리 복사와 검증이 중요하다. 시스템 호출은 일반 함수 호출보다 전환 비용이 크므로 버퍼링·배치 처리·비동기 I/O로 호출 횟수를 줄일 수 있다. 시스템 호출 번호와 ABI는 운영체제·아키텍처에 따라 다르다.\n\n응용 프로그램의 요청이 운영체제 서비스로 이어지는 경계와 보호 메커니즘을 설명할 수 있다.\n\n일반 함수 호출은 같은 실행 권한 안에서 제어를 이동하지만 시스템 호출은 보호 경계를 넘어 커널의 검증된 서비스를 요청한다.","응용 프로그램의 요청이 운영체제 서비스로 이어지는 경계와 보호 메커니즘을 설명할 수 있다.","응용 프로그램은 파일 읽기, 프로세스 생성, 네트워크 통신 등 운영체제의 보호된 기능을 이용할 때 시스템 호출을 사용한다. CPU는 사용자 모드와 커널 모드를 구분해 권한을 제한한다.",["함수 호출과 시스템 호출은 어떻게 다른가?","모드 전환이 필요한 이유는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["CPU 스케줄링 알고리즘 비교","FCFS는 도착 순서, SJF는 실행 시간이 짧은 작업 우선, 우선순위 스케줄링은 중요도, 라운드 로빈은 시간 할당량을 기준으로 CPU를 배분한다. 각 알고리즘은 대기 시간, 응답 시간, 공정성에서 차이가 있다.\n\nCPU 스케줄링은 준비 상태의 실행 단위 중 다음에 CPU를 배정할 대상을 선택한다. FCFS는 먼저 도착한 순서로 실행해 단순하지만 긴 작업 뒤 짧은 작업이 오래 기다리는 convoy effect가 생길 수 있다. SJF는 실행 시간이 짧은 작업을 우선해 평균 대기 시간을 줄이는 데 유리하지만 실행 시간을 미리 알기 어렵고 긴 작업이 굶을 수 있다. SRTF는 남은 시간이 가장 짧은 작업을 선점 방식으로 선택한다. Round Robin은 각 작업에 시간 할당량을 주어 응답성을 높이지만 quantum이 너무 작으면 문맥 교환이 늘고 너무 크면 FCFS와 비슷해진다. 우선순위 방식은 중요 작업을 먼저 실행하나 기아가 생길 수 있어 aging으로 오래 기다린 작업의 우선순위를 높인다. 반환 시간·대기 시간·응답 시간·처리량은 서로 다른 성능 지표다.\n\n스케줄러는 공정성·응답성·처리량·대기 시간·우선순위 등 서로 다른 목표 사이에서 절충한다. 대화형 시스템은 빠른 첫 응답이 중요하고 일괄 처리 시스템은 전체 작업 처리량과 반환 시간이 중요할 수 있다. 우선순위 역전은 낮은 우선순위 작업이 잠금을 보유해 높은 우선순위 작업이 대기하고 중간 우선순위 작업이 CPU를 점유하는 상황이다. 우선순위 상속은 잠금을 보유한 작업의 우선순위를 대기 중인 높은 우선순위 작업 수준으로 일시적으로 올려 문제를 완화한다.\n\n운영체제가 여러 프로세스에 CPU를 배분하는 기준과 트레이드오프를 비교할 수 있다.\n\n에이징은 오래 기다린 프로세스의 우선순위를 점차 높여 기아를 완화하는 방법이다.\n\nFCFS는 도착 순서, SJF는 실행 시간이 짧은 작업 우선, 우선순위 스케줄링은 중요도, 라운드 로빈은 시간 할당량을 기준으로 CPU를 배분한다. SJF는 다음 CPU 버스트가 가장 짧을 것으로 예상되는 작업을 먼저 실행해 평균 대기 시간을 줄이는 알고리즘이다.","운영체제가 여러 프로세스에 CPU를 배분하는 기준과 트레이드오프를 비교할 수 있다.","FCFS는 도착 순서, SJF는 실행 시간이 짧은 작업 우선, 우선순위 스케줄링은 중요도, 라운드 로빈은 시간 할당량을 기준으로 CPU를 배분한다. 각 알고리즘은 대기 시간, 응답 시간, 공정성에서 차이가 있다.  라운드 로빈은 준비 큐의 프로세스에 동일한 시간 할당량(time quantum)을 순환 배분한다. 응답성이 좋고 기아 가능성을 낮추지만, 할당량이 너무 작으면 문맥 교환이 잦고 너무 크면 FCFS와 비슷해진다.\n\nSJF는 다음 CPU 버스트가 가장 짧을 것으로 예상되는 작업을 먼저 실행해 평균 대기 시간을 줄이는 알고리즘이다. 실제 다음 버스트 길이를 미리 알기 어려워 과거 실행 시간으로 예측하며, 긴 작업이 계속 밀리는 기아가 발생할 수 있다. 선점형 변형은 SRTF다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["선점형과 비선점형 스케줄링의 차이는?","기아 현상은 어떻게 완화할 수 있는가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["동기화: 임계영역·뮤텍스·세마포어","임계영역은 공유 자원에 접근해 경쟁 상태가 발생할 수 있는 코드 구간이다. 뮤텍스는 소유권을 가진 잠금 개념이고 세마포어는 카운터를 이용해 여러 자원의 접근 수를 제어할 수 있다.\n\n여러 스레드가 공유 데이터를 동시에 읽고 수정하면 실행 순서에 따라 결과가 달라지는 경쟁 상태가 발생한다. `count++`는 읽기·더하기·쓰기의 여러 단계이므로 두 스레드가 같은 값을 읽고 각각 기록하면 증가가 유실될 수 있다. 임계영역은 공유 자원에 접근하는 코드 구간이며 상호 배제는 한 번에 하나의 실행 흐름만 진입하게 한다. 뮤텍스는 소유권이 있는 잠금으로 보통 획득한 스레드가 해제한다. 세마포어는 카운터로 자원 개수나 실행 순서를 제어한다. 모니터는 공유 데이터와 연산을 묶고 조건 변수를 통해 대기·통지를 제공한다. 잠금 순서를 일관되게 유지하지 않으면 교착상태가 생길 수 있다.\n\n원자 연산은 읽기·수정·쓰기 전체가 중간에 끼어들 수 없는 하나의 연산처럼 수행되게 한다. compare-and-swap(CAS)은 메모리 값이 예상한 값과 같을 때만 새 값으로 바꾸는 원자 연산으로 잠금 없는 자료구조 구현에 사용된다. 다만 원자 연산만으로 모든 동시성 문제가 해결되지는 않으며 메모리 순서, ABA 문제, 기아와 공정성도 고려해야 한다. 조건 변수는 특정 조건이 참이 될 때까지 스레드를 잠들게 하며, 깨어난 뒤에는 반드시 while 루프로 조건을 다시 검사해야 한다.\n\n멀티스레드 프로그램에서 데이터 불일치와 경쟁 상태가 생기는 원인 및 해결 원리를 이해할 수 있다.\n\n경쟁 상태는 실행 순서에 따라 결과가 달라지는 문제이고 교착상태는 서로 자원을 기다리며 진행하지 못하는 상태다.\n\n뮤텍스는 소유권을 가진 잠금 개념이고 세마포어는 카운터를 이용해 여러 자원의 접근 수를 제어할 수 있다. 뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다. 세마포어는 정수 카운터와 원자적 대기·신호 연산으로 자원 접근 수나 실행 순서를 제어한다. 값이 1인 이진 세마포어와 여러 자원 수를 나타내는 계수 세마포어를 구분할 수 있다.","멀티스레드 프로그램에서 데이터 불일치와 경쟁 상태가 생기는 원인 및 해결 원리를 이해할 수 있다.","임계영역은 공유 자원에 접근해 경쟁 상태가 발생할 수 있는 코드 구간이다. 뮤텍스는 소유권을 가진 잠금 개념이고 세마포어는 카운터를 이용해 여러 자원의 접근 수를 제어할 수 있다.  뮤텍스는 한 시점에 하나의 스레드만 임계영역에 들어가도록 하는 상호 배제 잠금이다. 일반적으로 잠근 스레드가 해제하는 소유권 개념이 있으며, 잠금 순서가 일관되지 않으면 교착상태가 생길 수 있다. 임계영역은 가능한 짧게 유지해야 한다.\n\n세마포어는 정수 카운터와 원자적 대기·신호 연산으로 자원 접근 수나 실행 순서를 제어한다. 값이 1인 이진 세마포어와 여러 자원 수를 나타내는 계수 세마포어를 구분할 수 있다. 뮤텍스와 달리 소유권이 없는 사용 방식도 가능하다.\n\n경쟁 상태는 여러 실행 흐름의 결과가 실행 순서나 타이밍에 따라 달라지는 현상이다. 공유 카운터의 증가를 읽기·수정·쓰기 단계로 나누어 수행하면 갱신이 유실될 수 있다. 잠금, 원자 연산, 불변 데이터, 메시지 전달 등으로 방지한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["뮤텍스와 세마포어의 차이는?","경쟁 상태와 교착상태는 같은가?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["페이지 교체 알고리즘과 스래싱","물리 메모리가 부족하면 운영체제는 페이지 교체 알고리즘으로 메모리에서 내보낼 페이지를 선택한다. FIFO, LRU, 최적 알고리즘 등이 있으며 페이지 폴트가 지나치게 많아 작업보다 교체에 시간을 쓰는 현상을 스래싱이라 한다.\n\n가상 메모리는 프로세스마다 독립된 주소 공간을 제공하고 실제 RAM 위치와 분리한다. 페이징은 가상 공간을 페이지, 물리 메모리를 프레임으로 나누고 페이지 테이블로 대응시킨다. CPU가 참조한 페이지가 RAM에 없으면 페이지 폴트가 발생하며 운영체제는 접근이 유효한지 확인하고 디스크에서 페이지를 적재한다. 빈 프레임이 없으면 기존 페이지를 교체한다. FIFO는 먼저 적재된 페이지, LRU는 가장 오래 사용하지 않은 페이지를 교체하며 OPT는 미래에 가장 늦게 사용할 페이지를 교체하는 이론적 기준이다. 실제 OS는 미래 접근을 알 수 없어 근사 정책을 쓴다. 페이지 폴트가 지나치게 잦아 CPU가 페이지 교체에 대부분의 시간을 쓰는 현상이 스래싱이다.\n\n페이지 교체 정책은 어떤 페이지를 내보낼지 결정한다. FIFO는 오래전에 적재된 페이지를 제거하지만 자주 쓰는 페이지도 교체할 수 있고 Belady의 이상 현상이 나타날 수 있다. LRU는 최근 사용 시점을 기준으로 지역성을 이용하지만 정확한 구현에는 비용이 든다. Clock/Second Chance는 참조 비트를 이용해 LRU를 근사한다. 더티 페이지는 디스크에 반영한 뒤 교체해야 하므로 깨끗한 페이지보다 비용이 크다. 페이지 크기는 페이지 테이블 크기·내부 단편화·TLB 도달 범위·I/O 효율에 영향을 준다.\n\n가상 메모리가 성능을 높이는 동시에 메모리 압박 상황에서 성능 저하를 일으킬 수 있음을 설명할 수 있다.\n\n작업 집합을 고려해 프로세스 수를 조정하거나 물리 메모리를 늘리고 메모리 접근 지역성을 개선할 수 있다.\n\n물리 메모리가 부족하면 운영체제는 페이지 교체 알고리즘으로 메모리에서 내보낼 페이지를 선택한다. FIFO, LRU, 최적 알고리즘 등이 있으며 페이지 폴트가 지나치게 많아 작업보다 교체에 시간을 쓰는 현상을 스래싱이라 한다. FIFO는 먼저 들어온 페이지, LRU는 가장 오래 사용하지 않은 페이지, OPT는 앞으로 가장 늦게 사용할 페이지를 교체한다. 스래싱은 프로세스의 작업 집합을 유지할 프레임이 부족해 페이지 폴트와 디스크 입출력이 과도하게 반복되고 실제 연산이 거의 진행되지 않는 현상이다.","가상 메모리가 성능을 높이는 동시에 메모리 압박 상황에서 성능 저하를 일으킬 수 있음을 설명할 수 있다.","물리 메모리가 부족하면 운영체제는 페이지 교체 알고리즘으로 메모리에서 내보낼 페이지를 선택한다. FIFO, LRU, 최적 알고리즘 등이 있으며 페이지 폴트가 지나치게 많아 작업보다 교체에 시간을 쓰는 현상을 스래싱이라 한다.  빈 프레임이 없을 때 어떤 페이지를 내보낼지 결정한다. FIFO는 먼저 들어온 페이지, LRU는 가장 오래 사용하지 않은 페이지, OPT는 앞으로 가장 늦게 사용할 페이지를 교체한다. OPT는 미래 참조를 알아야 하므로 비교 기준이고, LRU 근사 알고리즘 등이 실제 시스템에서 활용된다.\n\n스래싱은 프로세스의 작업 집합을 유지할 프레임이 부족해 페이지 폴트와 디스크 입출력이 과도하게 반복되고 실제 연산이 거의 진행되지 않는 현상이다. 동시 실행 프로세스 수를 줄이거나 프레임을 더 배분하고 작업 집합을 고려해 제어할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["FIFO에서 벨레이디의 모순이란?","스래싱을 줄이는 방법은?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]],["파일 시스템과 파일 접근 권한","파일 시스템은 저장장치의 블록을 파일과 디렉터리라는 논리적 구조로 관리하고 이름, 크기, 위치, 소유자, 권한 등의 메타데이터를 유지한다. 파일 접근 권한은 사용자와 그룹 등이 파일을 읽고 쓰고 실행할 수 있는 범위를 통제한다.\n\n파일 시스템은 저장장치의 블록을 파일과 디렉터리라는 논리 구조로 관리한다. 디렉터리 항목은 이름과 파일 메타데이터를 연결하며 메타데이터에는 크기·소유자·권한·시간·데이터 블록 위치가 포함될 수 있다. 파일을 열면 프로세스에 파일 디스크립터가 반환되고 이후 읽기·쓰기 작업은 이를 통해 수행된다. POSIX 권한은 소유자·그룹·기타 사용자별 읽기·쓰기·실행 비트를 사용하고 ACL은 더 세밀한 권한을 표현한다. HDD 디스크 스케줄링은 헤드 이동을 줄이기 위해 FCFS, SSTF, SCAN, C-SCAN 등을 사용한다. SSD는 기계식 헤드가 없어 HDD의 탐색 시간 최적화와 같은 기준을 그대로 적용하기 어렵다.\n\n데이터를 지속적으로 보관하고 사용자별 접근을 통제하는 운영체제의 핵심 기능이다.\n\n최소 권한 원칙에 따라 필요한 사용자에게 필요한 작업만 허용해야 하며, 저널링은 비정상 종료 후 파일 시스템 일관성 복구에 도움을 준다.","데이터를 지속적으로 보관하고 사용자별 접근을 통제하는 운영체제의 핵심 기능이다.","파일 시스템은 저장장치의 블록을 파일과 디렉터리라는 논리적 구조로 관리하고 이름, 크기, 위치, 소유자, 권한 등의 메타데이터를 유지한다. 파일 접근 권한은 사용자와 그룹 등이 파일을 읽고 쓰고 실행할 수 있는 범위를 통제한다.  운영체제의 정책과 메커니즘을 구분하는 것이 중요하다. 메커니즘은 어떤 기능을 수행할 수 있는 수단이고, 정책은 그 수단을 언제 누구에게 적용할지 결정한다. 운영체제별 구현과 설정에 따라 세부 동작은 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["파일 시스템의 메타데이터에는 무엇이 있습니까?","권한 설정이 보안에 중요한 이유는?"],"",[["Operating Systems: Three Easy Pieces","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["KAIST OSTEP 강의자료","https://oslab.kaist.ac.kr/ostepslides/"]]]]],["🧱","자료구조","데이터 저장·탐색·삽입·삭제 구조",[["자료구조와 선택 기준","자료구조는 데이터를 효율적으로 저장하고 접근·삽입·삭제하기 위한 구성 방식이다. 배열, 리스트, 스택, 큐, 트리, 그래프, 해시 등이 있다.\n\n자료구조는 데이터를 저장하는 모양뿐 아니라 지원하는 연산과 그 연산 비용까지 포함하는 설계 선택이다. 학생 목록에서 특정 번호를 즉시 조회할지, 순서대로 출력할지, 중간 삽입·삭제가 잦은지에 따라 적합한 구조가 달라진다. 핵심 연산의 빈도, 데이터 크기, 정렬 여부, 메모리 제한, 동시 접근을 함께 고려한다. 추상 자료형(ADT)은 데이터와 제공 연산을 정의하고 자료구조는 이를 메모리에 구현하는 방법을 정한다. 스택 ADT는 배열이나 연결 리스트로 구현할 수 있으며 같은 ADT라도 구현에 따라 메모리 사용과 연산 비용이 달라진다.\n\n자주 수행하는 연산과 데이터 형태에 따라 성능이 달라진다.\n\n자료구조는 데이터의 구성 방식이고 알고리즘은 그 데이터를 이용해 문제를 해결하는 절차다.","자주 수행하는 연산과 데이터 형태에 따라 성능이 달라진다.","자료구조는 데이터를 효율적으로 저장하고 접근·삽입·삭제하기 위한 구성 방식이다. 배열, 리스트, 스택, 큐, 트리, 그래프, 해시 등이 있다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["자료구조와 알고리즘의 관계는?","자료구조 선택 시 고려 요소는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["배열과 연결 리스트","배열은 연속된 메모리에 저장해 인덱스 접근이 빠르다. 연결 리스트는 데이터와 다음 노드 주소를 가진 노드들을 연결한다.\n\n배열은 원소를 연속된 메모리에 저장한다. 시작 주소와 원소 크기를 이용해 i번째 주소를 계산하므로 임의 인덱스 접근은 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 뒤쪽 원소 이동이 필요해 O(n)이다. 동적 배열은 용량이 차면 더 큰 공간을 할당하고 복사하며 개별 확장은 O(n)이지만 여러 번 삽입의 분할 상환 비용은 평균 O(1)로 설명할 수 있다. 연결 리스트는 각 노드가 데이터와 다음 노드 주소를 가진다. 특정 위치 검색은 O(n)이지만 삽입·삭제할 노드 참조를 이미 알고 있으면 링크 변경만으로 O(1)에 처리할 수 있다. 노드별 포인터 공간과 비연속 메모리로 인한 캐시 비지역성은 단점이다.\n\n배열의 연속 배치는 인덱스 계산과 캐시 활용에 유리하지만 크기 변경과 중간 삽입 비용이 크다. 동적 배열은 여유 용량을 확보해 append를 대부분 O(1)에 처리하고 가득 찰 때 용량을 늘린다. 연결 리스트는 노드가 흩어져 있을 수 있어 포인터 추적과 캐시 미스가 발생하지만 노드 참조가 이미 주어진 경우 링크 수정이 간단하다. 따라서 '삽입·삭제가 많으면 연결 리스트'라는 규칙만으로 선택하지 말고 실제로 삽입 위치를 알고 있는지, 순차 탐색이 얼마나 많은지, 메모리 지역성이 중요한지 확인해야 한다.\n\n배열은 임의 접근에 유리하고 연결 리스트는 노드 위치를 알고 있다면 연결 변경으로 삽입·삭제하기 쉽다.\n\n연결 리스트는 단일·이중·원형으로 구분하며 이중 연결 리스트는 이전 노드 포인터도 가진다.\n\n연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다.","배열은 임의 접근에 유리하고 연결 리스트는 노드 위치를 알고 있다면 연결 변경으로 삽입·삭제하기 쉽다.","배열은 연속된 메모리에 저장해 인덱스 접근이 빠르다. 연결 리스트는 데이터와 다음 노드 주소를 가진 노드들을 연결한다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다. 포인터 공간과 캐시 비지역성은 단점이다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["배열 중간 삽입이 느린 이유는?","연결 리스트의 단점은?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["스택과 큐","스택은 후입선출(LIFO), 큐는 선입선출(FIFO) 구조다. 스택은 push/pop, 큐는 enqueue/dequeue 연산을 사용한다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조다. push는 삽입, pop은 제거, peek는 최상단 확인이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행하며 작업 대기열과 BFS에 사용한다. 덱은 양쪽 끝에서 삽입·삭제가 가능하다. 우선순위 큐는 도착 순서가 아니라 우선순위로 원소를 꺼내며 보통 힙으로 구현한다. 이들은 동작을 정의하는 ADT이고 배열·연결 리스트·원형 버퍼 등으로 구현할 수 있다.\n\n함수 호출, 실행 취소, 작업 대기열 등 순서 규칙이 있는 문제를 표현한다.\n\n원형 큐는 배열 끝과 처음을 순환시켜 선형 큐의 공간 낭비를 줄인다.\n\n스택은 push/pop, 큐는 enqueue/dequeue 연산을 사용한다. 스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.","함수 호출, 실행 취소, 작업 대기열 등 순서 규칙이 있는 문제를 표현한다.","스택은 후입선출(LIFO), 큐는 선입선출(FIFO) 구조다. 스택은 push/pop, 큐는 enqueue/dequeue 연산을 사용한다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스택이 함수 호출에 사용되는 이유는?","원형 큐를 사용하는 이유는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["트리와 이진 탐색 트리","트리는 노드와 간선으로 계층 관계를 표현한다. 이진 탐색 트리는 왼쪽 서브트리 값이 작고 오른쪽이 큰 규칙을 가진다.\n\n트리는 노드와 간선으로 이루어진 계층 구조이며 루트·부모·자식·잎·깊이·높이·서브트리로 설명한다. 이진 트리는 각 노드가 최대 두 자식을 갖는다. 이진 탐색 트리는 왼쪽 서브트리 키가 현재 키보다 작고 오른쪽은 크도록 유지해 비교 결과에 따라 탐색 방향을 줄인다. 균형 트리에서는 높이가 O(log n)이므로 탐색·삽입·삭제가 O(log n)이지만 정렬된 순서로 삽입되면 한쪽으로 기울어 O(n)이 될 수 있다. AVL은 서브트리 높이 차이를 엄격히 제한하고 레드블랙 트리는 색 규칙으로 높이를 제한해 갱신과 탐색의 균형을 맞춘다. 회전은 BST의 키 순서를 유지하면서 트리 모양을 바꾸는 연산이다.\n\nBST의 삭제는 자식이 없는 노드, 자식 하나인 노드, 자식 둘인 노드로 나누어 처리한다. 자식 둘이면 오른쪽 서브트리의 최솟값(중위 후속자) 또는 왼쪽 서브트리의 최댓값으로 대체한 뒤 해당 노드를 제거할 수 있다. AVL 회전은 LL·RR·LR·RL 네 유형으로 설명하며 불균형 방향에 따라 단일 또는 이중 회전을 수행한다. 균형 트리는 검색 성능을 보장하지만 회전과 높이·색 정보 갱신으로 삽입·삭제 구현이 복잡해진다.\n\n계층 데이터와 검색 문제를 효율적으로 표현한다.\n\nAVL·레드블랙 트리는 균형을 유지해 탐색·삽입·삭제를 O(log n) 수준으로 관리한다.\n\n이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.","계층 데이터와 검색 문제를 효율적으로 표현한다.","트리는 노드와 간선으로 계층 관계를 표현한다. 이진 탐색 트리는 왼쪽 서브트리 값이 작고 오른쪽이 큰 규칙을 가진다.  이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["완전 이진 트리와 포화 이진 트리 차이는?","BST가 편향되면?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["그래프와 탐색","그래프는 정점과 간선으로 객체 간 관계를 표현한다. BFS는 큐로 가까운 정점부터, DFS는 스택 또는 재귀로 깊게 탐색한다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 방향·무방향, 가중·비가중 그래프로 나뉘며 도로망·소셜 네트워크·선수 과목 관계 등을 모델링한다. 인접 행렬은 V×V 공간을 사용해 두 정점의 연
