우와 넣는 경우 중 큰 값을 선택한다. 1차원 DP로 줄일 때는 용량 c를 W에서 무게 w까지 역순으로 갱신해야 같은 물건을 한 번만 사용한다. 정순으로 갱신하면 같은 물건을 여러 번 넣는 무한 배낭처럼 동작한다. O(nW)는 W의 숫자값에 비례하는 의사다항 시간이다.\n\n0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 조건에서 배낭의 용량을 넘지 않으면서 가치 합을 최대화하는 문제다. dp[i][w]를 i번째 물건까지 고려하고 배낭 용량이 w일 때 얻을 수 있는 최대 가치라고 정의한다. 정방향 갱신은 현재 물건의 갱신 결과를 다시 사용해 동일 물건을 여러 번 넣는 무한 배낭 문제가 된다. 물건을 쪼갤 수 있는 분할 배낭 문제는 가치/무게 비율에 따른 탐욕법으로 해결할 수 있지만 0-1 배낭에는 그리디가 일반적으로 최적해를 보장하지 않는다. 0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 방식으로 무게 제한 안에서 가치를 최대화한다.\n\n```text\ndp[0..W] = 0\n각 물건 (무게 w, 가치 v)에 대해:\n    c를 W부터 w까지 역순으로:\n        dp[c] = max(dp[c], dp[c-w] + v)\n```\n역순 갱신해야 물건을 한 번만 사용할 수 있다.","","0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 조건에서 배낭의 용량을 넘지 않으면서 가치 합을 최대화하는 문제다. 물건을 쪼갤 수 없고 각 물건은 최대 한 번만 선택할 수 있다.\n\ndp[i][w]를 i번째 물건까지 고려하고 배낭 용량이 w일 때 얻을 수 있는 최대 가치라고 정의한다. i번째 물건의 무게와 가치가 각각 weight[i], value[i]일 때 무게가 w보다 크면 넣을 수 없으므로 dp[i][w]=dp[i-1][w]다. 넣을 수 있다면 넣지 않는 경우와 넣는 경우 중 큰 값을 선택한다. dp[i][w]=max(dp[i-1][w], dp[i-1][w-weight[i]]+value[i])이다.\n\n물건 수 N, 용량 W라면 시간복잡도는 O(NW), 2차원 공간복잡도는 O(NW)다. 이전 행만 필요하므로 1차원 배열 O(W)로 줄일 수 있다. 이때 같은 물건을 한 번만 사용해야 하므로 용량 인덱스를 큰 값에서 작은 값으로 역순 갱신해야 한다. 정방향 갱신은 현재 물건의 갱신 결과를 다시 사용해 동일 물건을 여러 번 넣는 무한 배낭 문제가 된다.\n\n물건을 쪼갤 수 있는 분할 배낭 문제는 가치/무게 비율에 따른 탐욕법으로 해결할 수 있지만 0-1 배낭에는 그리디가 일반적으로 최적해를 보장하지 않는다.  ALU는 덧셈·뺄셈 같은 산술 연산과 AND·OR·XOR·NOT, 비교, 시프트 같은 논리·비트 연산을 수행한다. 연산 결과뿐 아니라 0 여부, 부호, 자리올림, 오버플로 등의 상태 플래그가 조건 분기나 후속 명령에 활용될 수 있다.\n\n배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 방식으로 무게 제한 안에서 가치를 최대화한다. dp[i][w]를 i번째 물건까지 고려해 용량 w에서 얻는 최대 가치로 정의하면 선택하지 않는 경우와 선택하는 경우의 최댓값을 비교한다. 1차원 배열 최적화 시 같은 물건을 한 번만 쓰도록 용량을 내림차순으로 갱신한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["1차원 DP에서 역순 갱신하는 이유는?","분할 배낭과 0-1 배낭의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["최장 공통 부분 수열(LCS)","LCS는 두 문자열 또는 수열에서 상대적 순서를 유지하면서 공통으로 나타나는 부분 수열 중 가장 긴 것을 찾는 문제다. 부분 수열은 연속할 필요가 없다. 예를 들어 ABCD와 AECBD의 LCS는 ABD 또는 ACD처럼 순서를 유지해 선택할 수 있다. 연속된 구간을 찾는 최장 공통 부분 문자열과 구분해야 한다.\n\nLCS는 두 수열에서 순서를 유지하며 공통으로 나타나는 부분 수열 중 가장 긴 것을 찾는다. 부분 수열은 연속할 필요는 없다. `dp[i][j]`를 각 수열의 앞 i개와 앞 j개 사이 LCS 길이로 정의한다. 마지막 문자가 같으면 `dp[i-1][j-1]+1`, 다르면 `max(dp[i-1][j],dp[i][j-1])`이다. 시간·공간복잡도는 O(nm)이며 길이만 필요하면 행 두 개로 공간을 줄일 수 있다. 실제 수열을 복원하려면 이전 상태를 역추적한다.\n\nLCS는 두 문자열 또는 수열에서 상대적 순서를 유지하면서 공통으로 나타나는 부분 수열 중 가장 긴 것을 찾는 문제다. 예를 들어 ABCD와 AECBD의 LCS는 ABD 또는 ACD처럼 순서를 유지해 선택할 수 있다. dp[i][j]를 첫 번째 문자열의 앞 i개와 두 번째 문자열의 앞 j개를 비교했을 때 LCS 길이로 정의한다. 최장 공통 부분 수열은 두 문자열에서 순서를 유지하면서 공통으로 나타나는 가장 긴 부분 수열이다. dp[i][j]를 각 문자열의 앞 i개와 앞 j개에서의 LCS 길이로 두고, 문자가 같으면 대각선 값에 1을 더하며 다르면 위·왼쪽 값 중 큰 값을 선택한다.\n\n```text\nfor i = 1..n:\n    for j = 1..m:\n        if A[i-1] == B[j-1]:\n            dp[i][j] = dp[i-1][j-1] + 1\n        else:\n            dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n```","","LCS는 두 문자열 또는 수열에서 상대적 순서를 유지하면서 공통으로 나타나는 부분 수열 중 가장 긴 것을 찾는 문제다. 부분 수열은 연속할 필요가 없다. 예를 들어 ABCD와 AECBD의 LCS는 ABD 또는 ACD처럼 순서를 유지해 선택할 수 있다. 연속된 구간을 찾는 최장 공통 부분 문자열과 구분해야 한다.\n\ndp[i][j]를 첫 번째 문자열의 앞 i개와 두 번째 문자열의 앞 j개를 비교했을 때 LCS 길이로 정의한다. 두 문자의 마지막 글자가 같으면 dp[i][j]=dp[i-1][j-1]+1이다. 다르면 dp[i][j]=max(dp[i-1][j],dp[i][j-1])이다. 빈 문자열과 비교한 길이는 0이므로 0행과 0열을 0으로 초기화한다.\n\n문자열 길이가 N과 M이면 시간복잡도와 기본 공간복잡도는 O(NM)이다. 길이만 필요하면 이전 행과 현재 행만 유지해 공간을 줄일 수 있다. 실제 부분 수열을 복원하려면 DP 테이블에서 역추적해야 한다.  최장 공통 부분 수열은 두 문자열에서 순서를 유지하면서 공통으로 나타나는 가장 긴 부분 수열이다. dp[i][j]를 각 문자열의 앞 i개와 앞 j개에서의 LCS 길이로 두고, 문자가 같으면 대각선 값에 1을 더하며 다르면 위·왼쪽 값 중 큰 값을 선택한다. 기본 시간·공간복잡도는 O(mn)이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["LCS와 최장 공통 부분 문자열의 차이는?","LCS의 점화식을 설명해보세요."],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["위상 정렬","위상 정렬은 방향 비순환 그래프(DAG)에서 모든 방향 간선의 선후 관계를 만족하도록 정점을 나열하는 것이다. u→v 간선이 있다면 결과에서 u는 v보다 먼저 나와야 한다. 선수 과목, 작업 의존성, 빌드 순서 등을 표현할 때 사용한다.\n\n위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 먼저 오도록 정점을 나열한다. 선수 과목·빌드 의존성·작업 순서에 사용한다. Kahn 알고리즘은 진입 차수가 0인 정점을 큐에 넣고 하나씩 꺼내 결과에 추가하면서 이웃의 진입 차수를 줄인다. 결과에 포함된 정점 수가 V보다 작으면 사이클이 존재한다. DFS 방식은 방문 중인 정점을 다시 만나는지 확인해 사이클을 찾고 종료 순서의 역순을 출력한다. 인접 리스트에서 O(V+E)다.\n\n위상 정렬은 방향 비순환 그래프(DAG)에서 모든 방향 간선의 선후 관계를 만족하도록 정점을 나열하는 것이다. 처리한 정점 수가 전체 정점 수보다 적으면 사이클이 존재해 위상 정렬이 불가능하다. 진입 차수가 0인 정점이 동시에 여러 개일 수 있으므로 위상 정렬 결과는 유일하지 않을 수 있다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다.\n\n```text\n모든 정점의 진입 차수 계산\n진입 차수가 0인 정점을 큐에 삽입\n큐가 빌 때까지:\n    u를 꺼내 결과에 추가\n    u에서 나가는 간선의 이웃 진입 차수 감소\n    0이 된 이웃을 큐에 삽입\n결과 정점 수가 V보다 작으면 사이클 존재\n```","","위상 정렬은 방향 비순환 그래프(DAG)에서 모든 방향 간선의 선후 관계를 만족하도록 정점을 나열하는 것이다. u→v 간선이 있다면 결과에서 u는 v보다 먼저 나와야 한다. 선수 과목, 작업 의존성, 빌드 순서 등을 표현할 때 사용한다.\n\n칸(Kahn) 알고리즘은 모든 정점의 진입 차수를 계산하고 진입 차수가 0인 정점을 큐에 넣는다. 큐에서 정점을 꺼내 결과에 추가하고, 해당 정점에서 나가는 간선을 제거한 것으로 보아 이웃 정점의 진입 차수를 감소시킨다. 진입 차수가 0이 된 정점을 큐에 넣는다. 처리한 정점 수가 전체 정점 수보다 적으면 사이클이 존재해 위상 정렬이 불가능하다.\n\nDFS 기반 방식은 후속 정점을 모두 방문한 뒤 정점을 결과에 추가하고, 완료 순서를 역순으로 출력한다. 인접 리스트 기준 두 방법의 시간복잡도는 O(V+E)다. 진입 차수가 0인 정점이 동시에 여러 개일 수 있으므로 위상 정렬 결과는 유일하지 않을 수 있다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 재귀 깊이가 큰 입력에서는 호출 스택 한계를 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["위상 정렬이 가능한 그래프의 조건은?","칸 알고리즘은 사이클을 어떻게 판별하는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["최장 증가 부분 수열(LIS)","LIS는 수열에서 원래 순서를 유지하면서 값이 엄격하게 증가하는 부분 수열 중 가장 긴 것을 찾는 문제다. 원소가 연속할 필요는 없다. 기본 DP에서는 dp[i]를 i번째 원소에서 끝나는 LIS의 길이로 정의한다. 모든 j<i에 대해 a[j]<a[i]이면 dp[i]=max(dp[i],dp[j]+1)로 갱신하고, 초기값은 1이다. 시간복잡도는 O(n²)이다.\n\nLIS는 원래 수열에서 순서를 유지하며 값이 증가하는 부분 수열 중 가장 긴 것을 찾는다. 기본 DP는 dp[i]를 i번째 원소에서 끝나는 LIS 길이로 정의하고 j<i, a[j]<a[i]인 모든 j에 대해 dp[i]=max(dp[i],dp[j]+1)로 갱신해 O(n²)에 구한다. 더 빠른 방법은 길이별 최소 마지막 값을 tails에 유지하고 이진 탐색으로 갱신해 O(n log n)에 길이를 구한다. 실제 수열을 복원하려면 이전 인덱스를 별도로 기록한다.\n\nLIS는 수열에서 원래 순서를 유지하면서 값이 엄격하게 증가하는 부분 수열 중 가장 긴 것을 찾는 문제다. 기본 DP에서는 dp[i]를 i번째 원소에서 끝나는 LIS의 길이로 정의한다. tails 배열은 길이가 같은 증가 부분 수열 중 가능한 최소 마지막 값을 관리한다. 이 배열 자체가 실제 LIS 수열을 항상 나타내는 것은 아니므로 실제 수열을 복원하려면 이전 인덱스와 선택 정보를 추가로 저장해야 한다. 최장 증가 부분 수열은 원래 순서를 유지하면서 값이 엄격히 증가하는 가장 긴 부분 수열이다. 단순 DP는 O(n²)이며, 증가하는 꼬리값을 이분 탐색으로 관리하면 O(n log n)에 길이를 구할 수 있다.\n\n```text\ndp[i] = 1\nfor i = 0..n-1:\n    for j = 0..i-1:\n        if a[j] < a[i]:\n            dp[i] = max(dp[i], dp[j] + 1)\nanswer = max(dp)\n```\n기본 DP는 O(n²), tails와 이진 탐색은 길이를 O(n log n)에 구한다.","","LIS는 수열에서 원래 순서를 유지하면서 값이 엄격하게 증가하는 부분 수열 중 가장 긴 것을 찾는 문제다. 원소가 연속할 필요는 없다. 기본 DP에서는 dp[i]를 i번째 원소에서 끝나는 LIS의 길이로 정의한다. 모든 j<i에 대해 a[j]<a[i]이면 dp[i]=max(dp[i],dp[j]+1)로 갱신하고, 초기값은 1이다. 시간복잡도는 O(n²)이다.\n\n이분 탐색을 이용하면 O(n log n)으로 개선할 수 있다. tails 배열은 길이가 같은 증가 부분 수열 중 가능한 최소 마지막 값을 관리한다. 각 원소 x에 대해 tails에서 x 이상인 첫 위치를 찾아 x로 교체하고, 그런 위치가 없으면 뒤에 추가한다. tails의 길이가 LIS 길이가 된다. 이 배열 자체가 실제 LIS 수열을 항상 나타내는 것은 아니므로 실제 수열을 복원하려면 이전 인덱스와 선택 정보를 추가로 저장해야 한다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n최장 증가 부분 수열은 원래 순서를 유지하면서 값이 엄격히 증가하는 가장 긴 부분 수열이다. 단순 DP는 O(n²)이며, 증가하는 꼬리값을 이분 탐색으로 관리하면 O(n log n)에 길이를 구할 수 있다. 부분 수열은 연속 구간이 아니라는 점을 구분해야 한다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["LIS의 기본 DP 점화식은?","이분 탐색으로 시간복잡도를 줄이는 원리는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["위상 정렬과 사이클 검출","방향 그래프에서 위상 정렬이 가능하려면 그래프가 DAG, 즉 방향 사이클이 없는 그래프여야 한다. 칸 알고리즘에서 진입 차수가 0인 정점을 반복적으로 제거했을 때 제거한 정점 수가 V보다 작으면 제거되지 않은 정점들 사이에 사이클이 존재한다. 사이클에 포함된 정점은 사이클 내부의 선행 간선 때문에 진입 차수가 0이 되지 않기 때문이다.\n\n위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 먼저 오도록 정점을 나열한다. 선수 과목·빌드 의존성·작업 순서에 사용한다. Kahn 알고리즘은 진입 차수가 0인 정점을 큐에 넣고 하나씩 꺼내 결과에 추가하면서 이웃의 진입 차수를 줄인다. 결과에 포함된 정점 수가 V보다 작으면 사이클이 존재한다. DFS 방식은 방문 중인 정점을 다시 만나는지 확인해 사이클을 찾고 종료 순서의 역순을 출력한다. 인접 리스트에서 O(V+E)다.\n\n방향 그래프에서 위상 정렬이 가능하려면 그래프가 DAG, 즉 방향 사이클이 없는 그래프여야 한다. 칸 알고리즘에서 진입 차수가 0인 정점을 반복적으로 제거했을 때 제거한 정점 수가 V보다 작으면 제거되지 않은 정점들 사이에 사이클이 존재한다. 사이클에 포함된 정점은 사이클 내부의 선행 간선 때문에 진입 차수가 0이 되지 않기 때문이다. 현재 재귀 경로에 있는 정점을 다시 만나면 역방향 간선(back edge)이므로 방향 사이클이 존재한다. 위상 정렬은 사이클이 없음을 전제로 작업 의존성의 순서를 찾는 문제이며, 사이클 검출은 그 전제의 성립 여부를 확인하는 과정이다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 위상 정렬은 방향 비순환 그래프(DAG)의 모든 간선 u→v에 대해 u가 v보다 앞서도록 정점을 선형 순서로 나열한다.\n\n```text\n모든 정점의 진입 차수 계산\n진입 차수가 0인 정점을 큐에 삽입\n큐가 빌 때까지:\n    u를 꺼내 결과에 추가\n    u에서 나가는 간선의 이웃 진입 차수 감소\n    0이 된 이웃을 큐에 삽입\n결과 정점 수가 V보다 작으면 사이클 존재\n```","","방향 그래프에서 위상 정렬이 가능하려면 그래프가 DAG, 즉 방향 사이클이 없는 그래프여야 한다. 칸 알고리즘에서 진입 차수가 0인 정점을 반복적으로 제거했을 때 제거한 정점 수가 V보다 작으면 제거되지 않은 정점들 사이에 사이클이 존재한다. 사이클에 포함된 정점은 사이클 내부의 선행 간선 때문에 진입 차수가 0이 되지 않기 때문이다.\n\nDFS로도 방향 사이클을 검출할 수 있다. 방문하지 않음, 현재 DFS 재귀 경로에 있음, 탐색 완료의 세 상태를 구분한다. 현재 재귀 경로에 있는 정점을 다시 만나면 역방향 간선(back edge)이므로 방향 사이클이 존재한다. 단순 방문 여부만 사용하면 이미 탐색을 마친 정점으로 향하는 간선과 현재 경로로 돌아가는 간선을 구분하지 못한다.\n\n위상 정렬은 사이클이 없음을 전제로 작업 의존성의 순서를 찾는 문제이며, 사이클 검출은 그 전제의 성립 여부를 확인하는 과정이다.  그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 재귀 깊이가 큰 입력에서는 호출 스택 한계를 고려한다.\n\n위상 정렬은 방향 비순환 그래프(DAG)의 모든 간선 u→v에 대해 u가 v보다 앞서도록 정점을 선형 순서로 나열한다. 진입 차수가 0인 정점을 큐에 넣는 칸 알고리즘이나 DFS 종료 순서의 역순으로 구현한다. 처리 정점 수가 V보다 적으면 사이클이 존재한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["단순 방문 배열만으로 DFS 사이클 검출이 어려운 이유는?","칸 알고리즘의 처리 정점 수로 사이클을 판단하는 방법은?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["그래프 최단 경로 알고리즘 선택","최단 경로 알고리즘은 간선 가중치의 조건과 구하려는 결과 범위에 따라 선택한다. 가중치가 없거나 모든 간선 가중치가 같으면 BFS로 최소 간선 수 경로를 구할 수 있다. 음수 가중치가 없는 단일 시작점 문제에는 다익스트라가 적합하다. 음수 간선이 존재할 수 있는 단일 시작점 문제에는 벨만-포드를 사용하며, 시작점에서 도달 가능한 음수 사이클도 검출할 수 있다.\n\n최단 경로는 시작 정점에서 다른 정점까지 간선 가중치 합이 최소인 경로다. 다익스트라는 시작점 거리를 0으로 두고 나머지는 무한대로 초기화한 뒤, 현재 알려진 거리 중 가장 작은 정점을 확정하고 인접 간선으로 거리를 완화한다. 모든 간선 가중치가 0 이상이면 가장 작은 거리로 선택된 정점에 이후 더 짧은 경로가 생기지 않는 탐욕적 성질이 성립한다. 음수 간선에서는 이 성질이 깨진다. 인접 리스트와 이진 힙은 보통 O((V+E)log V)이며 parent를 저장하면 경로를 역추적할 수 있다.\n\n최단 경로 알고리즘은 출력 범위와 가중치 조건을 기준으로 선택한다. 비가중 그래프의 단일 시작점은 BFS, 음수 간선이 없는 단일 시작점은 다익스트라, 음수 간선과 음수 사이클 검출은 벨만-포드, 모든 정점 쌍은 플로이드-워셜이 후보가 된다. 다익스트라는 우선순위 큐에서 오래된 거리 후보를 제거해야 중복 삽입 구현이 정확하고 효율적이다. 벨만-포드의 음수 사이클 판정은 시작점에서 도달 가능한 사이클만 대상으로 한다. 플로이드-워셜은 dist 행렬을 초기화할 때 자기 자신은 0, 간선이 없으면 무한대로 설정한다.\n\n최단 경로 알고리즘은 간선 가중치의 조건과 구하려는 결과 범위에 따라 선택한다. 가중치가 없거나 모든 간선 가중치가 같으면 BFS로 최소 간선 수 경로를 구할 수 있다. 음수 간선이 존재할 수 있는 단일 시작점 문제에는 벨만-포드를 사용하며, 시작점에서 도달 가능한 음수 사이클도 검출할 수 있다. 시간복잡도 O(V³), 공간복잡도 O(V²)이므로 정점 수가 크면 비효율적일 수 있다. 그래프가 희소하고 모든 정점에서 최단 거리가 필요하면 다익스트라를 여러 번 수행하는 방법 등도 고려한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 모든 간선의 가중치가 같거나 없을 때 최단 간선 수 경로를 구할 수 있으며 시간복잡도는 인접 리스트 기준 O(V+E)다. 다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다.","","최단 경로 알고리즘은 간선 가중치의 조건과 구하려는 결과 범위에 따라 선택한다. 가중치가 없거나 모든 간선 가중치가 같으면 BFS로 최소 간선 수 경로를 구할 수 있다. 음수 가중치가 없는 단일 시작점 문제에는 다익스트라가 적합하다. 음수 간선이 존재할 수 있는 단일 시작점 문제에는 벨만-포드를 사용하며, 시작점에서 도달 가능한 음수 사이클도 검출할 수 있다.\n\n모든 정점 쌍의 최단 거리를 구하려면 플로이드-워셜을 사용할 수 있다. 시간복잡도 O(V³), 공간복잡도 O(V²)이므로 정점 수가 크면 비효율적일 수 있다. 그래프가 희소하고 모든 정점에서 최단 거리가 필요하면 다익스트라를 여러 번 수행하는 방법 등도 고려한다.\n\n최단 경로는 특정 출발점과 도착점 사이의 경로 비용을 최소화한다. 최소 신장 트리는 모든 정점을 연결하는 간선 가중치 합을 최소화한다. 이름에 '최소'가 포함되어도 서로 다른 최적화 문제이므로 구분해야 한다.  그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n너비 우선 탐색은 시작 정점에서 가까운 정점부터 큐로 방문한다. 모든 간선의 가중치가 같거나 없을 때 최단 간선 수 경로를 구할 수 있으며 시간복잡도는 인접 리스트 기준 O(V+E)다. 방문 여부를 기록하지 않으면 사이클에서 무한 반복할 수 있다.\n\n다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["음수 간선이 있을 때 다익스트라를 사용할 수 없는 이유는?","MST와 최단 경로의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["분할 정복","분할 정복은 문제를 여러 부분 문제로 나누고(divide), 각 부분 문제를 재귀적으로 해결한 뒤(conquer), 결과를 결합(combine)하는 설계 기법이다. 부분 문제는 일반적으로 서로 독립적이다.\n\n재귀는 문제를 더 작은 같은 형태의 문제로 줄여 자기 자신을 호출한다. 기저 사례가 있어야 종료하고 각 호출에서 입력 크기가 기저 사례에 가까워져야 한다. 분할 정복은 문제를 부분 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 병합 정렬의 점화식은 `T(n)=2T(n/2)+O(n)`으로 두 절반을 정렬하고 O(n) 병합을 수행하므로 O(n log n)이다. 동적 계획법은 부분 문제가 겹쳐 계산 결과를 저장한다는 점에서 서로 독립적인 부분 문제를 푸는 분할 정복과 구분된다.\n\n분할 정복은 문제를 여러 부분 문제로 나누고(divide), 각 부분 문제를 재귀적으로 해결한 뒤(conquer), 결과를 결합(combine)하는 설계 기법이다. 퀵 정렬도 분할 정복이며 피벗 분할이 균형적이면 평균 O(n log n), 한쪽으로 치우치면 최악 O(n²)이다. 분할 정복은 독립적인 하위 문제를 각각 해결하는 경우가 일반적이라는 점에서 구분된다. 병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다.","","분할 정복은 문제를 여러 부분 문제로 나누고(divide), 각 부분 문제를 재귀적으로 해결한 뒤(conquer), 결과를 결합(combine)하는 설계 기법이다. 부분 문제는 일반적으로 서로 독립적이다.\n\n병합 정렬은 배열을 절반으로 나누어 각각 정렬하고 두 정렬 배열을 병합한다. 점화식 T(n)=2T(n/2)+O(n)이므로 시간복잡도는 O(n log n)이다. 이진 탐색은 정렬된 탐색 범위를 절반으로 줄여 T(n)=T(n/2)+O(1), 즉 O(log n)에 동작한다. 퀵 정렬도 분할 정복이며 피벗 분할이 균형적이면 평균 O(n log n), 한쪽으로 치우치면 최악 O(n²)이다.\n\n동적 계획법도 부분 문제를 활용하지만, 동일한 부분 문제가 반복되는 경우 결과를 저장해 재사용한다. 분할 정복은 독립적인 하위 문제를 각각 해결하는 경우가 일반적이라는 점에서 구분된다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.\n\n병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 외부 정렬에도 활용된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["분할 정복과 DP의 차이는?","병합 정렬의 점화식과 복잡도는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["백트래킹과 분기 한정법","백트래킹은 가능한 선택을 DFS 방식으로 탐색하다가 현재 상태가 제약 조건을 위반하거나 해로 확장될 수 없으면 되돌아가는 기법이다. 유망성 검사를 통해 불필요한 하위 탐색을 가지치기한다. N-Queen에서는 같은 열이나 대각선에 퀸이 이미 있으면 해당 배치를 더 탐색하지 않는다.\n\n백트래킹은 선택을 하나씩 시도하며 부분 해를 확장하고, 현재 선택으로 유효한 완전 해를 만들 수 없으면 이전 단계로 돌아간다. N-Queen은 퀸을 한 행씩 놓으면서 같은 열·대각선 충돌이 있으면 해당 가지를 중단한다. 가지치기는 불가능한 후보를 일찍 제거하는 것이며 유효한 해를 잘못 제거하지 않는다는 근거가 있어야 한다. 분기 한정법은 최적화 문제에서 현재 부분 해의 상한·하한을 계산해 이미 찾은 최적해보다 좋아질 수 없는 가지를 제거한다.\n\n백트래킹은 상태 공간 트리를 탐색하는 것으로 볼 수 있다. 각 노드는 부분 선택이고 자식은 다음 선택을 추가한 상태다. 유망성 검사는 현재 부분 상태가 제약을 만족하는지 또는 완전 해로 확장될 수 있는지 판단한다. N-Queen에서는 열과 두 대각선 점유 여부를 배열로 관리해 매번 모든 퀸을 비교하는 비용을 줄일 수 있다. 최악 시간복잡도는 지수적일 수 있지만 가지치기가 강하면 실제 탐색량을 크게 줄인다. 가지치기 조건은 해를 제거하지 않는다는 논리적 근거가 필요하다.\n\n분기 한정법은 최적화 문제에서 각 부분 문제의 목적함수에 대한 상한 또는 하한을 계산하고, 현재 최적해보다 나아질 가능성이 없는 부분을 제거한다. 백트래킹은 제약 조건을 만족하는 해 후보를 찾는 데 초점을 두고, 분기 한정은 목적함수의 경계를 사용해 최적해를 찾는 데 초점을 둔다. 분기 한정법은 최적화 문제에서 현재 부분해가 도달할 수 있는 최선의 값(상한·하한)을 계산해 이미 알려진 최적해보다 나아질 수 없는 가지를 제거한다.","","백트래킹은 가능한 선택을 DFS 방식으로 탐색하다가 현재 상태가 제약 조건을 위반하거나 해로 확장될 수 없으면 되돌아가는 기법이다. 유망성 검사를 통해 불필요한 하위 탐색을 가지치기한다. N-Queen에서는 같은 열이나 대각선에 퀸이 이미 있으면 해당 배치를 더 탐색하지 않는다.\n\n분기 한정법은 최적화 문제에서 각 부분 문제의 목적함수에 대한 상한 또는 하한을 계산하고, 현재 최적해보다 나아질 가능성이 없는 부분을 제거한다. 최소화 문제에서는 부분 문제의 하한이 현재 최적해 이상이면 탐색을 중단할 수 있다. 최대화 문제에서는 상한이 현재 최적해 이하인 경우 제거할 수 있다.\n\n백트래킹은 제약 조건을 만족하는 해 후보를 찾는 데 초점을 두고, 분기 한정은 목적함수의 경계를 사용해 최적해를 찾는 데 초점을 둔다. 둘 다 최악의 경우 지수 시간이 걸릴 수 있으며, 가지치기 기준이 정확해야 정답을 놓치지 않는다.  깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 재귀 깊이가 큰 입력에서는 호출 스택 한계를 고려한다.\n\n백트래킹은 가능한 선택을 하나씩 시도하고, 현재 부분 상태가 제약을 위반하거나 해가 될 가능성이 없으면 해당 탐색 가지를 되돌아가는 완전 탐색 기법이다. 상태 공간 트리를 탐색하며 가지치기로 불필요한 경우를 줄인다. 최악 시간복잡도는 지수적일 수 있어 탐색 순서와 가지치기 조건이 중요하다.\n\n분기 한정법은 최적화 문제에서 현재 부분해가 도달할 수 있는 최선의 값(상한·하한)을 계산해 이미 알려진 최적해보다 나아질 수 없는 가지를 제거한다. 백트래킹이 주로 제약 위반 여부로 가지를 자르는 것과 달리 목적함수의 경계값을 이용한다. 우선순위 큐로 유망한 노드를 먼저 확장하기도 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["백트래킹에서 유망성 검사는 무엇인가?","분기 한정의 상한과 하한은 어떻게 쓰이는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["정렬 알고리즘의 안정성과 복잡도","안정 정렬은 정렬 기준 값이 같은 원소들의 기존 상대적 순서를 유지하는 정렬이다. 예를 들어 학생을 점수순으로 정렬할 때 점수가 같은 학생들의 원래 입력 순서가 유지되면 안정 정렬이다. 병합 정렬과 삽입 정렬은 일반적인 구현에서 안정 정렬이며, 퀵 정렬과 힙 정렬은 일반적으로 안정 정렬이 아니다.\n\n버블 정렬은 인접 원소를 비교해 교환하고 선택 정렬은 매 단계 최솟값을 앞으로 보내며 삽입 정렬은 정렬된 앞부분에 원소를 끼워 넣는다. 세 방식은 보통 O(n²)이지만 구현이 단순하고 삽입 정렬은 거의 정렬된 입력에서 효율적이다. 병합 정렬은 절반으로 나누고 정렬 결과를 병합해 O(n log n)을 보장하지만 보조 배열이 필요하다. 퀵 정렬은 피벗 기준으로 분할해 평균 O(n log n), 최악 O(n²)이며 피벗 선택이 중요하다. 힙 정렬은 O(n log n)을 보장하고 추가 배열 없이 구현할 수 있지만 보통 안정 정렬은 아니다. 안정 정렬은 키가 같은 레코드의 기존 상대 순서를 유지해 다중 기준 정렬에 유용하다.\n\n정렬 알고리즘은 비교 기반인지 비비교 기반인지도 구분할 수 있다. 비교 기반 정렬은 원소 간 대소 비교만으로 정렬하므로 일반적인 모델에서 최악 O(n log n)보다 빠른 비교 횟수를 보장할 수 없다. 계수 정렬은 키 범위가 작고 정수인 경우 빈도를 세어 O(n+k)에 정렬할 수 있고, 기수 정렬은 자릿수별 안정 정렬을 반복한다. 이들은 키 범위나 자릿수에 대한 가정을 활용하므로 모든 입력에 비교 정렬보다 유리한 것은 아니다. 실무 정렬은 작은 구간에 삽입 정렬을 섞거나 안정성과 최악 성능을 고려한 하이브리드 방식을 사용한다.\n\n안정 정렬은 정렬 기준 값이 같은 원소들의 기존 상대적 순서를 유지하는 정렬이다. 예를 들어 학생을 점수순으로 정렬할 때 점수가 같은 학생들의 원래 입력 순서가 유지되면 안정 정렬이다. 병합 정렬과 삽입 정렬은 일반적인 구현에서 안정 정렬이며, 퀵 정렬과 힙 정렬은 일반적으로 안정 정렬이 아니다. 비교 기반 정렬의 대표적인 시간복잡도는 버블·선택·삽입 정렬의 평균 O(n²), 병합 정렬 O(n log n), 힙 정렬 O(n log n), 퀵 정렬 평균 O(n log n) 및 최악 O(n²)이다. 삽입 정렬은 거의 정렬된 작은 입력에서 효율적일 수 있고, 선택 정렬은 교환 횟수가 적다는 특징이 있다. 비교 기반 정렬은 원소 간 비교만으로 순서를 결정하므로 최악의 경우 Ω(n log n)의 비교가 필요하다는 하한이 있다. 계수 정렬과 기수 정렬은 값의 범위나 자릿수에 대한 추가 조건을 이용하는 비비교 정렬이므로 이 하한과 직접 같은 조건에서 비교하면 안 된다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다.","","안정 정렬은 정렬 기준 값이 같은 원소들의 기존 상대적 순서를 유지하는 정렬이다. 예를 들어 학생을 점수순으로 정렬할 때 점수가 같은 학생들의 원래 입력 순서가 유지되면 안정 정렬이다. 병합 정렬과 삽입 정렬은 일반적인 구현에서 안정 정렬이며, 퀵 정렬과 힙 정렬은 일반적으로 안정 정렬이 아니다.\n\n비교 기반 정렬의 대표적인 시간복잡도는 버블·선택·삽입 정렬의 평균 O(n²), 병합 정렬 O(n log n), 힙 정렬 O(n log n), 퀵 정렬 평균 O(n log n) 및 최악 O(n²)이다. 삽입 정렬은 거의 정렬된 작은 입력에서 효율적일 수 있고, 선택 정렬은 교환 횟수가 적다는 특징이 있다.\n\n비교 기반 정렬은 원소 간 비교만으로 순서를 결정하므로 최악의 경우 Ω(n log n)의 비교가 필요하다는 하한이 있다. 계수 정렬과 기수 정렬은 값의 범위나 자릿수에 대한 추가 조건을 이용하는 비비교 정렬이므로 이 하한과 직접 같은 조건에서 비교하면 안 된다.  이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.\n\n병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 외부 정렬에도 활용된다.\n\n퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균 O(n log n), 최악 O(n²)이며 피벗 선택과 분할 균형이 성능을 좌우한다. 제자리 정렬 구현이 가능하고 캐시 효율이 좋아 실무에서 널리 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["안정 정렬의 의미는?","비교 기반 정렬의 하한은?","계수 정렬은 어떤 조건에서 유리한가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]]]],["🌐","컴퓨터네트워크","계층·프로토콜·인터넷 통신",[["OSI 7계층과 TCP/IP","OSI는 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층 참조 모델이다. TCP/IP는 인터넷에서 쓰이는 프로토콜 중심 모델이다.\n\nOSI 참조 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 나눈다. 물리는 비트 신호, 데이터링크는 같은 링크의 프레임 전달, 네트워크는 네트워크 간 패킷 전달, 전송은 프로세스 간 통신을 다룬다. TCP/IP는 인터넷 프로토콜 중심 모델로 링크·인터넷·전송·응용 계층 등으로 설명한다. 두 모델은 목적이 비슷하지만 계층이 완전히 일대일 대응하지 않는다. 송신자는 각 계층의 헤더를 붙이는 캡슐화를 하고 수신자는 역캡슐화를 수행한다.\n\n계층별 역할 분담으로 표준화와 장애 분석이 쉬워진다.\n\n허브는 물리 계층, 일반 스위치는 데이터링크 계층, 라우터는 네트워크 계층으로 설명하지만 L3 스위치 등 예외가 있다.\n\nOSI는 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층 참조 모델이다. OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","계층별 역할 분담으로 표준화와 장애 분석이 쉬워진다.","OSI는 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층 참조 모델이다. TCP/IP는 인터넷에서 쓰이는 프로토콜 중심 모델이다.  OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 각 계층은 아래 계층 서비스를 이용하고 위 계층에 서비스를 제공한다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다.\n\nTCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["라우터와 스위치는 주로 어느 계층인가요?","캡슐화란?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TCP와 UDP","TCP는 연결 지향형으로 순서·신뢰성을 보장하기 위해 확인 응답과 재전송 등을 제공한다. UDP는 비연결형으로 기본적인 전달 보장 기능이 없어 오버헤드가 적다.\n\nTCP는 연결 지향 전송 프로토콜로 순서 번호·확인 응답·재전송으로 신뢰성 있는 바이트 스트림을 제공한다. 흐름 제어는 수신 측 버퍼를 보호하고 혼잡 제어는 네트워크 경로의 과부하를 줄인다. UDP는 연결 설정 없이 데이터그램을 전달하며 기본적으로 전달·순서·중복 제거를 보장하지 않는다. 헤더가 단순하고 지연이 적어 DNS·실시간 음성·영상·게임 등에 쓰인다. 신뢰성이 필요한 UDP 응용은 재전송과 순서 관리 등을 직접 구현할 수 있다. TCP는 메시지 경계를 보존하지 않으므로 응용 프로토콜이 길이 필드나 구분자로 메시지 경계를 정해야 한다.\n\nTCP의 순서 번호는 바이트 스트림에서 데이터의 위치를 나타내고 ACK는 다음에 기대하는 바이트 번호를 알린다. 재전송 타이머와 중복 ACK 등으로 손실을 감지하며 수신 윈도는 수신 버퍼 여유를 반영한다. TCP는 메시지 단위가 아닌 바이트 스트림이므로 응용은 길이 헤더·구분자·고정 길이 등으로 메시지 프레이밍을 해야 한다. UDP는 데이터그램 경계를 유지하지만 전달 성공이나 순서를 보장하지 않는다.\n\n응용 서비스의 신뢰성과 지연 요구에 따라 선택한다.\n\nDNS는 일반 질의에 UDP를 많이 사용하지만 응답 크기나 영역 전송 등 상황에 따라 TCP도 사용한다.\n\nTCP는 연결 지향형으로 순서·신뢰성을 보장하기 위해 확인 응답과 재전송 등을 제공한다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. UDP는 연결 설정 없이 데이터그램 단위로 전송하며 전달·순서·중복 제거를 보장하지 않는다.","응용 서비스의 신뢰성과 지연 요구에 따라 선택한다.","TCP는 연결 지향형으로 순서·신뢰성을 보장하기 위해 확인 응답과 재전송 등을 제공한다. UDP는 비연결형으로 기본적인 전달 보장 기능이 없어 오버헤드가 적다.  TCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다.\n\nUDP는 연결 설정 없이 데이터그램 단위로 전송하며 전달·순서·중복 제거를 보장하지 않는다. 헤더가 작고 지연을 줄이기 쉬워 실시간 음성·영상, DNS, 게임 등에 쓰인다. 신뢰성이 필요하면 응용 계층에서 재전송·순서 관리 등을 구현한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["TCP 3-way handshake는?","UDP가 DNS에 쓰이는 이유는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["IP 주소와 서브넷","IP는 네트워크 계층의 논리 주소다. IPv4는 32비트, IPv6는 128비트다. 서브넷 마스크나 프리픽스 길이는 네트워크 부분을 구분한다.\n\nIPv4는 32비트, IPv6는 128비트 논리 주소다. 프리픽스 길이 /n은 앞의 n비트가 네트워크 부분임을 뜻한다. 예를 들어 192.168.10.37/24의 네트워크 주소는 192.168.10.0이고 일반적인 브로드캐스트 주소는 192.168.10.255다. 호스트 비트가 8개인 일반 서브넷은 전통적으로 2^8-2개 호스트 주소를 제공하지만 /31 점대점 링크 등 예외가 있다. 라우터는 목적지 주소와 라우팅 테이블을 비교해 가장 긴 프리픽스 일치 경로를 선택한다.\n\n서브넷 계산은 IP 주소와 마스크를 2진수로 보고 AND 연산해 네트워크 주소를 구하는 과정이다. /26이면 호스트 비트가 6개라 주소 블록 크기는 64이며 마지막 옥텟 기준 0·64·128·192 경계로 나뉜다. 예를 들어 192.168.1.70/26은 192.168.1.64 네트워크에 속하고 브로드캐스트는 192.168.1.127이다. 사용 가능한 일반 호스트 범위는 .65부터 .126이다. 서브넷 설계는 필요한 호스트 수와 향후 확장, 라우팅 요약을 함께 고려한다.\n\n네트워크를 논리적으로 나누고 라우팅과 주소 관리를 효율화한다.\n\n사설 IPv4 대역은 10/8, 172.16/12, 192.168/16이며 일반적으로 NAT 등을 통해 인터넷과 통신한다.\n\nIPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다.","네트워크를 논리적으로 나누고 라우팅과 주소 관리를 효율화한다.","IP는 네트워크 계층의 논리 주소다. IPv4는 32비트, IPv6는 128비트다. 서브넷 마스크나 프리픽스 길이는 네트워크 부분을 구분한다.  IPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 서브넷은 주소 공간을 나누어 브로드캐스트 범위와 라우팅을 관리한다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["공인 IP와 사설 IP 차이는?","기본 게이트웨이 역할은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["DNS와 DHCP","DNS는 도메인 이름을 IP 주소 등으로 변환한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 등의 설정을 자동 할당한다.\n\nDNS는 도메인 이름을 IP 주소 등의 레코드로 바꾸는 분산 계층형 이름 서비스다. 재귀 리졸버는 캐시에 답이 없으면 루트·TLD·권한 네임서버를 조회할 수 있다. 재귀 질의는 요청받은 서버가 최종 답을 찾아주고 반복 질의는 다음 문의 대상을 알려준다. TTL은 캐시 보관 시간을 정한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 서버 설정을 자동 할당한다. IPv4 DHCP의 DORA는 Discover, Offer, Request, Acknowledge 흐름이다. DNS는 이름 해석, DHCP는 네트워크 설정 배포라는 서로 다른 역할이다.\n\nDNS 레코드에는 IPv4 주소 A, IPv6 주소 AAAA, 별칭 CNAME, 메일 서버 MX, 네임서버 NS, 텍스트 TXT 등이 있다. DNS 캐시는 TTL 동안 결과를 저장해 조회를 줄이지만 변경된 레코드가 즉시 모든 곳에 반영되지 않을 수 있다. DHCP 임대는 영구 할당이 아니라 일정 기간 주소를 빌려주는 구조이며 클라이언트는 임대 갱신을 시도한다. DHCP 릴레이는 서로 다른 서브넷의 클라이언트 요청을 DHCP 서버로 전달한다.\n\n이름 기반 서비스 접근과 네트워크 설정 자동화를 지원한다.\n\nDORA는 Discover, Offer, Request, Acknowledge 순서다. DNS는 캐시와 계층적 네임서버 구조를 이용한다.\n\nDHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 등의 설정을 자동 할당한다. DHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다.","이름 기반 서비스 접근과 네트워크 설정 자동화를 지원한다.","DNS는 도메인 이름을 IP 주소 등으로 변환한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 등의 설정을 자동 할당한다.  IPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 서브넷은 주소 공간을 나누어 브로드캐스트 범위와 라우팅을 관리한다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다.\n\nDNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다.\n\nDHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다. IPv4의 대표 절차는 Discover, Offer, Request, Acknowledge(DORA)이며 임대 기간이 끝나기 전에 갱신할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DHCP의 DORA 과정은?","DNS 조회 과정은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["HTTP와 HTTPS","HTTP는 웹 요청·응답 프로토콜이고 HTTPS는 HTTP에 TLS를 적용해 전송 구간 기밀성·무결성·서버 인증을 제공한다.\n\nHTTP는 클라이언트와 서버가 요청·응답으로 자원을 주고받는 응용 계층 프로토콜이다. 요청은 메서드·경로·헤더·본문으로, 응답은 상태 코드·헤더·본문으로 구성될 수 있다. HTTP는 상태 비저장이므로 쿠키·세션·토큰 등으로 응용 상태를 관리한다. HTTPS는 HTTP에 TLS를 적용해 전송 구간을 보호한다. TLS 핸드셰이크에서 암호 방식과 키 교환을 협상하고 인증서를 검증한 뒤 세션 키로 실제 데이터를 암호화한다. 인증서는 도메인 이름·유효기간·신뢰 체인을 검증해야 한다. HTTPS는 전송 구간을 보호할 뿐 서버의 악성 행위나 피싱을 보장하지 않는다.\n\nHTTP 상태 코드는 1xx 정보, 2xx 성공, 3xx 리다이렉션, 4xx 클라이언트 오류, 5xx 서버 오류 범주로 이해할 수 있다. GET은 자원 조회, POST는 처리 요청, PUT은 자원 전체 교체, PATCH는 부분 수정, DELETE는 삭제 의도를 표현한다. 메서드의 안전성·멱등성은 재시도와 캐시 설계에 영향을 준다. TLS 인증서는 서버 공개키의 신뢰를 확인하고 세션 키는 실제 대칭 암호화에 사용된다. HSTS는 브라우저가 해당 사이트에 HTTPS를 사용하도록 강제하는 정책이다.\n\n웹 자원을 표준 방식으로 교환하고 도청·변조·서버 사칭 위험을 줄인다.\n\nHTTPS가 서버 내부의 안전성이나 사용자 단말의 보안까지 보장하는 것은 아니다.\n\nHTTP는 웹 요청·응답 프로토콜이고 HTTPS는 HTTP에 TLS를 적용해 전송 구간 기밀성·무결성·서버 인증을 제공한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.","웹 자원을 표준 방식으로 교환하고 도청·변조·서버 사칭 위험을 줄인다.","HTTP는 웹 요청·응답 프로토콜이고 HTTPS는 HTTP에 TLS를 적용해 전송 구간 기밀성·무결성·서버 인증을 제공한다.  HTTPS는 HTTP 통신을 TLS로 보호한다. TLS 핸드셰이크에서 암호 알고리즘과 키를 협상하고 서버 인증서를 검증한 뒤 세션 키로 데이터를 암호화·무결성 보호한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.\n\nTLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["TLS 인증서란?","HTTPS가 보장하지 않는 것은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["라우팅과 네트워크 장비","라우팅은 목적지 IP를 기준으로 패킷이 전달될 경로를 결정한다. 라우터는 라우팅 테이블을 참고하고 스위치는 MAC 주소를 학습해 프레임을 전달한다.\n\n라우팅은 목적지 네트워크로 패킷을 전달할 다음 홉을 결정한다. 라우터는 목적지 IP와 라우팅 테이블을 비교해 가장 긴 프리픽스 일치 경로를 선택한다. ARP는 IPv4 LAN에서 다음 홉 IP에 대응하는 MAC 주소를 알아낸다. 목적지가 다른 네트워크이면 목적지 호스트가 아니라 기본 게이트웨이의 MAC을 알아낸다. NAT는 사설·공인 IP 또는 포트 정보를 변환한다. PAT는 여러 내부 장치가 공인 IP 하나를 포트 번호로 구분해 공유하는 방식이다. NAT는 주소 절약에 도움되지만 방화벽이나 완전한 보안 통제와 동일하지 않다.\n\n정적 라우팅은 관리자가 경로를 지정해 단순하고 예측 가능하지만 네트워크 변화에 자동 대응하지 못한다. 동적 라우팅은 라우터가 경로 정보를 교환하며 RIP·OSPF·BGP 등이 대표적이다. OSPF는 자율 시스템 내부의 링크 상태 기반 라우팅이고 BGP는 자율 시스템 사이의 경로 정책을 교환한다. 라우터는 패킷의 TTL/Hop Limit을 줄여 무한 루프를 방지하며, 경로가 없거나 정책에 맞지 않으면 패킷을 폐기하고 ICMP 메시지를 보낼 수 있다.\n\n서로 다른 네트워크를 연결해 목적지까지 데이터를 전달한다.\n\n동적 라우팅은 OSPF, BGP 등의 프로토콜로 경로 정보를 교환한다.\n\n실제 패킷에서는 여러 계층의 헤더가 캡슐화되며, 각 장비는 자신이 처리하는 계층과 주소 정보를 기준으로 전달·변환·필터링을 수행한다.","서로 다른 네트워크를 연결해 목적지까지 데이터를 전달한다.","라우팅은 목적지 IP를 기준으로 패킷이 전달될 경로를 결정한다. 라우터는 라우팅 테이블을 참고하고 스위치는 MAC 주소를 학습해 프레임을 전달한다.  네트워크 기능은 계층별 역할을 나누어 이해해야 한다. 실제 패킷에서는 여러 계층의 헤더가 캡슐화되며, 각 장비는 자신이 처리하는 계층과 주소 정보를 기준으로 전달·변환·필터링을 수행한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정적 라우팅과 동적 라우팅 차이는?","스위치와 라우터 차이는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["OSI 7계층과 TCP/IP 모델","OSI는 물리·데이터링크·네트워크·전송·세션·표현·응용 계층으로 네트워크 기능을 개념적으로 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 단순화해 설명한다.\n\nOSI 참조 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 나눈다. 물리는 비트 신호, 데이터링크는 같은 링크의 프레임 전달, 네트워크는 네트워크 간 패킷 전달, 전송은 프로세스 간 통신을 다룬다. TCP/IP는 인터넷 프로토콜 중심 모델로 링크·인터넷·전송·응용 계층 등으로 설명한다. 두 모델은 목적이 비슷하지만 계층이 완전히 일대일 대응하지 않는다. 송신자는 각 계층의 헤더를 붙이는 캡슐화를 하고 수신자는 역캡슐화를 수행한다.\n\n계층별 역할을 알면 통신 장애가 발생한 위치를 좁히고 프로토콜을 구분하기 쉽다.\n\n캡슐화는 상위 계층 데이터에 각 계층의 헤더 등이 추가되는 과정이고, 수신 측에서는 역캡슐화가 일어난다.\n\nOSI는 물리·데이터링크·네트워크·전송·세션·표현·응용 계층으로 네트워크 기능을 개념적으로 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 단순화해 설명한다. OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","계층별 역할을 알면 통신 장애가 발생한 위치를 좁히고 프로토콜을 구분하기 쉽다.","OSI는 물리·데이터링크·네트워크·전송·세션·표현·응용 계층으로 네트워크 기능을 개념적으로 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 단순화해 설명한다.  OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 각 계층은 아래 계층 서비스를 이용하고 위 계층에 서비스를 제공한다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다.\n\nTCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스위치와 라우터는 주로 어느 계층에서 동작하는가?","계층화의 장점은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["IP 주소·서브넷·라우팅","IP 주소는 네트워크와 호스트를 식별하는 논리 주소다. 서브넷 마스크 또는 CIDR 프리픽스는 네트워크 부분을 구분한다. 라우터는 라우팅 테이블을 참조해 목적지 네트워크로 패킷을 전달한다.\n\nIPv4는 32비트, IPv6는 128비트 논리 주소다. 프리픽스 길이 /n은 앞의 n비트가 네트워크 부분임을 뜻한다. 예를 들어 192.168.10.37/24의 네트워크 주소는 192.168.10.0이고 일반적인 브로드캐스트 주소는 192.168.10.255다. 호스트 비트가 8개인 일반 서브넷은 전통적으로 2^8-2개 호스트 주소를 제공하지만 /31 점대점 링크 등 예외가 있다. 라우터는 목적지 주소와 라우팅 테이블을 비교해 가장 긴 프리픽스 일치 경로를 선택한다.\n\n서브넷 계산은 IP 주소와 마스크를 2진수로 보고 AND 연산해 네트워크 주소를 구하는 과정이다. /26이면 호스트 비트가 6개라 주소 블록 크기는 64이며 마지막 옥텟 기준 0·64·128·192 경계로 나뉜다. 예를 들어 192.168.1.70/26은 192.168.1.64 네트워크에 속하고 브로드캐스트는 192.168.1.127이다. 사용 가능한 일반 호스트 범위는 .65부터 .126이다. 서브넷 설계는 필요한 호스트 수와 향후 확장, 라우팅 요약을 함께 고려한다.\n\n주소 체계와 라우팅은 서로 다른 네트워크 사이의 통신을 가능하게 하는 기본 원리다.\n\nIPv4 사설 주소는 내부 네트워크에서 재사용할 수 있고, 외부 인터넷 통신에는 일반적으로 NAT 등을 함께 사용한다.\n\nIPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다.","주소 체계와 라우팅은 서로 다른 네트워크 사이의 통신을 가능하게 하는 기본 원리다.","IP 주소는 네트워크와 호스트를 식별하는 논리 주소다. 서브넷 마스크 또는 CIDR 프리픽스는 네트워크 부분을 구분한다. 라우터는 라우팅 테이블을 참조해 목적지 네트워크로 패킷을 전달한다.  IPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 서브넷은 주소 공간을 나누어 브로드캐스트 범위와 라우팅을 관리한다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["사설 IP와 공인 IP의 차이는?","기본 게이트웨이의 역할은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TCP 연결·흐름제어·혼잡제어","TCP는 연결 지향적 전송 프로토콜로 순서 번호, 확인 응답, 재전송 등을 이용해 신뢰성 있는 바이트 스트림을 제공한다. 흐름제어는 수신자의 처리 능력을 고려하고 혼잡제어는 네트워크 혼잡을 완화한다.\n\nTCP 3-way handshake는 양쪽이 초기 순서 번호를 교환하고 송수신 상태를 확인한다. 클라이언트 SYN, 서버 SYN+ACK, 클라이언트 ACK 순서로 연결이 성립한다. 연결 종료는 각 방향의 송신을 독립적으로 닫으므로 FIN과 ACK가 양방향에서 교환되는 4단계로 설명한다. 한쪽이 FIN을 보내도 상대방은 남은 데이터를 보낼 수 있다. TIME_WAIT은 마지막 ACK가 유실될 가능성과 지연 세그먼트가 새 연결에 섞이는 문제를 방지하는 데 사용된다.\n\nTCP의 순서 번호는 바이트 스트림에서 데이터의 위치를 나타내고 ACK는 다음에 기대하는 바이트 번호를 알린다. 재전송 타이머와 중복 ACK 등으로 손실을 감지하며 수신 윈도는 수신 버퍼 여유를 반영한다. TCP는 메시지 단위가 아닌 바이트 스트림이므로 응용은 길이 헤더·구분자·고정 길이 등으로 메시지 프레이밍을 해야 한다. UDP는 데이터그램 경계를 유지하지만 전달 성공이나 순서를 보장하지 않는다.\n\n신뢰성과 성능을 동시에 확보하는 인터넷 통신의 핵심 원리다.\n\n일반적으로 연결 설정은 SYN, SYN-ACK, ACK 순서이며 종료 과정은 상황에 따라 FIN과 ACK 교환으로 진행된다.\n\nTCP는 연결 지향적 전송 프로토콜로 순서 번호, 확인 응답, 재전송 등을 이용해 신뢰성 있는 바이트 스트림을 제공한다. 흐름제어는 수신자의 처리 능력을 고려하고 혼잡제어는 네트워크 혼잡을 완화한다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","신뢰성과 성능을 동시에 확보하는 인터넷 통신의 핵심 원리다.","TCP는 연결 지향적 전송 프로토콜로 순서 번호, 확인 응답, 재전송 등을 이용해 신뢰성 있는 바이트 스트림을 제공한다. 흐름제어는 수신자의 처리 능력을 고려하고 혼잡제어는 네트워크 혼잡을 완화한다.  TCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["TCP 3-way handshake의 순서는?","흐름제어와 혼잡제어는 어떻게 다른가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["DNS·DHCP·ARP·NAT","DNS는 도메인 이름을 IP 주소 등으로 해석한다. DHCP는 클라이언트에 IP 주소와 네트워크 설정을 동적으로 할당한다. ARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 찾고, NAT는 주소를 변환한다.\n\nDNS는 도메인 이름을 IP 주소 등의 레코드로 바꾸는 분산 계층형 이름 서비스다. 재귀 리졸버는 캐시에 답이 없으면 루트·TLD·권한 네임서버를 조회할 수 있다. 재귀 질의는 요청받은 서버가 최종 답을 찾아주고 반복 질의는 다음 문의 대상을 알려준다. TTL은 캐시 보관 시간을 정한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 서버 설정을 자동 할당한다. IPv4 DHCP의 DORA는 Discover, Offer, Request, Acknowledge 흐름이다. DNS는 이름 해석, DHCP는 네트워크 설정 배포라는 서로 다른 역할이다.\n\nDNS 레코드에는 IPv4 주소 A, IPv6 주소 AAAA, 별칭 CNAME, 메일 서버 MX, 네임서버 NS, 텍스트 TXT 등이 있다. DNS 캐시는 TTL 동안 결과를 저장해 조회를 줄이지만 변경된 레코드가 즉시 모든 곳에 반영되지 않을 수 있다. DHCP 임대는 영구 할당이 아니라 일정 기간 주소를 빌려주는 구조이며 클라이언트는 임대 갱신을 시도한다. DHCP 릴레이는 서로 다른 서브넷의 클라이언트 요청을 DHCP 서버로 전달한다.\n\n이 네 가지 기능을 구분하면 웹 접속 실패나 주소 할당 문제를 단계별로 분석할 수 있다.\n\nDHCP는 일반적으로 DORA(Discover, Offer, Request, Acknowledge) 절차로 주소를 할당한다.\n\nARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 찾고, NAT는 주소를 변환한다. DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. DHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다. ARP는 같은 IPv4 로컬 링크에서 목적지 IP 주소에 대응하는 MAC 주소를 알아내는 프로토콜이다.","이 네 가지 기능을 구분하면 웹 접속 실패나 주소 할당 문제를 단계별로 분석할 수 있다.","DNS는 도메인 이름을 IP 주소 등으로 해석한다. DHCP는 클라이언트에 IP 주소와 네트워크 설정을 동적으로 할당한다. ARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 찾고, NAT는 주소를 변환한다.  DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다.\n\nDHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다. IPv4의 대표 절차는 Discover, Offer, Request, Acknowledge(DORA)이며 임대 기간이 끝나기 전에 갱신할 수 있다.\n\nARP는 같은 IPv4 로컬 링크에서 목적지 IP 주소에 대응하는 MAC 주소를 알아내는 프로토콜이다. ARP 요청은 보통 브로드캐스트되고 응답은 해당 MAC 주소를 알려준다. 다른 네트워크의 호스트로 보낼 때는 원격 호스트가 아니라 기본 게이트웨이의 MAC 주소를 알아낸다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["IP 주소는 있는데 인터넷이 안 될 때 무엇을 확인할까?","DNS와 ARP의 차이는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["HTTP·HTTPS·TLS와 웹 통신","HTTP는 클라이언트와 서버가 요청·응답 메시지로 자원을 주고받는 응용 계층 프로토콜이다. HTTPS는 HTTP 통신을 TLS로 보호해 기밀성·무결성·서버 인증을 제공한다. TLS는 인증서와 키 교환 등을 이용해 안전한 세션을 수립한다.\n\nHTTP는 클라이언트와 서버가 요청·응답으로 자원을 주고받는 응용 계층 프로토콜이다. 요청은 메서드·경로·헤더·본문으로, 응답은 상태 코드·헤더·본문으로 구성될 수 있다. HTTP는 상태 비저장이므로 쿠키·세션·토큰 등으로 응용 상태를 관리한다. HTTPS는 HTTP에 TLS를 적용해 전송 구간을 보호한다. TLS 핸드셰이크에서 암호 방식과 키 교환을 협상하고 인증서를 검증한 뒤 세션 키로 실제 데이터를 암호화한다. 인증서는 도메인 이름·유효기간·신뢰 체인을 검증해야 한다. HTTPS는 전송 구간을 보호할 뿐 서버의 악성 행위나 피싱을 보장하지 않는다.\n\nHTTP 상태 코드는 1xx 정보, 2xx 성공, 3xx 리다이렉션, 4xx 클라이언트 오류, 5xx 서버 오류 범주로 이해할 수 있다. GET은 자원 조회, POST는 처리 요청, PUT은 자원 전체 교체, PATCH는 부분 수정, DELETE는 삭제 의도를 표현한다. 메서드의 안전성·멱등성은 재시도와 캐시 설계에 영향을 준다. TLS 인증서는 서버 공개키의 신뢰를 확인하고 세션 키는 실제 대칭 암호화에 사용된다. HSTS는 브라우저가 해당 사이트에 HTTPS를 사용하도록 강제하는 정책이다.\n\n웹 보안, 인증서 오류, 암호화 통신을 이해하는 기반이다.\n\nTLS는 암호화뿐 아니라 메시지 변조 탐지와 인증도 제공한다. 단, 사용자가 접속한 사이트 자체의 신뢰성까지 보장하는 것은 아니다.\n\nHTTP는 클라이언트와 서버가 요청·응답 메시지로 자원을 주고받는 응용 계층 프로토콜이다. HTTPS는 HTTP 통신을 TLS로 보호해 기밀성·무결성·서버 인증을 제공한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다. TLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다.","웹 보안, 인증서 오류, 암호화 통신을 이해하는 기반이다.","HTTP는 클라이언트와 서버가 요청·응답 메시지로 자원을 주고받는 응용 계층 프로토콜이다. HTTPS는 HTTP 통신을 TLS로 보호해 기밀성·무결성·서버 인증을 제공한다. TLS는 인증서와 키 교환 등을 이용해 안전한 세션을 수립한다.  HTTPS는 HTTP 통신을 TLS로 보호한다. TLS 핸드셰이크에서 암호 알고리즘과 키를 협상하고 서버 인증서를 검증한 뒤 세션 키로 데이터를 암호화·무결성 보호한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.\n\nTLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["TLS 인증서가 만료되면 어떤 문제가 생기는가?","암호화와 인증은 같은 개념인가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["스위칭·VLAN·무선 네트워크","이더넷 스위치는 MAC 주소 학습 테이블을 바탕으로 프레임을 전달한다. VLAN은 하나의 물리 스위치 인프라를 논리적으로 분리해 브로드캐스트 영역을 나눈다. 무선 LAN은 IEEE 802.11 계열 표준을 기반으로 무선 매체를 공유한다.\n\n이더넷 스위치는 수신 프레임의 출발지 MAC 주소와 포트를 학습하고 목적지 MAC 주소를 기준으로 전달 포트를 결정한다. 목적지를 모르면 같은 VLAN의 다른 포트로 플러딩할 수 있다. VLAN은 하나의 물리 네트워크를 논리적으로 나누어 브로드캐스트 도메인을 분리한다. 서로 다른 VLAN 사이 통신에는 라우터나 L3 스위치의 라우팅이 필요하다. 트렁크 링크는 802.1Q 태그로 여러 VLAN 프레임을 하나의 물리 링크로 전달한다. VLAN 분리만으로 보안이 완성되는 것은 아니며 ACL과 방화벽 정책이 필요하다.\n\n네트워크 분리, 접근 통제, 브로드캐스트 관리와 무선 접속 원리를 이해할 수 있다.\n\nVLAN 간 라우팅이나 ACL 설정에 따라 통신이 허용될 수 있으므로 VLAN 분리만으로 보안 격리가 완성된다고 보면 안 된다.\n\nVLAN은 하나의 물리 스위치 인프라를 논리적으로 분리해 브로드캐스트 영역을 나눈다. 무선 LAN은 IEEE 802.11 계열 표준을 기반으로 무선 매체를 공유한다. VLAN은 하나의 물리 스위치 기반 네트워크를 논리적인 브로드캐스트 도메인으로 분리한다. 액세스 포트는 보통 하나의 VLAN에 속하고 트렁크 포트는 802.1Q 태그 등으로 여러 VLAN 트래픽을 운반한다.","네트워크 분리, 접근 통제, 브로드캐스트 관리와 무선 접속 원리를 이해할 수 있다.","이더넷 스위치는 MAC 주소 학습 테이블을 바탕으로 프레임을 전달한다. VLAN은 하나의 물리 스위치 인프라를 논리적으로 분리해 브로드캐스트 영역을 나눈다. 무선 LAN은 IEEE 802.11 계열 표준을 기반으로 무선 매체를 공유한다.  VLAN은 하나의 물리 스위치 기반 네트워크를 논리적인 브로드캐스트 도메인으로 분리한다. 액세스 포트는 보통 하나의 VLAN에 속하고 트렁크 포트는 802.1Q 태그 등으로 여러 VLAN 트래픽을 운반한다. 서로 다른 VLAN 간 통신에는 일반적으로 라우팅이 필요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["허브·스위치·라우터의 차이는?","VLAN만 설정하면 완전히 격리되는가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["서브넷 마스크와 CIDR 계산","IPv4 주소는 32비트이며 CIDR의 /n은 네트워크 부분이 n비트임을 뜻한다. 호스트 주소 수는 기본적으로 2^(32-n)개이고 전통적인 일반 서브넷에서는 네트워크·브로드캐스트 주소를 제외한다.\n\nIPv4는 32비트, IPv6는 128비트 논리 주소다. 프리픽스 길이 /n은 앞의 n비트가 네트워크 부분임을 뜻한다. 예를 들어 192.168.10.37/24의 네트워크 주소는 192.168.10.0이고 일반적인 브로드캐스트 주소는 192.168.10.255다. 호스트 비트가 8개인 일반 서브넷은 전통적으로 2^8-2개 호스트 주소를 제공하지만 /31 점대점 링크 등 예외가 있다. 라우터는 목적지 주소와 라우팅 테이블을 비교해 가장 긴 프리픽스 일치 경로를 선택한다.\n\n서브넷 계산은 IP 주소와 마스크를 2진수로 보고 AND 연산해 네트워크 주소를 구하는 과정이다. /26이면 호스트 비트가 6개라 주소 블록 크기는 64이며 마지막 옥텟 기준 0·64·128·192 경계로 나뉜다. 예를 들어 192.168.1.70/26은 192.168.1.64 네트워크에 속하고 브로드캐스트는 192.168.1.127이다. 사용 가능한 일반 호스트 범위는 .65부터 .126이다. 서브넷 설계는 필요한 호스트 수와 향후 확장, 라우팅 요약을 함께 고려한다.\n\nIP 주소와 네트워크 분할을 실제 숫자로 설명하는 데 필요하다.\n\n점대점 링크나 특수 주소 사용 등에서는 일반적인 호스트 수 계산 규칙과 다를 수 있다.\n\nIPv4 주소는 32비트이며 CIDR의 /n은 네트워크 부분이 n비트임을 뜻한다. 호스트 주소 수는 기본적으로 2^(32-n)개이고 전통적인 일반 서브넷에서는 네트워크·브로드캐스트 주소를 제외한다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다.","IP 주소와 네트워크 분할을 실제 숫자로 설명하는 데 필요하다.","IPv4 주소는 32비트이며 CIDR의 /n은 네트워크 부분이 n비트임을 뜻한다. 호스트 주소 수는 기본적으로 2^(32-n)개이고 전통적인 일반 서브넷에서는 네트워크·브로드캐스트 주소를 제외한다.  IPv4 주소는 네트워크 부분과 호스트 부분으로 나뉘며 프리픽스 길이(/n)가 네트워크 비트 수를 나타낸다. 서브넷은 주소 공간을 나누어 브로드캐스트 범위와 라우팅을 관리한다. 일반적인 서브넷에서 네트워크 주소와 브로드캐스트 주소를 제외하지만 /31 등 점대점 링크에는 예외가 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["/26의 전체 주소 수와 일반 호스트 수는?","서브넷을 나누는 목적은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TCP 연결 수립·종료와 상태","TCP는 3-way handshake로 연결을 수립하고 FIN·ACK 교환으로 정상 종료한다. 연결 상태에는 LISTEN, SYN-SENT, ESTABLISHED, FIN-WAIT, TIME-WAIT 등이 있다.\n\nTCP 3-way handshake는 양쪽이 초기 순서 번호를 교환하고 송수신 상태를 확인한다. 클라이언트 SYN, 서버 SYN+ACK, 클라이언트 ACK 순서로 연결이 성립한다. 연결 종료는 각 방향의 송신을 독립적으로 닫으므로 FIN과 ACK가 양방향에서 교환되는 4단계로 설명한다. 한쪽이 FIN을 보내도 상대방은 남은 데이터를 보낼 수 있다. TIME_WAIT은 마지막 ACK가 유실될 가능성과 지연 세그먼트가 새 연결에 섞이는 문제를 방지하는 데 사용된다.\n\nTCP의 순서 번호는 바이트 스트림에서 데이터의 위치를 나타내고 ACK는 다음에 기대하는 바이트 번호를 알린다. 재전송 타이머와 중복 ACK 등으로 손실을 감지하며 수신 윈도는 수신 버퍼 여유를 반영한다. TCP는 메시지 단위가 아닌 바이트 스트림이므로 응용은 길이 헤더·구분자·고정 길이 등으로 메시지 프레이밍을 해야 한다. UDP는 데이터그램 경계를 유지하지만 전달 성공이나 순서를 보장하지 않는다.\n\n네트워크 로그에서 연결 상태와 비정상 연결 패턴을 해석할 수 있다.\n\nTIME-WAIT는 지연된 세그먼트가 새 연결에 영향을 주지 않도록 하고 마지막 ACK 재전송에 대응하기 위한 상태다.\n\nTCP는 3-way handshake로 연결을 수립하고 FIN·ACK 교환으로 정상 종료한다. 연결 상태에는 LISTEN, SYN-SENT, ESTABLISHED, FIN-WAIT, TIME-WAIT 등이 있다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","네트워크 로그에서 연결 상태와 비정상 연결 패턴을 해석할 수 있다.","TCP는 3-way handshake로 연결을 수립하고 FIN·ACK 교환으로 정상 종료한다. 연결 상태에는 LISTEN, SYN-SENT, ESTABLISHED, FIN-WAIT, TIME-WAIT 등이 있다.  최장 증가 부분 수열은 원래 순서를 유지하면서 값이 엄격히 증가하는 가장 긴 부분 수열이다. 단순 DP는 O(n²)이며, 증가하는 꼬리값을 이분 탐색으로 관리하면 O(n log n)에 길이를 구할 수 있다. 부분 수열은 연속 구간이 아니라는 점을 구분해야 한다.\n\nTCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["3-way handshake가 필요한 이유는?","TIME-WAIT 상태가 필요한 이유는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["HTTP·HTTPS·TLS의 관계","HTTP는 웹에서 요청과 응답을 주고받는 응용 계층 프로토콜이다. HTTPS는 HTTP를 TLS로 보호해 통신 기밀성·무결성 및 서버 인증을 제공한다. TLS는 인증서와 키 교환, 대칭키 암호화를 조합한다.\n\nHTTP는 클라이언트와 서버가 요청·응답으로 자원을 주고받는 응용 계층 프로토콜이다. 요청은 메서드·경로·헤더·본문으로, 응답은 상태 코드·헤더·본문으로 구성될 수 있다. HTTP는 상태 비저장이므로 쿠키·세션·토큰 등으로 응용 상태를 관리한다. HTTPS는 HTTP에 TLS를 적용해 전송 구간을 보호한다. TLS 핸드셰이크에서 암호 방식과 키 교환을 협상하고 인증서를 검증한 뒤 세션 키로 실제 데이터를 암호화한다. 인증서는 도메인 이름·유효기간·신뢰 체인을 검증해야 한다. HTTPS는 전송 구간을 보호할 뿐 서버의 악성 행위나 피싱을 보장하지 않는다.\n\nHTTP 상태 코드는 1xx 정보, 2xx 성공, 3xx 리다이렉션, 4xx 클라이언트 오류, 5xx 서버 오류 범주로 이해할 수 있다. GET은 자원 조회, POST는 처리 요청, PUT은 자원 전체 교체, PATCH는 부분 수정, DELETE는 삭제 의도를 표현한다. 메서드의 안전성·멱등성은 재시도와 캐시 설계에 영향을 준다. TLS 인증서는 서버 공개키의 신뢰를 확인하고 세션 키는 실제 대칭 암호화에 사용된다. HSTS는 브라우저가 해당 사이트에 HTTPS를 사용하도록 강제하는 정책이다.\n\n웹 서비스와 보안 통신의 관계를 계층별로 설명할 수 있다.\n\n공개키 연산은 인증과 키 설정에 활용하고 대량 데이터 전송은 효율적인 대칭키 암호로 처리한다.\n\nHTTPS는 HTTP를 TLS로 보호해 통신 기밀성·무결성 및 서버 인증을 제공한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.","웹 서비스와 보안 통신의 관계를 계층별로 설명할 수 있다.","HTTP는 웹에서 요청과 응답을 주고받는 응용 계층 프로토콜이다. HTTPS는 HTTP를 TLS로 보호해 통신 기밀성·무결성 및 서버 인증을 제공한다. TLS는 인증서와 키 교환, 대칭키 암호화를 조합한다.  HTTPS는 HTTP 통신을 TLS로 보호한다. TLS 핸드셰이크에서 암호 알고리즘과 키를 협상하고 서버 인증서를 검증한 뒤 세션 키로 데이터를 암호화·무결성 보호한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.\n\nTLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["HTTPS가 서버 인증서만으로 사용자를 인증하는가?","TLS에서 대칭키를 사용하는 이유는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["DNS 재귀 질의·반복 질의·캐시","DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환한다. 재귀 리졸버는 클라이언트를 대신해 답을 찾아주고, 반복 질의는 각 DNS 서버가 다음에 문의할 서버 정보를 알려준다. TTL은 캐시 유지 시간을 정한다.\n\nDNS는 도메인 이름을 IP 주소 등의 레코드로 바꾸는 분산 계층형 이름 서비스다. 재귀 리졸버는 캐시에 답이 없으면 루트·TLD·권한 네임서버를 조회할 수 있다. 재귀 질의는 요청받은 서버가 최종 답을 찾아주고 반복 질의는 다음 문의 대상을 알려준다. TTL은 캐시 보관 시간을 정한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 서버 설정을 자동 할당한다. IPv4 DHCP의 DORA는 Discover, Offer, Request, Acknowledge 흐름이다. DNS는 이름 해석, DHCP는 네트워크 설정 배포라는 서로 다른 역할이다.\n\nDNS 레코드에는 IPv4 주소 A, IPv6 주소 AAAA, 별칭 CNAME, 메일 서버 MX, 네임서버 NS, 텍스트 TXT 등이 있다. DNS 캐시는 TTL 동안 결과를 저장해 조회를 줄이지만 변경된 레코드가 즉시 모든 곳에 반영되지 않을 수 있다. DHCP 임대는 영구 할당이 아니라 일정 기간 주소를 빌려주는 구조이며 클라이언트는 임대 갱신을 시도한다. DHCP 릴레이는 서로 다른 서브넷의 클라이언트 요청을 DHCP 서버로 전달한다.\n\nDNS 장애·위변조·캐시 문제를 구분하고 보안관제 로그를 해석하는 데 중요하다.\n\nDNSSEC은 DNS 응답의 출처와 무결성을 검증하도록 돕지만 데이터 자체를 암호화하는 기술은 아니다.\n\n재귀 리졸버는 클라이언트를 대신해 답을 찾아주고, 반복 질의는 각 DNS 서버가 다음에 문의할 서버 정보를 알려준다. 캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다.","DNS 장애·위변조·캐시 문제를 구분하고 보안관제 로그를 해석하는 데 중요하다.","DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환한다. 재귀 리졸버는 클라이언트를 대신해 답을 찾아주고, 반복 질의는 각 DNS 서버가 다음에 문의할 서버 정보를 알려준다. TTL은 캐시 유지 시간을 정한다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다.\n\nDNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DNS 캐시 포이즈닝이란?","TTL이 너무 길거나 짧으면 어떤 영향이 있는가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["라우팅·ARP·NAT의 역할","라우팅은 목적지 IP를 기준으로 다음 홉과 출구 인터페이스를 선택한다. ARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 확인하고, NAT는 주소를 변환해 사설망과 외부망 통신을 중개한다.\n\n라우팅은 목적지 네트워크로 패킷을 전달할 다음 홉을 결정한다. 라우터는 목적지 IP와 라우팅 테이블을 비교해 가장 긴 프리픽스 일치 경로를 선택한다. ARP는 IPv4 LAN에서 다음 홉 IP에 대응하는 MAC 주소를 알아낸다. 목적지가 다른 네트워크이면 목적지 호스트가 아니라 기본 게이트웨이의 MAC을 알아낸다. NAT는 사설·공인 IP 또는 포트 정보를 변환한다. PAT는 여러 내부 장치가 공인 IP 하나를 포트 번호로 구분해 공유하는 방식이다. NAT는 주소 절약에 도움되지만 방화벽이나 완전한 보안 통제와 동일하지 않다.\n\n정적 라우팅은 관리자가 경로를 지정해 단순하고 예측 가능하지만 네트워크 변화에 자동 대응하지 못한다. 동적 라우팅은 라우터가 경로 정보를 교환하며 RIP·OSPF·BGP 등이 대표적이다. OSPF는 자율 시스템 내부의 링크 상태 기반 라우팅이고 BGP는 자율 시스템 사이의 경로 정책을 교환한다. 라우터는 패킷의 TTL/Hop Limit을 줄여 무한 루프를 방지하며, 경로가 없거나 정책에 맞지 않으면 패킷을 폐기하고 ICMP 메시지를 보낼 수 있다.\n\n패킷이 실제로 어떤 경로로 전달되는지 계층별로 설명할 수 있다.\n\n다른 네트워크로 나가는 프레임의 목적지 MAC은 최종 서버가 아니라 기본 게이트웨이의 MAC이다.\n\nARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 확인하고, NAT는 주소를 변환해 사설망과 외부망 통신을 중개한다. ARP는 같은 IPv4 로컬 링크에서 목적지 IP 주소에 대응하는 MAC 주소를 알아내는 프로토콜이다.","패킷이 실제로 어떤 경로로 전달되는지 계층별로 설명할 수 있다.","라우팅은 목적지 IP를 기준으로 다음 홉과 출구 인터페이스를 선택한다. ARP는 같은 IPv4 로컬 네트워크에서 IP 주소에 대응하는 MAC 주소를 확인하고, NAT는 주소를 변환해 사설망과 외부망 통신을 중개한다.  ARP는 같은 IPv4 로컬 링크에서 목적지 IP 주소에 대응하는 MAC 주소를 알아내는 프로토콜이다. ARP 요청은 보통 브로드캐스트되고 응답은 해당 MAC 주소를 알려준다. 다른 네트워크의 호스트로 보낼 때는 원격 호스트가 아니라 기본 게이트웨이의 MAC 주소를 알아낸다.\n\nNAT는 사설 주소와 공인 주소 또는 포트 정보를 변환해 주소를 공유하거나 네트워크 경계를 구성한다. PAT는 여러 내부 호스트가 포트 번호를 구분자로 하나의 공인 IPv4 주소를 공유하게 한다. NAT는 주소 절약과 은닉에 도움을 줄 수 있지만 종단 간 연결성을 복잡하게 만든다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["라우터가 다른 네트워크로 패킷을 보낼 때 목적지 MAC은 누구의 것인가?","NAT와 방화벽은 같은 기능인가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["OSI 7계층과 TCP/IP 계층 모델","OSI 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 묶어 설명한다.\n\nOSI 참조 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 나눈다. 물리는 비트 신호, 데이터링크는 같은 링크의 프레임 전달, 네트워크는 네트워크 간 패킷 전달, 전송은 프로세스 간 통신을 다룬다. TCP/IP는 인터넷 프로토콜 중심 모델로 링크·인터넷·전송·응용 계층 등으로 설명한다. 두 모델은 목적이 비슷하지만 계층이 완전히 일대일 대응하지 않는다. 송신자는 각 계층의 헤더를 붙이는 캡슐화를 하고 수신자는 역캡슐화를 수행한다.\n\n장애 분석과 보안 장비의 역할을 계층별로 구분해 설명할 수 있다.\n\n계층화는 기능을 모듈화해 표준화와 상호운용성을 높이고 특정 계층의 변경이 다른 계층에 미치는 영향을 줄인다.\n\nOSI 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 묶어 설명한다. OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다.","장애 분석과 보안 장비의 역할을 계층별로 구분해 설명할 수 있다.","OSI 모델은 물리·데이터링크·네트워크·전송·세션·표현·응용의 7계층으로 통신 기능을 구분한다. TCP/IP 모델은 실제 인터넷 프로토콜 구조를 중심으로 계층을 묶어 설명한다.  OSI 7계층은 물리, 데이터링크, 네트워크, 전송, 세션, 표현, 응용 계층으로 통신 기능을 나눈 참조 모델이다. 각 계층은 아래 계층 서비스를 이용하고 위 계층에 서비스를 제공한다. 실제 인터넷 프로토콜은 TCP/IP 모델로 설명하는 경우가 많아 두 모델의 계층을 일대일로 완전히 대응시키면 안 된다.\n\nTCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스위치와 라우터는 주로 어느 계층에서 동작하는가?","계층화의 장점은?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TCP 흐름 제어와 혼잡 제어","흐름 제어는 수신자의 처리 능력을 넘지 않도록 송신량을 조절하고, 혼잡 제어는 네트워크 전체의 과부하를 방지한다. TCP는 수신 윈도와 혼잡 윈도 등을 이용한다.\n\n수신 윈도(rwnd)는 수신 애플리케이션이 데이터를 읽는 속도보다 빠르게 버퍼가 차는 것을 막고 혼잡 윈도(cwnd)는 네트워크 경로의 혼잡을 줄인다. 송신 가능한 미확인 데이터는 두 윈도 중 제한되는 값에 의해 결정된다. 혼잡 제어는 slow start, congestion avoidance, 손실·ECN 신호에 대한 반응 등으로 설명할 수 있지만 구체 알고리즘은 TCP 구현과 표준에 따라 달라진다. 흐름 제어가 정상이어도 네트워크 혼잡이 발생할 수 있고 반대도 가능하다.\n\nTCP가 신뢰성뿐 아니라 수신자와 네트워크 상태를 고려해 전송량을 조절하는 이유를 설명할 수 있다.\n\nUDP 자체는 TCP와 같은 연결 기반 혼잡 제어를 제공하지 않으므로 응용 계층이 전송률 조절을 고려해야 할 수 있다.\n\n흐름 제어는 수신자의 처리 능력을 넘지 않도록 송신량을 조절하고, 혼잡 제어는 네트워크 전체의 과부하를 방지한다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","TCP가 신뢰성뿐 아니라 수신자와 네트워크 상태를 고려해 전송량을 조절하는 이유를 설명할 수 있다.","흐름 제어는 수신자의 처리 능력을 넘지 않도록 송신량을 조절하고, 혼잡 제어는 네트워크 전체의 과부하를 방지한다. TCP는 수신 윈도와 혼잡 윈도 등을 이용한다.  TCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["흐름 제어와 혼잡 제어의 차이는?","UDP는 혼잡 제어를 제공하는가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["DHCP·DNS·NAT의 역할 구분","DHCP는 호스트에 IP 주소·게이트웨이·DNS 서버 등의 네트워크 설정을 동적으로 할당한다. DNS는 이름을 주소 등으로 변환하고 NAT는 IP 주소나 포트를 변환한다.\n\nDNS는 도메인 이름을 IP 주소 등의 레코드로 바꾸는 분산 계층형 이름 서비스다. 재귀 리졸버는 캐시에 답이 없으면 루트·TLD·권한 네임서버를 조회할 수 있다. 재귀 질의는 요청받은 서버가 최종 답을 찾아주고 반복 질의는 다음 문의 대상을 알려준다. TTL은 캐시 보관 시간을 정한다. DHCP는 IP 주소·서브넷 마스크·게이트웨이·DNS 서버 설정을 자동 할당한다. IPv4 DHCP의 DORA는 Discover, Offer, Request, Acknowledge 흐름이다. DNS는 이름 해석, DHCP는 네트워크 설정 배포라는 서로 다른 역할이다.\n\nDNS 레코드에는 IPv4 주소 A, IPv6 주소 AAAA, 별칭 CNAME, 메일 서버 MX, 네임서버 NS, 텍스트 TXT 등이 있다. DNS 캐시는 TTL 동안 결과를 저장해 조회를 줄이지만 변경된 레코드가 즉시 모든 곳에 반영되지 않을 수 있다. DHCP 임대는 영구 할당이 아니라 일정 기간 주소를 빌려주는 구조이며 클라이언트는 임대 갱신을 시도한다. DHCP 릴레이는 서로 다른 서브넷의 클라이언트 요청을 DHCP 서버로 전달한다.\n\n네트워크 접속 과정에서 서로 다른 서비스가 담당하는 기능을 구분할 수 있다.\n\nIP 주소로는 통신되지만 도메인 이름으로 접속되지 않는다면 DNS 문제를 의심할 수 있다.\n\nDHCP는 호스트에 IP 주소·게이트웨이·DNS 서버 등의 네트워크 설정을 동적으로 할당한다. DNS는 이름을 주소 등으로 변환하고 NAT는 IP 주소나 포트를 변환한다. DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. DHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다. PAT는 여러 내부 호스트가 포트 번호를 구분자로 하나의 공인 IPv4 주소를 공유하게 한다.","네트워크 접속 과정에서 서로 다른 서비스가 담당하는 기능을 구분할 수 있다.","DHCP는 호스트에 IP 주소·게이트웨이·DNS 서버 등의 네트워크 설정을 동적으로 할당한다. DNS는 이름을 주소 등으로 변환하고 NAT는 IP 주소나 포트를 변환한다.  DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다.\n\nDHCP는 클라이언트에 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 등의 네트워크 설정을 임대한다. IPv4의 대표 절차는 Discover, Offer, Request, Acknowledge(DORA)이며 임대 기간이 끝나기 전에 갱신할 수 있다.\n\nNAT는 사설 주소와 공인 주소 또는 포트 정보를 변환해 주소를 공유하거나 네트워크 경계를 구성한다. PAT는 여러 내부 호스트가 포트 번호를 구분자로 하나의 공인 IPv4 주소를 공유하게 한다. NAT는 주소 절약과 은닉에 도움을 줄 수 있지만 종단 간 연결성을 복잡하게 만든다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DHCP가 제공하는 정보는?","DNS 서버에 접근할 수 없으면 어떤 증상이 나타날 수 있는가?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["스위칭·VLAN·브로드캐스트 도메인","스위치는 MAC 주소 테이블을 학습해 프레임을 전달한다. VLAN은 하나의 물리 스위치 환경을 논리적으로 분리해 브로드캐스트 도메인을 나누며 VLAN 간 통신에는 일반적으로 라우팅이 필요하다.\n\n이더넷 스위치는 수신 프레임의 출발지 MAC 주소와 포트를 학습하고 목적지 MAC 주소를 기준으로 전달 포트를 결정한다. 목적지를 모르면 같은 VLAN의 다른 포트로 플러딩할 수 있다. VLAN은 하나의 물리 네트워크를 논리적으로 나누어 브로드캐스트 도메인을 분리한다. 서로 다른 VLAN 사이 통신에는 라우터나 L3 스위치의 라우팅이 필요하다. 트렁크 링크는 802.1Q 태그로 여러 VLAN 프레임을 하나의 물리 링크로 전달한다. VLAN 분리만으로 보안이 완성되는 것은 아니며 ACL과 방화벽 정책이 필요하다.\n\n기업 네트워크의 논리적 분리와 보안 영역 구성 원리를 이해할 수 있다.\n\n액세스 포트는 일반적으로 하나의 VLAN에 속하고 트렁크 포트는 여러 VLAN의 프레임을 태그로 구분해 전달한다.\n\nVLAN은 하나의 물리 스위치 환경을 논리적으로 분리해 브로드캐스트 도메인을 나누며 VLAN 간 통신에는 일반적으로 라우팅이 필요하다. VLAN은 하나의 물리 스위치 기반 네트워크를 논리적인 브로드캐스트 도메인으로 분리한다. 액세스 포트는 보통 하나의 VLAN에 속하고 트렁크 포트는 802.1Q 태그 등으로 여러 VLAN 트래픽을 운반한다.","기업 네트워크의 논리적 분리와 보안 영역 구성 원리를 이해할 수 있다.","스위치는 MAC 주소 테이블을 학습해 프레임을 전달한다. VLAN은 하나의 물리 스위치 환경을 논리적으로 분리해 브로드캐스트 도메인을 나누며 VLAN 간 통신에는 일반적으로 라우팅이 필요하다.  VLAN은 하나의 물리 스위치 기반 네트워크를 논리적인 브로드캐스트 도메인으로 분리한다. 액세스 포트는 보통 하나의 VLAN에 속하고 트렁크 포트는 802.1Q 태그 등으로 여러 VLAN 트래픽을 운반한다. 서로 다른 VLAN 간 통신에는 일반적으로 라우팅이 필요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["VLAN만 나누면 VLAN 사이 통신이 가능한가?","액세스 포트와 트렁크 포트의 차이는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TCP 3-way handshake와 4-way handshake","TCP는 연결 지향형 전송을 위해 연결 설정과 종료 절차를 사용한다. 3-way handshake는 SYN, SYN-ACK, ACK로 양쪽의 초기 순서 번호와 통신 가능 상태를 확인한다. 종료는 일반적으로 각 방향의 송신 종료를 독립적으로 알리는 4-way 절차로 설명한다.\n\nTCP 3-way handshake는 양쪽이 초기 순서 번호를 교환하고 송수신 상태를 확인한다. 클라이언트 SYN, 서버 SYN+ACK, 클라이언트 ACK 순서로 연결이 성립한다. 연결 종료는 각 방향의 송신을 독립적으로 닫으므로 FIN과 ACK가 양방향에서 교환되는 4단계로 설명한다. 한쪽이 FIN을 보내도 상대방은 남은 데이터를 보낼 수 있다. TIME_WAIT은 마지막 ACK가 유실될 가능성과 지연 세그먼트가 새 연결에 섞이는 문제를 방지하는 데 사용된다.\n\n웹 접속이나 서버 통신에서 연결이 언제 성립하고 종료되는지, 연결 상태가 왜 필요한지 이해할 수 있다.\n\nTCP 연결 설정은 양쪽의 송수신 준비를 확인하며, 종료는 양방향 데이터 흐름을 각각 닫기 때문에 독립적인 종료 신호가 필요하다.\n\n3-way handshake는 SYN, SYN-ACK, ACK로 양쪽의 초기 순서 번호와 통신 가능 상태를 확인한다. 종료는 일반적으로 각 방향의 송신 종료를 독립적으로 알리는 4-way 절차로 설명한다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다.","웹 접속이나 서버 통신에서 연결이 언제 성립하고 종료되는지, 연결 상태가 왜 필요한지 이해할 수 있다.","TCP는 연결 지향형 전송을 위해 연결 설정과 종료 절차를 사용한다. 3-way handshake는 SYN, SYN-ACK, ACK로 양쪽의 초기 순서 번호와 통신 가능 상태를 확인한다. 종료는 일반적으로 각 방향의 송신 종료를 독립적으로 알리는 4-way 절차로 설명한다.  TCP는 바이트 스트림 기반의 연결 지향 전송 프로토콜이다. 순서 번호, 확인 응답, 재전송, 흐름 제어, 혼잡 제어를 통해 신뢰성 있는 전달을 제공한다. 메시지 경계를 보존하지 않으므로 응용 계층은 길이 필드나 구분자 등으로 메시지 단위를 정의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["3-way handshake가 필요한 이유는?","연결 종료가 보통 4단계인 이유는?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]],["TLS와 HTTPS의 보안 통신 과정","TLS는 통신 상대 인증과 키 합의, 암호화 및 무결성 보호를 제공하는 보안 프로토콜이다. HTTPS는 HTTP 통신에 TLS를 적용한 것이다. 실제 TLS 핸드셰이크는 버전과 설정에 따라 세부 메시지가 다르지만 서버 인증서 검증과 세션 키 수립이 핵심이다.\n\nHTTP는 클라이언트와 서버가 요청·응답으로 자원을 주고받는 응용 계층 프로토콜이다. 요청은 메서드·경로·헤더·본문으로, 응답은 상태 코드·헤더·본문으로 구성될 수 있다. HTTP는 상태 비저장이므로 쿠키·세션·토큰 등으로 응용 상태를 관리한다. HTTPS는 HTTP에 TLS를 적용해 전송 구간을 보호한다. TLS 핸드셰이크에서 암호 방식과 키 교환을 협상하고 인증서를 검증한 뒤 세션 키로 실제 데이터를 암호화한다. 인증서는 도메인 이름·유효기간·신뢰 체인을 검증해야 한다. HTTPS는 전송 구간을 보호할 뿐 서버의 악성 행위나 피싱을 보장하지 않는다.\n\nHTTP 상태 코드는 1xx 정보, 2xx 성공, 3xx 리다이렉션, 4xx 클라이언트 오류, 5xx 서버 오류 범주로 이해할 수 있다. GET은 자원 조회, POST는 처리 요청, PUT은 자원 전체 교체, PATCH는 부분 수정, DELETE는 삭제 의도를 표현한다. 메서드의 안전성·멱등성은 재시도와 캐시 설계에 영향을 준다. TLS 인증서는 서버 공개키의 신뢰를 확인하고 세션 키는 실제 대칭 암호화에 사용된다. HSTS는 브라우저가 해당 사이트에 HTTPS를 사용하도록 강제하는 정책이다.\n\n웹 통신에서 도청·변조·서버 사칭 위험을 줄이는 원리를 이해한다.\n\nHTTPS는 전송 구간을 보호하지만 서버 내부의 안전성, 단말 감염, 잘못된 권한 설정까지 자동으로 보장하지는 않는다.\n\nTLS는 통신 상대 인증과 키 합의, 암호화 및 무결성 보호를 제공하는 보안 프로토콜이다. TLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다.","웹 통신에서 도청·변조·서버 사칭 위험을 줄이는 원리를 이해한다.","TLS는 통신 상대 인증과 키 합의, 암호화 및 무결성 보호를 제공하는 보안 프로토콜이다. HTTPS는 HTTP 통신에 TLS를 적용한 것이다. 실제 TLS 핸드셰이크는 버전과 설정에 따라 세부 메시지가 다르지만 서버 인증서 검증과 세션 키 수립이 핵심이다.  HTTPS는 HTTP 통신을 TLS로 보호한다. TLS 핸드셰이크에서 암호 알고리즘과 키를 협상하고 서버 인증서를 검증한 뒤 세션 키로 데이터를 암호화·무결성 보호한다. HTTPS가 서버의 모든 행위나 웹 애플리케이션 취약점까지 보장하는 것은 아니며 전송 구간 보호라는 범위를 이해해야 한다.\n\nTLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["HTTPS가 보장하는 보안 속성은?","TLS 인증서가 만료되거나 신뢰되지 않으면 어떤 문제가 생깁니까?"],"",[["TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["TLS RFC 8446","https://www.rfc-editor.org/rfc/rfc8446"],["DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]]]],["🗄️","데이터베이스","관계형 모델·SQL·정규화·트랜잭션",[["데이터베이스와 DBMS","데이터베이스는 공유·관리되는 데이터의 집합이고 DBMS는 데이터 정의·저장·검색·수정·보안·동시성 등을 관리하는 소프트웨어다.\n\n데이터베이스는 여러 응용 프로그램과 사용자가 공유하는 구조화된 데이터 집합이며 DBMS는 데이터 정의·저장·검색·수정·권한·동시성·복구를 관리한다. 파일로 데이터를 관리하면 프로그램별 중복과 형식 불일치, 동시 수정 문제가 생길 수 있다. DBMS는 스키마와 제약조건을 중앙에서 관리한다. 사용자는 SQL로 원하는 결과를 선언하고 옵티마이저는 통계와 비용 추정으로 접근 경로·조인 순서를 선택한다. 같은 SQL도 인덱스·데이터 분포·통계에 따라 실행 비용이 달라진다.\n\n데이터 독립성은 저장 구조 변경이 응용 프로그램에 미치는 영향을 줄이는 개념이다. 물리적 데이터 독립성은 파일 배치나 인덱스 변경이 논리 스키마에 영향을 주지 않는 것이고, 논리적 데이터 독립성은 논리 스키마 변경이 사용자 뷰나 응용 프로그램에 미치는 영향을 줄이는 것이다. DBMS는 뷰·스키마·저장 구조를 구분해 이러한 독립성을 지원한다. 실제로는 응용 프로그램이 스키마에 강하게 결합되어 있으면 변경 영향이 완전히 사라지지는 않는다.\n\n중복·불일치·공유·보안 문제를 줄인다.\n\n데이터 독립성은 데이터 구조 변경이 응용 프로그램에 미치는 영향을 줄이는 개념이다.\n\n데이터베이스는 공유·관리되는 데이터의 집합이고 DBMS는 데이터 정의·저장·검색·수정·보안·동시성 등을 관리하는 소프트웨어다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다.","중복·불일치·공유·보안 문제를 줄인다.","데이터베이스는 공유·관리되는 데이터의 집합이고 DBMS는 데이터 정의·저장·검색·수정·보안·동시성 등을 관리하는 소프트웨어다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DBMS를 사용하는 이유는?","데이터 독립성이란?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["관계형 모델과 키","관계형 DB는 테이블·행·열로 데이터를 표현한다. 기본키는 행을 유일하게 식별하고 외래키는 다른 테이블의 키를 참조한다.\n\n관계형 모델은 데이터를 릴레이션으로 표현하며 실무에서는 테이블·행·열로 부른다. 슈퍼키는 행을 유일하게 식별하고 후보키는 최소 슈퍼키다. 기본키는 후보키 중 대표로 선택하며 NULL과 중복을 허용하지 않는다. 외래키는 다른 테이블의 키를 참조해 참조 무결성을 유지한다. 관계 대수의 선택·투영·조인·합집합·차집합은 질의 의미를 표현하는 이론적 기반이다. 순수 관계 모델과 달리 SQL 테이블은 중복 행과 NULL을 허용할 수 있어 실제 SQL 동작을 별도로 이해해야 한다.\n\n기본키는 행 식별을 위한 제약이고 인덱스는 검색 성능을 위한 물리적 구조라는 점을 구분해야 한다. 기본키를 만들면 DBMS가 이를 보장하기 위한 인덱스를 자동 생성하는 경우가 많지만 기본키와 인덱스는 같은 개념이 아니다. 외래키는 참조 대상의 존재를 보장하며 삭제·갱신 시 RESTRICT, CASCADE, SET NULL 등 참조 동작을 정할 수 있다. 제약조건은 응용 프로그램의 검증만 믿지 않고 데이터베이스 차원에서 무결성을 지키는 수단이다.\n\n테이블 간 관계와 제약조건을 명확히 해 무결성을 유지한다.\n\n후보키 중 하나를 기본키로 선택한다. 기본키는 중복과 NULL을 허용하지 않는다.","테이블 간 관계와 제약조건을 명확히 해 무결성을 유지한다.","관계형 DB는 테이블·행·열로 데이터를 표현한다. 기본키는 행을 유일하게 식별하고 외래키는 다른 테이블의 키를 참조한다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["기본키와 후보키 차이는?","외래키에 NULL이 허용되나요?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["SQL과 JOIN","SQL은 관계형 DB에서 데이터를 정의·조작·제어하는 언어다. JOIN은 관련된 테이블을 조건에 따라 결합한다.\n\nSQL은 데이터 정의·조회·변경·권한 관리를 위한 선언적 언어다. WHERE는 행을 필터링하고 GROUP BY는 그룹별 집계를 만들며 HAVING은 집계 후 그룹을 필터링한다. INNER JOIN은 조건에 맞는 행만 결합하고 LEFT JOIN은 왼쪽 행을 모두 유지하며 오른쪽 일치가 없으면 NULL을 채운다. 1:N 조인은 왼쪽 행이 여러 번 나타날 수 있다. NULL은 3값 논리(TRUE/FALSE/UNKNOWN)를 만들기 때문에 `= NULL`이 아니라 `IS NULL`로 검사한다. 서브쿼리는 다른 질의 안에서 단일 값·집합·존재 여부를 계산한다.\n\n조인은 논리적으로 두 관계를 결합하지만 실제 실행은 중첩 루프·해시 조인·정렬 병합 조인 등으로 수행될 수 있다. 작은 테이블과 인덱스가 있는 경우 중첩 루프가 유리하고, 큰 데이터 집합을 동등 조건으로 결합할 때 해시 조인이 유리할 수 있다. LEFT JOIN 뒤 WHERE에서 오른쪽 테이블 조건을 걸면 NULL 행이 제거되어 사실상 INNER JOIN처럼 동작할 수 있으므로 조건을 ON에 둘지 WHERE에 둘지 의도를 구분한다. 집계 전에 조인으로 행이 중복되는지도 확인해야 한다.\n\n분리된 테이블의 정보를 필요한 형태로 조회·관리한다.\n\nWHERE는 그룹화 전 행을 필터링하고 HAVING은 그룹화 결과를 필터링한다.\n\nINNER JOIN은 양쪽에서 조건이 맞는 행만, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하고 오른쪽 일치가 없으면 NULL을 채운다.","분리된 테이블의 정보를 필요한 형태로 조회·관리한다.","SQL은 관계형 DB에서 데이터를 정의·조작·제어하는 언어다. JOIN은 관련된 테이블을 조건에 따라 결합한다.  JOIN은 두 관계의 행을 결합 조건에 따라 연결한다. INNER JOIN은 양쪽에서 조건이 맞는 행만, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하고 오른쪽 일치가 없으면 NULL을 채운다. 조인 조건 누락이나 다대다 관계는 예상보다 행 수가 늘어나는 원인이 된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["INNER JOIN과 LEFT JOIN 차이는?","WHERE와 HAVING 차이는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["정규화","정규화는 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블을 분해하는 과정이다. 1NF는 원자값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거가 핵심이다.\n\n정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 릴레이션을 분해하는 설계 과정이다. 함수 종속성 X→Y는 X 값이 같으면 Y 값도 같아야 한다는 제약이다. 1NF는 원자적 값, 2NF는 후보키 일부에만 종속되는 부분 함수 종속 제거, 3NF는 비키 속성의 이행 종속 문제를 줄이는 데 초점을 둔다. BCNF는 모든 비자명 함수 종속의 결정자가 슈퍼키가 되도록 더 강하게 요구한다. 분해 시 원래 정보를 복원할 수 있는 무손실 조인과 종속성 보존을 검토한다. 정규화가 무조건 조회 성능을 높이는 것은 아니며 실제 조회 패턴에 따라 반정규화를 고려할 수 있다.\n\n함수 종속성은 업무 규칙에서 도출해야 하며 단순히 현재 데이터 표본에서 우연히 값이 같다는 이유만으로 선언하면 안 된다. 후보키는 모든 속성을 함수적으로 결정하는 최소 집합이다. 2NF는 복합 후보키의 일부에만 종속되는 비주요 속성을 제거하고 3NF는 비주요 속성 사이의 이행 종속을 제한한다. BCNF는 결정자가 항상 슈퍼키가 되도록 한다. 분해가 무손실이어도 함수 종속성이 보존되지 않을 수 있어 두 조건을 함께 평가해야 한다.\n\n같은 사실이 여러 곳에 중복 저장되어 불일치하는 문제를 줄인다.\n\n정규화는 무결성을 높이지만 JOIN이 늘 수 있어 성능을 위해 역정규화를 적용하기도 한다.\n\n정규화는 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블을 분해하는 과정이다. 정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다.","같은 사실이 여러 곳에 중복 저장되어 불일치하는 문제를 줄인다.","정규화는 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블을 분해하는 과정이다. 1NF는 원자값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거가 핵심이다.  정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다. 분해 시 무손실 조인과 종속성 보존도 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정규화의 목적은?","역정규화가 필요한 경우는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["인덱스","인덱스는 특정 열을 기준으로 데이터 위치를 빠르게 찾도록 돕는 자료구조다. B+트리나 해시 인덱스 등이 사용된다.\n\n인덱스는 검색 키와 행 위치 또는 기본키를 별도로 관리해 테이블 전체를 읽지 않고 필요한 행을 찾도록 한다. B+트리는 내부 노드가 탐색 경로를 안내하고 리프 노드가 정렬된 키와 행 위치를 보유한다. 모든 리프가 같은 깊이에 있고 리프끼리 연결되어 범위 검색에 유리하다. 인덱스는 조회를 빠르게 할 수 있지만 저장 공간과 INSERT·UPDATE·DELETE 유지 비용이 발생한다. 복합 인덱스는 컬럼 순서가 중요하며 선두 컬럼 조건에 영향을 받는다. 실행 계획에는 인덱스 스캔·테이블 스캔·중첩 루프·해시 조인 등이 나타날 수 있고, 인덱스가 있어도 선택도가 낮으면 전체 스캔이 더 저렴할 수 있다.\n\nB+트리의 노드는 여러 키와 포인터를 저장해 트리 높이를 낮춘다. 디스크 기반 DB에서는 한 노드가 페이지 단위로 읽히므로 노드 크기와 팬아웃이 I/O 횟수에 중요하다. 범위 검색은 시작 키를 찾은 뒤 연결된 리프를 순서대로 읽어 효율적이다. 인덱스 컬럼에 함수를 적용하거나 자료형이 맞지 않아 암시적 형 변환이 발생하면 인덱스 활용이 제한될 수 있다. 인덱스 설계는 WHERE뿐 아니라 JOIN·ORDER BY·선택도와 쓰기 빈도를 함께 본다.\n\n조회 성능을 높일 수 있지만 저장 공간과 데이터 변경 시 갱신 비용이 필요하다.\n\n조회 빈도와 선택도, 데이터 분포, 쓰기 작업 비중을 고려한다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.","조회 성능을 높일 수 있지만 저장 공간과 데이터 변경 시 갱신 비용이 필요하다.","인덱스는 특정 열을 기준으로 데이터 위치를 빠르게 찾도록 돕는 자료구조다. B+트리나 해시 인덱스 등이 사용된다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.\n\nB+트리는 내부 노드에는 탐색 키와 자식 포인터를 두고 실제 레코드 탐색 정보는 리프 노드에 모으며 리프를 연결해 범위 검색을 효율화한다. 균형 높이가 유지되어 검색·삽입·삭제가 로그 수준으로 수행되고 디스크 페이지 단위 접근에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인덱스가 항상 성능을 높이나요?","인덱스를 어떤 열에 만들까요?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["트랜잭션과 ACID","트랜잭션은 하나의 논리적 작업 단위다. ACID는 원자성·일관성·격리성·지속성을 뜻한다.\n\n트랜잭션은 하나의 논리적 작업으로 묶인 DB 연산이다. 계좌 이체는 출금과 입금이 함께 성공하거나 함께 취소되어야 한다. ACID에서 원자성은 전부 수행되거나 취소됨, 일관성은 제약조건 유지, 격리성은 동시 실행 간섭 제한, 지속성은 커밋 결과 보존이다. WAL은 데이터 페이지를 디스크에 반영하기 전에 로그를 먼저 안정 저장소에 기록하는 원칙이다. 장애 후 로그를 이용해 커밋된 작업을 redo하고 미완료 작업을 undo할 수 있다. 체크포인트는 복구 시 검토할 로그 범위를 줄인다.\n\n트랜잭션의 일관성은 DBMS가 임의로 모든 업무 규칙을 알아서 보장한다는 뜻이 아니다. 기본키·외래키·CHECK·NOT NULL 같은 제약과 응용 프로그램의 업무 규칙이 함께 유지되어야 한다. COMMIT 전 오류가 발생하면 ROLLBACK으로 변경을 취소할 수 있다. WAL과 체크포인트는 장애 후 redo/undo 복구에 활용된다. 백업은 로그 기반 복구와 다른 보호 계층이며, 정기적인 복구 테스트를 하지 않은 백업은 실제 복구 가능성을 보장하지 못한다.\n\n여러 작업의 일관성과 장애·동시 접근 상황의 신뢰성을 유지한다.\n\n격리 수준에 따라 더티 리드, 반복 불가능 읽기, 팬텀 리드 등의 허용 범위가 달라진다.\n\n원자성은 전부 수행되거나 전부 취소됨, 일관성은 제약조건을 만족하는 상태 사이의 전이, 격리성은 동시 트랜잭션의 간섭 통제, 지속성은 커밋 결과의 장애 후 보존을 뜻한다.","여러 작업의 일관성과 장애·동시 접근 상황의 신뢰성을 유지한다.","트랜잭션은 하나의 논리적 작업 단위다. ACID는 원자성·일관성·격리성·지속성을 뜻한다.  원자성은 전부 수행되거나 전부 취소됨, 일관성은 제약조건을 만족하는 상태 사이의 전이, 격리성은 동시 트랜잭션의 간섭 통제, 지속성은 커밋 결과의 장애 후 보존을 뜻한다. 실제 격리 수준은 성능과 이상 현상 허용 사이의 절충이며 DBMS별 구현 차이가 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["COMMIT과 ROLLBACK 차이는?","격리 수준이 필요한 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["관계형 모델과 관계 대수 기초","관계형 데이터베이스는 데이터를 릴레이션(테이블), 튜플(행), 속성(열)로 표현한다. 관계 대수의 선택, 추출, 합집합, 차집합, 카티션 곱, 조인 등의 연산은 질의 처리의 이론적 기반이다.\n\n관계형 모델은 데이터를 릴레이션으로 표현하며 실무에서는 테이블·행·열로 부른다. 슈퍼키는 행을 유일하게 식별하고 후보키는 최소 슈퍼키다. 기본키는 후보키 중 대표로 선택하며 NULL과 중복을 허용하지 않는다. 외래키는 다른 테이블의 키를 참조해 참조 무결성을 유지한다. 관계 대수의 선택·투영·조인·합집합·차집합은 질의 의미를 표현하는 이론적 기반이다. 순수 관계 모델과 달리 SQL 테이블은 중복 행과 NULL을 허용할 수 있어 실제 SQL 동작을 별도로 이해해야 한다.\n\n기본키는 행 식별을 위한 제약이고 인덱스는 검색 성능을 위한 물리적 구조라는 점을 구분해야 한다. 기본키를 만들면 DBMS가 이를 보장하기 위한 인덱스를 자동 생성하는 경우가 많지만 기본키와 인덱스는 같은 개념이 아니다. 외래키는 참조 대상의 존재를 보장하며 삭제·갱신 시 RESTRICT, CASCADE, SET NULL 등 참조 동작을 정할 수 있다. 제약조건은 응용 프로그램의 검증만 믿지 않고 데이터베이스 차원에서 무결성을 지키는 수단이다.\n\nSQL을 단순 문법이 아니라 데이터 집합을 다루는 언어로 이해하는 데 도움이 된다.\n\n관계형 모델에서 관계는 수학적 집합 개념에 기반하므로 중복 튜플을 허용하지 않는 이론적 특성이 있다.","SQL을 단순 문법이 아니라 데이터 집합을 다루는 언어로 이해하는 데 도움이 된다.","관계형 데이터베이스는 데이터를 릴레이션(테이블), 튜플(행), 속성(열)로 표현한다. 관계 대수의 선택, 추출, 합집합, 차집합, 카티션 곱, 조인 등의 연산은 질의 처리의 이론적 기반이다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["기본키와 후보키의 차이는?","선택과 추출 연산은 어떻게 다른가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["SQL의 DDL·DML·DCL·TCL","DDL은 CREATE·ALTER·DROP 등 구조 정의, DML은 SELECT·INSERT·UPDATE·DELETE 등 데이터 조작, DCL은 GRANT·REVOKE 등 권한 제어, TCL은 COMMIT·ROLLBACK 등 트랜잭션 제어 명령을 말한다.\n\nSQL은 데이터 정의·조회·변경·권한 관리를 위한 선언적 언어다. WHERE는 행을 필터링하고 GROUP BY는 그룹별 집계를 만들며 HAVING은 집계 후 그룹을 필터링한다. INNER JOIN은 조건에 맞는 행만 결합하고 LEFT JOIN은 왼쪽 행을 모두 유지하며 오른쪽 일치가 없으면 NULL을 채운다. 1:N 조인은 왼쪽 행이 여러 번 나타날 수 있다. NULL은 3값 논리(TRUE/FALSE/UNKNOWN)를 만들기 때문에 `= NULL`이 아니라 `IS NULL`로 검사한다. 서브쿼리는 다른 질의 안에서 단일 값·집합·존재 여부를 계산한다.\n\n조인은 논리적으로 두 관계를 결합하지만 실제 실행은 중첩 루프·해시 조인·정렬 병합 조인 등으로 수행될 수 있다. 작은 테이블과 인덱스가 있는 경우 중첩 루프가 유리하고, 큰 데이터 집합을 동등 조건으로 결합할 때 해시 조인이 유리할 수 있다. LEFT JOIN 뒤 WHERE에서 오른쪽 테이블 조건을 걸면 NULL 행이 제거되어 사실상 INNER JOIN처럼 동작할 수 있으므로 조건을 ON에 둘지 WHERE에 둘지 의도를 구분한다. 집계 전에 조인으로 행이 중복되는지도 확인해야 한다.\n\nSQL 명령을 목적에 따라 분류하면 데이터베이스 운영과 권한 관리의 역할을 구분할 수 있다.\n\n세부 동작과 롤백 가능 여부는 DBMS 제품 및 트랜잭션 설정에 따라 차이가 있을 수 있다.","SQL 명령을 목적에 따라 분류하면 데이터베이스 운영과 권한 관리의 역할을 구분할 수 있다.","DDL은 CREATE·ALTER·DROP 등 구조 정의, DML은 SELECT·INSERT·UPDATE·DELETE 등 데이터 조작, DCL은 GRANT·REVOKE 등 권한 제어, TCL은 COMMIT·ROLLBACK 등 트랜잭션 제어 명령을 말한다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DELETE·TRUNCATE·DROP의 차이는?","GRANT와 REVOKE는 무엇인가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["정규화와 함수 종속성","정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블 구조를 분해하는 과정이다. 1정규형은 원자값, 2정규형은 부분 함수 종속 제거, 3정규형은 이행 함수 종속 제거를 핵심으로 설명한다.\n\n정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 릴레이션을 분해하는 설계 과정이다. 함수 종속성 X→Y는 X 값이 같으면 Y 값도 같아야 한다는 제약이다. 1NF는 원자적 값, 2NF는 후보키 일부에만 종속되는 부분 함수 종속 제거, 3NF는 비키 속성의 이행 종속 문제를 줄이는 데 초점을 둔다. BCNF는 모든 비자명 함수 종속의 결정자가 슈퍼키가 되도록 더 강하게 요구한다. 분해 시 원래 정보를 복원할 수 있는 무손실 조인과 종속성 보존을 검토한다. 정규화가 무조건 조회 성능을 높이는 것은 아니며 실제 조회 패턴에 따라 반정규화를 고려할 수 있다.\n\n함수 종속성은 업무 규칙에서 도출해야 하며 단순히 현재 데이터 표본에서 우연히 값이 같다는 이유만으로 선언하면 안 된다. 후보키는 모든 속성을 함수적으로 결정하는 최소 집합이다. 2NF는 복합 후보키의 일부에만 종속되는 비주요 속성을 제거하고 3NF는 비주요 속성 사이의 이행 종속을 제한한다. BCNF는 결정자가 항상 슈퍼키가 되도록 한다. 분해가 무손실이어도 함수 종속성이 보존되지 않을 수 있어 두 조건을 함께 평가해야 한다.\n\n데이터 일관성과 유지보수성을 높이지만 지나친 분해는 조회 조인을 늘릴 수 있다.\n\n실무에서는 조회 성능이나 업무 특성 때문에 반정규화를 선택하기도 하며, 무결성과 성능의 균형을 고려해야 한다.\n\n정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블 구조를 분해하는 과정이다. 1정규형은 원자값, 2정규형은 부분 함수 종속 제거, 3정규형은 이행 함수 종속 제거를 핵심으로 설명한다. 정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다.","데이터 일관성과 유지보수성을 높이지만 지나친 분해는 조회 조인을 늘릴 수 있다.","정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 테이블 구조를 분해하는 과정이다. 1정규형은 원자값, 2정규형은 부분 함수 종속 제거, 3정규형은 이행 함수 종속 제거를 핵심으로 설명한다.  정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다. 분해 시 무손실 조인과 종속성 보존도 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["갱신 이상·삽입 이상·삭제 이상이란?","정규화하면 항상 조회 성능이 좋아지는가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["인덱스와 질의 처리","인덱스는 검색 조건에 해당하는 행을 빠르게 찾기 위한 보조 자료구조다. B+트리 인덱스는 정렬된 키와 균형 트리 구조를 이용하며, 해시 인덱스는 동등 비교에 유리할 수 있다.\n\n인덱스는 검색 키와 행 위치 또는 기본키를 별도로 관리해 테이블 전체를 읽지 않고 필요한 행을 찾도록 한다. B+트리는 내부 노드가 탐색 경로를 안내하고 리프 노드가 정렬된 키와 행 위치를 보유한다. 모든 리프가 같은 깊이에 있고 리프끼리 연결되어 범위 검색에 유리하다. 인덱스는 조회를 빠르게 할 수 있지만 저장 공간과 INSERT·UPDATE·DELETE 유지 비용이 발생한다. 복합 인덱스는 컬럼 순서가 중요하며 선두 컬럼 조건에 영향을 받는다. 실행 계획에는 인덱스 스캔·테이블 스캔·중첩 루프·해시 조인 등이 나타날 수 있고, 인덱스가 있어도 선택도가 낮으면 전체 스캔이 더 저렴할 수 있다.\n\nB+트리의 노드는 여러 키와 포인터를 저장해 트리 높이를 낮춘다. 디스크 기반 DB에서는 한 노드가 페이지 단위로 읽히므로 노드 크기와 팬아웃이 I/O 횟수에 중요하다. 범위 검색은 시작 키를 찾은 뒤 연결된 리프를 순서대로 읽어 효율적이다. 인덱스 컬럼에 함수를 적용하거나 자료형이 맞지 않아 암시적 형 변환이 발생하면 인덱스 활용이 제한될 수 있다. 인덱스 설계는 WHERE뿐 아니라 JOIN·ORDER BY·선택도와 쓰기 빈도를 함께 본다.\n\n인덱스는 조회를 빠르게 하지만 저장 공간과 데이터 변경 비용을 추가한다.\n\n복합 인덱스는 선두 컬럼 조건이 활용 가능성에 큰 영향을 준다. 실제 사용 여부는 실행 계획으로 확인해야 한다.","인덱스는 조회를 빠르게 하지만 저장 공간과 데이터 변경 비용을 추가한다.","인덱스는 검색 조건에 해당하는 행을 빠르게 찾기 위한 보조 자료구조다. B+트리 인덱스는 정렬된 키와 균형 트리 구조를 이용하며, 해시 인덱스는 동등 비교에 유리할 수 있다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.\n\nB+트리는 내부 노드에는 탐색 키와 자식 포인터를 두고 실제 레코드 탐색 정보는 리프 노드에 모으며 리프를 연결해 범위 검색을 효율화한다. 균형 높이가 유지되어 검색·삽입·삭제가 로그 수준으로 수행되고 디스크 페이지 단위 접근에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인덱스를 많이 만들면 왜 안 되는가?","복합 인덱스의 컬럼 순서가 중요한 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["트랜잭션 격리수준과 동시성 제어","동시에 실행되는 트랜잭션은 더티 리드, 반복 불가능 읽기, 팬텀 리드 같은 문제가 발생할 수 있다. 격리수준은 Read Uncommitted, Read Committed, Repeatable Read, Serializable 등으로 구분되며 DBMS마다 구현 차이가 있다.\n\n트랜잭션은 하나의 논리적 작업으로 묶인 DB 연산이다. 계좌 이체는 출금과 입금이 함께 성공하거나 함께 취소되어야 한다. ACID에서 원자성은 전부 수행되거나 취소됨, 일관성은 제약조건 유지, 격리성은 동시 실행 간섭 제한, 지속성은 커밋 결과 보존이다. WAL은 데이터 페이지를 디스크에 반영하기 전에 로그를 먼저 안정 저장소에 기록하는 원칙이다. 장애 후 로그를 이용해 커밋된 작업을 redo하고 미완료 작업을 undo할 수 있다. 체크포인트는 복구 시 검토할 로그 범위를 줄인다.\n\n트랜잭션의 일관성은 DBMS가 임의로 모든 업무 규칙을 알아서 보장한다는 뜻이 아니다. 기본키·외래키·CHECK·NOT NULL 같은 제약과 응용 프로그램의 업무 규칙이 함께 유지되어야 한다. COMMIT 전 오류가 발생하면 ROLLBACK으로 변경을 취소할 수 있다. WAL과 체크포인트는 장애 후 redo/undo 복구에 활용된다. 백업은 로그 기반 복구와 다른 보호 계층이며, 정기적인 복구 테스트를 하지 않은 백업은 실제 복구 가능성을 보장하지 못한다.\n\n데이터 정확성과 동시 처리 성능 사이의 균형을 결정한다.\n\nMVCC는 여러 버전의 데이터를 관리해 읽기와 쓰기의 충돌을 줄이는 방식이며, 구체적 동작은 DBMS에 따라 다르다.","데이터 정확성과 동시 처리 성능 사이의 균형을 결정한다.","동시에 실행되는 트랜잭션은 더티 리드, 반복 불가능 읽기, 팬텀 리드 같은 문제가 발생할 수 있다. 격리수준은 Read Uncommitted, Read Committed, Repeatable Read, Serializable 등으로 구분되며 DBMS마다 구현 차이가 있다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["더티 리드와 팬텀 리드의 차이는?","낙관적·비관적 잠금은?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["데이터 모델링과 ERD","데이터 모델링은 업무 요구를 분석해 개체, 속성, 관계를 정의하고 이를 논리·물리 데이터 구조로 변환하는 과정이다. ERD는 엔터티와 관계, 카디널리티, 선택성 등을 시각화한다.\n\n데이터 모델링은 현실의 업무 정보를 데이터 구조로 표현한다. 개념 모델은 엔터티와 관계를 파악하고 논리 모델은 속성·키·정규화를 구체화하며 물리 모델은 DBMS별 자료형·인덱스·파티션을 정한다. ERD는 엔터티·속성·관계·카디널리티를 표현한다. 학생과 과목의 N:M 관계는 수강 신청 같은 연결 엔터티를 두어 구현하고, 관계 속성은 연결 테이블에 둔다. 업무 규칙과 데이터 생명주기를 먼저 파악해야 올바른 모델이 나온다.\n\n데이터베이스 설계는 구현 이전에 업무 개념과 데이터 관계를 명확히 하는 작업이다.\n\n일대다 관계에서는 일반적으로 다(N) 쪽 테이블에 일(1) 쪽의 기본키를 외래키로 둔다.","데이터베이스 설계는 구현 이전에 업무 개념과 데이터 관계를 명확히 하는 작업이다.","데이터 모델링은 업무 요구를 분석해 개체, 속성, 관계를 정의하고 이를 논리·물리 데이터 구조로 변환하는 과정이다. ERD는 엔터티와 관계, 카디널리티, 선택성 등을 시각화한다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["개념·논리·물리 모델의 차이는?","1:N 관계를 테이블로 어떻게 표현하는가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["트랜잭션 ACID와 장애 복구","트랜잭션은 하나의 논리적 작업 단위이며 원자성·일관성·격리성·지속성을 만족하도록 설계한다. 로그와 체크포인트는 장애 이후 커밋된 변경을 복구하고 미완료 변경을 되돌리는 데 활용된다.\n\n트랜잭션은 하나의 논리적 작업으로 묶인 DB 연산이다. 계좌 이체는 출금과 입금이 함께 성공하거나 함께 취소되어야 한다. ACID에서 원자성은 전부 수행되거나 취소됨, 일관성은 제약조건 유지, 격리성은 동시 실행 간섭 제한, 지속성은 커밋 결과 보존이다. WAL은 데이터 페이지를 디스크에 반영하기 전에 로그를 먼저 안정 저장소에 기록하는 원칙이다. 장애 후 로그를 이용해 커밋된 작업을 redo하고 미완료 작업을 undo할 수 있다. 체크포인트는 복구 시 검토할 로그 범위를 줄인다.\n\n트랜잭션의 일관성은 DBMS가 임의로 모든 업무 규칙을 알아서 보장한다는 뜻이 아니다. 기본키·외래키·CHECK·NOT NULL 같은 제약과 응용 프로그램의 업무 규칙이 함께 유지되어야 한다. COMMIT 전 오류가 발생하면 ROLLBACK으로 변경을 취소할 수 있다. WAL과 체크포인트는 장애 후 redo/undo 복구에 활용된다. 백업은 로그 기반 복구와 다른 보호 계층이며, 정기적인 복구 테스트를 하지 않은 백업은 실제 복구 가능성을 보장하지 못한다.\n\n데이터베이스가 여러 사용자와 장애 상황에서도 신뢰성을 유지하는 원리를 설명할 수 있다.\n\nWAL은 데이터 페이지를 디스크에 기록하기 전에 관련 로그를 먼저 안정 저장장치에 기록하는 원칙이다.\n\n트랜잭션은 하나의 논리적 작업 단위이며 원자성·일관성·격리성·지속성을 만족하도록 설계한다. 로그와 체크포인트는 장애 이후 커밋된 변경을 복구하고 미완료 변경을 되돌리는 데 활용된다. 원자성은 전부 수행되거나 전부 취소됨, 일관성은 제약조건을 만족하는 상태 사이의 전이, 격리성은 동시 트랜잭션의 간섭 통제, 지속성은 커밋 결과의 장애 후 보존을 뜻한다.","데이터베이스가 여러 사용자와 장애 상황에서도 신뢰성을 유지하는 원리를 설명할 수 있다.","트랜잭션은 하나의 논리적 작업 단위이며 원자성·일관성·격리성·지속성을 만족하도록 설계한다. 로그와 체크포인트는 장애 이후 커밋된 변경을 복구하고 미완료 변경을 되돌리는 데 활용된다.  원자성은 전부 수행되거나 전부 취소됨, 일관성은 제약조건을 만족하는 상태 사이의 전이, 격리성은 동시 트랜잭션의 간섭 통제, 지속성은 커밋 결과의 장애 후 보존을 뜻한다. 실제 격리 수준은 성능과 이상 현상 허용 사이의 절충이며 DBMS별 구현 차이가 있다.",["원자성과 일관성의 차이는?","커밋 후 전원이 꺼지면 데이터가 보존되는 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["SQL JOIN과 집계·서브쿼리","JOIN은 관련 테이블을 조건에 따라 결합한다. INNER JOIN은 양쪽에 일치하는 행을, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하며 오른쪽에 일치 항목이 없으면 NULL을 채운다. GROUP BY와 HAVING은 그룹 집계와 조건 필터링에 사용된다.\n\nSQL은 데이터 정의·조회·변경·권한 관리를 위한 선언적 언어다. WHERE는 행을 필터링하고 GROUP BY는 그룹별 집계를 만들며 HAVING은 집계 후 그룹을 필터링한다. INNER JOIN은 조건에 맞는 행만 결합하고 LEFT JOIN은 왼쪽 행을 모두 유지하며 오른쪽 일치가 없으면 NULL을 채운다. 1:N 조인은 왼쪽 행이 여러 번 나타날 수 있다. NULL은 3값 논리(TRUE/FALSE/UNKNOWN)를 만들기 때문에 `= NULL`이 아니라 `IS NULL`로 검사한다. 서브쿼리는 다른 질의 안에서 단일 값·집합·존재 여부를 계산한다.\n\n조인은 논리적으로 두 관계를 결합하지만 실제 실행은 중첩 루프·해시 조인·정렬 병합 조인 등으로 수행될 수 있다. 작은 테이블과 인덱스가 있는 경우 중첩 루프가 유리하고, 큰 데이터 집합을 동등 조건으로 결합할 때 해시 조인이 유리할 수 있다. LEFT JOIN 뒤 WHERE에서 오른쪽 테이블 조건을 걸면 NULL 행이 제거되어 사실상 INNER JOIN처럼 동작할 수 있으므로 조건을 ON에 둘지 WHERE에 둘지 의도를 구분한다. 집계 전에 조인으로 행이 중복되는지도 확인해야 한다.\n\n관계형 데이터의 조회와 분석을 정확하게 설명할 수 있다.\n\nJOIN 조건을 잘못 작성하면 행이 중복되거나 카테시안 곱이 발생할 수 있다.","관계형 데이터의 조회와 분석을 정확하게 설명할 수 있다.","JOIN은 관련 테이블을 조건에 따라 결합한다. INNER JOIN은 양쪽에 일치하는 행을, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하며 오른쪽에 일치 항목이 없으면 NULL을 채운다. GROUP BY와 HAVING은 그룹 집계와 조건 필터링에 사용된다.  JOIN은 두 관계의 행을 결합 조건에 따라 연결한다. INNER JOIN은 양쪽에서 조건이 맞는 행만, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하고 오른쪽 일치가 없으면 NULL을 채운다. 조인 조건 누락이나 다대다 관계는 예상보다 행 수가 늘어나는 원인이 된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["WHERE와 HAVING의 차이는?","LEFT JOIN 결과에 NULL이 생기는 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["인덱스의 구조와 실행 계획","인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 별도 탐색 구조를 유지한다. B+트리는 범위 검색과 정렬에 유리하며, 실행 계획은 DBMS가 선택한 접근 경로와 조인 순서 등을 보여준다.\n\n인덱스는 검색 키와 행 위치 또는 기본키를 별도로 관리해 테이블 전체를 읽지 않고 필요한 행을 찾도록 한다. B+트리는 내부 노드가 탐색 경로를 안내하고 리프 노드가 정렬된 키와 행 위치를 보유한다. 모든 리프가 같은 깊이에 있고 리프끼리 연결되어 범위 검색에 유리하다. 인덱스는 조회를 빠르게 할 수 있지만 저장 공간과 INSERT·UPDATE·DELETE 유지 비용이 발생한다. 복합 인덱스는 컬럼 순서가 중요하며 선두 컬럼 조건에 영향을 받는다. 실행 계획에는 인덱스 스캔·테이블 스캔·중첩 루프·해시 조인 등이 나타날 수 있고, 인덱스가 있어도 선택도가 낮으면 전체 스캔이 더 저렴할 수 있다.\n\nB+트리의 노드는 여러 키와 포인터를 저장해 트리 높이를 낮춘다. 디스크 기반 DB에서는 한 노드가 페이지 단위로 읽히므로 노드 크기와 팬아웃이 I/O 횟수에 중요하다. 범위 검색은 시작 키를 찾은 뒤 연결된 리프를 순서대로 읽어 효율적이다. 인덱스 컬럼에 함수를 적용하거나 자료형이 맞지 않아 암시적 형 변환이 발생하면 인덱스 활용이 제한될 수 있다. 인덱스 설계는 WHERE뿐 아니라 JOIN·ORDER BY·선택도와 쓰기 빈도를 함께 본다.\n\n인덱스를 무조건 많이 만드는 것이 아니라 조회와 갱신 비용을 함께 고려해야 한다.\n\n선택도가 낮은 조건, 함수 적용, 형변환, 선행 컬럼 조건 누락 등은 인덱스 활용에 영향을 줄 수 있다.\n\nB+트리는 범위 검색과 정렬에 유리하며, 실행 계획은 DBMS가 선택한 접근 경로와 조인 순서 등을 보여준다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.","인덱스를 무조건 많이 만드는 것이 아니라 조회와 갱신 비용을 함께 고려해야 한다.","인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 별도 탐색 구조를 유지한다. B+트리는 범위 검색과 정렬에 유리하며, 실행 계획은 DBMS가 선택한 접근 경로와 조인 순서 등을 보여준다.  인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.\n\nB+트리는 내부 노드에는 탐색 키와 자식 포인터를 두고 실제 레코드 탐색 정보는 리프 노드에 모으며 리프를 연결해 범위 검색을 효율화한다. 균형 높이가 유지되어 검색·삽입·삭제가 로그 수준으로 수행되고 디스크 페이지 단위 접근에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인덱스가 있는데도 사용하지 않는 이유는?","복합 인덱스의 컬럼 순서가 중요한 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["정규화와 반정규화의 판단","정규화는 함수 종속과 키 관계를 분석해 삽입·갱신·삭제 이상을 줄이도록 테이블을 분해하는 과정이다. 반정규화는 조회 성능이나 단순성을 위해 중복을 의도적으로 허용하는 설계다.\n\n정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 릴레이션을 분해하는 설계 과정이다. 함수 종속성 X→Y는 X 값이 같으면 Y 값도 같아야 한다는 제약이다. 1NF는 원자적 값, 2NF는 후보키 일부에만 종속되는 부분 함수 종속 제거, 3NF는 비키 속성의 이행 종속 문제를 줄이는 데 초점을 둔다. BCNF는 모든 비자명 함수 종속의 결정자가 슈퍼키가 되도록 더 강하게 요구한다. 분해 시 원래 정보를 복원할 수 있는 무손실 조인과 종속성 보존을 검토한다. 정규화가 무조건 조회 성능을 높이는 것은 아니며 실제 조회 패턴에 따라 반정규화를 고려할 수 있다.\n\n함수 종속성은 업무 규칙에서 도출해야 하며 단순히 현재 데이터 표본에서 우연히 값이 같다는 이유만으로 선언하면 안 된다. 후보키는 모든 속성을 함수적으로 결정하는 최소 집합이다. 2NF는 복합 후보키의 일부에만 종속되는 비주요 속성을 제거하고 3NF는 비주요 속성 사이의 이행 종속을 제한한다. BCNF는 결정자가 항상 슈퍼키가 되도록 한다. 분해가 무손실이어도 함수 종속성이 보존되지 않을 수 있어 두 조건을 함께 평가해야 한다.\n\n데이터 무결성과 성능 사이의 설계 trade-off를 설명할 수 있다.\n\n반정규화로 중복 데이터가 생기면 갱신 일관성을 유지할 책임이 애플리케이션이나 DB 설계에 추가된다.\n\n정규화는 함수 종속과 키 관계를 분석해 삽입·갱신·삭제 이상을 줄이도록 테이블을 분해하는 과정이다. 정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다.","데이터 무결성과 성능 사이의 설계 trade-off를 설명할 수 있다.","정규화는 함수 종속과 키 관계를 분석해 삽입·갱신·삭제 이상을 줄이도록 테이블을 분해하는 과정이다. 반정규화는 조회 성능이나 단순성을 위해 중복을 의도적으로 허용하는 설계다.  정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다. 분해 시 무손실 조인과 종속성 보존도
