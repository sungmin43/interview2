 있는 작업을 결정한다. 접근통제 모델에는 DAC, MAC, RBAC, ABAC 등이 있으며 최소 권한 원칙과 직무 분리가 중요하다.  인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\n인가는 인증된 주체가 어떤 자원에 어떤 작업을 수행할 수 있는지 결정한다. 최소 권한 원칙에 따라 업무에 필요한 권한만 부여하고, 기본 거부·권한 분리·주기적 검토로 과도한 권한을 줄인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["MFA가 비밀번호만 사용하는 것보다 안전한 이유는?","RBAC와 ABAC의 차이는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["네트워크 보안 장비와 탐지 체계","방화벽은 정책에 따라 네트워크 트래픽을 허용·차단하고, IDS는 침입 징후를 탐지해 경보하며, IPS는 인라인으로 트래픽을 차단할 수 있다. WAF는 웹 애플리케이션 계층 공격을 방어하고, EDR은 단말의 행위와 이벤트를 분석·대응한다.\n\n탐지 시스템은 시그니처·이상 행위·프로토콜 분석 등 여러 방식을 조합한다. 시그니처는 알려진 공격에 정확할 수 있지만 변형 공격을 놓치고, 이상 탐지는 새로운 행위를 찾을 수 있지만 정상 변동을 오탐할 수 있다. 인라인 IPS는 차단 효과가 있지만 오탐 시 정상 서비스까지 중단시킬 수 있으므로 차단 정책과 예외, 장애 시 fail-open/fail-close 동작을 설계해야 한다. SIEM은 이벤트를 수집·정규화하고 시간·계정·자산을 연결해 분석한다.\n\n보안 장비마다 관찰 지점과 방어 범위가 달라 여러 통제 수단을 계층적으로 구성해야 한다.\n\n탐지 규칙은 정상 행위를 공격으로 판단하는 오탐과 공격을 놓치는 미탐 사이의 균형을 고려해 튜닝해야 한다.\n\n방화벽은 정책에 따라 네트워크 트래픽을 허용·차단하고, IDS는 침입 징후를 탐지해 경보하며, IPS는 인라인으로 트래픽을 차단할 수 있다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. IDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. IPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다.","보안 장비마다 관찰 지점과 방어 범위가 달라 여러 통제 수단을 계층적으로 구성해야 한다.","방화벽은 정책에 따라 네트워크 트래픽을 허용·차단하고, IDS는 침입 징후를 탐지해 경보하며, IPS는 인라인으로 트래픽을 차단할 수 있다. WAF는 웹 애플리케이션 계층 공격을 방어하고, EDR은 단말의 행위와 이벤트를 분석·대응한다.  방화벽은 네트워크 트래픽을 정책에 따라 허용하거나 차단한다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. 방화벽 통과가 곧 내부 시스템의 안전을 뜻하지는 않는다.\n\nIDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. 시그니처 기반은 알려진 패턴에 강하고 이상 행위 기반은 기준선에서 벗어난 행위를 찾지만 오탐·미탐이 생길 수 있다. 일반적인 IDS는 직접 차단보다 탐지·경보에 초점을 둔다.\n\nIPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다. 실시간 차단이 가능하지만 오탐이 정상 트래픽을 막을 수 있어 정책 튜닝, 예외 관리, 장애 시 우회 정책이 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["오탐과 미탐은 무엇인가?","WAF가 모든 웹 공격을 막을 수 있는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["악성코드·취약점·공격 단계","악성코드는 바이러스, 웜, 트로이목마, 랜섬웨어, 백도어 등 목적과 전파 방식에 따라 구분한다. 공격은 정찰, 초기 침투, 실행, 권한 상승, 지속성 확보, 내부 이동, 정보 유출 등 여러 단계로 진행될 수 있다.\n\n악성코드는 시스템의 기밀성·무결성·가용성을 침해하거나 공격 목적을 수행하는 소프트웨어다. 바이러스는 다른 파일에 붙어 전파되고 웜은 스스로 확산하며 트로이목마는 정상 프로그램처럼 위장한다. 랜섬웨어는 파일을 암호화하거나 시스템을 잠그고 대가를 요구하며 데이터 유출 협박을 함께 하기도 한다. 방어는 패치·최소 권한·이메일 필터·EDR·네트워크 분리·오프라인 또는 불변 백업을 결합한다. 감염 시 증거 보존과 확산 억제, 초기 침투 경로 제거, 검증된 백업 복구가 필요하다.\n\n랜섬웨어 사고 대응에서는 감염 단말을 네트워크에서 격리하되 전원 차단이 메모리 증거를 잃게 할 수 있으므로 상황에 따라 포렌식 담당자와 판단한다. 계정 탈취와 원격 관리 도구 악용이 확산 경로일 수 있어 자격 증명 초기화와 원격 접속 통제가 필요하다. 복구는 백업 파일만 복사하는 것이 아니라 초기 침투 경로 제거, 시스템 재구축, 백업 무결성 확인, 복구 후 모니터링까지 포함해야 한다.\n\n단일 경보만 보는 것이 아니라 공격 흐름과 연관 이벤트를 연결해야 침해 범위를 파악할 수 있다.\n\nC2 차단은 외부 명령 통신을 제한하지만 이미 실행된 악성코드나 내부 지속성은 남을 수 있으므로 단말 격리, 포렌식, 제거·재설치 판단이 별도로 필요하다.\n\n악성코드는 바이러스, 웜, 트로이목마, 랜섬웨어, 백도어 등 목적과 전파 방식에 따라 구분한다. 공격은 정찰, 초기 침투, 실행, 권한 상승, 지속성 확보, 내부 이동, 정보 유출 등 여러 단계로 진행될 수 있다. 초기 침투, 권한 상승, 내부 이동, 백업 파괴, 암호화·유출 등 여러 단계가 나타날 수 있다.","단일 경보만 보는 것이 아니라 공격 흐름과 연관 이벤트를 연결해야 침해 범위를 파악할 수 있다.","악성코드는 바이러스, 웜, 트로이목마, 랜섬웨어, 백도어 등 목적과 전파 방식에 따라 구분한다. 공격은 정찰, 초기 침투, 실행, 권한 상승, 지속성 확보, 내부 이동, 정보 유출 등 여러 단계로 진행될 수 있다.  랜섬웨어는 파일이나 시스템을 암호화하거나 탈취한 뒤 금전을 요구하는 악성 행위다. 초기 침투, 권한 상승, 내부 이동, 백업 파괴, 암호화·유출 등 여러 단계가 나타날 수 있다. 오프라인·불변 백업, 패치, MFA, 권한 최소화, EDR·로그 모니터링, 복구 훈련이 방어에 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["백도어와 트로이목마의 차이는?","C2 통신을 차단하면 침해가 완전히 해결되는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["보안 거버넌스·개인정보·사고 대응","보안 거버넌스는 조직의 보안 목표, 책임, 정책, 위험관리 체계를 정하는 활동이다. 개인정보 보호는 수집 목적과 최소 수집, 보유 기간, 접근 권한, 안전조치 등을 고려한다. 사고 대응은 준비, 탐지·분석, 억제, 제거, 복구, 사후 개선 단계로 수행한다.\n\n위협은 손실을 일으킬 잠재 원인이고 취약점은 위협이 악용할 약점이며 위험은 발생 가능성과 영향도를 고려한 판단이다. 위험 처리는 회피·완화·이전·수용으로 나눌 수 있다. 통제는 관리적(정책·교육), 물리적(출입 통제·시설 보호), 기술적(암호화·접근통제·탐지) 조치로 구분한다. 개인정보 보호는 목적·최소 수집·이용 범위·보유 기간·파기·정보주체 권리·접근기록을 포함하며 기술 조치뿐 아니라 업무 절차와 책임 관리가 필요하다.\n\n위험 평가는 자산 가치와 위협 가능성, 취약점, 기존 통제의 효과를 고려해 우선순위를 정한다. 정성 평가는 높음·중간·낮음으로, 정량 평가는 예상 손실과 발생 빈도 등을 수치화할 수 있다. 위험 수용은 책임 있는 승인과 모니터링을 전제로 해야 하며 방치와 다르다. 정책은 책임자·적용 범위·예외·위반 대응을 명확히 하고 교육과 감사로 실제 이행 여부를 확인한다.\n\n기술적 대응뿐 아니라 보고, 증거 보존, 법적 의무, 재발 방지까지 연결해야 한다.\n\n시간 동기화, 원본 로그 보존, 접근 이력 관리, 대응 조치 기록은 사고 원인 분석과 사후 설명에 중요하다.","기술적 대응뿐 아니라 보고, 증거 보존, 법적 의무, 재발 방지까지 연결해야 한다.","보안 거버넌스는 조직의 보안 목표, 책임, 정책, 위험관리 체계를 정하는 활동이다. 개인정보 보호는 수집 목적과 최소 수집, 보유 기간, 접근 권한, 안전조치 등을 고려한다. 사고 대응은 준비, 탐지·분석, 억제, 제거, 복구, 사후 개선 단계로 수행한다.  보안 통제는 단일 솔루션보다 예방·탐지·대응·복구를 연결해 설계해야 한다. 자산과 위협, 취약점, 발생 가능성, 영향도를 평가하고 통제의 잔여 위험과 운영 부담도 함께 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["사고 종료 후 수행해야 할 활동은?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["웹 보안: 인증·세션·쿠키·CSRF·XSS","웹 애플리케이션은 로그인 후 세션 식별자를 쿠키 등에 저장해 사용자를 구분한다. XSS는 신뢰할 수 없는 스크립트가 브라우저에서 실행되는 취약점이고 CSRF는 사용자의 인증된 브라우저를 악용해 원치 않는 요청을 보내게 하는 공격이다.\n\n식별은 신원을 주장하고 인증은 그 주장을 증명하며 인가는 인증된 주체의 자원 접근 권한을 결정한다. 비밀번호는 지식, 보안키는 소유, 지문은 생체 요소다. MFA는 서로 다른 종류의 요소를 결합한다. DAC는 소유자 재량, MAC은 보안 등급과 중앙 정책, RBAC는 역할, ABAC는 사용자·자원·환경 속성으로 권한을 결정한다. 최소 권한·기본 거부·직무 분리·정기 권한 검토로 과도한 권한을 줄인다.\n\n인증 이후 세션을 안전하게 관리하는 것도 중요하다. 세션 ID는 예측하기 어려워야 하고 로그인 후 재발급해 세션 고정 공격을 막으며 로그아웃·만료·권한 변경 시 무효화해야 한다. 권한 검사는 서버 측에서 매 요청마다 수행해야 하며 화면에서 버튼을 숨기는 것만으로 인가가 되지 않는다. 수평 권한 상승은 같은 권한 수준의 다른 사용자 자원에 접근하는 것이고 수직 권한 상승은 관리자 기능 등 더 높은 권한을 얻는 것이다.\n\n웹 공격 로그를 단순 문자열이 아니라 브라우저·서버의 동작과 연결해 이해할 수 있다.\n\nHttpOnly는 자바스크립트의 쿠키 접근을 제한하지만 XSS 자체를 막지는 못하며, 세션 탈취 위험 일부를 줄이는 방어층이다.\n\n웹 애플리케이션은 로그인 후 세션 식별자를 쿠키 등에 저장해 사용자를 구분한다. XSS는 신뢰할 수 없는 스크립트가 브라우저에서 실행되는 취약점이고 CSRF는 사용자의 인증된 브라우저를 악용해 원치 않는 요청을 보내게 하는 공격이다. 인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. XSS는 신뢰할 수 없는 입력이 브라우저에서 실행 가능한 스크립트로 해석되어 다른 사용자의 브라우저에서 실행되는 취약점이다. 출력 문맥에 맞는 인코딩, 안전한 DOM API, 콘텐츠 보안 정책 등을 적용하며 입력 필터만을 유일한 방어로 삼지 않는다. CSRF는 사용자가 로그인된 상태에서 공격자가 유도한 요청이 사용자의 권한으로 처리되도록 하는 공격이다. 예측 불가능한 CSRF 토큰, SameSite 쿠키, 중요 작업의 재인증과 출처 검증 등으로 방어한다.","웹 공격 로그를 단순 문자열이 아니라 브라우저·서버의 동작과 연결해 이해할 수 있다.","웹 애플리케이션은 로그인 후 세션 식별자를 쿠키 등에 저장해 사용자를 구분한다. XSS는 신뢰할 수 없는 스크립트가 브라우저에서 실행되는 취약점이고 CSRF는 사용자의 인증된 브라우저를 악용해 원치 않는 요청을 보내게 하는 공격이다.  인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\nXSS는 신뢰할 수 없는 입력이 브라우저에서 실행 가능한 스크립트로 해석되어 다른 사용자의 브라우저에서 실행되는 취약점이다. 저장형·반사형·DOM 기반으로 구분한다. 출력 문맥에 맞는 인코딩, 안전한 DOM API, 콘텐츠 보안 정책 등을 적용하며 입력 필터만을 유일한 방어로 삼지 않는다.\n\nCSRF는 사용자가 로그인된 상태에서 공격자가 유도한 요청이 사용자의 권한으로 처리되도록 하는 공격이다. 예측 불가능한 CSRF 토큰, SameSite 쿠키, 중요 작업의 재인증과 출처 검증 등으로 방어한다. GET 요청은 상태 변경에 사용하지 않는 것이 원칙이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["XSS와 CSRF의 차이는?","HttpOnly 쿠키가 XSS를 완전히 막는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["SQL 인젝션과 매개변수화 쿼리","SQL 인젝션은 사용자 입력이 SQL 구문으로 해석되면서 의도하지 않은 질의가 실행되는 취약점이다. 매개변수화 쿼리는 SQL 구조와 입력 데이터를 분리해 입력이 명령으로 해석되는 것을 방지한다.\n\nSQL 인젝션은 입력값이 SQL 구문으로 해석되어 의도하지 않은 조회·변경을 수행하는 취약점이다. 문자열 결합 대신 매개변수화 쿼리를 사용해 입력과 SQL 구조를 분리한다. XSS는 공격 스크립트가 다른 사용자의 브라우저에서 실행되는 취약점이며 저장형·반사형·DOM 기반으로 구분한다. 출력 문맥에 맞는 인코딩과 안전한 DOM API, CSP가 방어 수단이다. CSRF는 인증된 사용자가 공격자가 유도한 요청을 실행하게 만드는 공격으로 CSRF 토큰·SameSite 쿠키·출처 검증 등을 조합한다.\n\n보안관제에서 SQLi 탐지 이벤트의 원인과 방어 원리를 설명할 수 있다.\n\n최소 권한 DB 계정, 안전한 오류 처리, 입력 검증, 코드 수정과 보안 테스트를 함께 적용해야 한다.\n\nSQL 인젝션은 사용자 입력이 SQL 구문으로 해석되면서 의도하지 않은 질의가 실행되는 취약점이다. 매개변수화 쿼리는 SQL 구조와 입력 데이터를 분리해 입력이 명령으로 해석되는 것을 방지한다. SQL 인젝션은 사용자 입력이 SQL 구문으로 해석되도록 만들어 의도하지 않은 질의나 명령을 실행시키는 취약점이다. 문자열 결합 대신 매개변수화 쿼리를 사용하고, DB 계정 권한을 최소화하며, 오류 메시지·로그·입력 검증을 함께 관리한다.","보안관제에서 SQLi 탐지 이벤트의 원인과 방어 원리를 설명할 수 있다.","SQL 인젝션은 사용자 입력이 SQL 구문으로 해석되면서 의도하지 않은 질의가 실행되는 취약점이다. 매개변수화 쿼리는 SQL 구조와 입력 데이터를 분리해 입력이 명령으로 해석되는 것을 방지한다.  SQL 인젝션은 사용자 입력이 SQL 구문으로 해석되도록 만들어 의도하지 않은 질의나 명령을 실행시키는 취약점이다. 문자열 결합 대신 매개변수화 쿼리를 사용하고, DB 계정 권한을 최소화하며, 오류 메시지·로그·입력 검증을 함께 관리한다. 단순 필터링만으로 방어하려 해서는 안 된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["WAF만으로 SQLi를 완전히 막을 수 있는가?","에러 기반 SQLi와 블라인드 SQLi 차이는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["TLS 인증서·PKI·인증서 검증","PKI는 공개키와 신원 정보를 인증서로 연결하고 인증기관(CA)의 서명으로 신뢰 체계를 구성한다. 클라이언트는 인증서의 서명, 유효기간, 도메인 이름, 신뢰 체인 등을 검증한다.\n\n식별은 신원을 주장하고 인증은 그 주장을 증명하며 인가는 인증된 주체의 자원 접근 권한을 결정한다. 비밀번호는 지식, 보안키는 소유, 지문은 생체 요소다. MFA는 서로 다른 종류의 요소를 결합한다. DAC는 소유자 재량, MAC은 보안 등급과 중앙 정책, RBAC는 역할, ABAC는 사용자·자원·환경 속성으로 권한을 결정한다. 최소 권한·기본 거부·직무 분리·정기 권한 검토로 과도한 권한을 줄인다.\n\n인증 이후 세션을 안전하게 관리하는 것도 중요하다. 세션 ID는 예측하기 어려워야 하고 로그인 후 재발급해 세션 고정 공격을 막으며 로그아웃·만료·권한 변경 시 무효화해야 한다. 권한 검사는 서버 측에서 매 요청마다 수행해야 하며 화면에서 버튼을 숨기는 것만으로 인가가 되지 않는다. 수평 권한 상승은 같은 권한 수준의 다른 사용자 자원에 접근하는 것이고 수직 권한 상승은 관리자 기능 등 더 높은 권한을 얻는 것이다.\n\nHTTPS 통신에서 인증서 경고가 의미하는 바와 중간자 공격 방어를 설명할 수 있다.\n\n자체 서명 인증서는 사전에 별도 신뢰 설정을 하지 않았다면 일반 브라우저가 신뢰할 근거가 부족하다.\n\nPKI는 공개키와 신원 정보를 인증서로 연결하고 인증기관(CA)의 서명으로 신뢰 체계를 구성한다. 클라이언트는 인증서의 서명, 유효기간, 도메인 이름, 신뢰 체인 등을 검증한다. TLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 클라이언트는 인증서 체인, 유효기간, 호스트 이름, 용도, 폐기 여부 등을 검증해야 한다.","HTTPS 통신에서 인증서 경고가 의미하는 바와 중간자 공격 방어를 설명할 수 있다.","PKI는 공개키와 신원 정보를 인증서로 연결하고 인증기관(CA)의 서명으로 신뢰 체계를 구성한다. 클라이언트는 인증서의 서명, 유효기간, 도메인 이름, 신뢰 체인 등을 검증한다.  TLS는 통신 상대 인증, 키 합의, 기밀성, 무결성을 제공하는 보안 프로토콜이다. 인증서의 이름·유효기간·신뢰 체인·서명 등을 검증하고 핸드셰이크로 세션 키를 설정한다. 현대 TLS는 보통 AEAD 암호와 임시 키 교환을 사용해 전방향 안전성을 제공한다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\nTLS 인증서는 공개키와 도메인·주체 정보를 인증기관의 서명으로 연결한다. 클라이언트는 인증서 체인, 유효기간, 호스트 이름, 용도, 폐기 여부 등을 검증해야 한다. 암호화된 연결이라도 인증서 검증을 생략하면 중간자 공격 위험이 남는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인증서가 만료되면 어떤 문제가 생기는가?","자체 서명 인증서는 무조건 안전하지 않은가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["침해사고 분석: IOC·행위 기반 탐지·MITRE ATT&CK","IOC는 악성 IP·도메인·파일 해시 등 침해 징후를 나타내는 지표다. 행위 기반 탐지는 프로세스 실행, 권한 변경, 지속성 등록 등 행위 패턴을 분석한다. MITRE ATT&CK은 공격자의 전술·기술·절차를 분류한 지식 기반이다.\n\nIOC는 관찰 가능한 침해 단서이므로 수명과 맥락을 함께 관리해야 한다. IP 주소는 공유 호스팅이나 클라우드에서 정상 서비스와 함께 사용될 수 있고 파일 해시는 변종이 바뀌면 달라진다. 행위 기반 탐지는 단일 지표보다 프로세스 계보, 명령 실행, 권한 상승, 외부 통신, 데이터 압축·유출 같은 연속 행위를 본다. MITRE ATT&CK의 전술은 공격 목적, 기술은 목적을 달성하는 구체 행동을 나타내며 탐지 커버리지와 대응 플레이북을 정리하는 데 활용한다.\n\n단일 IP 차단을 넘어 공격 흐름을 분석하고 탐지 규칙을 개선할 수 있다.\n\nIP·도메인 같은 지표는 빠르게 바뀔 수 있으므로 프로세스 계보, 명령행, 파일 행위, 인증 이벤트 등 행위 맥락과 함께 분석한다.\n\n행위 기반 탐지는 프로세스 실행, 권한 변경, 지속성 등록 등 행위 패턴을 분석한다. IOC(침해지표)는 악성 IP·도메인·파일 해시·URL 등 침해와 관련된 관찰 가능한 단서다. 단일 IOC는 정상 인프라와 공유되거나 쉽게 바뀔 수 있어 행위·시간·자산 맥락과 함께 판단해야 한다. MITRE ATT&CK는 공격자의 전술과 기술을 구조화해 탐지 공백과 대응을 분석하는 지식 기반이다.","단일 IP 차단을 넘어 공격 흐름을 분석하고 탐지 규칙을 개선할 수 있다.","IOC는 악성 IP·도메인·파일 해시 등 침해 징후를 나타내는 지표다. 행위 기반 탐지는 프로세스 실행, 권한 변경, 지속성 등록 등 행위 패턴을 분석한다. MITRE ATT&CK은 공격자의 전술·기술·절차를 분류한 지식 기반이다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.\n\nIOC(침해지표)는 악성 IP·도메인·파일 해시·URL 등 침해와 관련된 관찰 가능한 단서다. 단일 IOC는 정상 인프라와 공유되거나 쉽게 바뀔 수 있어 행위·시간·자산 맥락과 함께 판단해야 한다. MITRE ATT&CK는 공격자의 전술과 기술을 구조화해 탐지 공백과 대응을 분석하는 지식 기반이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["IOC 기반 탐지의 한계는?","공격자가 IP를 바꾸면 어떻게 탐지할 것인가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["네트워크 분리·제로 트러스트·최소 권한","네트워크 분리는 보안 영역을 구분해 침해 확산을 제한한다. 제로 트러스트는 내부망이라는 이유만으로 신뢰하지 않고 사용자·기기·상황을 지속적으로 검증하며 최소 권한을 적용하는 보안 접근이다.\n\n네트워크 분리는 서버망·사용자망·관리망 등을 나누고 구역 사이 통신을 정책으로 통제해 침해 후 측면 이동을 어렵게 한다. VLAN은 브로드캐스트 도메인을 분리하고 ACL·방화벽은 구역 간 허용 트래픽을 제어한다. 제로 트러스트는 내부 네트워크라는 이유만으로 신뢰하지 않고 사용자·기기·요청 맥락을 지속 검증한다. 최소 권한으로 필요한 자원과 작업만 허용하며 네트워크 위치만으로 신뢰를 부여하지 않는다. 제로 트러스트는 특정 제품이 아니라 아키텍처 원칙이다.\n\n마이크로세그멘테이션은 네트워크 내부를 더 작은 보안 구역으로 나누어 워크로드 간 통신을 세밀하게 제한한다. 제로 트러스트의 접근 판단은 사용자 신원·기기 보안 상태·요청 자원·위치·위험 신호 등을 정책으로 평가할 수 있다. 지속 검증은 모든 패킷을 매번 재인증한다는 뜻이 아니라 세션과 상황 변화에 따라 신뢰 수준을 재평가한다는 의미다. MFA·기기 관리·최소 권한·로그 분석이 함께 필요하다.\n\n방화벽·NAC·접근제어 정책을 조직의 보안 아키텍처와 연결할 수 있다.\n\n제로 트러스트는 단일 제품이 아니라 인증·인가·기기 상태·세분화·모니터링을 결합하는 아키텍처 원칙이다.\n\n제로 트러스트는 내부망이라는 이유만으로 신뢰하지 않고 사용자·기기·상황을 지속적으로 검증하며 최소 권한을 적용하는 보안 접근이다. 제로 트러스트는 내부망이라는 이유만으로 신뢰하지 않고 사용자·기기·요청 맥락을 지속적으로 검증하는 보안 접근이다. 강한 인증, 기기 상태 확인, 최소 권한, 마이크로 세그멘테이션, 지속 모니터링을 조합한다.","방화벽·NAC·접근제어 정책을 조직의 보안 아키텍처와 연결할 수 있다.","네트워크 분리는 보안 영역을 구분해 침해 확산을 제한한다. 제로 트러스트는 내부망이라는 이유만으로 신뢰하지 않고 사용자·기기·상황을 지속적으로 검증하며 최소 권한을 적용하는 보안 접근이다.  제로 트러스트는 내부망이라는 이유만으로 신뢰하지 않고 사용자·기기·요청 맥락을 지속적으로 검증하는 보안 접근이다. 강한 인증, 기기 상태 확인, 최소 권한, 마이크로 세그멘테이션, 지속 모니터링을 조합한다. 단일 제품을 설치한다고 완성되는 구조가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["제로 트러스트가 VPN을 없애는 개념인가?","네트워크 분리만으로 내부 침해를 막을 수 있는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["정보보안의 3요소 CIA와 위험 관리","기밀성은 허가된 주체만 정보에 접근하게 하고 무결성은 정보가 부당하게 변경되지 않게 하며 가용성은 필요할 때 서비스를 이용할 수 있게 하는 속성이다. 위험 관리는 자산·위협·취약점·영향·가능성을 분석해 대응 우선순위를 정한다.\n\n기밀성은 허가되지 않은 주체가 정보를 읽지 못하게 하는 성질로 암호화·접근통제가 활용된다. 무결성은 정보가 허가되지 않게 변경·삭제되지 않고 정확성과 완전성을 유지하는 성질로 해시·전자서명·변경 이력이 활용된다. 가용성은 권한 있는 사용자가 필요할 때 시스템과 정보에 접근할 수 있는 성질로 이중화·백업·장애 대응·DDoS 방어가 관련된다. 세 목표는 서로 다른 위험을 다루므로 보안 설계에서는 자산·위협·취약점·영향을 분석해 통제를 조합한다.\n\n위험 평가는 자산 가치와 위협 가능성, 취약점, 기존 통제의 효과를 고려해 우선순위를 정한다. 정성 평가는 높음·중간·낮음으로, 정량 평가는 예상 손실과 발생 빈도 등을 수치화할 수 있다. 위험 수용은 책임 있는 승인과 모니터링을 전제로 해야 하며 방치와 다르다. 정책은 책임자·적용 범위·예외·위반 대응을 명확히 하고 교육과 감사로 실제 이행 여부를 확인한다.\n\n보안 통제의 목적과 사고 영향 평가의 기준을 명확하게 설명할 수 있다.\n\n랜섬웨어는 가용성을 직접 위협하고 데이터 유출을 동반하면 기밀성도 위협할 수 있다.\n\n위험 관리는 자산·위협·취약점·영향·가능성을 분석해 대응 우선순위를 정한다.","보안 통제의 목적과 사고 영향 평가의 기준을 명확하게 설명할 수 있다.","기밀성은 허가된 주체만 정보에 접근하게 하고 무결성은 정보가 부당하게 변경되지 않게 하며 가용성은 필요할 때 서비스를 이용할 수 있게 하는 속성이다. 위험 관리는 자산·위협·취약점·영향·가능성을 분석해 대응 우선순위를 정한다.  기밀성은 허가되지 않은 열람 방지, 무결성은 허가되지 않은 변경·파괴 방지, 가용성은 필요할 때 시스템과 정보를 사용할 수 있도록 보장하는 목표다. 하나의 보안 대책이 세 목표 모두를 같은 수준으로 보장하지 않으므로 자산·위협·영향을 분석해 통제 수단을 조합한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["랜섬웨어는 CIA 중 무엇을 위협하는가?","위험과 취약점은 어떻게 다른가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["대칭키·공개키 암호와 해시의 차이","대칭키 암호는 같은 비밀키로 암호화·복호화해 빠른 데이터 보호에 적합하다. 공개키 암호는 공개키와 개인키 쌍을 사용하며, 해시 함수는 고정 길이 요약값을 생성하지만 복호화하는 암호화 방식은 아니다.\n\n대칭키 암호는 같은 비밀키로 암·복호화하므로 빠르고 대량 데이터에 적합하지만 키 공유가 어렵다. 공개키 방식은 공개키·개인키 쌍을 사용해 키 합의·인증·전자서명에 활용한다. 실제 통신은 공개키 방식으로 키를 합의하고 대칭키로 데이터를 보호하는 하이브리드 방식을 사용한다. 해시는 임의 길이 입력을 고정 길이로 요약하며 복호화하는 암호화가 아니다. 비밀번호 저장은 salt와 Argon2·bcrypt 같은 전용 KDF를 사용한다. 전자서명은 개인키로 서명하고 공개키로 검증해 무결성과 서명자 인증 근거를 제공하지만 기밀성은 제공하지 않는다.\n\n암호화 알고리즘만 강하다고 시스템이 안전한 것은 아니다. 키 생성·보관·교체·폐기, 난수 품질, 모드와 nonce 관리, 인증서 검증이 함께 중요하다. AES-GCM 같은 AEAD는 기밀성과 무결성을 함께 제공하며 nonce 재사용은 치명적인 보안 문제를 일으킬 수 있다. 해시의 충돌 저항성은 서로 다른 입력이 같은 해시를 찾기 어렵다는 성질이고 비밀번호 저장은 빠른 해시가 아니라 느린 KDF를 사용해야 한다. 전자서명은 서명 대상 데이터의 무결성과 키 소유 증거를 제공하지만 개인키가 탈취되면 신뢰가 무너진다.\n\n암호화·전자서명·무결성 검증을 혼동하지 않고 설명할 수 있다.\n\n전자서명은 일반적으로 개인키로 생성하고 대응하는 공개키로 검증해 서명자 인증과 무결성 확인을 제공한다.\n\n공개키 암호는 공개키와 개인키 쌍을 사용하며, 해시 함수는 고정 길이 요약값을 생성하지만 복호화하는 암호화 방식은 아니다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.","암호화·전자서명·무결성 검증을 혼동하지 않고 설명할 수 있다.","대칭키 암호는 같은 비밀키로 암호화·복호화해 빠른 데이터 보호에 적합하다. 공개키 암호는 공개키와 개인키 쌍을 사용하며, 해시 함수는 고정 길이 요약값을 생성하지만 복호화하는 암호화 방식은 아니다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시와 암호화의 차이는?","전자서명은 어떤 키로 생성하고 검증하는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["방화벽·IDS·IPS·WAF의 역할","방화벽은 네트워크 접근 정책에 따라 트래픽을 허용·차단하고 IDS는 침입 징후를 탐지해 경보하며 IPS는 탐지 결과에 따라 차단 등 예방 조치를 수행한다. WAF는 웹 애플리케이션 요청을 분석해 웹 공격을 방어한다.\n\n방화벽은 IP·포트·프로토콜 또는 연결 상태를 기준으로 트래픽을 허용·차단한다. IDS는 의심스러운 트래픽·행위를 탐지해 경보하고 IPS는 탐지 결과에 따라 차단한다. 시그니처 탐지는 알려진 패턴에 강하지만 새로운 변종을 놓칠 수 있고 이상 행위 탐지는 오탐이 늘 수 있다. WAF는 HTTP 요청과 웹 애플리케이션 계층을 검사해 SQL 인젝션·XSS 등 웹 공격을 방어한다. 네트워크 방화벽과 WAF는 보호 계층과 검사 대상이 달라 대체재가 아니다.\n\n탐지 시스템은 시그니처·이상 행위·프로토콜 분석 등 여러 방식을 조합한다. 시그니처는 알려진 공격에 정확할 수 있지만 변형 공격을 놓치고, 이상 탐지는 새로운 행위를 찾을 수 있지만 정상 변동을 오탐할 수 있다. 인라인 IPS는 차단 효과가 있지만 오탐 시 정상 서비스까지 중단시킬 수 있으므로 차단 정책과 예외, 장애 시 fail-open/fail-close 동작을 설계해야 한다. SIEM은 이벤트를 수집·정규화하고 시간·계정·자산을 연결해 분석한다.\n\n보안관제 경험을 보안 아키텍처와 연결하고 장비별 탐지·차단 범위를 구분할 수 있다.\n\n암호화된 트래픽이나 애플리케이션 로직 취약점, 우회 기법 등으로 탐지 한계가 있어 안전한 개발과 패치가 함께 필요하다.\n\n방화벽은 네트워크 접근 정책에 따라 트래픽을 허용·차단하고 IDS는 침입 징후를 탐지해 경보하며 IPS는 탐지 결과에 따라 차단 등 예방 조치를 수행한다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. IDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. IPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다.","보안관제 경험을 보안 아키텍처와 연결하고 장비별 탐지·차단 범위를 구분할 수 있다.","방화벽은 네트워크 접근 정책에 따라 트래픽을 허용·차단하고 IDS는 침입 징후를 탐지해 경보하며 IPS는 탐지 결과에 따라 차단 등 예방 조치를 수행한다. WAF는 웹 애플리케이션 요청을 분석해 웹 공격을 방어한다.  방화벽은 네트워크 트래픽을 정책에 따라 허용하거나 차단한다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. 방화벽 통과가 곧 내부 시스템의 안전을 뜻하지는 않는다.\n\nIDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. 시그니처 기반은 알려진 패턴에 강하고 이상 행위 기반은 기준선에서 벗어난 행위를 찾지만 오탐·미탐이 생길 수 있다. 일반적인 IDS는 직접 차단보다 탐지·경보에 초점을 둔다.\n\nIPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다. 실시간 차단이 가능하지만 오탐이 정상 트래픽을 막을 수 있어 정책 튜닝, 예외 관리, 장애 시 우회 정책이 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["IDS와 IPS의 차이는?","WAF가 모든 웹 취약점을 막을 수 있는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["침해사고 대응 절차와 디지털 포렌식 기초","침해사고 대응은 준비, 탐지·분석, 억제, 제거, 복구, 사후 교훈 도출의 흐름으로 설명할 수 있다. 포렌식은 증거의 무결성과 수집 절차를 보존하면서 시스템·네트워크 흔적을 분석하는 활동이다.\n\n보안관제는 시스템·네트워크·보안 장비 로그를 수집·분석해 위협을 탐지하고 대응한다. 경보 하나만 보고 공격으로 단정하지 않고 자산 중요도·탐지 룰·출발지/목적지·포트·프로토콜·시간·계정·행위를 함께 본다. 이벤트 상관분석은 여러 장비의 로그를 시간·IP·계정·호스트 등으로 연결해 공격 흐름을 재구성한다. IOC는 악성 IP·도메인·해시 등 관찰 가능한 침해 단서이고 MITRE ATT&CK는 공격 전술·기술을 분류하는 지식 기반이다. 사고 대응은 준비·탐지/분석·억제·제거·복구·사후 교훈으로 이어지며 원본 로그·시간 정보·수집 경로를 보존해야 한다.\n\n보안관제 분석에서는 탐지 이벤트를 정상·오탐·의심·침해로 분류할 때 근거를 기록해야 한다. 출발지 IP가 내부 프록시나 NAT 주소인지, 목적지 서버가 실제 운영 자산인지, 포트와 프로토콜이 서비스와 일치하는지, 인증 실패 뒤 성공 로그가 이어지는지 등 맥락을 확인한다. 사고 보고에는 발생 시각, 영향 자산, 관찰 증거, 판단 근거, 조치, 잔여 위험과 후속 권고를 포함해야 한다. 경보를 닫는 것과 사고를 해결하는 것은 다르다.\n\n보안관제의 경보 처리부터 사고 대응과 재발 방지까지 전체 흐름을 설명할 수 있다.\n\n서비스 확산 피해가 급박하면 억제가 우선일 수 있지만 가능한 범위에서 휘발성 증거와 로그를 신속히 확보하고 조치 근거를 기록해야 한다.","보안관제의 경보 처리부터 사고 대응과 재발 방지까지 전체 흐름을 설명할 수 있다.","침해사고 대응은 준비, 탐지·분석, 억제, 제거, 복구, 사후 교훈 도출의 흐름으로 설명할 수 있다. 포렌식은 증거의 무결성과 수집 절차를 보존하면서 시스템·네트워크 흔적을 분석하는 활동이다.  보안 통제는 단일 솔루션보다 예방·탐지·대응·복구를 연결해 설계해야 한다. 자산과 위협, 취약점, 발생 가능성, 영향도를 평가하고 통제의 잔여 위험과 운영 부담도 함께 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["차단을 먼저 할지 증거 수집을 먼저 할지는 어떻게 결정하는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["악성코드와 랜섬웨어","악성코드는 사용자나 시스템에 피해를 주거나 정보를 탈취하기 위해 제작된 소프트웨어를 말한다. 랜섬웨어는 파일을 암호화하거나 시스템 접근을 제한하고 금전을 요구하는 악성코드 유형이며, 최근에는 정보 유출과 협박을 결합하기도 한다.\n\n악성코드는 시스템의 기밀성·무결성·가용성을 침해하거나 공격 목적을 수행하는 소프트웨어다. 바이러스는 다른 파일에 붙어 전파되고 웜은 스스로 확산하며 트로이목마는 정상 프로그램처럼 위장한다. 랜섬웨어는 파일을 암호화하거나 시스템을 잠그고 대가를 요구하며 데이터 유출 협박을 함께 하기도 한다. 방어는 패치·최소 권한·이메일 필터·EDR·네트워크 분리·오프라인 또는 불변 백업을 결합한다. 감염 시 증거 보존과 확산 억제, 초기 침투 경로 제거, 검증된 백업 복구가 필요하다.\n\n랜섬웨어 사고 대응에서는 감염 단말을 네트워크에서 격리하되 전원 차단이 메모리 증거를 잃게 할 수 있으므로 상황에 따라 포렌식 담당자와 판단한다. 계정 탈취와 원격 관리 도구 악용이 확산 경로일 수 있어 자격 증명 초기화와 원격 접속 통제가 필요하다. 복구는 백업 파일만 복사하는 것이 아니라 초기 침투 경로 제거, 시스템 재구축, 백업 무결성 확인, 복구 후 모니터링까지 포함해야 한다.\n\n악성 행위의 목적과 침해 영향, 예방·탐지·복구 대책을 설명할 수 있다.\n\n오프라인 또는 변경 불가능한 백업, 패치, 최소 권한, 다중 인증, 이메일 보안, EDR과 로그 모니터링을 함께 적용해야 한다.\n\n랜섬웨어는 파일을 암호화하거나 시스템 접근을 제한하고 금전을 요구하는 악성코드 유형이며, 최근에는 정보 유출과 협박을 결합하기도 한다. 랜섬웨어는 파일이나 시스템을 암호화하거나 탈취한 뒤 금전을 요구하는 악성 행위다.","악성 행위의 목적과 침해 영향, 예방·탐지·복구 대책을 설명할 수 있다.","악성코드는 사용자나 시스템에 피해를 주거나 정보를 탈취하기 위해 제작된 소프트웨어를 말한다. 랜섬웨어는 파일을 암호화하거나 시스템 접근을 제한하고 금전을 요구하는 악성코드 유형이며, 최근에는 정보 유출과 협박을 결합하기도 한다.  랜섬웨어는 파일이나 시스템을 암호화하거나 탈취한 뒤 금전을 요구하는 악성 행위다. 초기 침투, 권한 상승, 내부 이동, 백업 파괴, 암호화·유출 등 여러 단계가 나타날 수 있다. 오프라인·불변 백업, 패치, MFA, 권한 최소화, EDR·로그 모니터링, 복구 훈련이 방어에 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["랜섬웨어가 CIA에 미치는 영향은?","감염이 의심되는 단말을 발견하면 어떤 순서로 대응합니까?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["로그 분석과 보안 이벤트 상관분석","로그는 시스템과 장비에서 발생한 행위 및 상태를 시간 정보와 함께 기록한 자료다. 보안관제에서는 방화벽, 서버, 인증, DNS, EDR 등 서로 다른 로그를 시간·주소·계정·행위 기준으로 연계해 공격 흐름을 판단한다.\n\n보안관제는 시스템·네트워크·보안 장비 로그를 수집·분석해 위협을 탐지하고 대응한다. 경보 하나만 보고 공격으로 단정하지 않고 자산 중요도·탐지 룰·출발지/목적지·포트·프로토콜·시간·계정·행위를 함께 본다. 이벤트 상관분석은 여러 장비의 로그를 시간·IP·계정·호스트 등으로 연결해 공격 흐름을 재구성한다. IOC는 악성 IP·도메인·해시 등 관찰 가능한 침해 단서이고 MITRE ATT&CK는 공격 전술·기술을 분류하는 지식 기반이다. 사고 대응은 준비·탐지/분석·억제·제거·복구·사후 교훈으로 이어지며 원본 로그·시간 정보·수집 경로를 보존해야 한다.\n\n단일 경보만으로 결론을 내리지 않고 공격의 맥락과 영향 범위를 파악하는 데 중요하다.\n\n시간 동기화가 어긋나면 이벤트의 선후 관계를 잘못 판단할 수 있으므로 NTP 등으로 시스템 시간을 관리하고 로그 보존 정책을 마련한다.\n\n로그는 시스템과 장비에서 발생한 행위 및 상태를 시간 정보와 함께 기록한 자료다. 보안관제에서는 방화벽, 서버, 인증, DNS, EDR 등 서로 다른 로그를 시간·주소·계정·행위 기준으로 연계해 공격 흐름을 판단한다. 인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다.","단일 경보만으로 결론을 내리지 않고 공격의 맥락과 영향 범위를 파악하는 데 중요하다.","로그는 시스템과 장비에서 발생한 행위 및 상태를 시간 정보와 함께 기록한 자료다. 보안관제에서는 방화벽, 서버, 인증, DNS, EDR 등 서로 다른 로그를 시간·주소·계정·행위 기준으로 연계해 공격 흐름을 판단한다.  DNS는 도메인 이름을 IP 주소 등 자원 레코드로 변환하는 분산 계층형 시스템이다. 재귀 리졸버는 클라이언트 대신 응답을 찾아주고, 반복 질의는 각 서버가 다음에 물어볼 서버 정보를 반환한다. TTL 기반 캐시는 응답 속도와 부하를 줄이지만 변경 반영에는 시간이 걸릴 수 있다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\n방화벽은 네트워크 트래픽을 정책에 따라 허용하거나 차단한다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. 방화벽 통과가 곧 내부 시스템의 안전을 뜻하지는 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["오탐과 미탐을 어떻게 구분합니까?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["접근통제 모델: DAC·MAC·RBAC·ABAC","접근통제는 주체(subject)가 객체(object)에 수행할 수 있는 행위를 정책에 따라 제한하는 것이다. 인증은 사용자의 신원을 확인하는 과정이고, 인가는 인증된 주체가 특정 자원에 접근하거나 작업을 수행할 권한이 있는지 판단하는 과정이다.\n\n식별은 신원을 주장하고 인증은 그 주장을 증명하며 인가는 인증된 주체의 자원 접근 권한을 결정한다. 비밀번호는 지식, 보안키는 소유, 지문은 생체 요소다. MFA는 서로 다른 종류의 요소를 결합한다. DAC는 소유자 재량, MAC은 보안 등급과 중앙 정책, RBAC는 역할, ABAC는 사용자·자원·환경 속성으로 권한을 결정한다. 최소 권한·기본 거부·직무 분리·정기 권한 검토로 과도한 권한을 줄인다.\n\n인증 이후 세션을 안전하게 관리하는 것도 중요하다. 세션 ID는 예측하기 어려워야 하고 로그인 후 재발급해 세션 고정 공격을 막으며 로그아웃·만료·권한 변경 시 무효화해야 한다. 권한 검사는 서버 측에서 매 요청마다 수행해야 하며 화면에서 버튼을 숨기는 것만으로 인가가 되지 않는다. 수평 권한 상승은 같은 권한 수준의 다른 사용자 자원에 접근하는 것이고 수직 권한 상승은 관리자 기능 등 더 높은 권한을 얻는 것이다.\n\n접근통제는 주체(subject)가 객체(object)에 수행할 수 있는 행위를 정책에 따라 제한하는 것이다. DAC(임의적 접근통제)는 객체 소유자가 다른 사용자에게 권한을 부여할 수 있는 방식이다. MAC(강제적 접근통제)는 보안 등급과 보안 정책에 따라 중앙에서 접근을 통제하며 사용자가 임의로 권한을 변경하기 어렵다. RBAC(역할 기반 접근통제)는 사용자에게 역할을 부여하고 역할에 권한을 연결한다. ABAC(속성 기반 접근통제)는 사용자·자원·행위·환경의 속성을 정책 조건으로 평가한다. RBAC는 조직의 직무와 역할이 명확할 때 권한 관리가 단순하고, ABAC는 시간·위치·기기 상태 등 다양한 조건을 반영하기 유연하다.","","접근통제는 주체(subject)가 객체(object)에 수행할 수 있는 행위를 정책에 따라 제한하는 것이다. 인증은 사용자의 신원을 확인하는 과정이고, 인가는 인증된 주체가 특정 자원에 접근하거나 작업을 수행할 권한이 있는지 판단하는 과정이다.\n\nDAC(임의적 접근통제)는 객체 소유자가 다른 사용자에게 권한을 부여할 수 있는 방식이다. MAC(강제적 접근통제)는 보안 등급과 보안 정책에 따라 중앙에서 접근을 통제하며 사용자가 임의로 권한을 변경하기 어렵다. RBAC(역할 기반 접근통제)는 사용자에게 역할을 부여하고 역할에 권한을 연결한다. ABAC(속성 기반 접근통제)는 사용자·자원·행위·환경의 속성을 정책 조건으로 평가한다.\n\nRBAC는 조직의 직무와 역할이 명확할 때 권한 관리가 단순하고, ABAC는 시간·위치·기기 상태 등 다양한 조건을 반영하기 유연하다. 실제 시스템은 여러 모델을 조합할 수 있다. 최소 권한 원칙에 따라 업무 수행에 필요한 최소한의 권한만 부여하고 정기적으로 검토해야 한다.  인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\n인가는 인증된 주체가 어떤 자원에 어떤 작업을 수행할 수 있는지 결정한다. 최소 권한 원칙에 따라 업무에 필요한 권한만 부여하고, 기본 거부·권한 분리·주기적 검토로 과도한 권한을 줄인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인증과 인가의 차이는?","RBAC와 ABAC는 어떻게 다른가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]]]],["🤖","인공지능·데이터 과학","머신러닝·딥러닝·생성형 AI",[["AI·머신러닝·딥러닝 관계","AI는 지능적 작업을 수행하는 시스템 전반, 머신러닝은 데이터에서 패턴을 학습하는 AI 분야, 딥러닝은 여러 층의 신경망을 사용하는 머신러닝 분야다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n개념 간 범위와 기술 적용 방식을 정확히 설명할 수 있다.\n\n딥러닝이 모든 문제에서 전통적 머신러닝보다 우수한 것은 아니다.","개념 간 범위와 기술 적용 방식을 정확히 설명할 수 있다.","AI는 지능적 작업을 수행하는 시스템 전반, 머신러닝은 데이터에서 패턴을 학습하는 AI 분야, 딥러닝은 여러 층의 신경망을 사용하는 머신러닝 분야다.  모델 성능은 데이터의 대표성, 라벨 품질, 전처리, 평가 설계에 크게 좌우된다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["머신러닝과 딥러닝 차이는?","딥러닝이 데이터와 연산을 많이 쓰는 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["지도·비지도·강화학습","지도학습은 정답 라벨이 있는 데이터, 비지도학습은 라벨 없이 데이터 구조, 강화학습은 행동에 따른 보상을 이용한다.\n\n지도학습은 입력과 정답 레이블로 분류·회귀를 학습한다. 비지도학습은 레이블 없이 군집화·차원 축소 등 데이터 내부 구조를 찾는다. 강화학습은 에이전트가 환경에서 행동하고 보상을 받으며 장기 누적 보상을 최대화하는 정책을 학습한다. 강화학습은 탐험과 활용의 균형, 보상 설계, 지연 보상이 중요하며 잘못된 보상 설계는 의도하지 않은 행동을 최적화할 수 있다.\n\n지도학습에서 레이블 품질이 낮으면 모델은 잘못된 정답을 학습한다. 클래스 불균형은 학습 과정에서 소수 클래스가 무시되는 문제를 만들 수 있어 class weight·재표집·임계값 조정 등을 고려한다. 비지도 군집화는 정답이 없으므로 군집 수·거리 척도·스케일링에 따라 결과가 달라진다. 강화학습은 상태·행동·보상·정책·가치 함수로 모델링하며 보상만 높이는 편법 행동(reward hacking)이 발생하지 않는지 평가해야 한다.\n\n문제에 정답 데이터가 있는지, 패턴 탐색인지, 행동 최적화인지에 따라 방법을 선택한다.\n\n학습·평가 데이터가 겹치면 성능을 과대평가하므로 데이터 분리와 교차 검증이 중요하다.\n\n지도학습은 정답 라벨이 있는 데이터, 비지도학습은 라벨 없이 데이터 구조, 강화학습은 행동에 따른 보상을 이용한다. 지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 강화학습은 에이전트가 환경에서 행동하고 보상·상태 변화를 관찰하며 장기 누적 보상을 최대화하는 정책을 학습한다.","문제에 정답 데이터가 있는지, 패턴 탐색인지, 행동 최적화인지에 따라 방법을 선택한다.","지도학습은 정답 라벨이 있는 데이터, 비지도학습은 라벨 없이 데이터 구조, 강화학습은 행동에 따른 보상을 이용한다.  지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 분류는 범주, 회귀는 연속값을 예측한다. 학습 데이터의 레이블 품질과 대표성이 중요하며, 데이터 누수 없이 검증·테스트를 분리해야 한다.\n\n비지도학습은 정답 레이블 없이 데이터의 구조를 찾는다. 군집화는 유사한 데이터 묶음을 찾고, 차원 축소는 중요한 변동을 적은 변수로 표현한다. 결과의 정답이 주어지지 않으므로 군집의 해석 가능성과 업무 목적에 맞는 평가가 중요하다.\n\n강화학습은 에이전트가 환경에서 행동하고 보상·상태 변화를 관찰하며 장기 누적 보상을 최대화하는 정책을 학습한다. 탐험과 활용의 균형, 보상 설계, 지연 보상, 상태·행동 공간이 핵심 요소다. 시뮬레이션에서 잘 학습해도 실제 환경으로 옮길 때 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["분류와 회귀 차이는?","군집화는 언제 사용하나요?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["신경망과 역전파","신경망은 입력·은닉·출력층의 노드가 가중치와 활성화 함수로 연결된 모델이다. 예측 오차를 손실 함수로 계산하고 역전파로 가중치를 조정한다.\n\n신경망은 입력층·은닉층·출력층의 뉴런을 가중치로 연결한다. 뉴런은 입력의 가중합과 편향에 활성화 함수를 적용하며 비선형 활성화가 있어야 여러 층이 복잡한 관계를 학습할 수 있다. 순전파는 예측값을 계산하고 손실 함수는 오차를 수치화한다. 역전파는 연쇄법칙으로 각 가중치에 대한 기울기를 계산하고 경사하강법은 기울기의 반대 방향으로 파라미터를 갱신한다. 역전파는 기울기 계산, 경사하강법은 파라미터 갱신이라는 차이를 구분한다. 학습률이 너무 크면 발산하고 너무 작으면 학습이 느리다.\n\n역전파는 출력 손실에서 시작해 각 층의 가중치에 대한 미분을 연쇄법칙으로 계산한다. 가중치 갱신은 `w = w - learning_rate × gradient` 형태로 설명할 수 있다. 배치 경사하강법은 전체 학습 데이터로 기울기를 계산하고 SGD는 샘플 하나, 미니배치는 일부 샘플로 계산한다. Adam 같은 옵티마이저는 기울기의 이동 평균과 크기를 이용해 학습률을 조정한다. 기울기 소실·폭발은 깊은 네트워크 학습을 어렵게 하며 초기화·정규화·잔차 연결 등이 완화에 사용된다.\n\n이미지·음성·언어 등의 복잡한 패턴을 학습한다.\n\n과적합은 학습 데이터에만 잘 맞는 현상이며 데이터 증강, 정규화, 드롭아웃, 조기 종료 등으로 완화한다.\n\n역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다.","이미지·음성·언어 등의 복잡한 패턴을 학습한다.","신경망은 입력·은닉·출력층의 노드가 가중치와 활성화 함수로 연결된 모델이다. 예측 오차를 손실 함수로 계산하고 역전파로 가중치를 조정한다.  역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 경사하강법 등 최적화 기법은 이 기울기를 이용해 가중치를 갱신한다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["역전파란?","과적합을 줄이는 방법은?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["생성형 AI와 LLM","생성형 AI는 학습한 패턴을 바탕으로 텍스트·이미지·음성·코드 등을 생성한다. LLM은 대량의 텍스트로 학습해 다음 토큰 예측 등을 통해 언어를 생성한다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n트랜스포머 어텐션은 Query·Key·Value 벡터를 만들고 Query와 Key의 유사도로 각 Value를 얼마나 반영할지 계산한다. 자기 어텐션은 한 토큰이 같은 입력 시퀀스의 다른 토큰을 참고하게 한다. 위치 인코딩은 순서 정보를 보완하고 causal mask는 다음 토큰을 예측할 때 미래 토큰을 보지 못하게 한다. 문맥 창 길이는 한 번에 처리할 수 있는 토큰 범위이며 길이가 늘면 계산 비용과 메모리 사용이 증가한다. 임베딩 유사도는 의미적 근접성을 돕지만 사실의 참·거짓을 보장하지 않는다.\n\n교육 활용 가능성이 크지만 환각·편향·개인정보·저작권 문제를 고려해야 한다.\n\nRAG는 외부 자료를 검색해 생성 모델의 답변에 참고하도록 하는 방식이다.","교육 활용 가능성이 크지만 환각·편향·개인정보·저작권 문제를 고려해야 한다.","생성형 AI는 학습한 패턴을 바탕으로 텍스트·이미지·음성·코드 등을 생성한다. LLM은 대량의 텍스트로 학습해 다음 토큰 예측 등을 통해 언어를 생성한다.  대규모 언어 모델은 대량의 텍스트로 다음 토큰 예측 등을 학습한 신경망 모델이다. 토큰화된 입력을 임베딩과 어텐션 층으로 처리해 다음 토큰 분포를 계산하고 반복 생성한다. 유창한 출력이 사실성을 보장하지 않으므로 출처 확인과 검증이 필요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["환각이란?","수업에서 생성형 AI를 어떻게 활용할까요?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["데이터 과학과 빅데이터","데이터 과학은 데이터를 수집·정제·분석해 의미를 도출한다. 빅데이터는 규모·속도·다양성 등으로 전통적 방식으로 처리하기 어려운 데이터 특성을 말한다.\n\n데이터 과학은 데이터를 수집·정제·탐색·분석해 설명과 예측을 지원한다. 빅데이터는 규모·속도·다양성 등의 특성으로 설명한다. 전처리는 결측·이상치·중복 처리, 범주형 인코딩, 수치형 스케일링을 포함한다. 특징 공학은 원본에서 유용한 변수를 만들거나 변환하는 과정이다. Min-Max 정규화와 z-score 표준화는 변수 범위를 조정한다. 전처리 파라미터는 학습 데이터에서만 계산한 뒤 검증·테스트에 적용해야 데이터 누수를 막는다.\n\n결측값은 결측이 발생한 이유에 따라 처리 방법이 달라진다. 평균 대치는 분포를 왜곡할 수 있고 결측 자체가 정보라면 결측 여부 변수를 추가할 수 있다. 이상치는 입력 오류인지 실제 희귀 사건인지 확인한 뒤 제거·변환·강건한 모델 사용을 결정한다. 범주형 변수는 원-핫 인코딩이나 순서 인코딩을 사용할 수 있으며 순서가 없는 범주에 임의 숫자를 부여하면 모델이 순서 관계로 오해할 수 있다. 전처리는 학습 데이터에서 fit하고 검증·테스트에는 transform만 적용한다.\n\n데이터 기반 의사결정에 도움을 주지만 품질·편향·개인정보 보호가 중요하다.\n\n교란 변수와 연구 설계를 고려해야 인과관계를 신중하게 판단할 수 있다.\n\n빅데이터는 규모·속도·다양성 등으로 전통적 방식으로 처리하기 어려운 데이터 특성을 말한다.","데이터 기반 의사결정에 도움을 주지만 품질·편향·개인정보 보호가 중요하다.","데이터 과학은 데이터를 수집·정제·분석해 의미를 도출한다. 빅데이터는 규모·속도·다양성 등으로 전통적 방식으로 처리하기 어려운 데이터 특성을 말한다.  모델 성능은 데이터의 대표성, 라벨 품질, 전처리, 평가 설계에 크게 좌우된다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["전처리가 중요한 이유는?","상관관계와 인과관계 차이는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["인공지능·머신러닝·딥러닝의 관계","인공지능은 인간의 지능적 작업을 수행하는 시스템을 포괄하는 분야다. 머신러닝은 데이터에서 패턴을 학습하는 AI 접근법이며, 딥러닝은 여러 층의 신경망을 사용하는 머신러닝 방법이다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n용어의 포함 관계와 각 기술이 해결하는 문제를 구분해야 과장된 설명을 피할 수 있다.\n\n딥러닝은 데이터에서 특징을 자동으로 학습할 수 있지만 학습 데이터의 품질, 모델 크기, 연산 자원에 큰 영향을 받는다.\n\n머신러닝은 데이터에서 패턴을 학습하는 AI 접근법이며, 딥러닝은 여러 층의 신경망을 사용하는 머신러닝 방법이다.","용어의 포함 관계와 각 기술이 해결하는 문제를 구분해야 과장된 설명을 피할 수 있다.","인공지능은 인간의 지능적 작업을 수행하는 시스템을 포괄하는 분야다. 머신러닝은 데이터에서 패턴을 학습하는 AI 접근법이며, 딥러닝은 여러 층의 신경망을 사용하는 머신러닝 방법이다.  모델 성능은 데이터의 대표성, 라벨 품질, 전처리, 평가 설계에 크게 좌우된다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["규칙 기반 AI와 머신러닝의 차이는?","딥러닝이 많은 데이터와 연산을 요구하는 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["지도·비지도·강화학습","지도학습은 입력과 정답 라벨이 있는 데이터로 분류·회귀를 학습한다. 비지도학습은 라벨 없이 군집이나 잠재 구조를 찾는다. 강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동 정책을 학습한다.\n\n지도학습은 입력과 정답 레이블로 분류·회귀를 학습한다. 비지도학습은 레이블 없이 군집화·차원 축소 등 데이터 내부 구조를 찾는다. 강화학습은 에이전트가 환경에서 행동하고 보상을 받으며 장기 누적 보상을 최대화하는 정책을 학습한다. 강화학습은 탐험과 활용의 균형, 보상 설계, 지연 보상이 중요하며 잘못된 보상 설계는 의도하지 않은 행동을 최적화할 수 있다.\n\n지도학습에서 레이블 품질이 낮으면 모델은 잘못된 정답을 학습한다. 클래스 불균형은 학습 과정에서 소수 클래스가 무시되는 문제를 만들 수 있어 class weight·재표집·임계값 조정 등을 고려한다. 비지도 군집화는 정답이 없으므로 군집 수·거리 척도·스케일링에 따라 결과가 달라진다. 강화학습은 상태·행동·보상·정책·가치 함수로 모델링하며 보상만 높이는 편법 행동(reward hacking)이 발생하지 않는지 평가해야 한다.\n\n데이터와 문제 목적에 따라 학습 방법을 선택하는 기초다.\n\n분류는 범주를 예측하고 회귀는 연속적인 수치를 예측한다. 군집화는 고객 유형이나 문서 주제 탐색 등에 활용할 수 있다.\n\n강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동 정책을 학습한다. 지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 강화학습은 에이전트가 환경에서 행동하고 보상·상태 변화를 관찰하며 장기 누적 보상을 최대화하는 정책을 학습한다.","데이터와 문제 목적에 따라 학습 방법을 선택하는 기초다.","지도학습은 입력과 정답 라벨이 있는 데이터로 분류·회귀를 학습한다. 비지도학습은 라벨 없이 군집이나 잠재 구조를 찾는다. 강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동 정책을 학습한다.  지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 분류는 범주, 회귀는 연속값을 예측한다. 학습 데이터의 레이블 품질과 대표성이 중요하며, 데이터 누수 없이 검증·테스트를 분리해야 한다.\n\n비지도학습은 정답 레이블 없이 데이터의 구조를 찾는다. 군집화는 유사한 데이터 묶음을 찾고, 차원 축소는 중요한 변동을 적은 변수로 표현한다. 결과의 정답이 주어지지 않으므로 군집의 해석 가능성과 업무 목적에 맞는 평가가 중요하다.\n\n강화학습은 에이전트가 환경에서 행동하고 보상·상태 변화를 관찰하며 장기 누적 보상을 최대화하는 정책을 학습한다. 탐험과 활용의 균형, 보상 설계, 지연 보상, 상태·행동 공간이 핵심 요소다. 시뮬레이션에서 잘 학습해도 실제 환경으로 옮길 때 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["분류와 회귀의 차이는?","군집화는 어떤 상황에서 활용되는가?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["학습·검증·테스트 데이터와 과적합","데이터를 학습, 검증, 테스트 세트로 나누어 모델 학습과 하이퍼파라미터 선택, 최종 성능 평가를 구분한다. 과적합은 학습 데이터에 지나치게 맞춰 새로운 데이터에서 성능이 떨어지는 현상이다.\n\n학습 데이터는 파라미터 조정, 검증 데이터는 모델·하이퍼파라미터 선택, 테스트 데이터는 선택이 끝난 뒤 최종 일반화 평가에 사용한다. 테스트 결과를 보고 모델을 계속 수정하면 테스트 정보에 과적합되어 독립 평가의 의미가 약해진다. 과적합은 학습 데이터를 지나치게 외워 새 데이터 성능이 낮은 상태이고 과소적합은 모델이 단순하거나 학습이 부족해 훈련 데이터도 설명하지 못하는 상태다. 정규화·드롭아웃·데이터 증강·조기 종료 등으로 과적합을 완화할 수 있다. 데이터 누수는 예측 시점에 알 수 없는 정보가 학습에 섞이는 문제다.\n\n일반화 성능을 평가하려면 데이터 분할 방식도 문제에 맞아야 한다. 시계열 데이터는 미래 데이터가 학습에 섞이지 않도록 시간 순서대로 분할하고, 동일 환자·사용자·기기에서 나온 샘플이 학습과 테스트에 나뉘어 누수가 생기지 않도록 그룹 분할을 고려한다. 데이터가 적으면 교차 검증으로 여러 분할에서 성능을 측정할 수 있다. 하이퍼파라미터 선택은 검증 데이터 또는 교차 검증에서 수행하고 최종 테스트는 마지막 평가에 남겨 둔다.\n\n학습 데이터 성능만으로 모델이 실제 환경에서 잘 작동한다고 판단하면 안 된다.\n\n테스트 결과를 보고 모델을 반복 조정하면 테스트 데이터에 간접적으로 맞춰져 최종 평가가 낙관적으로 왜곡될 수 있다.\n\n데이터를 학습, 검증, 테스트 세트로 나누어 모델 학습과 하이퍼파라미터 선택, 최종 성능 평가를 구분한다. 과적합은 학습 데이터에 지나치게 맞춰 새로운 데이터에서 성능이 떨어지는 현상이다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 과적합은 모델이 학습 데이터의 잡음과 우연한 패턴까지 학습해 훈련 성능은 높지만 새로운 데이터 성능이 낮은 상태다. 더 많은 대표 데이터, 정규화, 조기 종료, 데이터 증강, 모델 단순화, 교차 검증 등으로 완화한다.","학습 데이터 성능만으로 모델이 실제 환경에서 잘 작동한다고 판단하면 안 된다.","데이터를 학습, 검증, 테스트 세트로 나누어 모델 학습과 하이퍼파라미터 선택, 최종 성능 평가를 구분한다. 과적합은 학습 데이터에 지나치게 맞춰 새로운 데이터에서 성능이 떨어지는 현상이다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다.\n\n과적합은 모델이 학습 데이터의 잡음과 우연한 패턴까지 학습해 훈련 성능은 높지만 새로운 데이터 성능이 낮은 상태다. 더 많은 대표 데이터, 정규화, 조기 종료, 데이터 증강, 모델 단순화, 교차 검증 등으로 완화한다. 과소적합은 모델이 패턴을 충분히 학습하지 못한 상태다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["과적합과 과소적합의 차이는?","테스트 데이터를 반복해서 확인하면 왜 문제가 되는가?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["신경망의 기본 구조와 역전파","인공신경망은 입력층, 은닉층, 출력층의 뉴런이 가중치와 활성화 함수를 통해 연결된 모델이다. 순전파로 예측값을 계산하고 손실 함수를 통해 오차를 측정한 뒤 역전파와 경사하강법으로 가중치를 갱신한다.\n\n신경망은 입력층·은닉층·출력층의 뉴런을 가중치로 연결한다. 뉴런은 입력의 가중합과 편향에 활성화 함수를 적용하며 비선형 활성화가 있어야 여러 층이 복잡한 관계를 학습할 수 있다. 순전파는 예측값을 계산하고 손실 함수는 오차를 수치화한다. 역전파는 연쇄법칙으로 각 가중치에 대한 기울기를 계산하고 경사하강법은 기울기의 반대 방향으로 파라미터를 갱신한다. 역전파는 기울기 계산, 경사하강법은 파라미터 갱신이라는 차이를 구분한다. 학습률이 너무 크면 발산하고 너무 작으면 학습이 느리다.\n\n역전파는 출력 손실에서 시작해 각 층의 가중치에 대한 미분을 연쇄법칙으로 계산한다. 가중치 갱신은 `w = w - learning_rate × gradient` 형태로 설명할 수 있다. 배치 경사하강법은 전체 학습 데이터로 기울기를 계산하고 SGD는 샘플 하나, 미니배치는 일부 샘플로 계산한다. Adam 같은 옵티마이저는 기울기의 이동 평균과 크기를 이용해 학습률을 조정한다. 기울기 소실·폭발은 깊은 네트워크 학습을 어렵게 하며 초기화·정규화·잔차 연결 등이 완화에 사용된다.\n\n딥러닝 모델이 데이터를 학습하는 기본 원리를 이해하는 데 필요하다.\n\n학습률이 너무 크면 최적점을 지나 발산할 수 있고 너무 작으면 학습이 느려질 수 있다.\n\n순전파로 예측값을 계산하고 손실 함수를 통해 오차를 측정한 뒤 역전파와 경사하강법으로 가중치를 갱신한다. 역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다.","딥러닝 모델이 데이터를 학습하는 기본 원리를 이해하는 데 필요하다.","인공신경망은 입력층, 은닉층, 출력층의 뉴런이 가중치와 활성화 함수를 통해 연결된 모델이다. 순전파로 예측값을 계산하고 손실 함수를 통해 오차를 측정한 뒤 역전파와 경사하강법으로 가중치를 갱신한다.  역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 경사하강법 등 최적화 기법은 이 기울기를 이용해 가중치를 갱신한다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다.\n\n경사하강법은 손실 함수가 감소하는 방향인 음의 기울기를 따라 파라미터를 반복 갱신한다. 학습률이 너무 크면 발산하거나 최솟값을 지나칠 수 있고 너무 작으면 학습이 느리다. 배치·확률적·미니배치 방식과 모멘텀·Adam 등 변형이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["활성화 함수가 필요한 이유는?","학습률이 너무 크거나 작으면?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["생성형 AI·대규모 언어 모델·프롬프트","생성형 AI는 학습한 데이터의 패턴을 바탕으로 텍스트·이미지·음성 등 새로운 콘텐츠를 생성한다. 대규모 언어 모델은 대량의 텍스트로 학습해 다음 토큰 예측 등을 수행하며, 프롬프트는 모델에 제공하는 지시와 맥락이다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n트랜스포머 어텐션은 Query·Key·Value 벡터를 만들고 Query와 Key의 유사도로 각 Value를 얼마나 반영할지 계산한다. 자기 어텐션은 한 토큰이 같은 입력 시퀀스의 다른 토큰을 참고하게 한다. 위치 인코딩은 순서 정보를 보완하고 causal mask는 다음 토큰을 예측할 때 미래 토큰을 보지 못하게 한다. 문맥 창 길이는 한 번에 처리할 수 있는 토큰 범위이며 길이가 늘면 계산 비용과 메모리 사용이 증가한다. 임베딩 유사도는 의미적 근접성을 돕지만 사실의 참·거짓을 보장하지 않는다.\n\n교육에서 활용 가능성이 크지만 사실 오류, 편향, 개인정보, 저작권, 평가 공정성을 함께 고려해야 한다.\n\n출처 확인, 결과 검증, 개인정보 입력 금지, 사용 과정 공개, AI 결과를 비판적으로 수정하는 역량을 함께 지도해야 한다.","교육에서 활용 가능성이 크지만 사실 오류, 편향, 개인정보, 저작권, 평가 공정성을 함께 고려해야 한다.","생성형 AI는 학습한 데이터의 패턴을 바탕으로 텍스트·이미지·음성 등 새로운 콘텐츠를 생성한다. 대규모 언어 모델은 대량의 텍스트로 학습해 다음 토큰 예측 등을 수행하며, 프롬프트는 모델에 제공하는 지시와 맥락이다.  모델 성능은 데이터의 대표성, 라벨 품질, 전처리, 평가 설계에 크게 좌우된다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["환각 현상이란?","학생의 생성형 AI 사용을 어떻게 지도할 것인가?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["데이터 전처리·편향·평가지표","데이터 과학은 수집, 정제, 탐색적 분석, 모델링, 평가, 해석 과정을 포함한다. 결측치·이상치·중복·불균형 데이터 처리가 중요하며, 정확도·정밀도·재현율·F1 점수 등 평가 지표는 문제 목적에 맞게 선택한다.\n\n데이터 과학은 데이터를 수집·정제·탐색·분석해 설명과 예측을 지원한다. 빅데이터는 규모·속도·다양성 등의 특성으로 설명한다. 전처리는 결측·이상치·중복 처리, 범주형 인코딩, 수치형 스케일링을 포함한다. 특징 공학은 원본에서 유용한 변수를 만들거나 변환하는 과정이다. Min-Max 정규화와 z-score 표준화는 변수 범위를 조정한다. 전처리 파라미터는 학습 데이터에서만 계산한 뒤 검증·테스트에 적용해야 데이터 누수를 막는다.\n\n결측값은 결측이 발생한 이유에 따라 처리 방법이 달라진다. 평균 대치는 분포를 왜곡할 수 있고 결측 자체가 정보라면 결측 여부 변수를 추가할 수 있다. 이상치는 입력 오류인지 실제 희귀 사건인지 확인한 뒤 제거·변환·강건한 모델 사용을 결정한다. 범주형 변수는 원-핫 인코딩이나 순서 인코딩을 사용할 수 있으며 순서가 없는 범주에 임의 숫자를 부여하면 모델이 순서 관계로 오해할 수 있다. 전처리는 학습 데이터에서 fit하고 검증·테스트에는 transform만 적용한다.\n\n데이터 품질과 평가 방식이 잘못되면 모델 결과가 실제 문제를 왜곡할 수 있다.\n\n정밀도는 양성이라고 예측한 것 중 실제 양성 비율, 재현율은 실제 양성 중 찾아낸 비율이다. 어떤 오류가 더 치명적인지에 따라 중요 지표가 달라진다.\n\n전처리는 결측치·이상치·중복·범주형 변수·텍스트 형식 등을 모델에 적합하게 정리하는 과정이다.","데이터 품질과 평가 방식이 잘못되면 모델 결과가 실제 문제를 왜곡할 수 있다.","데이터 과학은 수집, 정제, 탐색적 분석, 모델링, 평가, 해석 과정을 포함한다. 결측치·이상치·중복·불균형 데이터 처리가 중요하며, 정확도·정밀도·재현율·F1 점수 등 평가 지표는 문제 목적에 맞게 선택한다.  전처리는 결측치·이상치·중복·범주형 변수·텍스트 형식 등을 모델에 적합하게 정리하는 과정이다. 평균 대치나 스케일링 같은 변환은 학습 데이터에서 기준을 학습하고 검증·테스트에는 그 기준을 적용해야 데이터 누수를 막을 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정밀도와 재현율의 차이는?","데이터 편향이 모델에 미치는 영향은?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["분류 모델 평가: 혼동행렬·ROC·AUC","혼동행렬은 실제·예측 양성 및 음성의 조합을 TP·FP·TN·FN으로 나타낸다. ROC 곡선은 임계값에 따른 재현율과 위양성률 관계를, AUC는 그 구분 능력을 요약한다.\n\n혼동행렬은 TP·FP·TN·FN으로 분류 결과를 나눈다. 정확도는 전체 중 맞힌 비율, 정밀도는 양성 예측 중 실제 양성 비율, 재현율은 실제 양성 중 찾아낸 비율이다. F1은 정밀도와 재현율의 조화평균이다. 클래스 불균형에서는 정상만 예측해도 정확도가 높을 수 있으므로 사기 탐지처럼 FP와 FN 비용이 다르면 정밀도·재현율을 함께 봐야 한다. ROC는 임계값에 따른 TPR과 FPR, AUC는 ROC 곡선 아래 면적이다. 양성 클래스가 희소하면 PR 곡선도 유용하다.\n\n분류 모델은 보통 확률을 출력하고 임계값을 정해 양성·음성 클래스로 나눈다. 임계값을 낮추면 더 많은 사례를 양성으로 잡아 재현율이 올라갈 수 있지만 오탐도 늘 수 있다. 의료 선별은 놓침을 줄이기 위해 재현율을 중시할 수 있고 스팸 필터는 정상 메일을 차단하지 않도록 정밀도를 중시할 수 있다. ROC-AUC가 높아도 실제 운영 임계값에서 원하는 정밀도·재현율을 얻는다는 보장은 없으므로 비용과 운영 조건을 함께 평가한다.\n\n정확도만으로 평가하기 어려운 불균형 데이터 문제를 구체적으로 설명할 수 있다.\n\n질병 선별이나 침입 탐지처럼 놓치는 비용이 큰 문제에서는 재현율을 중시할 수 있지만 오탐 처리 비용도 함께 고려해야 한다.\n\n혼동행렬은 실제·예측 양성 및 음성의 조합을 TP·FP·TN·FN으로 나타낸다. ROC 곡선은 임계값에 따른 재현율과 위양성률 관계를, AUC는 그 구분 능력을 요약한다. 혼동행렬은 실제 클래스와 예측 클래스를 교차해 TP, TN, FP, FN을 정리한다. ROC 곡선은 분류 임계값을 바꾸며 참양성률과 거짓양성률의 관계를 나타낸다. AUC는 곡선 아래 면적으로 임의의 양성 샘플을 음성보다 높은 점수로 평가할 확률과 연결해 해석할 수 있다.","정확도만으로 평가하기 어려운 불균형 데이터 문제를 구체적으로 설명할 수 있다.","혼동행렬은 실제·예측 양성 및 음성의 조합을 TP·FP·TN·FN으로 나타낸다. ROC 곡선은 임계값에 따른 재현율과 위양성률 관계를, AUC는 그 구분 능력을 요약한다.  혼동행렬은 실제 클래스와 예측 클래스를 교차해 TP, TN, FP, FN을 정리한다. 정확도는 전체 정답 비율, 정밀도는 양성 예측 중 실제 양성 비율, 재현율은 실제 양성 중 찾아낸 비율, F1은 정밀도와 재현율의 조화평균이다. 클래스 불균형에서는 정확도만으로 성능을 판단하기 어렵다.\n\nROC 곡선은 분류 임계값을 바꾸며 참양성률과 거짓양성률의 관계를 나타낸다. AUC는 곡선 아래 면적으로 임의의 양성 샘플을 음성보다 높은 점수로 평가할 확률과 연결해 해석할 수 있다. 실제 운영에서는 클래스 비율과 오탐 비용을 고려해 PR 곡선 등도 함께 본다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["위양성과 위음성 중 무엇이 더 중요한지는 어떻게 정하는가?","불균형 데이터에서 정확도가 왜 위험한가?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["특징 공학·정규화·데이터 누수","특징 공학은 원시 데이터를 모델이 학습하기 좋은 변수로 변환하는 과정이다. 정규화·표준화는 변수의 척도를 조정하며, 데이터 누수는 예측 시점에 알 수 없는 정보가 학습·평가에 들어가 성능이 부풀려지는 문제다.\n\n데이터 과학은 데이터를 수집·정제·탐색·분석해 설명과 예측을 지원한다. 빅데이터는 규모·속도·다양성 등의 특성으로 설명한다. 전처리는 결측·이상치·중복 처리, 범주형 인코딩, 수치형 스케일링을 포함한다. 특징 공학은 원본에서 유용한 변수를 만들거나 변환하는 과정이다. Min-Max 정규화와 z-score 표준화는 변수 범위를 조정한다. 전처리 파라미터는 학습 데이터에서만 계산한 뒤 검증·테스트에 적용해야 데이터 누수를 막는다.\n\n결측값은 결측이 발생한 이유에 따라 처리 방법이 달라진다. 평균 대치는 분포를 왜곡할 수 있고 결측 자체가 정보라면 결측 여부 변수를 추가할 수 있다. 이상치는 입력 오류인지 실제 희귀 사건인지 확인한 뒤 제거·변환·강건한 모델 사용을 결정한다. 범주형 변수는 원-핫 인코딩이나 순서 인코딩을 사용할 수 있으며 순서가 없는 범주에 임의 숫자를 부여하면 모델이 순서 관계로 오해할 수 있다. 전처리는 학습 데이터에서 fit하고 검증·테스트에는 transform만 적용한다.\n\n실제 데이터 분석에서 높은 성능이 재현되지 않는 원인을 이해할 수 있다.\n\n전처리 통계량도 학습 데이터에서만 계산한 뒤 검증·테스트 데이터에 적용해야 누수를 줄일 수 있다.\n\n정규화·표준화는 변수의 척도를 조정하며, 데이터 누수는 예측 시점에 알 수 없는 정보가 학습·평가에 들어가 성능이 부풀려지는 문제다. 정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다.","실제 데이터 분석에서 높은 성능이 재현되지 않는 원인을 이해할 수 있다.","특징 공학은 원시 데이터를 모델이 학습하기 좋은 변수로 변환하는 과정이다. 정규화·표준화는 변수의 척도를 조정하며, 데이터 누수는 예측 시점에 알 수 없는 정보가 학습·평가에 들어가 성능이 부풀려지는 문제다.  정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다. 분해 시 무손실 조인과 종속성 보존도 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정규화와 표준화의 차이는?","데이터 누수의 사례를 들어보세요."],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["지도학습 모델: 결정트리·앙상블","결정트리는 특징에 대한 조건을 반복해 데이터를 분할한다. 랜덤 포레스트는 여러 트리를 학습해 예측을 결합하고, 그래디언트 부스팅은 이전 모델의 오류를 보완하는 방향으로 모델을 순차적으로 추가한다.\n\n지도학습은 입력과 정답 레이블로 분류·회귀를 학습한다. 비지도학습은 레이블 없이 군집화·차원 축소 등 데이터 내부 구조를 찾는다. 강화학습은 에이전트가 환경에서 행동하고 보상을 받으며 장기 누적 보상을 최대화하는 정책을 학습한다. 강화학습은 탐험과 활용의 균형, 보상 설계, 지연 보상이 중요하며 잘못된 보상 설계는 의도하지 않은 행동을 최적화할 수 있다.\n\n지도학습에서 레이블 품질이 낮으면 모델은 잘못된 정답을 학습한다. 클래스 불균형은 학습 과정에서 소수 클래스가 무시되는 문제를 만들 수 있어 class weight·재표집·임계값 조정 등을 고려한다. 비지도 군집화는 정답이 없으므로 군집 수·거리 척도·스케일링에 따라 결과가 달라진다. 강화학습은 상태·행동·보상·정책·가치 함수로 모델링하며 보상만 높이는 편법 행동(reward hacking)이 발생하지 않는지 평가해야 한다.\n\n모델의 예측력과 해석 가능성, 과적합 사이의 차이를 설명할 수 있다.\n\n앙상블은 여러 모델의 예측을 결합해 일반화 성능을 높일 수 있지만 계산 비용과 설명 복잡도가 커질 수 있다.\n\n지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다.","모델의 예측력과 해석 가능성, 과적합 사이의 차이를 설명할 수 있다.","결정트리는 특징에 대한 조건을 반복해 데이터를 분할한다. 랜덤 포레스트는 여러 트리를 학습해 예측을 결합하고, 그래디언트 부스팅은 이전 모델의 오류를 보완하는 방향으로 모델을 순차적으로 추가한다.  지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 분류는 범주, 회귀는 연속값을 예측한다. 학습 데이터의 레이블 품질과 대표성이 중요하며, 데이터 누수 없이 검증·테스트를 분리해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["랜덤 포레스트와 부스팅의 차이는?","결정트리가 과적합되는 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["생성형 AI의 토큰·임베딩·어텐션","언어 모델은 텍스트를 토큰 단위로 처리하고 토큰을 벡터 임베딩으로 표현한다. 어텐션은 문맥 내 토큰 사이의 관련성을 계산해 현재 표현에 반영하는 메커니즘이다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n트랜스포머 어텐션은 Query·Key·Value 벡터를 만들고 Query와 Key의 유사도로 각 Value를 얼마나 반영할지 계산한다. 자기 어텐션은 한 토큰이 같은 입력 시퀀스의 다른 토큰을 참고하게 한다. 위치 인코딩은 순서 정보를 보완하고 causal mask는 다음 토큰을 예측할 때 미래 토큰을 보지 못하게 한다. 문맥 창 길이는 한 번에 처리할 수 있는 토큰 범위이며 길이가 늘면 계산 비용과 메모리 사용이 증가한다. 임베딩 유사도는 의미적 근접성을 돕지만 사실의 참·거짓을 보장하지 않는다.\n\nLLM의 작동 원리를 단순히 검색이나 데이터베이스 조회로 오해하지 않도록 한다.\n\n토큰은 단어보다 작거나 클 수 있으며 언어·기호·분할 방식에 따라 하나의 단어가 여러 토큰이 될 수 있다.\n\n언어 모델은 텍스트를 토큰 단위로 처리하고 토큰을 벡터 임베딩으로 표현한다. 어텐션은 문맥 내 토큰 사이의 관련성을 계산해 현재 표현에 반영하는 메커니즘이다. 어텐션은 Query와 Key의 유사도로 각 Value의 가중치를 계산해 현재 위치에 중요한 정보를 모으는 메커니즘이다. 셀프 어텐션에서는 같은 입력 시퀀스에서 Q·K·V를 만들며, 멀티헤드는 서로 다른 표현 공간의 관계를 병렬로 학습한다. 임베딩은 단어·토큰·사용자·항목 등을 연속적인 실수 벡터로 표현해 유사성과 관계를 계산할 수 있게 한다. 임베딩 공간에서 가까운 벡터가 의미상 유사할 수 있지만, 학습 데이터의 편향과 문맥에 따라 의미가 달라질 수 있다.","LLM의 작동 원리를 단순히 검색이나 데이터베이스 조회로 오해하지 않도록 한다.","언어 모델은 텍스트를 토큰 단위로 처리하고 토큰을 벡터 임베딩으로 표현한다. 어텐션은 문맥 내 토큰 사이의 관련성을 계산해 현재 표현에 반영하는 메커니즘이다.  어텐션은 Query와 Key의 유사도로 각 Value의 가중치를 계산해 현재 위치에 중요한 정보를 모으는 메커니즘이다. 셀프 어텐션에서는 같은 입력 시퀀스에서 Q·K·V를 만들며, 멀티헤드는 서로 다른 표현 공간의 관계를 병렬로 학습한다.\n\n임베딩은 단어·토큰·사용자·항목 등을 연속적인 실수 벡터로 표현해 유사성과 관계를 계산할 수 있게 한다. 임베딩 공간에서 가까운 벡터가 의미상 유사할 수 있지만, 학습 데이터의 편향과 문맥에 따라 의미가 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["토큰은 단어와 항상 일치하는가?","어텐션이 문맥 이해에 기여하는 방식은?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["AI 윤리: 공정성·설명가능성·책임성","AI 시스템은 학습 데이터의 대표성, 편향, 오류 영향, 설명 가능성, 개인정보와 책임 소재를 고려해 설계·운영해야 한다. 정확도가 높더라도 특정 집단에 불리한 결과를 주면 사회적 위험이 발생할 수 있다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n학교에서 AI 활용을 지도할 때 기술적 성능과 사회적 책임을 함께 다룰 수 있다.\n\n채용·대출·교육 평가처럼 사람의 기회에 큰 영향을 주는 결정에서는 설명과 검토, 인간의 감독이 특히 중요하다.\n\nAI 시스템은 학습 데이터의 대표성, 편향, 오류 영향, 설명 가능성, 개인정보와 책임 소재를 고려해 설계·운영해야 한다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다.","학교에서 AI 활용을 지도할 때 기술적 성능과 사회적 책임을 함께 다룰 수 있다.","AI 시스템은 학습 데이터의 대표성, 편향, 오류 영향, 설명 가능성, 개인정보와 책임 소재를 고려해 설계·운영해야 한다. 정확도가 높더라도 특정 집단에 불리한 결과를 주면 사회적 위험이 발생할 수 있다.  모델 성능은 데이터의 대표성, 라벨 품질, 전처리, 평가 설계에 크게 좌우된다. 훈련 데이터 성능만으로 일반화 능력을 판단하지 말고, 실제 사용 환경과 비용·공정성·설명 가능성 등 운영 조건까지 함께 평가해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["AI 편향은 어떻게 발생하는가?","설명 가능한 AI가 필요한 상황은?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["지도·비지도·강화학습의 비교","지도학습은 정답 레이블이 있는 데이터로 입력과 출력의 관계를 학습한다. 비지도학습은 레이블 없이 데이터 구조를 찾고, 강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동을 학습한다.\n\n지도학습은 입력과 정답 레이블로 분류·회귀를 학습한다. 비지도학습은 레이블 없이 군집화·차원 축소 등 데이터 내부 구조를 찾는다. 강화학습은 에이전트가 환경에서 행동하고 보상을 받으며 장기 누적 보상을 최대화하는 정책을 학습한다. 강화학습은 탐험과 활용의 균형, 보상 설계, 지연 보상이 중요하며 잘못된 보상 설계는 의도하지 않은 행동을 최적화할 수 있다.\n\n지도학습에서 레이블 품질이 낮으면 모델은 잘못된 정답을 학습한다. 클래스 불균형은 학습 과정에서 소수 클래스가 무시되는 문제를 만들 수 있어 class weight·재표집·임계값 조정 등을 고려한다. 비지도 군집화는 정답이 없으므로 군집 수·거리 척도·스케일링에 따라 결과가 달라진다. 강화학습은 상태·행동·보상·정책·가치 함수로 모델링하며 보상만 높이는 편법 행동(reward hacking)이 발생하지 않는지 평가해야 한다.\n\nAI 문제에 따라 학습 데이터와 목표, 적합한 학습 방식이 달라지는 이유를 설명할 수 있다.\n\n보상 함수를 잘못 설계하면 실제 의도와 다른 행동을 최적화하는 보상 해킹이 발생할 수 있다.\n\n비지도학습은 레이블 없이 데이터 구조를 찾고, 강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동을 학습한다. 지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다.","AI 문제에 따라 학습 데이터와 목표, 적합한 학습 방식이 달라지는 이유를 설명할 수 있다.","지도학습은 정답 레이블이 있는 데이터로 입력과 출력의 관계를 학습한다. 비지도학습은 레이블 없이 데이터 구조를 찾고, 강화학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동을 학습한다.  지도학습은 입력과 정답 레이블의 쌍으로 모델을 학습해 새로운 입력의 값을 예측한다. 분류는 범주, 회귀는 연속값을 예측한다. 학습 데이터의 레이블 품질과 대표성이 중요하며, 데이터 누수 없이 검증·테스트를 분리해야 한다.\n\n비지도학습은 정답 레이블 없이 데이터의 구조를 찾는다. 군집화는 유사한 데이터 묶음을 찾고, 차원 축소는 중요한 변동을 적은 변수로 표현한다. 결과의 정답이 주어지지 않으므로 군집의 해석 가능성과 업무 목적에 맞는 평가가 중요하다.\n\n강화학습은 에이전트가 환경에서 행동하고 보상·상태 변화를 관찰하며 장기 누적 보상을 최대화하는 정책을 학습한다. 탐험과 활용의 균형, 보상 설계, 지연 보상, 상태·행동 공간이 핵심 요소다. 시뮬레이션에서 잘 학습해도 실제 환경으로 옮길 때 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스팸 메일 분류는 어떤 학습에 해당하는가?","강화학습에서 보상 설계가 중요한 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["과적합·과소적합과 일반화","과적합은 학습 데이터의 세부 잡음까지 학습해 새로운 데이터 성능이 떨어지는 현상이고 과소적합은 모델이 데이터 패턴을 충분히 학습하지 못한 상태다. 일반화는 보지 않은 데이터에 대한 예측 성능을 의미한다.\n\n학습 데이터는 파라미터 조정, 검증 데이터는 모델·하이퍼파라미터 선택, 테스트 데이터는 선택이 끝난 뒤 최종 일반화 평가에 사용한다. 테스트 결과를 보고 모델을 계속 수정하면 테스트 정보에 과적합되어 독립 평가의 의미가 약해진다. 과적합은 학습 데이터를 지나치게 외워 새 데이터 성능이 낮은 상태이고 과소적합은 모델이 단순하거나 학습이 부족해 훈련 데이터도 설명하지 못하는 상태다. 정규화·드롭아웃·데이터 증강·조기 종료 등으로 과적합을 완화할 수 있다. 데이터 누수는 예측 시점에 알 수 없는 정보가 학습에 섞이는 문제다.\n\n일반화 성능을 평가하려면 데이터 분할 방식도 문제에 맞아야 한다. 시계열 데이터는 미래 데이터가 학습에 섞이지 않도록 시간 순서대로 분할하고, 동일 환자·사용자·기기에서 나온 샘플이 학습과 테스트에 나뉘어 누수가 생기지 않도록 그룹 분할을 고려한다. 데이터가 적으면 교차 검증으로 여러 분할에서 성능을 측정할 수 있다. 하이퍼파라미터 선택은 검증 데이터 또는 교차 검증에서 수행하고 최종 테스트는 마지막 평가에 남겨 둔다.\n\n모델 학습 성능과 실제 활용 성능이 다른 이유 및 개선 방법을 설명할 수 있다.\n\n검증 데이터는 모델·하이퍼파라미터 선택에 사용하고 테스트 데이터는 최종 성능을 독립적으로 평가하는 데 사용한다.\n\n과적합은 학습 데이터의 세부 잡음까지 학습해 새로운 데이터 성능이 떨어지는 현상이고 과소적합은 모델이 데이터 패턴을 충분히 학습하지 못한 상태다. 과적합은 모델이 학습 데이터의 잡음과 우연한 패턴까지 학습해 훈련 성능은 높지만 새로운 데이터 성능이 낮은 상태다.","모델 학습 성능과 실제 활용 성능이 다른 이유 및 개선 방법을 설명할 수 있다.","과적합은 학습 데이터의 세부 잡음까지 학습해 새로운 데이터 성능이 떨어지는 현상이고 과소적합은 모델이 데이터 패턴을 충분히 학습하지 못한 상태다. 일반화는 보지 않은 데이터에 대한 예측 성능을 의미한다.  과적합은 모델이 학습 데이터의 잡음과 우연한 패턴까지 학습해 훈련 성능은 높지만 새로운 데이터 성능이 낮은 상태다. 더 많은 대표 데이터, 정규화, 조기 종료, 데이터 증강, 모델 단순화, 교차 검증 등으로 완화한다. 과소적합은 모델이 패턴을 충분히 학습하지 못한 상태다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["학습 정확도는 높은데 테스트 정확도가 낮다면?","검증 데이터와 테스트 데이터의 역할은?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["신경망·역전파·경사하강법","인공신경망은 가중치와 활성화 함수를 가진 층을 연결해 입력에서 출력을 계산한다. 역전파는 손실 함수의 기울기를 연쇄법칙으로 계산하고 경사하강법은 기울기 방향으로 가중치를 갱신한다.\n\n신경망은 입력층·은닉층·출력층의 뉴런을 가중치로 연결한다. 뉴런은 입력의 가중합과 편향에 활성화 함수를 적용하며 비선형 활성화가 있어야 여러 층이 복잡한 관계를 학습할 수 있다. 순전파는 예측값을 계산하고 손실 함수는 오차를 수치화한다. 역전파는 연쇄법칙으로 각 가중치에 대한 기울기를 계산하고 경사하강법은 기울기의 반대 방향으로 파라미터를 갱신한다. 역전파는 기울기 계산, 경사하강법은 파라미터 갱신이라는 차이를 구분한다. 학습률이 너무 크면 발산하고 너무 작으면 학습이 느리다.\n\n역전파는 출력 손실에서 시작해 각 층의 가중치에 대한 미분을 연쇄법칙으로 계산한다. 가중치 갱신은 `w = w - learning_rate × gradient` 형태로 설명할 수 있다. 배치 경사하강법은 전체 학습 데이터로 기울기를 계산하고 SGD는 샘플 하나, 미니배치는 일부 샘플로 계산한다. Adam 같은 옵티마이저는 기울기의 이동 평균과 크기를 이용해 학습률을 조정한다. 기울기 소실·폭발은 깊은 네트워크 학습을 어렵게 하며 초기화·정규화·잔차 연결 등이 완화에 사용된다.\n\n딥러닝 학습이 단순히 데이터를 저장하는 과정이 아니라 오차를 줄이도록 파라미터를 조정하는 과정임을 설명할 수 있다.\n\n활성화 함수가 없으면 여러 층을 쌓아도 선형 변환의 조합에 머물러 복잡한 비선형 관계를 표현하기 어렵다.\n\n인공신경망은 가중치와 활성화 함수를 가진 층을 연결해 입력에서 출력을 계산한다. 역전파는 손실 함수의 기울기를 연쇄법칙으로 계산하고 경사하강법은 기울기 방향으로 가중치를 갱신한다. 역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다. 경사하강법은 손실 함수가 감소하는 방향인 음의 기울기를 따라 파라미터를 반복 갱신한다.","딥러닝 학습이 단순히 데이터를 저장하는 과정이 아니라 오차를 줄이도록 파라미터를 조정하는 과정임을 설명할 수 있다.","인공신경망은 가중치와 활성화 함수를 가진 층을 연결해 입력에서 출력을 계산한다. 역전파는 손실 함수의 기울기를 연쇄법칙으로 계산하고 경사하강법은 기울기 방향으로 가중치를 갱신한다.  역전파는 손실 함수의 미분값을 연쇄 법칙으로 출력층에서 입력 방향으로 계산해 각 가중치의 기울기를 구하는 알고리즘이다. 경사하강법 등 최적화 기법은 이 기울기를 이용해 가중치를 갱신한다. 역전파는 기울기 계산 방법이고 경사하강법은 파라미터 갱신 방법이라는 점을 구분한다.\n\n경사하강법은 손실 함수가 감소하는 방향인 음의 기울기를 따라 파라미터를 반복 갱신한다. 학습률이 너무 크면 발산하거나 최솟값을 지나칠 수 있고 너무 작으면 학습이 느리다. 배치·확률적·미니배치 방식과 모멘텀·Adam 등 변형이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["학습률이 너무 크거나 작으면?","활성화 함수가 필요한 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["생성형 AI의 환각·프롬프트·검증","생성형 AI는 학습한 패턴을 바탕으로 그럴듯한 결과를 생성하지만 사실과 다른 내용을 자신 있게 제시하는 환각이 발생할 수 있다. 프롬프트는 과업·맥락·제약·출력 형식을 명확히 제시하고 결과를 근거와 대조해 검증해야 한다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n일반화 성능을 평가하려면 데이터 분할 방식도 문제에 맞아야 한다. 시계열 데이터는 미래 데이터가 학습에 섞이지 않도록 시간 순서대로 분할하고, 동일 환자·사용자·기기에서 나온 샘플이 학습과 테스트에 나뉘어 누수가 생기지 않도록 그룹 분할을 고려한다. 데이터가 적으면 교차 검증으로 여러 분할에서 성능을 측정할 수 있다. 하이퍼파라미터 선택은 검증 데이터 또는 교차 검증에서 수행하고 최종 테스트는 마지막 평가에 남겨 둔다.\n\n교육 현장에서 생성형 AI를 무비판적으로 사용하지 않고 보조 도구로 활용하는 태도를 설명할 수 있다.\n\nAI 사용 여부만 단속하기보다 출처 확인, 과정 기록, 결과 설명, 개인정보 보호, 허용 범위를 명확히 지도하는 것이 중요하다.\n\n생성형 AI는 학습한 패턴을 바탕으로 그럴듯한 결과를 생성하지만 사실과 다른 내용을 자신 있게 제시하는 환각이 발생할 수 있다. 프롬프트는 과업·맥락·제약·출력 형식을 명확히 제시하고 결과를 근거와 대조해 검증해야 한다. 환각은 생성형 AI가 근거가 부족하거나 사실과 다른 내용을 그럴듯하게 생성하는 현상이다. 검색 증강, 출처 제시, 계산·검증 도구, 불확실성 표현으로 위험을 줄이되 완전히 제거한다고 단정하지 않는다.","교육 현장에서 생성형 AI를 무비판적으로 사용하지 않고 보조 도구로 활용하는 태도를 설명할 수 있다.","생성형 AI는 학습한 패턴을 바탕으로 그럴듯한 결과를 생성하지만 사실과 다른 내용을 자신 있게 제시하는 환각이 발생할 수 있다. 프롬프트는 과업·맥락·제약·출력 형식을 명확히 제시하고 결과를 근거와 대조해 검증해야 한다.  환각은 생성형 AI가 근거가 부족하거나 사실과 다른 내용을 그럴듯하게 생성하는 현상이다. 학습 데이터의 한계, 질문의 모호성, 확률적 생성, 지식 최신성 문제 등이 원인이 될 수 있다. 검색 증강, 출처 제시, 계산·검증 도구, 불확실성 표현으로 위험을 줄이되 완전히 제거한다고 단정하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["AI 환각이 발생하는 이유는?","학생 과제에서 생성형 AI 사용을 어떻게 지도할 것인가?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["CNN·RNN·트랜스포머의 특징","CNN은 합성곱 연산으로 이미지의 공간적 특징을 추출하는 데 강점을 가진다. RNN은 순차 데이터의 이전 상태를 다음 단계에 전달하도록 설계되었고, 트랜스포머는 어텐션을 이용해 입력 요소 사이의 관계를 병렬적으로 모델링한다.\n\nCNN은 작은 필터를 입력 여러 위치에 적용해 지역 패턴을 추출하고 가중치 공유로 파라미터를 줄인다. RNN은 이전 시점의 은닉 상태를 다음 계산에 전달해 순서 데이터를 처리하지만 긴 시퀀스에서 기울기 소실·폭발이 생길 수 있어 LSTM·GRU가 이를 완화한다. 트랜스포머는 순환 대신 어텐션으로 토큰 관계를 계산해 병렬화에 유리하다. 표준 자기 어텐션은 시퀀스 길이가 늘면 메모리·연산 비용이 대략 제곱으로 증가할 수 있다. 데이터 특성과 계산 조건에 따라 구조를 선택한다.\n\nCNN의 필터는 이미지 전체에서 같은 가중치를 공유해 위치가 달라도 같은 패턴을 인식할 수 있다. RNN은 순서 정보를 상태에 누적하지만 긴 의존 관계를 학습하기 어렵고 LSTM은 입력·망각·출력 게이트로 정보 흐름을 조절한다. 트랜스포머는 어텐션으로 먼 위치의 관계를 직접 계산하고 병렬 학습이 가능하지만 긴 시퀀스의 메모리 비용이 크다. 실제 모델 선택은 데이터의 공간·시간 구조, 학습 데이터 크기, 지연 요구, 하드웨어 자원을 고려한다.\n\n데이터 유형과 문제에 따라 신경망 구조가 달라지는 이유를 설명할 수 있다.\n\n각 구조가 모든 문제에서 우월한 것은 아니며 데이터 규모, 계산 자원, 지연 시간, 입력 특성에 따라 선택해야 한다.\n\nCNN은 합성곱 연산으로 이미지의 공간적 특징을 추출하는 데 강점을 가진다. RNN은 순차 데이터의 이전 상태를 다음 단계에 전달하도록 설계되었고, 트랜스포머는 어텐션을 이용해 입력 요소 사이의 관계를 병렬적으로 모델링한다. CNN은 합성곱 필터를 적용해 이미지의 지역적 패턴을 추출하고 가중치를 공유해 파라미터 수를 줄인다. RNN은 이전 시점의 은닉 상태를 다음 시점 계산에 전달해 순서가 있는 데이터를 처리한다.","데이터 유형과 문제에 따라 신경망 구조가 달라지는 이유를 설명할 수 있다.","CNN은 합성곱 연산으로 이미지의 공간적 특징을 추출하는 데 강점을 가진다. RNN은 순차 데이터의 이전 상태를 다음 단계에 전달하도록 설계되었고, 트랜스포머는 어텐션을 이용해 입력 요소 사이의 관계를 병렬적으로 모델링한다.  CNN은 합성곱 필터를 적용해 이미지의 지역적 패턴을 추출하고 가중치를 공유해 파라미터 수를 줄인다. 초기 층은 모서리·질감, 깊은 층은 더 복잡한 형태를 학습할 수 있다. 이미지 분류·검출 등에 강점이 있지만 긴 거리 관계는 별도 구조가 필요할 수 있다.\n\nRNN은 이전 시점의 은닉 상태를 다음 시점 계산에 전달해 순서가 있는 데이터를 처리한다. 순환 구조로 시계열·문장 순서를 반영하지만 긴 시퀀스에서 기울기 소실·폭발 문제가 생길 수 있어 LSTM·GRU 등이 이를 완화한다.\n\n트랜스포머는 순환 없이 셀프 어텐션으로 입력 토큰 사이의 관계를 계산하고 위치 정보를 별도로 반영한다. 병렬 학습이 용이하고 긴 거리 의존성을 다룰 수 있지만, 기본 어텐션은 시퀀스 길이에 대해 메모리·연산 비용이 대체로 제곱으로 증가한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["CNN이 이미지에 적합한 이유는?","트랜스포머의 어텐션은 어떤 역할을 합니까?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["머신러닝 평가 지표와 데이터 분리","모델 평가는 학습에 사용하지 않은 데이터에서 예측 성능을 측정하는 과정이다. 분류에서는 정확도, 정밀도, 재현율, F1 점수, ROC-AUC 등을 사용하고 회귀에서는 MAE, MSE, RMSE 등을 활용한다.\n\nAI는 인식·추론·언어·계획 등 지능적 작업을 수행하는 시스템과 방법을 포괄한다. 머신러닝은 사람이 모든 규칙을 직접 작성하는 대신 데이터에서 패턴을 학습하는 AI의 한 분야이고 딥러닝은 여러 층의 신경망을 이용하는 머신러닝 방법이다. 모든 AI가 머신러닝인 것은 아니며 규칙 기반 전문가 시스템도 AI에 포함된다. 모델은 입력 특징을 받아 예측하고 손실 함수는 예측과 정답의 차이를 수치화한다. 학습 데이터 성능보다 보지 않은 데이터에서도 성능이 유지되는 일반화가 중요하다.\n\n분류 모델은 보통 확률을 출력하고 임계값을 정해 양성·음성 클래스로 나눈다. 임계값을 낮추면 더 많은 사례를 양성으로 잡아 재현율이 올라갈 수 있지만 오탐도 늘 수 있다. 의료 선별은 놓침을 줄이기 위해 재현율을 중시할 수 있고 스팸 필터는 정상 메일을 차단하지 않도록 정밀도를 중시할 수 있다. ROC-AUC가 높아도 실제 운영 임계값에서 원하는 정밀도·재현율을 얻는다는 보장은 없으므로 비용과 운영 조건을 함께 평가한다.\n\n정확도 하나만으로 모델의 실제 유용성을 판단할 수 없는 이유를 이해한다.\n\n스팸 탐지처럼 놓치는 비용과 잘못 차단하는 비용이 다른 문제에서는 목적에 따라 정밀도와 재현율의 균형을 조정한다.","정확도 하나만으로 모델의 실제 유용성을 판단할 수 없는 이유를 이해한다.","모델 평가는 학습에 사용하지 않은 데이터에서 예측 성능을 측정하는 과정이다. 분류에서는 정확도, 정밀도, 재현율, F1 점수, ROC-AUC 등을 사용하고 회귀에서는 MAE, MSE, RMSE 등을 활용한다.  ROC 곡선은 분류 임계값을 바꾸며 참양성률과 거짓양성률의 관계를 나타낸다. AUC는 곡선 아래 면적으로 임의의 양성 샘플을 음성보다 높은 점수로 평가할 확률과 연결해 해석할 수 있다. 실제 운영에서는 클래스 비율과 오탐 비용을 고려해 PR 곡선 등도 함께 본다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정밀도와 재현율의 차이는?","불균형 데이터에서 정확도만 보면 위험한 이유는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]],["경사하강법과 학습률","경사하강법(Gradient Descent)은 손실 함수의 값을 줄이기 위해 매개변수를 기울기의 반대 방향으로 반복 갱신하는 최적화 방법이다. 매개변수 θ에 대한 갱신은 θ ← θ - η∇L(θ)로 표현할 수 있다. 여기서 η는 학습률, ∇L은 손실 함수의 기울기다.\n\n학습 데이터는 파라미터 조정, 검증 데이터는 모델·하이퍼파라미터 선택, 테스트 데이터는 선택이 끝난 뒤 최종 일반화 평가에 사용한다. 테스트 결과를 보고 모델을 계속 수정하면 테스트 정보에 과적합되어 독립 평가의 의미가 약해진다. 과적합은 학습 데이터를 지나치게 외워 새 데이터 성능이 낮은 상태이고 과소적합은 모델이 단순하거나 학습이 부족해 훈련 데이터도 설명하지 못하는 상태다. 정규화·드롭아웃·데이터 증강·조기 종료 등으로 과적합을 완화할 수 있다. 데이터 누수는 예측 시점에 알 수 없는 정보가 학습에 섞이는 문제다.\n\n일반화 성능을 평가하려면 데이터 분할 방식도 문제에 맞아야 한다. 시계열 데이터는 미래 데이터가 학습에 섞이지 않도록 시간 순서대로 분할하고, 동일 환자·사용자·기기에서 나온 샘플이 학습과 테스트에 나뉘어 누수가 생기지 않도록 그룹 분할을 고려한다. 데이터가 적으면 교차 검증으로 여러 분할에서 성능을 측정할 수 있다. 하이퍼파라미터 선택은 검증 데이터 또는 교차 검증에서 수행하고 최종 테스트는 마지막 평가에 남겨 둔다.\n\n학습률이 너무 크면 최솟값을 지나치거나 발산할 수 있고, 너무 작으면 수렴이 느려진다. 실제 딥러닝에서는 모멘텀, AdaGrad, RMSProp, Adam 등 학습률 조정과 기울기 누적을 활용하는 최적화 방법도 사용한다. 경사하강법은 손실 함수의 전역 최솟값을 항상 보장하지 않으며, 초기값·학습률·손실 함수의 형태에 영향을 받는다. 학습률이 너무 크면 발산하거나 최솟값을 지나칠 수 있고 너무 작으면 학습이 느리다.","","경사하강법(Gradient Descent)은 손실 함수의 값을 줄이기 위해 매개변수를 기울기의 반대 방향으로 반복 갱신하는 최적화 방법이다. 매개변수 θ에 대한 갱신은 θ ← θ - η∇L(θ)로 표현할 수 있다. 여기서 η는 학습률, ∇L은 손실 함수의 기울기다.\n\n학습률이 너무 크면 최솟값을 지나치거나 발산할 수 있고, 너무 작으면 수렴이 느려진다. 배치 경사하강법은 전체 학습 데이터를 이용해 기울기를 계산하고, 확률적 경사하강법은 한 샘플 또는 작은 미니배치로 근사한다. 미니배치 방식은 계산 효율과 기울기 추정의 안정성 사이에서 절충한다.\n\n실제 딥러닝에서는 모멘텀, AdaGrad, RMSProp, Adam 등 학습률 조정과 기울기 누적을 활용하는 최적화 방법도 사용한다. 경사하강법은 손실 함수의 전역 최솟값을 항상 보장하지 않으며, 초기값·학습률·손실 함수의 형태에 영향을 받는다.  경사하강법은 손실 함수가 감소하는 방향인 음의 기울기를 따라 파라미터를 반복 갱신한다. 학습률이 너무 크면 발산하거나 최솟값을 지나칠 수 있고 너무 작으면 학습이 느리다. 배치·확률적·미니배치 방식과 모멘텀·Adam 등 변형이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["학습률이 너무 크거나 작으면 어떤 문제가 생기는가?","배치·확률적·미니배치 경사하강법의 차이는?"],"",[["Google Machine Learning Crash Course","https://developers.google.com/machine-learning/crash-course"]]]]],["🎓","컴퓨터교육론","정보 교과·컴퓨팅 사고력·교수학습",[["정보 교과의 목표와 역량","정보 교과는 컴퓨팅 원리를 이해하고 디지털 기술을 활용해 문제를 해결하며 책임 있게 참여하는 역량을 기르는 교과다.\n\n정보 교과는 디지털 도구 사용을 넘어 컴퓨팅 원리를 이해하고 데이터·알고리즘·프로그래밍으로 문제를 해결하며 디지털 사회에 책임 있게 참여하는 역량을 기른다. 교육과정은 목표·내용·교수학습·평가를 연결하는 기준이다. 2022 개정 교육과정은 디지털 전환과 AI 등 사회 변화에 대응해 디지털 기초 소양, 학생 주도성, 깊이 있는 학습 등을 강조한다. 세부 성취기준은 학교급·과목별 교육과정 별책 원문으로 확인해야 한다.\n\n교육과정의 성취기준은 학생이 학습 후 보여야 할 지식·기능·태도 수준을 구체화한다. 교사는 성취기준을 분석해 수업 목표와 평가 기준을 만들고 학생의 선행 지식과 학교 환경을 고려해 학습 활동을 설계한다. 교육과정은 단원 순서를 그대로 전달하는 문서가 아니라 학교와 교사가 수업·평가를 설계할 때 기준으로 삼는 틀이다. 면접에서는 교육과정의 정확한 문구와 적용 학년·과목을 원문으로 확인해야 한다.\n\n특정 프로그램 사용법을 넘어 문제 해결·정보 윤리·디지털 시민성을 길러야 한다.\n\n세부 성취기준과 과목 구성은 지원 시점의 교육부 고시 및 해당 학교급 교육과정으로 확인해야 한다.","특정 프로그램 사용법을 넘어 문제 해결·정보 윤리·디지털 시민성을 길러야 한다.","정보 교과는 컴퓨팅 원리를 이해하고 디지털 기술을 활용해 문제를 해결하며 책임 있게 참여하는 역량을 기르는 교과다.  수업 설계에서는 교육 목표, 학습 활동, 평가가 서로 일치해야 한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정보 교과와 단순 코딩 교육의 차이는?","정보 교사의 역할은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["컴퓨팅 사고력","컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리를 활용해 이해하고 해결 가능한 형태로 표현하는 사고 과정이다. 문제 분해·패턴 인식·추상화·알고리즘 설계가 핵심 요소다.\n\n컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리로 분석하고 실행 가능한 해결 절차로 표현하는 사고 방식이다. 분해는 복잡한 문제를 작은 하위 문제로 나누고, 패턴 인식은 반복 구조를 찾으며, 추상화는 핵심 정보와 관계만 남기고, 알고리즘 설계는 명확한 해결 절차를 구성한다. 학교 급식 대기 문제라면 시간대별 인원과 배식 처리량을 추상화해 대기열 분리 규칙을 설계할 수 있다. 컴퓨팅 사고력은 코딩 문법을 많이 아는 것과 동일하지 않으며 언플러그드 활동으로도 기를 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있도록 표현하는 데서 끝나지 않고 해결 과정의 정확성과 효율성을 검토하는 과정도 포함한다. 알고리즘을 설계한 뒤 대표 입력과 경계 입력으로 테스트하고 예상 결과와 실제 결과를 비교해 수정한다. 추상화는 모든 현실 요소를 모델에 넣는 것이 아니라 목적에 필요한 요소를 선택하는 판단이다. 따라서 같은 현실 문제도 목표가 바뀌면 추상화 모델과 알고리즘이 달라질 수 있다.\n\n복잡한 문제를 구조화하고 해결 절차를 설계하는 능력은 다양한 분야에서 활용된다.\n\n언플러그드 활동, 순서도, 의사코드로도 컴퓨팅 사고 과정을 학습할 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리를 활용해 이해하고 해결 가능한 형태로 표현하는 사고 과정이다. 컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다.","복잡한 문제를 구조화하고 해결 절차를 설계하는 능력은 다양한 분야에서 활용된다.","컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리를 활용해 이해하고 해결 가능한 형태로 표현하는 사고 과정이다. 문제 분해·패턴 인식·추상화·알고리즘 설계가 핵심 요소다.  컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다. 단순히 코딩을 잘하는 능력과 동일하지 않다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴퓨팅 사고력과 코딩의 차이는?","추상화가 필요한 이유는?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["프로그래밍 교수학습","문법 전달에 그치지 않고 문제 이해, 알고리즘 설계, 구현, 디버깅, 성찰을 경험하게 한다. 프로젝트 학습·문제중심학습·짝 프로그래밍 등을 활용할 수 있다.\n\n프로그래밍 학습은 문제 이해·알고리즘 설계·코드 구현·테스트·디버깅·성찰의 순환을 경험하게 해야 한다. 오류 원인은 문법뿐 아니라 문제 해석·알고리즘 누락·자료형·경계 조건·실행 환경 등 다양하다. 교사는 정답 코드를 바로 주기보다 오류 메시지와 예상/실제 출력을 비교하고 작은 입력으로 실행을 추적하도록 질문한다. 반복문 off-by-one 오류는 시작값·종료 조건·갱신을 표로 추적하게 할 수 있다. 짝 프로그래밍은 작성자와 검토자 역할을 바꾸며 논리 설명과 협력을 촉진한다.\n\n초보자는 코드 한 줄과 실행 결과 사이의 인과관계를 파악하기 어려우므로 변수 추적표·메모리 그림·순서도·실행 단계 시각화가 도움이 된다. 교사는 예측-실행-설명 활동을 통해 학생이 코드 결과를 먼저 예상하게 하고 실행 결과와 비교하도록 한다. 오류를 고칠 때는 정답 코드를 복사하는 것보다 오류가 발생한 조건과 수정 이유를 설명하게 해야 전이가 일어난다. 학생의 오개념은 다음 수업의 예제와 질문을 설계하는 진단 자료가 된다.\n\n학생이 코드를 따라 쓰는 데서 벗어나 스스로 문제를 정의하고 해결하도록 돕는다.\n\n초보자에게는 블록 기반 언어와 시각적 피드백으로 진입 장벽을 낮춘 뒤 텍스트 기반 언어로 연결할 수 있다.","학생이 코드를 따라 쓰는 데서 벗어나 스스로 문제를 정의하고 해결하도록 돕는다.","문법 전달에 그치지 않고 문제 이해, 알고리즘 설계, 구현, 디버깅, 성찰을 경험하게 한다. 프로젝트 학습·문제중심학습·짝 프로그래밍 등을 활용할 수 있다.",["디버깅을 어떻게 지도할까요?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["평가와 과정 중심 평가","최종 프로그램뿐 아니라 문제 분석, 알고리즘 설계, 구현, 오류 수정, 협업과 성찰 등 과정도 평가한다.\n\n형성평가는 수업 중 학습 상태를 확인해 교수·학습을 조정하고 총괄평가는 일정 기간 학습 결과를 종합한다. 수행평가는 학생이 실제 문제를 해결하거나 산출물을 만드는 과정에서 지식과 기능을 보여준다. 프로그래밍에서는 최종 코드뿐 아니라 문제 정의·알고리즘 설계·테스트·오류 수정·협업·성찰도 증거가 된다. 루브릭은 평가 요소와 수준별 관찰 가능한 기준을 제시해 기대와 평가 일관성을 높인다. 과정 중심 평가는 결과를 배제하는 것이 아니라 과정과 결과를 함께 해석하는 것이다.\n\n형성평가의 증거는 퀴즈 점수뿐 아니라 학생의 설명·코드·질문·오류 수정 기록·동료 피드백에서 얻을 수 있다. 피드백은 무엇을 잘못했는지 지적하는 데서 끝나지 않고 다음에 어떤 전략을 사용해야 하는지 알려야 한다. 루브릭의 수준 설명은 '우수함'처럼 추상적 표현보다 조건 분기 누락 없이 경계 사례를 처리한다처럼 관찰 가능한 행동으로 작성한다. 평가 결과는 학생에게 다음 학습 목표를 제시하고 교사에게 수업 조정 정보를 제공한다.\n\n결과물만으로는 학생의 사고 과정과 개인별 성장을 파악하기 어렵다.\n\n평가 기준을 사전에 공유하고 타당도·신뢰도·공정성을 고려해야 한다.","결과물만으로는 학생의 사고 과정과 개인별 성장을 파악하기 어렵다.","최종 프로그램뿐 아니라 문제 분석, 알고리즘 설계, 구현, 오류 수정, 협업과 성찰 등 과정도 평가한다.",["과정 중심 평가의 장점은?","팀 프로젝트 개인 평가는?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["학생 수준 차이 지도","학생은 사전 경험과 추상적 사고, 디지털 접근성에서 차이가 있다. 공통 목표를 유지하면서 과제 난이도와 지원 수준을 조절한다.\n\n학습자 차이는 선행 지식·언어·추상적 사고·디지털 경험·학습 속도·접근성 요구에서 발생한다. UDL은 다양한 학생이 참여하도록 정보 제시·참여·학습 결과 표현 방식을 유연하게 설계한다. 블록/텍스트 코딩, 시각 자료/설명 글, 단계별 힌트/확장 과제를 함께 제공할 수 있다. 비계 설정은 일시적 지원을 제공하고 숙련될수록 줄여 독립 수행으로 이동시키는 것이다. 지원은 목표를 낮추는 것이 아니라 목표에 도달하는 경로를 다양하게 하는 것이다.\n\n접근성은 시각·청각·운동·인지 특성에 관계없이 학습 자료와 도구를 사용할 수 있게 하는 설계다. 이미지에는 대체 텍스트, 영상에는 자막, 키보드만으로 조작할 수 있는 인터페이스, 충분한 색 대비와 읽기 쉬운 글꼴을 고려한다. 코딩 도구는 화면 낭독기 호환과 블록의 색 외 구분 기호를 제공할 수 있다. UDL은 사후에 예외 학생을 위한 대책을 추가하는 것보다 처음부터 다양한 접근 경로를 설계하는 데 초점을 둔다.\n\n초보자는 작은 성공 경험을 얻고 숙련자는 심화 과제를 통해 성장하도록 한다.\n\n진단평가로 사전 지식을 파악하고 짝 활동에서는 역할을 순환해 특정 학생이 코딩을 독점하지 않도록 한다.\n\n학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다.","초보자는 작은 성공 경험을 얻고 숙련자는 심화 과제를 통해 성장하도록 한다.","학생은 사전 경험과 추상적 사고, 디지털 접근성에서 차이가 있다. 공통 목표를 유지하면서 과제 난이도와 지원 수준을 조절한다.  수업 설계에서는 교육 목표, 학습 활동, 평가가 서로 일치해야 한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["수준 차이가 큰 학급을 어떻게 지도할까요?","답을 바로 알려주지 않고 어떻게 돕나요?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["정보 윤리와 디지털 시민성","개인정보 보호, 저작권, 정보 신뢰성, 사이버 폭력 예방, 알고리즘 편향과 책임 있는 기술 활용을 다룬다.\n\n디지털 시민성은 디지털 환경에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 기술을 활용하는 역량이다. 개인정보 보호·저작권·정보 신뢰성 평가·사이버 폭력 예방·디지털 발자국 관리가 포함된다. AI 윤리는 공정성·설명 가능성·책임성·개인정보·안전성을 고려한다. 학습 데이터 편향은 모델 결과에 반영될 수 있고 생성형 AI는 틀린 정보를 그럴듯하게 만들 수 있으므로 교차 검증과 출처 확인이 필요하다. 학교에서는 학생 개인정보 입력 범위·저작권·평가 공정성·AI 사용 공개 기준을 정해야 한다.\n\nAI 결과를 과제에 활용할 때는 결과의 사실성·편향·저작권·개인정보·출처를 검토해야 한다. 생성형 AI가 제시한 참고문헌이나 통계는 실제 존재하지 않을 수 있으므로 원문을 확인한다. 학생의 민감정보·성적·개인 식별 정보를 외부 AI 서비스에 입력하지 않도록 데이터 처리 조건을 확인한다. 교사는 AI 사용을 숨기게 하기보다 허용 범위와 출처 표시, 학생 본인의 사고 과정 평가 기준을 명확히 해야 한다.\n\n기술을 사용할 줄 아는 것만큼 타인과 사회에 미치는 영향을 이해하는 것이 중요하다.\n\n출처 확인, 교차 검증, 개인정보 최소 제공, 플랫폼 신고·차단 절차 등을 사례와 연결한다.\n\n디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보 보호, 정보 판별, 저작권, 사이버폭력 예방, 디지털 발자국, 알고리즘·AI 영향 이해를 포함해 다룬다.","기술을 사용할 줄 아는 것만큼 타인과 사회에 미치는 영향을 이해하는 것이 중요하다.","개인정보 보호, 저작권, 정보 신뢰성, 사이버 폭력 예방, 알고리즘 편향과 책임 있는 기술 활용을 다룬다.  저작권은 창작과 동시에 발생하는 저작자의 권리를 보호한다. 교육 목적이라고 모든 이용이 자동 허용되는 것은 아니며, 이용 목적·분량·시장 영향 등 저작권법상 요건과 학교의 이용 규정을 확인해야 한다. 출처 표시는 중요하지만 허락이 필요한 이용을 자동으로 합법화하지는 않는다.\n\n디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보 보호, 정보 판별, 저작권, 사이버폭력 예방, 디지털 발자국, 알고리즘·AI 영향 이해를 포함해 다룬다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["생성형 AI와 저작권을 어떻게 지도할까요?","가짜뉴스 판별 교육은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["2022 개정 교육과정과 정보 교과의 방향","2022 개정 교육과정은 디지털 전환, 인공지능 확산, 기후·사회 변화 등에 대응하는 미래 역량과 학생 주도성을 강조한다. 정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 영역을 통해 디지털 소양과 컴퓨팅 사고력을 기르는 방향으로 이해할 수 있다.\n\n정보 교과는 디지털 도구 사용을 넘어 컴퓨팅 원리를 이해하고 데이터·알고리즘·프로그래밍으로 문제를 해결하며 디지털 사회에 책임 있게 참여하는 역량을 기른다. 교육과정은 목표·내용·교수학습·평가를 연결하는 기준이다. 2022 개정 교육과정은 디지털 전환과 AI 등 사회 변화에 대응해 디지털 기초 소양, 학생 주도성, 깊이 있는 학습 등을 강조한다. 세부 성취기준은 학교급·과목별 교육과정 별책 원문으로 확인해야 한다.\n\n교육과정의 성취기준은 학생이 학습 후 보여야 할 지식·기능·태도 수준을 구체화한다. 교사는 성취기준을 분석해 수업 목표와 평가 기준을 만들고 학생의 선행 지식과 학교 환경을 고려해 학습 활동을 설계한다. 교육과정은 단원 순서를 그대로 전달하는 문서가 아니라 학교와 교사가 수업·평가를 설계할 때 기준으로 삼는 틀이다. 면접에서는 교육과정의 정확한 문구와 적용 학년·과목을 원문으로 확인해야 한다.\n\n컴퓨터교육 전공 면접에서는 전공 지식뿐 아니라 학교 교육에서 무엇을 왜 가르칠지 설명할 수 있어야 한다.\n\n교육과정 문구를 그대로 암기하기보다 성취기준이 요구하는 지식·과정·태도를 실제 수업 활동과 평가로 연결해 설명하는 것이 중요하다.","컴퓨터교육 전공 면접에서는 전공 지식뿐 아니라 학교 교육에서 무엇을 왜 가르칠지 설명할 수 있어야 한다.","2022 개정 교육과정은 디지털 전환, 인공지능 확산, 기후·사회 변화 등에 대응하는 미래 역량과 학생 주도성을 강조한다. 정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 영역을 통해 디지털 소양과 컴퓨팅 사고력을 기르는 방향으로 이해할 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다. 단순히 코딩을 잘하는 능력과 동일하지 않다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정보 교과에서 디지털 소양과 컴퓨팅 사고력은 어떻게 연결되는가?","2022 개정 교육과정의 학생 주도성은 수업에서 어떻게 구현할 수 있는가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["컴퓨팅 사고력의 구성 요소","컴퓨팅 사고력은 컴퓨터 과학의 개념과 방법을 활용해 문제를 이해하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 자동화 등을 설명할 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리로 분석하고 실행 가능한 해결 절차로 표현하는 사고 방식이다. 분해는 복잡한 문제를 작은 하위 문제로 나누고, 패턴 인식은 반복 구조를 찾으며, 추상화는 핵심 정보와 관계만 남기고, 알고리즘 설계는 명확한 해결 절차를 구성한다. 학교 급식 대기 문제라면 시간대별 인원과 배식 처리량을 추상화해 대기열 분리 규칙을 설계할 수 있다. 컴퓨팅 사고력은 코딩 문법을 많이 아는 것과 동일하지 않으며 언플러그드 활동으로도 기를 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있도록 표현하는 데서 끝나지 않고 해결 과정의 정확성과 효율성을 검토하는 과정도 포함한다. 알고리즘을 설계한 뒤 대표 입력과 경계 입력으로 테스트하고 예상 결과와 실제 결과를 비교해 수정한다. 추상화는 모든 현실 요소를 모델에 넣는 것이 아니라 목적에 필요한 요소를 선택하는 판단이다. 따라서 같은 현실 문제도 목표가 바뀌면 추상화 모델과 알고리즘이 달라질 수 있다.\n\n코딩 자체보다 문제를 구조화하고 해결 절차를 설계하는 역량을 가르치는 것이 핵심이다.\n\n언플러그드 활동으로 카드 정렬, 경로 찾기, 명령어 순서화 등을 수행하며 알고리즘과 분해 개념을 학습할 수 있다.\n\n컴퓨팅 사고력은 컴퓨터 과학의 개념과 방법을 활용해 문제를 이해하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 자동화 등을 설명할 수 있다. 컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다.","코딩 자체보다 문제를 구조화하고 해결 절차를 설계하는 역량을 가르치는 것이 핵심이다.","컴퓨팅 사고력은 컴퓨터 과학의 개념과 방법을 활용해 문제를 이해하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 자동화 등을 설명할 수 있다.  컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다. 단순히 코딩을 잘하는 능력과 동일하지 않다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴퓨팅 사고력과 문제해결력의 관계는?","코딩을 하지 않아도 컴퓨팅 사고력을 기를 수 있는가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["구성주의·문제중심학습·프로젝트학습","구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 능동적으로 구성한다고 본다. 문제중심학습(PBL)은 실제적 문제를 중심으로 탐구하고, 프로젝트학습은 일정 기간 결과물을 기획·제작·공유하는 활동을 강조한다.\n\n구성주의는 학습자가 기존 지식과 경험으로 새로운 의미를 능동적으로 구성한다고 본다. 문제중심학습은 복잡한 실제 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다. 프로젝트 기반 학습은 일정 기간 탐구·설계·제작을 진행해 의미 있는 산출물을 만들고 공유한다. 문제중심학습은 문제 해결 과정의 지식 습득과 추론을, 프로젝트 기반 학습은 장기간 산출물과 공개적 결과 공유를 강조하는 경향이 있다. 활동 뒤 핵심 개념 정리·중간 피드백·성찰이 필요하다.\n\n컴퓨터 수업에서 학생이 직접 설계·구현·검증하는 활동을 교육적으로 설계할 근거가 된다.\n\n두 방법 모두 실제적 과제를 활용할 수 있지만 PBL은 문제를 통한 학습 과정, 프로젝트학습은 기획·제작·공유하는 프로젝트 전체가 중심이 되는 경향이 있다.\n\n구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 능동적으로 구성한다고 본다. 문제중심학습(PBL)은 실제적 문제를 중심으로 탐구하고, 프로젝트학습은 일정 기간 결과물을 기획·제작·공유하는 활동을 강조한다. 구성주의는 학습자가 기존 지식과 경험을 바탕으로 능동적으로 의미를 구성한다고 본다.","컴퓨터 수업에서 학생이 직접 설계·구현·검증하는 활동을 교육적으로 설계할 근거가 된다.","구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 능동적으로 구성한다고 본다. 문제중심학습(PBL)은 실제적 문제를 중심으로 탐구하고, 프로젝트학습은 일정 기간 결과물을 기획·제작·공유하는 활동을 강조한다.  구성주의는 학습자가 기존 지식과 경험을 바탕으로 능동적으로 의미를 구성한다고 본다. 교사는 정답을 일방 전달하기보다 탐구 과제, 협력, 피드백, 성찰을 설계한다. 다만 학습자의 선개념과 인지 부담을 고려한 적절한 안내가 필요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["문제중심학습과 프로젝트학습의 차이는?","교사의 역할은 어떻게 달라지는가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["프로그래밍 교수학습과 오류 기반 학습","프로그래밍 학습은 문제 이해, 알고리즘 설계, 코드 작성, 실행, 디버깅, 성찰의 반복 과정으로 이루어진다. 오류는 실패가 아니라 프로그램의 동작과 학습자의 사고를 확인할 수 있는 피드백 자료다.\n\n프로그래밍 학습은 문제 이해·알고리즘 설계·코드 구현·테스트·디버깅·성찰의 순환을 경험하게 해야 한다. 오류 원인은 문법뿐 아니라 문제 해석·알고리즘 누락·자료형·경계 조건·실행 환경 등 다양하다. 교사는 정답 코드를 바로 주기보다 오류 메시지와 예상/실제 출력을 비교하고 작은 입력으로 실행을 추적하도록 질문한다. 반복문 off-by-one 오류는 시작값·종료 조건·갱신을 표로 추적하게 할 수 있다. 짝 프로그래밍은 작성자와 검토자 역할을 바꾸며 논리 설명과 협력을 촉진한다.\n\n초보자는 코드 한 줄과 실행 결과 사이의 인과관계를 파악하기 어려우므로 변수 추적표·메모리 그림·순서도·실행 단계 시각화가 도움이 된다. 교사는 예측-실행-설명 활동을 통해 학생이 코드 결과를 먼저 예상하게 하고 실행 결과와 비교하도록 한다. 오류를 고칠 때는 정답 코드를 복사하는 것보다 오류가 발생한 조건과 수정 이유를 설명하게 해야 전이가 일어난다. 학생의 오개념은 다음 수업의 예제와 질문을 설계하는 진단 자료가 된다.\n\n학생이 코드를 따라 쓰는 수준을 넘어 스스로 원인을 추론하고 수정하는 능력을 기를 수 있다.\n\n스캐폴딩은 학습자의 현재 수준에 맞춰 예시, 힌트, 부분 코드 등을 제공하고 숙련도에 따라 지원을 점차 줄이는 교수 전략이다.","학생이 코드를 따라 쓰는 수준을 넘어 스스로 원인을 추론하고 수정하는 능력을 기를 수 있다.","프로그래밍 학습은 문제 이해, 알고리즘 설계, 코드 작성, 실행, 디버깅, 성찰의 반복 과정으로 이루어진다. 오류는 실패가 아니라 프로그램의 동작과 학습자의 사고를 확인할 수 있는 피드백 자료다.",["초보 학생이 오류를 반복할 때 어떻게 지도할 것인가?","스캐폴딩이란 무엇인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["정보 교과 평가: 과정·수행·루브릭","정보 교과 평가는 개념 이해뿐 아니라 문제 분석, 알고리즘 설계, 구현, 협업, 디버깅, 성찰 등 과정과 결과를 함께 살펴야 한다. 루브릭은 평가 기준과 수준별 수행 특성을 명시한 도구다.\n\n정보 교과는 디지털 도구 사용을 넘어 컴퓨팅 원리를 이해하고 데이터·알고리즘·프로그래밍으로 문제를 해결하며 디지털 사회에 책임 있게 참여하는 역량을 기른다. 교육과정은 목표·내용·교수학습·평가를 연결하는 기준이다. 2022 개정 교육과정은 디지털 전환과 AI 등 사회 변화에 대응해 디지털 기초 소양, 학생 주도성, 깊이 있는 학습 등을 강조한다. 세부 성취기준은 학교급·과목별 교육과정 별책 원문으로 확인해야 한다.\n\n교육과정의 성취기준은 학생이 학습 후 보여야 할 지식·기능·태도 수준을 구체화한다. 교사는 성취기준을 분석해 수업 목표와 평가 기준을 만들고 학생의 선행 지식과 학교 환경을 고려해 학습 활동을 설계한다. 교육과정은 단원 순서를 그대로 전달하는 문서가 아니라 학교와 교사가 수업·평가를 설계할 때 기준으로 삼는 틀이다. 면접에서는 교육과정의 정확한 문구와 적용 학년·과목을 원문으로 확인해야 한다.\n\n결과물만 평가하면 학생의 문제 해결 과정과 협력, 개선 노력을 놓칠 수 있다.\n\n평가 기준을 사전에 공개하고 개인별 기여 기록, 과정 포트폴리오, 교사 관찰을 함께 활용하면 모둠 활동에서 개인의 학습을 더 정확히 파악할 수 있다.\n\n정보 교과 평가는 개념 이해뿐 아니라 문제 분석, 알고리즘 설계, 구현, 협업, 디버깅, 성찰 등 과정과 결과를 함께 살펴야 한다.","결과물만 평가하면 학생의 문제 해결 과정과 협력, 개선 노력을 놓칠 수 있다.","정보 교과 평가는 개념 이해뿐 아니라 문제 분석, 알고리즘 설계, 구현, 협업, 디버깅, 성찰 등 과정과 결과를 함께 살펴야 한다. 루브릭은 평가 기준과 수준별 수행 특성을 명시한 도구다.  루브릭은 평가 요소와 수준별 수행 기준을 사전에 명시한 평가 도구다. 알고리즘 정확성, 문제 해결 과정, 코드 가독성, 협업·성찰 등 과제 목표에 맞는 기준을 설정한다. 관찰 가능한 행동으로 수준을 기술해야 평가의 일관성과 피드백 활용도가 높아진다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["수행평가에서 공정성을 확보하는 방법은?","자기평가·동료평가의 한계와 보완점은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["학생 수준 차이·보편적 학습 설계·협력학습","학습자의 사전 지식과 속도, 접근성 요구는 다를 수 있다. 차별화 수업은 난이도와 지원을 조정하고, 보편적 학습 설계(UDL)는 다양한 참여·표현·정보 제시 방식을 미리 고려한다. 협력학습에서는 역할과 상호의존성을 설계한다.\n\n학습자 차이는 선행 지식·언어·추상적 사고·디지털 경험·학습 속도·접근성 요구에서 발생한다. UDL은 다양한 학생이 참여하도록 정보 제시·참여·학습 결과 표현 방식을 유연하게 설계한다. 블록/텍스트 코딩, 시각 자료/설명 글, 단계별 힌트/확장 과제를 함께 제공할 수 있다. 비계 설정은 일시적 지원을 제공하고 숙련될수록 줄여 독립 수행으로 이동시키는 것이다. 지원은 목표를 낮추는 것이 아니라 목표에 도달하는 경로를 다양하게 하는 것이다.\n\n접근성은 시각·청각·운동·인지 특성에 관계없이 학습 자료와 도구를 사용할 수 있게 하는 설계다. 이미지에는 대체 텍스트, 영상에는 자막, 키보드만으로 조작할 수 있는 인터페이스, 충분한 색 대비와 읽기 쉬운 글꼴을 고려한다. 코딩 도구는 화면 낭독기 호환과 블록의 색 외 구분 기호를 제공할 수 있다. UDL은 사후에 예외 학생을 위한 대책을 추가하는 것보다 처음부터 다양한 접근 경로를 설계하는 데 초점을 둔다.\n\n한 가지 설명 방식이나 동일한 과제만으로 모든 학생이 참여하기 어렵기 때문에 접근성을 고려한 수업 설계가 필요하다.\n\n역할 순환, 개인별 성찰 기록, 짝 프로그래밍의 드라이버·네비게이터 교대 등을 통해 참여 편중을 줄일 수 있다.\n\n차별화 수업은 난이도와 지원을 조정하고, 보편적 학습 설계(UDL)는 다양한 참여·표현·정보 제시 방식을 미리 고려한다. 보편적 학습 설계(UDL)는 학습자의 다양성을 전제로 참여, 정보 제시, 행동·표현의 여러 선택지를 수업 설계 단계부터 제공한다. 동일한 목표에 도달하는 경로를 다양하게 하되 학습 목표와 평가 기준 자체를 임의로 낮추는 것과는 구분한다.","한 가지 설명 방식이나 동일한 과제만으로 모든 학생이 참여하기 어렵기 때문에 접근성을 고려한 수업 설계가 필요하다.","학습자의 사전 지식과 속도, 접근성 요구는 다를 수 있다. 차별화 수업은 난이도와 지원을 조정하고, 보편적 학습 설계(UDL)는 다양한 참여·표현·정보 제시 방식을 미리 고려한다. 협력학습에서는 역할과 상호의존성을 설계한다.  보편적 학습 설계(UDL)는 학습자의 다양성을 전제로 참여, 정보 제시, 행동·표현의 여러 선택지를 수업 설계 단계부터 제공한다. 동일한 목표에 도달하는 경로를 다양하게 하되 학습 목표와 평가 기준 자체를 임의로 낮추는 것과는 구분한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["모둠에서 특정 학생이 코딩을 독점하면?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["디지털 시민성·AI 윤리·저작권","디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보, 저작권, 사이버 폭력, 허위정보, 알고리즘 편향, 생성형 AI의 책임 있는 활용을 포함한다.\n\n디지털 시민성은 디지털 환경에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 기술을 활용하는 역량이다. 개인정보 보호·저작권·정보 신뢰성 평가·사이버 폭력 예방·디지털 발자국 관리가 포함된다. AI 윤리는 공정성·설명 가능성·책임성·개인정보·안전성을 고려한다. 학습 데이터 편향은 모델 결과에 반영될 수 있고 생성형 AI는 틀린 정보를 그럴듯하게 만들 수 있으므로 교차 검증과 출처 확인이 필요하다. 학교에서는 학생 개인정보 입력 범위·저작권·평가 공정성·AI 사용 공개 기준을 정해야 한다.\n\nAI 결과를 과제에 활용할 때는 결과의 사실성·편향·저작권·개인정보·출처를 검토해야 한다. 생성형 AI가 제시한 참고문헌이나 통계는 실제 존재하지 않을 수 있으므로 원문을 확인한다. 학생의 민감정보·성적·개인 식별 정보를 외부 AI 서비스에 입력하지 않도록 데이터 처리 조건을 확인한다. 교사는 AI 사용을 숨기게 하기보다 허용 범위와 출처 표시, 학생 본인의 사고 과정 평가 기준을 명확히 해야 한다.\n\n기술을 사용할 수 있는 능력과 기술을 책임 있게 사용하는 능력을 함께 길러야 한다.\n\n추천 시스템이 특정 집단의 데이터를 적게 학습하면 일부 사용자에게 불리한 결과를 줄 수 있다는 사례로 편향과 공정성을 설명할 수 있다.\n\n디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보, 저작권, 사이버 폭력, 허위정보, 알고리즘 편향, 생성형 AI의 책임 있는 활용을 포함한다. 교육 목적이라고 모든 이용이 자동 허용되는 것은 아니며, 이용 목적·분량·시장 영향 등 저작권법상 요건과 학교의 이용 규정을 확인해야 한다. 디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보 보호, 정보 판별, 저작권, 사이버폭력 예방, 디지털 발자국, 알고리즘·AI 영향 이해를 포함해 다룬다.","기술을 사용할 수 있는 능력과 기술을 책임 있게 사용하는 능력을 함께 길러야 한다.","디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보, 저작권, 사이버 폭력, 허위정보, 알고리즘 편향, 생성형 AI의 책임 있는 활용을 포함한다.  저작권은 창작과 동시에 발생하는 저작자의 권리를 보호한다. 교육 목적이라고 모든 이용이 자동 허용되는 것은 아니며, 이용 목적·분량·시장 영향 등 저작권법상 요건과 학교의 이용 규정을 확인해야 한다. 출처 표시는 중요하지만 허락이 필요한 이용을 자동으로 합법화하지는 않는다.\n\n디지털 시민성은 온라인에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 참여하는 역량이다. 개인정보 보호, 정보 판별, 저작권, 사이버폭력 예방, 디지털 발자국, 알고리즘·AI 영향 이해를 포함해 다룬다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["생성형 AI를 과제에 활용할 때 지켜야 할 원칙은?","알고리즘 편향을 학생에게 어떻게 설명할 수 있는가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["교사의 전문성·수업 설계·성찰","교사의 전문성은 교과 내용 지식, 교수학적 내용 지식(PCK), 학습자 이해, 수업 설계와 평가, 생활지도, 디지털 윤리 및 전문성 개발을 포함한다. 수업 후 성찰은 학생 반응과 평가 결과를 바탕으로 수업을 개선하는 과정이다.\n\n수업 설계는 성취기준을 분석하고 학습 목표를 관찰 가능한 수행으로 바꾸며, 학생의 선행 지식과 오개념을 고려해 설명·활동·평가를 정렬하는 일이다. 정보 교사는 기술 변화가 빠른 분야 특성상 새로운 도구를 익히되 도구 자체보다 컴퓨터 과학의 핵심 원리와 교육적 적합성을 판단해야 한다. 수업 성찰은 학생 산출물·질문·평가 결과를 근거로 다음 수업의 구체적 개선안을 만드는 과정이다.\n\n컴퓨터교육 전공 면접에서는 전공 지식을 학생에게 어떻게 이해시키고 성장시키는지 연결해 답해야 한다.\n\n좋은 수업은 재미있는 활동만으로 판단할 수 없으며 목표·활동·평가의 정합성, 학생의 실제 학습 증거, 접근성과 안전성을 함께 고려해야 한다.\n\n교사의 전문성은 교과 내용 지식, 교수학적 내용 지식(PCK), 학습자 이해, 수업 설계와 평가, 생활지도, 디지털 윤리 및 전문성 개발을 포함한다. 수업 후 성찰은 학생 반응과 평가 결과를 바탕으로 수업을 개선하는 과정이다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다.","컴퓨터교육 전공 면접에서는 전공 지식을 학생에게 어떻게 이해시키고 성장시키는지 연결해 답해야 한다.","교사의 전문성은 교과 내용 지식, 교수학적 내용 지식(PCK), 학습자 이해, 수업 설계와 평가, 생활지도, 디지털 윤리 및 전문성 개발을 포함한다. 수업 후 성찰은 학생 반응과 평가 결과를 바탕으로 수업을 개선하는 과정이다.  수업 설계에서는 교육 목표, 학습 활동, 평가가 서로 일치해야 한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["교과 내용 지식과 교수학적 내용 지식의 차이는?","좋은 정보 수업을 어떻게 판단할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["정보 교과의 내용 체계와 핵심 아이디어","정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 영역을 통해 지식·이해, 과정·기능, 가치·태도를 함께 기르도록 구성된다. 실제 수업은 해당 학교급과 과목의 성취기준을 기준으로 설계해야 한다.\n\n정보 교과는 디지털 도구 사용을 넘어 컴퓨팅 원리를 이해하고 데이터·알고리즘·프로그래밍으로 문제를 해결하며 디지털 사회에 책임 있게 참여하는 역량을 기른다. 교육과정은 목표·내용·교수학습·평가를 연결하는 기준이다. 2022 개정 교육과정은 디지털 전환과 AI 등 사회 변화에 대응해 디지털 기초 소양, 학생 주도성, 깊이 있는 학습 등을 강조한다. 세부 성취기준은 학교급·과목별 교육과정 별책 원문으로 확인해야 한다.\n\n교육과정의 성취기준은 학생이 학습 후 보여야 할 지식·기능·태도 수준을 구체화한다. 교사는 성취기준을 분석해 수업 목표와 평가 기준을 만들고 학생의 선행 지식과 학교 환경을 고려해 학습 활동을 설계한다. 교육과정은 단원 순서를 그대로 전달하는 문서가 아니라 학교와 교사가 수업·평가를 설계할 때 기준으로 삼는 틀이다. 면접에서는 교육과정의 정확한 문구와 적용 학년·과목을 원문으로 확인해야 한다.\n\n면접에서 교육과정의 영역을 나열하는 데 그치지 않고 수업 목표와 연결할 수 있다.\n\n성취기준의 동사와 내용 요소를 분석해 관찰 가능한 학습 목표와 평가 증거로 변환한다.","면접에서 교육과정의 영역을 나열하는 데 그치지 않고 수업 목표와 연결할 수 있다.","정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 영역을 통해 지식·이해, 과정·기능, 가치·태도를 함께 기르도록 구성된다. 실제 수업은 해당 학교급과 과목의 성취기준을 기준으로 설계해야 한다.",["정보 교과의 내용 영역을 수업 사례와 연결해보세요.","성취기준을 수업 목표로 바꾸는 방법은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["백워드 설계와 목표·평가·수업 정렬","백워드 설계는 먼저 기대하는 학습 결과를 정하고, 그 성취를 보여줄 평가 증거를 설계한 다음, 학습 활동을 계획하는 방식이다. 목표·평가·교수학습 활동의 정렬이 핵심이다.\n\n형성평가는 수업 중 학습 상태를 확인해 교수·학습을 조정하고 총괄평가는 일정 기간 학습 결과를 종합한다. 수행평가는 학생이 실제 문제를 해결하거나 산출물을 만드는
