고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["갱신 이상이란?","반정규화를 적용할 때 주의할 점은?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["동시성 제어: 잠금·MVCC·격리 수준","DBMS는 동시에 실행되는 트랜잭션의 간섭을 제어하기 위해 잠금이나 다중 버전 동시성 제어(MVCC)를 사용한다. 격리 수준에 따라 더티 리드, 반복 불가능 읽기, 팬텀 리드 등의 허용 여부가 달라진다.\n\n동시에 실행되는 트랜잭션은 갱신 손실·더티 리드·반복 불가능 읽기·팬텀 읽기 등을 일으킬 수 있다. 잠금 기반 제어는 읽기·쓰기 잠금으로 충돌을 제어하며 2단계 잠금은 잠금 획득 단계와 해제 단계를 구분해 직렬 가능성을 확보하지만 교착상태가 생길 수 있다. MVCC는 데이터 여러 버전을 유지해 트랜잭션이 특정 시점의 스냅샷을 읽도록 하며 읽기와 쓰기 충돌을 줄인다. 격리 수준은 DBMS 구현에 따라 차이가 있고 강한 격리는 이상 현상을 줄이는 대신 대기·재시도 비용을 늘릴 수 있다.\n\nRead Committed는 각 문장 시작 시점의 커밋된 데이터를 읽도록 구현되는 경우가 많고 Repeatable Read는 트랜잭션 내 동일 행 재조회 결과를 안정화한다. Serializable은 동시 실행 결과가 어떤 직렬 실행과 동등하도록 강한 보장을 제공하지만 트랜잭션이 중단되어 재시도해야 할 수 있다. MVCC의 오래된 버전은 vacuum이나 가비지 컬렉션 같은 정리 작업이 필요하며 장기 트랜잭션은 오래된 버전을 오래 유지시켜 저장 공간을 늘릴 수 있다. 격리 수준의 세부 이상 현상은 DBMS별 차이를 확인해야 한다.\n\n동시에 여러 사용자가 데이터를 변경할 때 발생하는 문제를 설명할 수 있다.\n\n격리 수준이 높을수록 이상 현상을 줄일 수 있지만 잠금 대기나 재시도 등 동시성 비용이 증가할 수 있다.\n\nDBMS는 동시에 실행되는 트랜잭션의 간섭을 제어하기 위해 잠금이나 다중 버전 동시성 제어(MVCC)를 사용한다. 격리 수준에 따라 더티 리드, 반복 불가능 읽기, 팬텀 리드 등의 허용 여부가 달라진다. MVCC는 데이터의 여러 버전을 유지해 읽기 작업이 특정 시점의 일관된 스냅샷을 볼 수 있도록 하는 동시성 제어 기법이다. 읽기와 쓰기의 충돌을 줄일 수 있지만 오래된 버전 정리, 갱신 충돌, 격리 수준별 가시성 규칙을 관리해야 한다.","동시에 여러 사용자가 데이터를 변경할 때 발생하는 문제를 설명할 수 있다.","DBMS는 동시에 실행되는 트랜잭션의 간섭을 제어하기 위해 잠금이나 다중 버전 동시성 제어(MVCC)를 사용한다. 격리 수준에 따라 더티 리드, 반복 불가능 읽기, 팬텀 리드 등의 허용 여부가 달라진다.  MVCC는 데이터의 여러 버전을 유지해 읽기 작업이 특정 시점의 일관된 스냅샷을 볼 수 있도록 하는 동시성 제어 기법이다. 읽기와 쓰기의 충돌을 줄일 수 있지만 오래된 버전 정리, 갱신 충돌, 격리 수준별 가시성 규칙을 관리해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["더티 리드란?","격리 수준을 높이면 항상 좋은가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["관계형 데이터 모델과 키","관계형 데이터베이스는 데이터를 릴레이션(테이블)으로 표현한다. 기본키는 행을 유일하게 식별하고 외래키는 다른 테이블의 키를 참조해 관계와 참조 무결성을 표현한다.\n\n관계형 모델은 데이터를 릴레이션으로 표현하며 실무에서는 테이블·행·열로 부른다. 슈퍼키는 행을 유일하게 식별하고 후보키는 최소 슈퍼키다. 기본키는 후보키 중 대표로 선택하며 NULL과 중복을 허용하지 않는다. 외래키는 다른 테이블의 키를 참조해 참조 무결성을 유지한다. 관계 대수의 선택·투영·조인·합집합·차집합은 질의 의미를 표현하는 이론적 기반이다. 순수 관계 모델과 달리 SQL 테이블은 중복 행과 NULL을 허용할 수 있어 실제 SQL 동작을 별도로 이해해야 한다.\n\n기본키는 행 식별을 위한 제약이고 인덱스는 검색 성능을 위한 물리적 구조라는 점을 구분해야 한다. 기본키를 만들면 DBMS가 이를 보장하기 위한 인덱스를 자동 생성하는 경우가 많지만 기본키와 인덱스는 같은 개념이 아니다. 외래키는 참조 대상의 존재를 보장하며 삭제·갱신 시 RESTRICT, CASCADE, SET NULL 등 참조 동작을 정할 수 있다. 제약조건은 응용 프로그램의 검증만 믿지 않고 데이터베이스 차원에서 무결성을 지키는 수단이다.\n\n테이블 설계와 데이터 중복 방지, 관계 설정의 기본을 설명할 수 있다.\n\n후보키는 행을 유일하게 식별할 수 있는 최소 속성 집합이고 그중 하나를 기본키로 선택한다.","테이블 설계와 데이터 중복 방지, 관계 설정의 기본을 설명할 수 있다.","관계형 데이터베이스는 데이터를 릴레이션(테이블)으로 표현한다. 기본키는 행을 유일하게 식별하고 외래키는 다른 테이블의 키를 참조해 관계와 참조 무결성을 표현한다.  DBMS의 논리적 데이터 모델과 실제 저장·실행 방식은 구분해야 한다. SQL 결과는 선언적으로 표현되며, DBMS의 옵티마이저가 통계와 비용 모델을 바탕으로 실행 계획을 선택한다. 따라서 같은 SQL도 인덱스와 데이터 분포에 따라 성능이 달라질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["후보키와 기본키의 차이는?","외래키에 NULL을 허용할 수 있는가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["정규화와 함수적 종속성","정규화는 데이터 중복과 삽입·수정·삭제 이상을 줄이기 위해 테이블을 구조화하는 과정이다. 함수적 종속성은 한 속성 집합의 값이 다른 속성 집합의 값을 결정하는 관계이며 1·2·3정규형과 BCNF 등이 있다.\n\n정규화는 데이터 중복과 삽입·갱신·삭제 이상을 줄이기 위해 릴레이션을 분해하는 설계 과정이다. 함수 종속성 X→Y는 X 값이 같으면 Y 값도 같아야 한다는 제약이다. 1NF는 원자적 값, 2NF는 후보키 일부에만 종속되는 부분 함수 종속 제거, 3NF는 비키 속성의 이행 종속 문제를 줄이는 데 초점을 둔다. BCNF는 모든 비자명 함수 종속의 결정자가 슈퍼키가 되도록 더 강하게 요구한다. 분해 시 원래 정보를 복원할 수 있는 무손실 조인과 종속성 보존을 검토한다. 정규화가 무조건 조회 성능을 높이는 것은 아니며 실제 조회 패턴에 따라 반정규화를 고려할 수 있다.\n\n함수 종속성은 업무 규칙에서 도출해야 하며 단순히 현재 데이터 표본에서 우연히 값이 같다는 이유만으로 선언하면 안 된다. 후보키는 모든 속성을 함수적으로 결정하는 최소 집합이다. 2NF는 복합 후보키의 일부에만 종속되는 비주요 속성을 제거하고 3NF는 비주요 속성 사이의 이행 종속을 제한한다. BCNF는 결정자가 항상 슈퍼키가 되도록 한다. 분해가 무손실이어도 함수 종속성이 보존되지 않을 수 있어 두 조건을 함께 평가해야 한다.\n\n정규화가 단순히 테이블을 잘게 나누는 작업이 아니라 데이터 무결성을 위한 설계 원칙임을 설명할 수 있다.\n\n테이블 분해가 과도하면 JOIN 비용과 질의 복잡도가 증가할 수 있어 실제 시스템에서는 성능을 위해 반정규화를 고려하기도 한다.\n\n정규화는 데이터 중복과 삽입·수정·삭제 이상을 줄이기 위해 테이블을 구조화하는 과정이다. 함수적 종속성은 한 속성 집합의 값이 다른 속성 집합의 값을 결정하는 관계이며 1·2·3정규형과 BCNF 등이 있다. 정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다.","정규화가 단순히 테이블을 잘게 나누는 작업이 아니라 데이터 무결성을 위한 설계 원칙임을 설명할 수 있다.","정규화는 데이터 중복과 삽입·수정·삭제 이상을 줄이기 위해 테이블을 구조화하는 과정이다. 함수적 종속성은 한 속성 집합의 값이 다른 속성 집합의 값을 결정하는 관계이며 1·2·3정규형과 BCNF 등이 있다.  정규화는 함수 종속성을 분석해 데이터 중복과 삽입·갱신·삭제 이상을 줄이도록 릴레이션을 분해하는 과정이다. 1NF는 원자적 값, 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거, BCNF는 모든 결정자가 후보키가 되도록 하는 조건으로 설명한다. 분해 시 무손실 조인과 종속성 보존도 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정규화의 장점과 단점은?","정규화를 지나치게 하면 어떤 문제가 있는가?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["인덱스와 B+트리","인덱스는 검색 조건에 해당하는 행을 빠르게 찾기 위한 보조 자료구조다. 데이터베이스는 B+트리 등으로 범위 검색과 정렬을 효율화할 수 있지만 인덱스 유지에 저장 공간과 쓰기 비용이 든다.\n\n인덱스는 검색 키와 행 위치 또는 기본키를 별도로 관리해 테이블 전체를 읽지 않고 필요한 행을 찾도록 한다. B+트리는 내부 노드가 탐색 경로를 안내하고 리프 노드가 정렬된 키와 행 위치를 보유한다. 모든 리프가 같은 깊이에 있고 리프끼리 연결되어 범위 검색에 유리하다. 인덱스는 조회를 빠르게 할 수 있지만 저장 공간과 INSERT·UPDATE·DELETE 유지 비용이 발생한다. 복합 인덱스는 컬럼 순서가 중요하며 선두 컬럼 조건에 영향을 받는다. 실행 계획에는 인덱스 스캔·테이블 스캔·중첩 루프·해시 조인 등이 나타날 수 있고, 인덱스가 있어도 선택도가 낮으면 전체 스캔이 더 저렴할 수 있다.\n\nB+트리의 노드는 여러 키와 포인터를 저장해 트리 높이를 낮춘다. 디스크 기반 DB에서는 한 노드가 페이지 단위로 읽히므로 노드 크기와 팬아웃이 I/O 횟수에 중요하다. 범위 검색은 시작 키를 찾은 뒤 연결된 리프를 순서대로 읽어 효율적이다. 인덱스 컬럼에 함수를 적용하거나 자료형이 맞지 않아 암시적 형 변환이 발생하면 인덱스 활용이 제한될 수 있다. 인덱스 설계는 WHERE뿐 아니라 JOIN·ORDER BY·선택도와 쓰기 빈도를 함께 본다.\n\n검색 성능을 높이는 대신 데이터 변경 비용이 발생하는 이유를 설명할 수 있다.\n\n복합 인덱스는 선두 컬럼 조건이 활용 가능성에 영향을 주므로 실제 질의 패턴과 실행 계획을 보고 설계해야 한다.\n\n데이터베이스는 B+트리 등으로 범위 검색과 정렬을 효율화할 수 있지만 인덱스 유지에 저장 공간과 쓰기 비용이 든다. B+트리는 내부 노드에는 탐색 키와 자식 포인터를 두고 실제 레코드 탐색 정보는 리프 노드에 모으며 리프를 연결해 범위 검색을 효율화한다. 균형 높이가 유지되어 검색·삽입·삭제가 로그 수준으로 수행되고 디스크 페이지 단위 접근에 적합하다.","검색 성능을 높이는 대신 데이터 변경 비용이 발생하는 이유를 설명할 수 있다.","인덱스는 검색 조건에 해당하는 행을 빠르게 찾기 위한 보조 자료구조다. 데이터베이스는 B+트리 등으로 범위 검색과 정렬을 효율화할 수 있지만 인덱스 유지에 저장 공간과 쓰기 비용이 든다.  인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.\n\nB+트리는 내부 노드에는 탐색 키와 자식 포인터를 두고 실제 레코드 탐색 정보는 리프 노드에 모으며 리프를 연결해 범위 검색을 효율화한다. 균형 높이가 유지되어 검색·삽입·삭제가 로그 수준으로 수행되고 디스크 페이지 단위 접근에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["모든 컬럼에 인덱스를 만들면 좋은가?","복합 인덱스의 컬럼 순서가 중요한 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["SQL JOIN과 집계 질의","JOIN은 여러 테이블의 관련 행을 결합하는 연산이다. INNER JOIN은 일치하는 행, LEFT OUTER JOIN은 왼쪽 테이블의 모든 행과 일치 행을 반환한다. GROUP BY와 HAVING은 그룹화와 그룹 조건에 사용한다.\n\nSQL은 데이터 정의·조회·변경·권한 관리를 위한 선언적 언어다. WHERE는 행을 필터링하고 GROUP BY는 그룹별 집계를 만들며 HAVING은 집계 후 그룹을 필터링한다. INNER JOIN은 조건에 맞는 행만 결합하고 LEFT JOIN은 왼쪽 행을 모두 유지하며 오른쪽 일치가 없으면 NULL을 채운다. 1:N 조인은 왼쪽 행이 여러 번 나타날 수 있다. NULL은 3값 논리(TRUE/FALSE/UNKNOWN)를 만들기 때문에 `= NULL`이 아니라 `IS NULL`로 검사한다. 서브쿼리는 다른 질의 안에서 단일 값·집합·존재 여부를 계산한다.\n\n조인은 논리적으로 두 관계를 결합하지만 실제 실행은 중첩 루프·해시 조인·정렬 병합 조인 등으로 수행될 수 있다. 작은 테이블과 인덱스가 있는 경우 중첩 루프가 유리하고, 큰 데이터 집합을 동등 조건으로 결합할 때 해시 조인이 유리할 수 있다. LEFT JOIN 뒤 WHERE에서 오른쪽 테이블 조건을 걸면 NULL 행이 제거되어 사실상 INNER JOIN처럼 동작할 수 있으므로 조건을 ON에 둘지 WHERE에 둘지 의도를 구분한다. 집계 전에 조인으로 행이 중복되는지도 확인해야 한다.\n\n관계형 데이터에서 여러 테이블을 결합하고 요약하는 기본 질의 능력을 설명할 수 있다.\n\nLEFT JOIN한 오른쪽 테이블 컬럼을 WHERE에서 제한하면 NULL 행이 제거되어 사실상 INNER JOIN처럼 동작할 수 있다.","관계형 데이터에서 여러 테이블을 결합하고 요약하는 기본 질의 능력을 설명할 수 있다.","JOIN은 여러 테이블의 관련 행을 결합하는 연산이다. INNER JOIN은 일치하는 행, LEFT OUTER JOIN은 왼쪽 테이블의 모든 행과 일치 행을 반환한다. GROUP BY와 HAVING은 그룹화와 그룹 조건에 사용한다.  JOIN은 두 관계의 행을 결합 조건에 따라 연결한다. INNER JOIN은 양쪽에서 조건이 맞는 행만, LEFT OUTER JOIN은 왼쪽 행을 모두 유지하고 오른쪽 일치가 없으면 NULL을 채운다. 조인 조건 누락이나 다대다 관계는 예상보다 행 수가 늘어나는 원인이 된다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["WHERE와 HAVING의 차이는?","LEFT JOIN 뒤 WHERE 조건이 결과를 바꾸는 이유는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["동시성 제어와 격리 수준","동시성 제어는 여러 트랜잭션이 동시에 데이터에 접근해도 데이터의 일관성과 격리성을 유지하도록 실행 순서를 조정하는 기법이다. 잠금, 타임스탬프, 다중 버전 동시성 제어(MVCC) 등이 사용된다.\n\n동시에 실행되는 트랜잭션은 갱신 손실·더티 리드·반복 불가능 읽기·팬텀 읽기 등을 일으킬 수 있다. 잠금 기반 제어는 읽기·쓰기 잠금으로 충돌을 제어하며 2단계 잠금은 잠금 획득 단계와 해제 단계를 구분해 직렬 가능성을 확보하지만 교착상태가 생길 수 있다. MVCC는 데이터 여러 버전을 유지해 트랜잭션이 특정 시점의 스냅샷을 읽도록 하며 읽기와 쓰기 충돌을 줄인다. 격리 수준은 DBMS 구현에 따라 차이가 있고 강한 격리는 이상 현상을 줄이는 대신 대기·재시도 비용을 늘릴 수 있다.\n\n여러 사용자가 동시에 조회·수정하는 서비스에서 갱신 손실이나 일관성 오류를 방지한다.\n\n실제 서비스에서는 정확성 요구와 처리량을 함께 고려해 격리 수준을 선택하고, 교착상태와 재시도 정책도 설계한다.\n\n동시성 제어는 여러 트랜잭션이 동시에 데이터에 접근해도 데이터의 일관성과 격리성을 유지하도록 실행 순서를 조정하는 기법이다. MVCC는 데이터의 여러 버전을 유지해 읽기 작업이 특정 시점의 일관된 스냅샷을 볼 수 있도록 하는 동시성 제어 기법이다. 읽기와 쓰기의 충돌을 줄일 수 있지만 오래된 버전 정리, 갱신 충돌, 격리 수준별 가시성 규칙을 관리해야 한다.","여러 사용자가 동시에 조회·수정하는 서비스에서 갱신 손실이나 일관성 오류를 방지한다.","동시성 제어는 여러 트랜잭션이 동시에 데이터에 접근해도 데이터의 일관성과 격리성을 유지하도록 실행 순서를 조정하는 기법이다. 잠금, 타임스탬프, 다중 버전 동시성 제어(MVCC) 등이 사용된다.  MVCC는 데이터의 여러 버전을 유지해 읽기 작업이 특정 시점의 일관된 스냅샷을 볼 수 있도록 하는 동시성 제어 기법이다. 읽기와 쓰기의 충돌을 줄일 수 있지만 오래된 버전 정리, 갱신 충돌, 격리 수준별 가시성 규칙을 관리해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["격리 수준이 필요한 이유는?","MVCC는 어떤 방식으로 읽기와 쓰기 충돌을 줄입니까?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]],["B+트리 인덱스","B+트리는 데이터베이스와 파일 시스템에서 인덱스 구조로 널리 사용되는 균형 다진 탐색 트리다. 내부 노드는 탐색을 위한 키와 자식 포인터를 저장하고, 실제 레코드 위치 또는 레코드 데이터에 대한 포인터는 리프 노드에 모아 저장하는 구조가 일반적이다. 리프 노드들은 서로 연결되어 범위 검색과 순차 탐색에 유리하다.\n\n인덱스는 검색 키와 행 위치 또는 기본키를 별도로 관리해 테이블 전체를 읽지 않고 필요한 행을 찾도록 한다. B+트리는 내부 노드가 탐색 경로를 안내하고 리프 노드가 정렬된 키와 행 위치를 보유한다. 모든 리프가 같은 깊이에 있고 리프끼리 연결되어 범위 검색에 유리하다. 인덱스는 조회를 빠르게 할 수 있지만 저장 공간과 INSERT·UPDATE·DELETE 유지 비용이 발생한다. 복합 인덱스는 컬럼 순서가 중요하며 선두 컬럼 조건에 영향을 받는다. 실행 계획에는 인덱스 스캔·테이블 스캔·중첩 루프·해시 조인 등이 나타날 수 있고, 인덱스가 있어도 선택도가 낮으면 전체 스캔이 더 저렴할 수 있다.\n\nB+트리의 노드는 여러 키와 포인터를 저장해 트리 높이를 낮춘다. 디스크 기반 DB에서는 한 노드가 페이지 단위로 읽히므로 노드 크기와 팬아웃이 I/O 횟수에 중요하다. 범위 검색은 시작 키를 찾은 뒤 연결된 리프를 순서대로 읽어 효율적이다. 인덱스 컬럼에 함수를 적용하거나 자료형이 맞지 않아 암시적 형 변환이 발생하면 인덱스 활용이 제한될 수 있다. 인덱스 설계는 WHERE뿐 아니라 JOIN·ORDER BY·선택도와 쓰기 빈도를 함께 본다.\n\nB+트리는 데이터베이스와 파일 시스템에서 인덱스 구조로 널리 사용되는 균형 다진 탐색 트리다. 내부 노드는 탐색을 위한 키와 자식 포인터를 저장하고, 실제 레코드 위치 또는 레코드 데이터에 대한 포인터는 리프 노드에 모아 저장하는 구조가 일반적이다. 한 노드에 여러 키와 자식 포인터를 저장하므로 이진 탐색 트리보다 팬아웃이 크고 트리 높이가 낮다. 데이터베이스는 디스크 페이지 단위로 노드를 읽기 때문에 높이를 낮추면 디스크 I/O 횟수를 줄이는 데 도움이 된다. 검색·삽입·삭제는 트리 높이에 비례하는 O(log N) 수준이며, 삽입·삭제 시 노드 분할과 병합 또는 재분배가 일어날 수 있다. B트리는 내부 노드에도 레코드가 저장될 수 있지만, B+트리는 레코드 포인터를 리프에 집중시키고 리프를 연결하는 형태가 일반적이다. 이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다.","","B+트리는 데이터베이스와 파일 시스템에서 인덱스 구조로 널리 사용되는 균형 다진 탐색 트리다. 내부 노드는 탐색을 위한 키와 자식 포인터를 저장하고, 실제 레코드 위치 또는 레코드 데이터에 대한 포인터는 리프 노드에 모아 저장하는 구조가 일반적이다. 리프 노드들은 서로 연결되어 범위 검색과 순차 탐색에 유리하다.\n\n한 노드에 여러 키와 자식 포인터를 저장하므로 이진 탐색 트리보다 팬아웃이 크고 트리 높이가 낮다. 데이터베이스는 디스크 페이지 단위로 노드를 읽기 때문에 높이를 낮추면 디스크 I/O 횟수를 줄이는 데 도움이 된다. 검색·삽입·삭제는 트리 높이에 비례하는 O(log N) 수준이며, 삽입·삭제 시 노드 분할과 병합 또는 재분배가 일어날 수 있다.\n\nB트리는 내부 노드에도 레코드가 저장될 수 있지만, B+트리는 레코드 포인터를 리프에 집중시키고 리프를 연결하는 형태가 일반적이다. 실제 DBMS의 인덱스 세부 구현은 제품별로 차이가 있다.  이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["B+트리가 DB 인덱스에 적합한 이유는?","B트리와 B+트리의 차이는?"],"",[["PostgreSQL 공식 문서","https://www.postgresql.org/docs/current/"],["인덱스","https://www.postgresql.org/docs/current/indexes.html"],["트랜잭션 격리","https://www.postgresql.org/docs/current/transaction-iso.html"]]]]],["💻","프로그래밍 언어","문법·자료형·객체지향·실행 원리",[["변수와 자료형","변수는 값을 저장하거나 참조하는 이름이고 자료형은 값의 종류·표현 범위·허용 연산을 정의한다.\n\n변수는 프로그램에서 값을 참조하는 이름이고 자료형은 값의 종류·표현 범위·허용 연산을 정한다. 정수형·실수형·문자형·불리언형 등이 있으며 정적 타입 언어는 보통 컴파일 또는 정적 분석 시 타입을 검사하고 동적 타입 언어는 실행 중 값의 타입을 판단한다. 정적/동적 타입과 강한/약한 타입은 서로 다른 구분이다. 형 변환은 자료형을 바꾸는 과정이며 확대 변환은 정보 손실이 적고 축소 변환은 소수 부분 제거·오버플로·정밀도 손실이 생길 수 있다. 암시적 변환과 명시적 변환의 규칙은 언어마다 다르다.\n\n자료형은 값의 표현 방식뿐 아니라 연산의 의미와 오류 가능성을 정한다. 정수 오버플로 처리 방식은 언어와 타입에 따라 정의되며 C의 일부 부호 있는 정수 오버플로처럼 정의되지 않은 동작이 될 수 있다. 부동소수점은 유한 정밀도이므로 누적 합산 순서가 결과에 영향을 줄 수 있다. 타입 추론은 모든 변수 타입을 직접 쓰지 않아도 컴파일러가 문맥에서 추론하는 기능이다. 제네릭·템플릿은 타입을 매개변수화해 여러 자료형에 재사용 가능한 코드를 만든다.\n\n데이터 표현과 연산 결과, 메모리 사용 및 오류를 이해할 수 있다.\n\n정적·동적 타입 구분과 강한·약한 타입 구분은 서로 다른 기준이다.","데이터 표현과 연산 결과, 메모리 사용 및 오류를 이해할 수 있다.","변수는 값을 저장하거나 참조하는 이름이고 자료형은 값의 종류·표현 범위·허용 연산을 정의한다.  언어의 문법과 실행 의미, 런타임 구현을 구분해 설명해야 한다. 같은 문법적 기능도 언어별 타입 체계와 메모리 관리, 예외 모델에 따라 동작이 달라질 수 있으므로 특정 언어의 규칙을 모든 언어에 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정적 타입과 동적 타입 차이는?","자료형이 필요한 이유는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["조건문·반복문·함수","조건문은 조건에 따라 분기하고 반복문은 명령을 반복한다. 함수는 특정 작업을 코드 단위로 분리해 재사용하게 한다.\n\n조건문은 조건식 결과에 따라 실행 경로를 선택하고 반복문은 조건이 참인 동안 코드 블록을 반복한다. 반복문은 종료 조건에 가까워지도록 상태를 갱신해야 하며 갱신이 빠지면 무한 루프가 된다. 함수는 입력 매개변수를 받아 작업하고 필요하면 반환값을 제공하는 재사용 가능한 코드 단위다. 함수로 역할을 분리하면 중복을 줄이고 테스트가 쉬워진다. 지역 변수의 범위, 매개변수 전달, 반환값, 부작용을 이해해야 호출 순서에 따른 오류를 줄일 수 있다.\n\n함수의 입력과 출력 계약을 명확히 하면 단위 테스트가 쉬워진다. 순수 함수는 외부 상태에 의존하지 않으므로 같은 입력으로 항상 같은 결과를 확인할 수 있다. 반복문은 초기화·조건·갱신 세 요소를 확인해야 하며, 배열 인덱스가 0부터 시작하는 언어에서는 반복 종료 조건이 길이와 같아지는 순간 접근하지 않도록 주의한다. 함수 분해는 너무 작은 함수로 무조건 나누는 것이 아니라 의미 있는 책임과 변경 이유를 기준으로 결정한다.\n\n실행 흐름 제어와 코드 재사용·가독성에 중요하다.\n\n함수는 입력·출력과 역할을 명확히 설계하고 지나치게 긴 함수는 작은 책임 단위로 분리한다.","실행 흐름 제어와 코드 재사용·가독성에 중요하다.","조건문은 조건에 따라 분기하고 반복문은 명령을 반복한다. 함수는 특정 작업을 코드 단위로 분리해 재사용하게 한다.  언어의 문법과 실행 의미, 런타임 구현을 구분해 설명해야 한다. 같은 문법적 기능도 언어별 타입 체계와 메모리 관리, 예외 모델에 따라 동작이 달라질 수 있으므로 특정 언어의 규칙을 모든 언어에 일반화하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["반복문과 재귀의 차이는?","매개변수와 인자의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["객체지향 프로그래밍","객체지향은 데이터와 기능을 객체 단위로 묶어 설계한다. 대표 특징은 캡슐화·상속·다형성·추상화다.\n\n객체지향은 상태와 행위를 객체 단위로 묶고 객체 사이 협력으로 프로그램을 구성한다. 클래스는 객체를 만들기 위한 타입 정의이고 객체는 구체적인 인스턴스다. 캡슐화는 내부 상태를 보호하고 공개 메서드로 접근하게 해 불변식을 유지한다. 추상화는 중요한 역할과 계약을 드러낸다. 상속은 기존 타입을 확장하지만 부모 타입을 기대하는 코드에 자식 객체를 넣어도 올바르게 동작해야 한다. 다형성은 같은 인터페이스 호출이 실제 객체 타입에 따라 다른 구현을 실행하는 성질이며 동적 바인딩은 실행 시 구현을 결정한다. 상속을 과도하게 사용하면 결합도가 커져 조합을 대안으로 쓸 수 있다.\n\n객체지향 설계는 클래스 수를 늘리는 것보다 객체 책임과 협력 관계를 명확히 하는 것이 중요하다. 인터페이스는 구현이 제공해야 할 계약을 정의하고 추상 클래스는 공통 상태나 일부 구현을 제공할 수 있다. 다형성은 호출 코드가 구체 클래스에 의존하지 않게 해 확장성을 높인다. 상속은 강한 결합을 만들 수 있으므로 has-a 관계에는 조합을 고려한다. SOLID 원칙은 단일 책임·개방 폐쇄·리스코프 치환·인터페이스 분리·의존 역전을 통해 변경에 강한 설계를 돕는다.\n\n복잡한 시스템을 역할별로 나누고 코드 재사용과 변경 대응을 쉽게 한다.\n\n상속은 is-a 관계에 적합하고 조합은 객체가 다른 객체를 포함·사용해 기능을 구성한다.\n\n객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다.","복잡한 시스템을 역할별로 나누고 코드 재사용과 변경 대응을 쉽게 한다.","객체지향은 데이터와 기능을 객체 단위로 묶어 설계한다. 대표 특징은 캡슐화·상속·다형성·추상화다.  객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 상속을 과도하게 사용하면 결합도가 높아질 수 있다.\n\n다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다. 동적 바인딩은 실행 시점에 메서드 구현을 결정하며, 이를 통해 호출 코드를 구체 클래스에 덜 의존하게 만들 수 있다.",["캡슐화와 추상화 차이는?","상속과 조합의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["컴파일러와 인터프리터","컴파일러는 소스 코드를 다른 형태의 코드로 번역하고 인터프리터는 실행 과정에서 코드를 해석한다. 현대 언어는 두 방식을 혼합하기도 한다.\n\n컴파일러는 소스 코드를 다른 형태로 번역한다. 전형적으로 어휘 분석은 토큰을 만들고 구문 분석은 AST를 구성하며 의미 분석은 타입·이름·범위를 검사한다. 이후 중간 표현 변환·최적화·코드 생성이 이루어진다. 링커는 목적 파일과 라이브러리를 결합하고 로더는 실행에 필요한 내용을 메모리에 배치한다. 인터프리터는 실행 과정에서 코드나 중간 표현을 해석한다. 실제 언어 구현은 바이트코드와 가상 머신, JIT 컴파일을 혼합할 수 있으므로 언어 이름만으로 실행 방식을 단정하지 않는 것이 정확하다.\n\n컴파일러의 어휘 분석은 문자 흐름을 토큰으로 나누고 구문 분석은 문법에 맞는 트리 구조를 만든다. 의미 분석은 선언·타입·범위·호출 인자 등을 검사한다. 최적화는 상수 접기·죽은 코드 제거·루프 최적화 등을 수행할 수 있다. JIT는 실행 중 자주 호출되는 코드를 기계어로 변환해 성능을 높이지만 초기 컴파일 비용과 코드 캐시를 사용한다. 인터프리터와 컴파일러는 상호 배타적인 실행 모델이 아니며 많은 런타임이 둘을 혼합한다.\n\n언어 실행 과정과 성능·이식성·오류 확인 시점을 이해한다.\n\nJIT는 실행 중 자주 실행되는 코드를 기계어로 컴파일해 성능을 높이는 기법이다.\n\n컴파일러는 소스 코드를 다른 형태의 코드로 번역하고 인터프리터는 실행 과정에서 코드를 해석한다. 실제 언어 런타임은 바이트코드 인터프리터와 JIT 컴파일을 함께 사용하는 경우가 많다.","언어 실행 과정과 성능·이식성·오류 확인 시점을 이해한다.","컴파일러는 소스 코드를 다른 형태의 코드로 번역하고 인터프리터는 실행 과정에서 코드를 해석한다. 현대 언어는 두 방식을 혼합하기도 한다.  컴파일러는 소스 코드를 어휘·구문·의미 분석하고 중간 표현 또는 목적 코드로 변환한다. 최적화 단계는 실행 결과의 의미를 보존하면서 불필요한 계산과 메모리 접근을 줄인다. 컴파일과 실행이 분리되면 실행 전 오류 탐지와 배포 효율 측면의 장점이 있다.\n\n인터프리터는 프로그램을 실행하면서 명령이나 중간 표현을 해석·수행한다. 즉시 실행과 동적 기능에 유리할 수 있지만 실행 시 해석 비용이 발생한다. 실제 언어 런타임은 바이트코드 인터프리터와 JIT 컴파일을 함께 사용하는 경우가 많다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["JIT 컴파일이란?","컴파일 방식의 장점은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["예외 처리와 디버깅","예외 처리는 실행 중 오류 상황을 감지하고 대응하는 구조다. 디버깅은 오류를 재현하고 원인을 찾아 수정하는 과정이다.\n\n문법 오류는 번역 단계에서 발견되고 실행 중 예외는 파일 없음·0으로 나누기·네트워크 실패 등 실행 중 발생하며 논리 오류는 프로그램은 실행되지만 결과가 잘못되는 경우다. try/catch 또는 try/except는 예외를 처리하거나 상위 호출로 전파한다. finally나 자원 관리 구문은 성공·실패와 관계없이 파일·소켓 등을 해제한다. 예외를 무조건 잡아 무시하면 오류가 숨겨진다. 디버깅은 재현 가능한 입력을 만들고 로그·브레이크포인트·스택 추적으로 원인을 좁힌 뒤 수정 후 회귀 테스트를 하는 과정이다.\n\n예외는 호출 스택을 거슬러 전파되며 적절한 처리기가 없으면 프로그램이 비정상 종료될 수 있다. 예외를 발생시킨 함수가 복구할 수 없는 상황이라면 상위 계층에 전파하고, 파일·잠금 등 자원은 예외가 발생해도 해제해야 한다. 오류 코드는 호출자가 명시적으로 결과를 확인하도록 하지만 모든 호출 지점에서 처리하지 않으면 오류가 누락될 수 있다. 예외와 오류 반환 중 무엇을 쓸지는 언어 관례와 실패가 얼마나 예외적인지에 따라 결정한다.\n\n예상하지 못한 입력이나 외부 오류에도 프로그램이 안전하게 동작하게 한다.\n\n넓은 예외를 무시하면 장애 원인을 숨길 수 있으므로 구체적으로 처리하고 기록한다.\n\n예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다.","예상하지 못한 입력이나 외부 오류에도 프로그램이 안전하게 동작하게 한다.","예외 처리는 실행 중 오류 상황을 감지하고 대응하는 구조다. 디버깅은 오류를 재현하고 원인을 찾아 수정하는 과정이다.  예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다. 자원은 finally나 자동 자원 관리 구조로 해제해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["예외를 무조건 잡으면 안 되는 이유는?","디버깅 과정은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["컴파일·인터프리트·바이트코드","컴파일은 소스 코드를 다른 형태의 코드나 기계어로 변환하는 과정이다. 인터프리트는 실행 시 명령을 해석해 수행하는 방식이다. 많은 언어는 바이트코드와 가상 머신, JIT 컴파일을 함께 사용한다.\n\n소스 코드는 전처리·컴파일·어셈블을 거쳐 목적 파일이 되고 링커가 목적 파일과 라이브러리를 결합해 실행 파일을 만든다. 정적 링크는 라이브러리 코드를 실행 파일에 포함하고 동적 링크는 실행 시 공유 라이브러리를 연결한다. 로더는 실행 파일을 해석해 코드·데이터를 가상 주소 공간에 배치하고 스택·힙 등 실행 환경을 준비한다. 런타임 초기화 후 main 같은 진입 함수로 제어가 넘어간다. 컴파일 오류·링크 오류·로드 오류·실행 오류는 발생 단계가 다르므로 메시지를 구분해 분석해야 한다.\n\n언어의 실행 방식은 이식성, 오류 발견 시점, 실행 성능, 배포 방식에 영향을 준다.\n\nPython도 구현에 따라 바이트코드와 가상 머신을 사용하므로 단순히 인터프리터 언어라고만 외우기보다 실행 구현을 구분하는 것이 정확하다.\n\nJIT(Just-In-Time) 컴파일은 실행 중 자주 실행되는 코드 등을 기계어로 변환해 반복 실행 비용을 줄인다. 실행 프로파일에 따라 최적화할 수 있지만 초기 컴파일 비용과 메모리 사용이 발생한다.","언어의 실행 방식은 이식성, 오류 발견 시점, 실행 성능, 배포 방식에 영향을 준다.","컴파일은 소스 코드를 다른 형태의 코드나 기계어로 변환하는 과정이다. 인터프리트는 실행 시 명령을 해석해 수행하는 방식이다. 많은 언어는 바이트코드와 가상 머신, JIT 컴파일을 함께 사용한다.  JIT(Just-In-Time) 컴파일은 실행 중 자주 실행되는 코드 등을 기계어로 변환해 반복 실행 비용을 줄인다. 실행 프로파일에 따라 최적화할 수 있지만 초기 컴파일 비용과 메모리 사용이 발생한다. 워밍업 전후 성능이 다를 수 있어 벤치마크 시 주의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴파일 오류와 실행 오류의 차이는?","JIT 컴파일의 목적은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["변수·자료형·메모리와 형 변환","자료형은 값의 종류와 표현 범위, 수행 가능한 연산을 정의한다. 정수·실수·문자·논리형 외에 배열, 구조체, 객체 등의 복합 자료형이 있다. 형 변환은 서로 다른 자료형 사이의 값을 변환하는 과정이다.\n\n변수는 프로그램에서 값을 참조하는 이름이고 자료형은 값의 종류·표현 범위·허용 연산을 정한다. 정수형·실수형·문자형·불리언형 등이 있으며 정적 타입 언어는 보통 컴파일 또는 정적 분석 시 타입을 검사하고 동적 타입 언어는 실행 중 값의 타입을 판단한다. 정적/동적 타입과 강한/약한 타입은 서로 다른 구분이다. 형 변환은 자료형을 바꾸는 과정이며 확대 변환은 정보 손실이 적고 축소 변환은 소수 부분 제거·오버플로·정밀도 손실이 생길 수 있다. 암시적 변환과 명시적 변환의 규칙은 언어마다 다르다.\n\n자료형은 값의 표현 방식뿐 아니라 연산의 의미와 오류 가능성을 정한다. 정수 오버플로 처리 방식은 언어와 타입에 따라 정의되며 C의 일부 부호 있는 정수 오버플로처럼 정의되지 않은 동작이 될 수 있다. 부동소수점은 유한 정밀도이므로 누적 합산 순서가 결과에 영향을 줄 수 있다. 타입 추론은 모든 변수 타입을 직접 쓰지 않아도 컴파일러가 문맥에서 추론하는 기능이다. 제네릭·템플릿은 타입을 매개변수화해 여러 자료형에 재사용 가능한 코드를 만든다.\n\n자료형을 이해하면 메모리 사용, 연산 결과, 오버플로, 정밀도 손실을 예측할 수 있다.\n\n정적 타입 언어는 일반적으로 컴파일 또는 분석 시점에 타입 오류를 더 많이 확인할 수 있고, 동적 타입 언어는 실행 중 값의 타입을 다루는 유연성이 크다.\n\n정수·실수·문자·논리형 외에 배열, 구조체, 객체 등의 복합 자료형이 있다.","자료형을 이해하면 메모리 사용, 연산 결과, 오버플로, 정밀도 손실을 예측할 수 있다.","자료형은 값의 종류와 표현 범위, 수행 가능한 연산을 정의한다. 정수·실수·문자·논리형 외에 배열, 구조체, 객체 등의 복합 자료형이 있다. 형 변환은 서로 다른 자료형 사이의 값을 변환하는 과정이다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정적 타입과 동적 타입의 차이는?","정수 오버플로란 무엇인가?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["값 전달과 참조·포인터","함수에 인자를 전달하는 방식은 값 전달과 참조에 의한 전달 등으로 설명할 수 있다. 포인터는 메모리 주소를 저장하며 간접 참조를 가능하게 한다. 언어마다 참조 전달의 의미와 구현은 다를 수 있다.\n\n값 전달은 인자 값을 매개변수에 복사하므로 매개변수 자체 변경이 호출자 변수에 영향을 주지 않는다. 참조 전달은 호출자 변수의 별칭처럼 동작한다. 포인터는 메모리 주소를 값으로 전달하고 역참조해 해당 객체에 접근한다. 언어마다 의미가 다르다. Java는 참조값 자체를 값으로 전달하므로 함수 안에서 참조 변수를 다른 객체로 재대입해도 호출자의 참조는 바뀌지 않지만 전달받은 가변 객체의 상태를 수정하면 호출자가 그 변경을 볼 수 있다. C 포인터는 NULL·수명 종료 후 접근·범위 밖 접근에 주의해야 한다.\n\n함수 호출, 객체 공유, 메모리 접근, 부작용을 이해하는 기반이다.\n\n얕은 복사는 내부 객체의 참조를 공유할 수 있고 깊은 복사는 내부 구성 요소까지 별도로 복제하는 개념이다.\n\n함수에 인자를 전달하는 방식은 값 전달과 참조에 의한 전달 등으로 설명할 수 있다.","함수 호출, 객체 공유, 메모리 접근, 부작용을 이해하는 기반이다.","함수에 인자를 전달하는 방식은 값 전달과 참조에 의한 전달 등으로 설명할 수 있다. 포인터는 메모리 주소를 저장하며 간접 참조를 가능하게 한다. 언어마다 참조 전달의 의미와 구현은 다를 수 있다.  포인터는 메모리 주소를 값으로 보유해 해당 위치의 객체에 접근하게 한다. 동적 자료구조와 배열 순회 등에 유용하지만 잘못된 주소, 해제 후 사용, 이중 해제, 버퍼 범위 초과 등 메모리 안전성 문제가 생길 수 있다. 참조와 포인터의 의미는 언어별로 다르다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["포인터와 배열의 관계는?","얕은 복사와 깊은 복사의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["객체지향 설계 원칙","객체지향은 상태와 동작을 객체로 묶어 모델링한다. 캡슐화, 상속, 다형성, 추상화가 주요 특징이며 SOLID 원칙은 유지보수 가능한 객체지향 설계를 위한 다섯 가지 원칙을 제시한다.\n\n객체지향은 상태와 행위를 객체 단위로 묶고 객체 사이 협력으로 프로그램을 구성한다. 클래스는 객체를 만들기 위한 타입 정의이고 객체는 구체적인 인스턴스다. 캡슐화는 내부 상태를 보호하고 공개 메서드로 접근하게 해 불변식을 유지한다. 추상화는 중요한 역할과 계약을 드러낸다. 상속은 기존 타입을 확장하지만 부모 타입을 기대하는 코드에 자식 객체를 넣어도 올바르게 동작해야 한다. 다형성은 같은 인터페이스 호출이 실제 객체 타입에 따라 다른 구현을 실행하는 성질이며 동적 바인딩은 실행 시 구현을 결정한다. 상속을 과도하게 사용하면 결합도가 커져 조합을 대안으로 쓸 수 있다.\n\n객체지향 설계는 클래스 수를 늘리는 것보다 객체 책임과 협력 관계를 명확히 하는 것이 중요하다. 인터페이스는 구현이 제공해야 할 계약을 정의하고 추상 클래스는 공통 상태나 일부 구현을 제공할 수 있다. 다형성은 호출 코드가 구체 클래스에 의존하지 않게 해 확장성을 높인다. 상속은 강한 결합을 만들 수 있으므로 has-a 관계에는 조합을 고려한다. SOLID 원칙은 단일 책임·개방 폐쇄·리스코프 치환·인터페이스 분리·의존 역전을 통해 변경에 강한 설계를 돕는다.\n\n대규모 프로그램의 변경 가능성과 재사용성, 테스트 용이성을 높이는 설계 관점을 제공한다.\n\nSOLID에는 단일 책임, 개방-폐쇄, 리스코프 치환, 인터페이스 분리, 의존 역전 원칙이 포함된다.\n\n캡슐화, 상속, 다형성, 추상화가 주요 특징이며 SOLID 원칙은 유지보수 가능한 객체지향 설계를 위한 다섯 가지 원칙을 제시한다. 객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다.","대규모 프로그램의 변경 가능성과 재사용성, 테스트 용이성을 높이는 설계 관점을 제공한다.","객체지향은 상태와 동작을 객체로 묶어 모델링한다. 캡슐화, 상속, 다형성, 추상화가 주요 특징이며 SOLID 원칙은 유지보수 가능한 객체지향 설계를 위한 다섯 가지 원칙을 제시한다.  객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 상속을 과도하게 사용하면 결합도가 높아질 수 있다.\n\n다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다. 동적 바인딩은 실행 시점에 메서드 구현을 결정하며, 이를 통해 호출 코드를 구체 클래스에 덜 의존하게 만들 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["상속보다 합성을 선호한다는 말은?","다형성이 코드 유지보수에 주는 장점은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["예외 처리와 오류 관리","예외 처리는 정상적인 실행 흐름에서 벗어난 상황을 감지하고 적절히 복구하거나 전달하는 구조다. try-catch-finally, 예외 전파, 사용자 정의 예외 등이 대표적이다.\n\n문법 오류는 번역 단계에서 발견되고 실행 중 예외는 파일 없음·0으로 나누기·네트워크 실패 등 실행 중 발생하며 논리 오류는 프로그램은 실행되지만 결과가 잘못되는 경우다. try/catch 또는 try/except는 예외를 처리하거나 상위 호출로 전파한다. finally나 자원 관리 구문은 성공·실패와 관계없이 파일·소켓 등을 해제한다. 예외를 무조건 잡아 무시하면 오류가 숨겨진다. 디버깅은 재현 가능한 입력을 만들고 로그·브레이크포인트·스택 추적으로 원인을 좁힌 뒤 수정 후 회귀 테스트를 하는 과정이다.\n\n예외는 호출 스택을 거슬러 전파되며 적절한 처리기가 없으면 프로그램이 비정상 종료될 수 있다. 예외를 발생시킨 함수가 복구할 수 없는 상황이라면 상위 계층에 전파하고, 파일·잠금 등 자원은 예외가 발생해도 해제해야 한다. 오류 코드는 호출자가 명시적으로 결과를 확인하도록 하지만 모든 호출 지점에서 처리하지 않으면 오류가 누락될 수 있다. 예외와 오류 반환 중 무엇을 쓸지는 언어 관례와 실패가 얼마나 예외적인지에 따라 결정한다.\n\n오류를 무시하거나 잘못 처리하면 데이터 손실과 보안 취약점이 생길 수 있다.\n\n파일·네트워크 연결·DB 트랜잭션처럼 외부 자원은 성공·실패 여부와 관계없이 적절히 닫거나 정리해야 한다.\n\n예외 처리는 정상적인 실행 흐름에서 벗어난 상황을 감지하고 적절히 복구하거나 전달하는 구조다. try-catch-finally, 예외 전파, 사용자 정의 예외 등이 대표적이다. 예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다.","오류를 무시하거나 잘못 처리하면 데이터 손실과 보안 취약점이 생길 수 있다.","예외 처리는 정상적인 실행 흐름에서 벗어난 상황을 감지하고 적절히 복구하거나 전달하는 구조다. try-catch-finally, 예외 전파, 사용자 정의 예외 등이 대표적이다.  예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다. 자원은 finally나 자동 자원 관리 구조로 해제해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["오류 코드 반환과 예외 처리의 차이는?","finally 또는 자원 자동 해제의 역할은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["함수형 프로그래밍과 불변성","함수형 프로그래밍은 순수 함수, 불변 데이터, 고차 함수, 함수 조합 등을 활용해 상태 변경과 부작용을 줄이는 프로그래밍 패러다임이다.\n\n조건문은 조건식 결과에 따라 실행 경로를 선택하고 반복문은 조건이 참인 동안 코드 블록을 반복한다. 반복문은 종료 조건에 가까워지도록 상태를 갱신해야 하며 갱신이 빠지면 무한 루프가 된다. 함수는 입력 매개변수를 받아 작업하고 필요하면 반환값을 제공하는 재사용 가능한 코드 단위다. 함수로 역할을 분리하면 중복을 줄이고 테스트가 쉬워진다. 지역 변수의 범위, 매개변수 전달, 반환값, 부작용을 이해해야 호출 순서에 따른 오류를 줄일 수 있다.\n\n함수의 입력과 출력 계약을 명확히 하면 단위 테스트가 쉬워진다. 순수 함수는 외부 상태에 의존하지 않으므로 같은 입력으로 항상 같은 결과를 확인할 수 있다. 반복문은 초기화·조건·갱신 세 요소를 확인해야 하며, 배열 인덱스가 0부터 시작하는 언어에서는 반복 종료 조건이 길이와 같아지는 순간 접근하지 않도록 주의한다. 함수 분해는 너무 작은 함수로 무조건 나누는 것이 아니라 의미 있는 책임과 변경 이유를 기준으로 결정한다.\n\n상태 변화가 복잡한 프로그램에서 테스트와 병렬 처리의 예측 가능성을 높일 수 있다.\n\nmap, filter, reduce는 함수를 인자로 받아 컬렉션을 변환·선택·축약하는 대표적 고차 함수다.\n\n함수형 프로그래밍은 순수 함수, 불변 데이터, 고차 함수, 함수 조합 등을 활용해 상태 변경과 부작용을 줄이는 프로그래밍 패러다임이다. 함수형 프로그래밍은 순수 함수, 불변 데이터, 함수 조합을 활용해 부수 효과를 통제한다.","상태 변화가 복잡한 프로그램에서 테스트와 병렬 처리의 예측 가능성을 높일 수 있다.","함수형 프로그래밍은 순수 함수, 불변 데이터, 고차 함수, 함수 조합 등을 활용해 상태 변경과 부작용을 줄이는 프로그래밍 패러다임이다.  함수형 프로그래밍은 순수 함수, 불변 데이터, 함수 조합을 활용해 부수 효과를 통제한다. 같은 입력에 같은 출력을 내는 순수 함수는 테스트와 병렬 실행이 쉬워지지만, 입출력·상태 변경은 경계에서 명시적으로 다뤄야 한다.",["순수 함수의 조건은?","고차 함수란 무엇인가?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["컴파일·링크·로드·실행 과정","컴파일러는 소스 코드를 목적 코드나 중간 표현으로 변환한다. 링커는 여러 목적 파일과 라이브러리를 결합하고 로더는 실행 파일을 메모리에 적재해 실행을 준비한다.\n\n소스 코드는 전처리·컴파일·어셈블을 거쳐 목적 파일이 되고 링커가 목적 파일과 라이브러리를 결합해 실행 파일을 만든다. 정적 링크는 라이브러리 코드를 실행 파일에 포함하고 동적 링크는 실행 시 공유 라이브러리를 연결한다. 로더는 실행 파일을 해석해 코드·데이터를 가상 주소 공간에 배치하고 스택·힙 등 실행 환경을 준비한다. 런타임 초기화 후 main 같은 진입 함수로 제어가 넘어간다. 컴파일 오류·링크 오류·로드 오류·실행 오류는 발생 단계가 다르므로 메시지를 구분해 분석해야 한다.\n\n소스 코드가 실행 파일과 프로세스로 이어지는 과정을 단계적으로 설명할 수 있다.\n\n정적 링크는 필요한 코드가 실행 파일에 포함되고, 동적 링크는 실행 시 공유 라이브러리를 연결하는 방식이다.\n\n링커는 여러 목적 파일과 라이브러리를 결합하고 로더는 실행 파일을 메모리에 적재해 실행을 준비한다. 컴파일러는 소스 코드를 어휘·구문·의미 분석하고 중간 표현 또는 목적 코드로 변환한다. 최적화 단계는 실행 결과의 의미를 보존하면서 불필요한 계산과 메모리 접근을 줄인다. 컴파일과 실행이 분리되면 실행 전 오류 탐지와 배포 효율 측면의 장점이 있다.","소스 코드가 실행 파일과 프로세스로 이어지는 과정을 단계적으로 설명할 수 있다.","컴파일러는 소스 코드를 목적 코드나 중간 표현으로 변환한다. 링커는 여러 목적 파일과 라이브러리를 결합하고 로더는 실행 파일을 메모리에 적재해 실행을 준비한다.  컴파일러는 소스 코드를 어휘·구문·의미 분석하고 중간 표현 또는 목적 코드로 변환한다. 최적화 단계는 실행 결과의 의미를 보존하면서 불필요한 계산과 메모리 접근을 줄인다. 컴파일과 실행이 분리되면 실행 전 오류 탐지와 배포 효율 측면의 장점이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴파일 오류와 링크 오류의 차이는?","동적 라이브러리와 정적 라이브러리는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["스택·힙·정적 메모리 영역","프로그램 메모리는 일반적으로 코드, 정적 데이터, 힙, 스택 등으로 구분해 설명한다. 스택은 함수 호출과 지역 변수에, 힙은 동적 할당에 주로 사용되며 관리 방식과 수명이 다르다.\n\n코드 영역에는 실행 명령어, 정적 데이터 영역에는 전역·static 변수, 힙에는 동적 할당 객체, 스택에는 함수 호출 프레임·지역 변수·복귀 주소 등이 놓이는 것으로 설명한다. 스택은 함수 호출과 반환에 따라 자동 관리되어 빠르지만 깊은 재귀나 큰 지역 배열에서 스택 오버플로가 발생할 수 있다. 힙은 수명을 유연하게 관리하지만 메모리 누수·단편화·use-after-free 위험이 있으며 가비지 컬렉션 또는 명시적 해제가 필요하다. 이 주소 배치는 개념 모델이며 모든 OS·런타임의 실제 배치를 보장하지 않는다.\n\n스택 프레임은 함수가 호출될 때 만들어지고 반환할 때 정리되는 것이 일반적이며 재귀 호출마다 별도 프레임이 생긴다. 힙 객체는 함수가 반환된 뒤에도 다른 곳에서 참조하면 살아 있어야 하므로 자동 수명과 다를 수 있다. 수동 메모리 관리에서는 할당과 해제의 짝을 맞춰야 하고, 가비지 컬렉션은 더 이상 도달할 수 없는 객체를 회수한다. 가비지 컬렉션이 있어도 파일 핸들·소켓 같은 외부 자원은 명시적으로 닫아야 한다.\n\n메모리 누수, 스택 오버플로, 포인터 오류의 원인을 이해하는 기반이다.\n\n가비지 컬렉션 언어도 논리적으로 더 이상 필요 없는 객체를 참조하고 있으면 메모리 사용이 계속 늘 수 있다.\n\n프로그램 메모리는 일반적으로 코드, 정적 데이터, 힙, 스택 등으로 구분해 설명한다. 스택은 함수 호출과 지역 변수에, 힙은 동적 할당에 주로 사용되며 관리 방식과 수명이 다르다. 스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다.","메모리 누수, 스택 오버플로, 포인터 오류의 원인을 이해하는 기반이다.","프로그램 메모리는 일반적으로 코드, 정적 데이터, 힙, 스택 등으로 구분해 설명한다. 스택은 함수 호출과 지역 변수에, 힙은 동적 할당에 주로 사용되며 관리 방식과 수명이 다르다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.",["스택 오버플로는 왜 발생하는가?","메모리 누수와 댕글링 포인터의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["값 전달·참조 전달·포인터","값 전달은 인수의 값이 매개변수에 복사되는 방식이다. 참조 전달은 원본 변수를 직접 참조하도록 하고, 포인터는 메모리 주소를 값으로 다룬다. 언어마다 참조 의미와 구현이 다르므로 구분해야 한다.\n\n값 전달은 인자 값을 매개변수에 복사하므로 매개변수 자체 변경이 호출자 변수에 영향을 주지 않는다. 참조 전달은 호출자 변수의 별칭처럼 동작한다. 포인터는 메모리 주소를 값으로 전달하고 역참조해 해당 객체에 접근한다. 언어마다 의미가 다르다. Java는 참조값 자체를 값으로 전달하므로 함수 안에서 참조 변수를 다른 객체로 재대입해도 호출자의 참조는 바뀌지 않지만 전달받은 가변 객체의 상태를 수정하면 호출자가 그 변경을 볼 수 있다. C 포인터는 NULL·수명 종료 후 접근·범위 밖 접근에 주의해야 한다.\n\n함수 호출이 원본 데이터에 미치는 영향과 메모리 접근을 설명할 수 있다.\n\n자바는 항상 값 전달이며 객체를 가리키는 참조값이 복사되어 전달된다. 따라서 객체 내부 변경은 관찰될 수 있지만 호출자의 참조 변수 자체를 바꾸지는 못한다.\n\n참조 전달은 원본 변수를 직접 참조하도록 하고, 포인터는 메모리 주소를 값으로 다룬다.","함수 호출이 원본 데이터에 미치는 영향과 메모리 접근을 설명할 수 있다.","값 전달은 인수의 값이 매개변수에 복사되는 방식이다. 참조 전달은 원본 변수를 직접 참조하도록 하고, 포인터는 메모리 주소를 값으로 다룬다. 언어마다 참조 의미와 구현이 다르므로 구분해야 한다.  포인터는 메모리 주소를 값으로 보유해 해당 위치의 객체에 접근하게 한다. 동적 자료구조와 배열 순회 등에 유용하지만 잘못된 주소, 해제 후 사용, 이중 해제, 버퍼 범위 초과 등 메모리 안전성 문제가 생길 수 있다. 참조와 포인터의 의미는 언어별로 다르다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["포인터와 참조의 차이는?","자바는 참조 전달 언어인가?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["객체지향의 다형성·상속·캡슐화","캡슐화는 데이터와 연산을 묶고 내부 구현을 감춘다. 상속은 기존 클래스의 특성과 동작을 확장하며 다형성은 동일한 인터페이스 호출이 실제 객체 유형에 따라 다른 동작을 하게 한다.\n\n객체지향은 상태와 행위를 객체 단위로 묶고 객체 사이 협력으로 프로그램을 구성한다. 클래스는 객체를 만들기 위한 타입 정의이고 객체는 구체적인 인스턴스다. 캡슐화는 내부 상태를 보호하고 공개 메서드로 접근하게 해 불변식을 유지한다. 추상화는 중요한 역할과 계약을 드러낸다. 상속은 기존 타입을 확장하지만 부모 타입을 기대하는 코드에 자식 객체를 넣어도 올바르게 동작해야 한다. 다형성은 같은 인터페이스 호출이 실제 객체 타입에 따라 다른 구현을 실행하는 성질이며 동적 바인딩은 실행 시 구현을 결정한다. 상속을 과도하게 사용하면 결합도가 커져 조합을 대안으로 쓸 수 있다.\n\n객체지향 설계는 클래스 수를 늘리는 것보다 객체 책임과 협력 관계를 명확히 하는 것이 중요하다. 인터페이스는 구현이 제공해야 할 계약을 정의하고 추상 클래스는 공통 상태나 일부 구현을 제공할 수 있다. 다형성은 호출 코드가 구체 클래스에 의존하지 않게 해 확장성을 높인다. 상속은 강한 결합을 만들 수 있으므로 has-a 관계에는 조합을 고려한다. SOLID 원칙은 단일 책임·개방 폐쇄·리스코프 치환·인터페이스 분리·의존 역전을 통해 변경에 강한 설계를 돕는다.\n\n객체지향 설계 원리와 코드 재사용·유지보수성을 설명할 수 있다.\n\n상속 관계가 깊고 강하게 결합되면 변경 영향이 커질 수 있어 객체를 조합하는 합성이 유연할 때가 많다.\n\n상속은 기존 클래스의 특성과 동작을 확장하며 다형성은 동일한 인터페이스 호출이 실제 객체 유형에 따라 다른 동작을 하게 한다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다.","객체지향 설계 원리와 코드 재사용·유지보수성을 설명할 수 있다.","캡슐화는 데이터와 연산을 묶고 내부 구현을 감춘다. 상속은 기존 클래스의 특성과 동작을 확장하며 다형성은 동일한 인터페이스 호출이 실제 객체 유형에 따라 다른 동작을 하게 한다.  객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 상속을 과도하게 사용하면 결합도가 높아질 수 있다.\n\n다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다. 동적 바인딩은 실행 시점에 메서드 구현을 결정하며, 이를 통해 호출 코드를 구체 클래스에 덜 의존하게 만들 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["상속보다 합성을 권장하는 이유는?","오버로딩과 오버라이딩의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["예외 처리와 오류 설계","예외 처리는 정상 흐름과 다른 오류 상황을 감지하고 적절히 복구하거나 호출자에게 전달하는 구조다. 오류를 무시하거나 지나치게 넓게 잡으면 문제 원인을 숨길 수 있다.\n\n문법 오류는 번역 단계에서 발견되고 실행 중 예외는 파일 없음·0으로 나누기·네트워크 실패 등 실행 중 발생하며 논리 오류는 프로그램은 실행되지만 결과가 잘못되는 경우다. try/catch 또는 try/except는 예외를 처리하거나 상위 호출로 전파한다. finally나 자원 관리 구문은 성공·실패와 관계없이 파일·소켓 등을 해제한다. 예외를 무조건 잡아 무시하면 오류가 숨겨진다. 디버깅은 재현 가능한 입력을 만들고 로그·브레이크포인트·스택 추적으로 원인을 좁힌 뒤 수정 후 회귀 테스트를 하는 과정이다.\n\n예외는 호출 스택을 거슬러 전파되며 적절한 처리기가 없으면 프로그램이 비정상 종료될 수 있다. 예외를 발생시킨 함수가 복구할 수 없는 상황이라면 상위 계층에 전파하고, 파일·잠금 등 자원은 예외가 발생해도 해제해야 한다. 오류 코드는 호출자가 명시적으로 결과를 확인하도록 하지만 모든 호출 지점에서 처리하지 않으면 오류가 누락될 수 있다. 예외와 오류 반환 중 무엇을 쓸지는 언어 관례와 실패가 얼마나 예외적인지에 따라 결정한다.\n\n견고하고 유지보수 가능한 프로그램을 설계하는 데 필요하다.\n\n사용자에게 내부 경로·비밀번호·스택 추적 등 민감한 정보를 그대로 노출하지 않도록 해야 한다.\n\n예외 처리는 정상 흐름과 다른 오류 상황을 감지하고 적절히 복구하거나 호출자에게 전달하는 구조다. 예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다.","견고하고 유지보수 가능한 프로그램을 설계하는 데 필요하다.","예외 처리는 정상 흐름과 다른 오류 상황을 감지하고 적절히 복구하거나 호출자에게 전달하는 구조다. 오류를 무시하거나 지나치게 넓게 잡으면 문제 원인을 숨길 수 있다.  예외 처리는 정상 흐름과 오류 흐름을 분리해 복구·전파·정리 동작을 명시한다. 예외를 무조건 삼키면 오류 원인을 숨기므로 처리할 수 있는 위치에서 구체적으로 처리하고, 처리할 수 없다면 문맥을 보존해 상위 계층으로 전달한다. 자원은 finally나 자동 자원 관리 구조로 해제해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["예외와 반환 코드 방식의 차이는?","finally 블록의 목적은?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["컴파일·인터프리트·JIT 실행 방식","컴파일러는 소스 코드를 다른 형태의 코드로 변환하고 인터프리터는 프로그램을 해석해 실행한다. JIT는 실행 중 자주 사용되는 코드를 기계어로 변환해 성능을 높일 수 있다.\n\n컴파일러는 소스 코드를 다른 형태로 번역한다. 전형적으로 어휘 분석은 토큰을 만들고 구문 분석은 AST를 구성하며 의미 분석은 타입·이름·범위를 검사한다. 이후 중간 표현 변환·최적화·코드 생성이 이루어진다. 링커는 목적 파일과 라이브러리를 결합하고 로더는 실행에 필요한 내용을 메모리에 배치한다. 인터프리터는 실행 과정에서 코드나 중간 표현을 해석한다. 실제 언어 구현은 바이트코드와 가상 머신, JIT 컴파일을 혼합할 수 있으므로 언어 이름만으로 실행 방식을 단정하지 않는 것이 정확하다.\n\n컴파일러의 어휘 분석은 문자 흐름을 토큰으로 나누고 구문 분석은 문법에 맞는 트리 구조를 만든다. 의미 분석은 선언·타입·범위·호출 인자 등을 검사한다. 최적화는 상수 접기·죽은 코드 제거·루프 최적화 등을 수행할 수 있다. JIT는 실행 중 자주 호출되는 코드를 기계어로 변환해 성능을 높이지만 초기 컴파일 비용과 코드 캐시를 사용한다. 인터프리터와 컴파일러는 상호 배타적인 실행 모델이 아니며 많은 런타임이 둘을 혼합한다.\n\n프로그래밍 언어가 실제 CPU 명령으로 실행되는 과정을 설명할 수 있다.\n\n많은 언어 구현은 컴파일과 인터프리트를 혼합하므로 언어 이름만으로 실행 방식을 단정하기 어렵다.\n\n컴파일러는 소스 코드를 다른 형태의 코드로 변환하고 인터프리터는 프로그램을 해석해 실행한다. JIT는 실행 중 자주 사용되는 코드를 기계어로 변환해 성능을 높일 수 있다. 컴파일러는 소스 코드를 어휘·구문·의미 분석하고 중간 표현 또는 목적 코드로 변환한다. 최적화 단계는 실행 결과의 의미를 보존하면서 불필요한 계산과 메모리 접근을 줄인다. 컴파일과 실행이 분리되면 실행 전 오류 탐지와 배포 효율 측면의 장점이 있다. 실제 언어 런타임은 바이트코드 인터프리터와 JIT 컴파일을 함께 사용하는 경우가 많다. JIT(Just-In-Time) 컴파일은 실행 중 자주 실행되는 코드 등을 기계어로 변환해 반복 실행 비용을 줄인다. 실행 프로파일에 따라 최적화할 수 있지만 초기 컴파일 비용과 메모리 사용이 발생한다.","프로그래밍 언어가 실제 CPU 명령으로 실행되는 과정을 설명할 수 있다.","컴파일러는 소스 코드를 다른 형태의 코드로 변환하고 인터프리터는 프로그램을 해석해 실행한다. JIT는 실행 중 자주 사용되는 코드를 기계어로 변환해 성능을 높일 수 있다.  컴파일러는 소스 코드를 어휘·구문·의미 분석하고 중간 표현 또는 목적 코드로 변환한다. 최적화 단계는 실행 결과의 의미를 보존하면서 불필요한 계산과 메모리 접근을 줄인다. 컴파일과 실행이 분리되면 실행 전 오류 탐지와 배포 효율 측면의 장점이 있다.\n\n인터프리터는 프로그램을 실행하면서 명령이나 중간 표현을 해석·수행한다. 즉시 실행과 동적 기능에 유리할 수 있지만 실행 시 해석 비용이 발생한다. 실제 언어 런타임은 바이트코드 인터프리터와 JIT 컴파일을 함께 사용하는 경우가 많다.\n\nJIT(Just-In-Time) 컴파일은 실행 중 자주 실행되는 코드 등을 기계어로 변환해 반복 실행 비용을 줄인다. 실행 프로파일에 따라 최적화할 수 있지만 초기 컴파일 비용과 메모리 사용이 발생한다. 워밍업 전후 성능이 다를 수 있어 벤치마크 시 주의해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴파일 언어와 인터프리터 언어를 단순히 구분할 수 있는가?","바이트코드란?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["스택·힙·정적 영역과 메모리 수명","프로그램 메모리는 일반적으로 코드 영역, 정적·전역 데이터 영역, 스택, 힙 등으로 구분해 설명한다. 스택은 함수 호출과 지역 변수에, 힙은 동적 할당 객체에 활용된다.\n\n코드 영역에는 실행 명령어, 정적 데이터 영역에는 전역·static 변수, 힙에는 동적 할당 객체, 스택에는 함수 호출 프레임·지역 변수·복귀 주소 등이 놓이는 것으로 설명한다. 스택은 함수 호출과 반환에 따라 자동 관리되어 빠르지만 깊은 재귀나 큰 지역 배열에서 스택 오버플로가 발생할 수 있다. 힙은 수명을 유연하게 관리하지만 메모리 누수·단편화·use-after-free 위험이 있으며 가비지 컬렉션 또는 명시적 해제가 필요하다. 이 주소 배치는 개념 모델이며 모든 OS·런타임의 실제 배치를 보장하지 않는다.\n\n스택 프레임은 함수가 호출될 때 만들어지고 반환할 때 정리되는 것이 일반적이며 재귀 호출마다 별도 프레임이 생긴다. 힙 객체는 함수가 반환된 뒤에도 다른 곳에서 참조하면 살아 있어야 하므로 자동 수명과 다를 수 있다. 수동 메모리 관리에서는 할당과 해제의 짝을 맞춰야 하고, 가비지 컬렉션은 더 이상 도달할 수 없는 객체를 회수한다. 가비지 컬렉션이 있어도 파일 핸들·소켓 같은 외부 자원은 명시적으로 닫아야 한다.\n\n변수의 생명주기와 메모리 누수·스택 오버플로 등의 원인을 이해할 수 있다.\n\n가비지 컬렉션은 더 이상 도달할 수 없는 객체 등을 회수하지만 모든 메모리 사용 문제를 자동으로 해결하지는 않는다.\n\n프로그램 메모리는 일반적으로 코드 영역, 정적·전역 데이터 영역, 스택, 힙 등으로 구분해 설명한다. 스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다.","변수의 생명주기와 메모리 누수·스택 오버플로 등의 원인을 이해할 수 있다.","프로그램 메모리는 일반적으로 코드 영역, 정적·전역 데이터 영역, 스택, 힙 등으로 구분해 설명한다. 스택은 함수 호출과 지역 변수에, 힙은 동적 할당 객체에 활용된다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.",["스택 오버플로가 발생하는 대표 원인은?","가비지 컬렉션은 메모리를 언제 회수하는가?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["값 전달·참조 전달과 포인터","값 전달은 인자의 값을 복사해 전달하고 참조 전달은 호출 대상이 원본 변수에 접근하도록 전달하는 방식이다. 포인터는 메모리 주소를 값으로 다루며 언어마다 참조 의미가 다르게 정의된다.\n\n값 전달은 인자 값을 매개변수에 복사하므로 매개변수 자체 변경이 호출자 변수에 영향을 주지 않는다. 참조 전달은 호출자 변수의 별칭처럼 동작한다. 포인터는 메모리 주소를 값으로 전달하고 역참조해 해당 객체에 접근한다. 언어마다 의미가 다르다. Java는 참조값 자체를 값으로 전달하므로 함수 안에서 참조 변수를 다른 객체로 재대입해도 호출자의 참조는 바뀌지 않지만 전달받은 가변 객체의 상태를 수정하면 호출자가 그 변경을 볼 수 있다. C 포인터는 NULL·수명 종료 후 접근·범위 밖 접근에 주의해야 한다.\n\n함수 호출 시 데이터가 변경되는 범위와 메모리 접근 방식을 정확하게 설명할 수 있다.\n\n얕은 복사는 내부 참조를 공유할 수 있고 깊은 복사는 내부 객체까지 독립적으로 복제한다.","함수 호출 시 데이터가 변경되는 범위와 메모리 접근 방식을 정확하게 설명할 수 있다.","값 전달은 인자의 값을 복사해 전달하고 참조 전달은 호출 대상이 원본 변수에 접근하도록 전달하는 방식이다. 포인터는 메모리 주소를 값으로 다루며 언어마다 참조 의미가 다르게 정의된다.  포인터는 메모리 주소를 값으로 보유해 해당 위치의 객체에 접근하게 한다. 동적 자료구조와 배열 순회 등에 유용하지만 잘못된 주소, 해제 후 사용, 이중 해제, 버퍼 범위 초과 등 메모리 안전성 문제가 생길 수 있다. 참조와 포인터의 의미는 언어별로 다르다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["C의 포인터와 Java의 참조는 같은가?","얕은 복사와 깊은 복사의 차이는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["객체지향의 다형성·상속·캡슐화","캡슐화는 데이터와 동작을 묶고 내부 구현을 감추는 원칙, 상속은 기존 클래스의 특성을 확장하는 방법, 다형성은 같은 인터페이스 호출이 객체의 실제 유형에 따라 다르게 동작하는 특성이다.\n\n객체지향은 상태와 행위를 객체 단위로 묶고 객체 사이 협력으로 프로그램을 구성한다. 클래스는 객체를 만들기 위한 타입 정의이고 객체는 구체적인 인스턴스다. 캡슐화는 내부 상태를 보호하고 공개 메서드로 접근하게 해 불변식을 유지한다. 추상화는 중요한 역할과 계약을 드러낸다. 상속은 기존 타입을 확장하지만 부모 타입을 기대하는 코드에 자식 객체를 넣어도 올바르게 동작해야 한다. 다형성은 같은 인터페이스 호출이 실제 객체 타입에 따라 다른 구현을 실행하는 성질이며 동적 바인딩은 실행 시 구현을 결정한다. 상속을 과도하게 사용하면 결합도가 커져 조합을 대안으로 쓸 수 있다.\n\n객체지향 설계는 클래스 수를 늘리는 것보다 객체 책임과 협력 관계를 명확히 하는 것이 중요하다. 인터페이스는 구현이 제공해야 할 계약을 정의하고 추상 클래스는 공통 상태나 일부 구현을 제공할 수 있다. 다형성은 호출 코드가 구체 클래스에 의존하지 않게 해 확장성을 높인다. 상속은 강한 결합을 만들 수 있으므로 has-a 관계에는 조합을 고려한다. SOLID 원칙은 단일 책임·개방 폐쇄·리스코프 치환·인터페이스 분리·의존 역전을 통해 변경에 강한 설계를 돕는다.\n\n객체지향 설계가 코드 재사용과 변경 용이성에 어떤 영향을 주는지 설명할 수 있다.\n\n상속 관계가 강하게 결합되거나 계층이 복잡해질 때는 객체를 조합하는 합성이 더 유연할 수 있다.\n\n캡슐화는 데이터와 동작을 묶고 내부 구현을 감추는 원칙, 상속은 기존 클래스의 특성을 확장하는 방법, 다형성은 같은 인터페이스 호출이 객체의 실제 유형에 따라 다르게 동작하는 특성이다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다.","객체지향 설계가 코드 재사용과 변경 용이성에 어떤 영향을 주는지 설명할 수 있다.","캡슐화는 데이터와 동작을 묶고 내부 구현을 감추는 원칙, 상속은 기존 클래스의 특성을 확장하는 방법, 다형성은 같은 인터페이스 호출이 객체의 실제 유형에 따라 다르게 동작하는 특성이다.  객체지향은 상태와 행위를 객체로 묶고 객체 사이의 메시지·메서드 호출로 시스템을 구성한다. 캡슐화는 내부 상태 보호, 추상화는 핵심 특성 표현, 상속은 기존 타입의 확장, 다형성은 동일한 인터페이스에 서로 다른 구현을 대입하는 데 초점을 둔다. 상속을 과도하게 사용하면 결합도가 높아질 수 있다.\n\n다형성은 같은 타입이나 인터페이스로 호출해도 실제 객체의 구체 타입에 따라 다른 구현이 실행되는 성질이다. 동적 바인딩은 실행 시점에 메서드 구현을 결정하며, 이를 통해 호출 코드를 구체 클래스에 덜 의존하게 만들 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["오버로딩과 오버라이딩의 차이는?","상속보다 합성이 권장되는 경우는?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]],["함수 호출과 재귀 호출의 실행 구조","함수는 특정 작업을 독립된 단위로 묶어 입력을 받아 처리하고 결과를 반환할 수 있다. 재귀 함수는 자기 자신을 다시 호출하며, 각 호출의 매개변수와 지역 변수 및 복귀 주소는 호출 스택의 프레임으로 관리된다.\n\n조건문은 조건식 결과에 따라 실행 경로를 선택하고 반복문은 조건이 참인 동안 코드 블록을 반복한다. 반복문은 종료 조건에 가까워지도록 상태를 갱신해야 하며 갱신이 빠지면 무한 루프가 된다. 함수는 입력 매개변수를 받아 작업하고 필요하면 반환값을 제공하는 재사용 가능한 코드 단위다. 함수로 역할을 분리하면 중복을 줄이고 테스트가 쉬워진다. 지역 변수의 범위, 매개변수 전달, 반환값, 부작용을 이해해야 호출 순서에 따른 오류를 줄일 수 있다.\n\n함수의 입력과 출력 계약을 명확히 하면 단위 테스트가 쉬워진다. 순수 함수는 외부 상태에 의존하지 않으므로 같은 입력으로 항상 같은 결과를 확인할 수 있다. 반복문은 초기화·조건·갱신 세 요소를 확인해야 하며, 배열 인덱스가 0부터 시작하는 언어에서는 반복 종료 조건이 길이와 같아지는 순간 접근하지 않도록 주의한다. 함수 분해는 너무 작은 함수로 무조건 나누는 것이 아니라 의미 있는 책임과 변경 이유를 기준으로 결정한다.\n\n코드 재사용뿐 아니라 호출 흐름, 지역 변수의 생명주기, 스택 오버플로를 이해하는 기반이다.\n\n트리 순회처럼 문제 구조가 재귀적인 경우 재귀가 자연스럽지만 깊이가 큰 입력은 반복문과 명시적 스택이 더 안전할 수 있다.\n\n함수는 특정 작업을 독립된 단위로 묶어 입력을 받아 처리하고 결과를 반환할 수 있다. 재귀 함수는 자기 자신을 다시 호출하며, 각 호출의 매개변수와 지역 변수 및 복귀 주소는 호출 스택의 프레임으로 관리된다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다.","코드 재사용뿐 아니라 호출 흐름, 지역 변수의 생명주기, 스택 오버플로를 이해하는 기반이다.","함수는 특정 작업을 독립된 단위로 묶어 입력을 받아 처리하고 결과를 반환할 수 있다. 재귀 함수는 자기 자신을 다시 호출하며, 각 호출의 매개변수와 지역 변수 및 복귀 주소는 호출 스택의 프레임으로 관리된다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["재귀에서 종료 조건이 필요한 이유는?","재귀와 반복문은 메모리 사용에서 어떻게 다른가?"],"",[["MDN JavaScript 안내서","https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide"],["CMU CS:APP","https://csapp.cs.cmu.edu/3e/perspective.html"]]]]],["🧩","소프트웨어공학","요구사항·개발 방법론·테스트",[["소프트웨어 개발 생명주기","요구사항 분석, 설계, 구현, 테스트, 배포, 유지보수 등 소프트웨어 개발·운영의 전 과정이다.\n\nSDLC는 요구사항 분석부터 설계·구현·테스트·배포·운영·유지보수까지 소프트웨어가 만들어지고 변화하는 전 과정이다. 요구사항에서는 사용자 목표와 제약을 확인하고 설계에서는 구조와 인터페이스를 정하며 구현 후 테스트로 요구 충족을 검증한다. 생명주기는 반드시 한 번 순차적으로 끝나는 절차가 아니며 폭포수·V모델·반복 개발·나선형·애자일 등은 요구사항 안정성·위험·규제·팀 규모에 따라 선택한다. 단계별 산출물과 검증, 변경 영향 추적이 핵심이다.\n\n요구사항 누락과 품질 저하, 일정·비용 위험을 줄인다.\n\n유지보수는 오류 수정, 환경 변화 대응, 기능 개선, 예방적 구조 개선 등으로 나눌 수 있다.","요구사항 누락과 품질 저하, 일정·비용 위험을 줄인다.","요구사항 분석, 설계, 구현, 테스트, 배포, 유지보수 등 소프트웨어 개발·운영의 전 과정이다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["요구사항 분석이 중요한 이유는?","유지보수 유형은?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["폭포수와 애자일","폭포수는 단계가 순차적으로 진행되고 애자일은 짧은 주기의 반복 개발과 피드백을 중시한다.\n\n폭포수는 요구사항·설계·구현·시험·운영을 순차 진행해 산출물과 승인 기준이 명확하지만 후반 변경 비용이 크고 피드백이 늦다. 애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백과 변경을 반영한다. 스크럼은 제품 백로그에서 작업을 선택해 스프린트 동안 완료하고 리뷰에서 결과를 확인하며 회고에서 작업 방식을 개선한다. 애자일은 계획·문서를 없애는 방식이 아니라 변화에 대응하면서 가치 있는 결과를 자주 전달하는 접근이다.\n\n스크럼에서 제품 책임자는 제품 가치와 백로그 우선순위를 관리하고 스크럼 마스터는 팀이 스크럼을 이해하고 장애물을 제거하도록 돕는다. 개발자는 스프린트 목표를 달성할 실행 계획을 만든다. 스프린트 리뷰는 결과물과 이해관계자 피드백을 확인하고 회고는 협업·도구·절차를 개선한다. 스프린트는 고정된 기간이며 진행 중 범위 변경은 스프린트 목표를 위협하지 않도록 관리한다.\n\n요구사항 안정성과 변경 가능성에 따라 적절한 방법을 선택한다.\n\n스크럼은 스프린트, 제품 백로그, 계획·리뷰·회고 등을 통해 반복적으로 제품을 개선한다.\n\n폭포수는 단계가 순차적으로 진행되고 애자일은 짧은 주기의 반복 개발과 피드백을 중시한다. 애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다. 애자일은 계획이나 문서를 없애는 방식이 아니라 변화에 맞춰 계획과 협업을 지속하는 접근이다.","요구사항 안정성과 변경 가능성에 따라 적절한 방법을 선택한다.","폭포수는 단계가 순차적으로 진행되고 애자일은 짧은 주기의 반복 개발과 피드백을 중시한다.  폭포수 모델은 요구사항, 설계, 구현, 시험, 운영 단계를 순차적으로 진행하는 방식이다. 산출물과 단계별 승인 기준이 명확해 규제·계약 환경에서 관리하기 쉽지만, 후반에 요구사항 변경이 발생하면 비용이 커지고 사용자 피드백이 늦게 반영될 수 있다.\n\n애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다. 스크럼은 스프린트, 제품 백로그, 스프린트 계획·리뷰·회고 등을 사용한다. 애자일은 계획이나 문서를 없애는 방식이 아니라 변화에 맞춰 계획과 협업을 지속하는 접근이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["애자일이 모든 프로젝트에 적합한가요?","스크럼 스프린트란?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["요구사항과 UML","요구사항은 시스템이 제공해야 할 기능과 품질 조건이다. UML은 시스템 구조와 동작을 시각적으로 표현하는 모델링 언어다.\n\n기능 요구사항은 시스템이 제공해야 하는 기능과 사용자 작업을 표현하고 비기능 요구사항은 응답 시간·가용성·보안·접근성·확장성 등 품질 속성과 제약을 표현한다. '빠르게 동작해야 한다'는 모호하므로 특정 부하에서 응답시간 p95가 몇 초 이내인지처럼 측정 가능한 기준으로 구체화해야 한다. 요구사항 분석은 이해관계자 인터뷰·관찰·문서 분석으로 요구를 수집하고 충돌과 우선순위를 조정한다. 추적성은 요구가 설계·코드·테스트에 어떻게 반영되었는지 연결해 변경 영향과 누락을 확인한다.\n\n요구사항은 기능뿐 아니라 사용자의 목표·업무 규칙·법적 제약·성능·보안·운영 환경을 포함한다. 이해관계자마다 요구가 충돌할 수 있으므로 우선순위와 수용 기준을 협의한다. 사용자 스토리는 사용자 유형·필요 기능·가치를 짧게 표현하고 acceptance criteria는 완료 여부를 검증할 구체 조건을 정의한다. 요구 변경은 설계·코드·테스트·일정·비용에 미치는 영향을 분석하고 승인 이력을 남겨야 한다.\n\n개발자·사용자·기획자가 시스템 범위와 설계를 공통으로 이해한다.\n\n비기능 요구사항에는 성능·보안·사용성·가용성·확장성 등이 있다.","개발자·사용자·기획자가 시스템 범위와 설계를 공통으로 이해한다.","요구사항은 시스템이 제공해야 할 기능과 품질 조건이다. UML은 시스템 구조와 동작을 시각적으로 표현하는 모델링 언어다.  UML은 시스템의 구조와 동작을 표현하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 목표와 시스템 기능, 시퀀스 다이어그램은 객체 간 시간 순서 메시지, 활동 다이어그램은 업무 흐름을 표현한다. 다이어그램은 코드 자체가 아니라 의사소통과 설계 검토 도구다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["기능·비기능 요구사항 차이는?","클래스·시퀀스 다이어그램 차이는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 테스트","단위 테스트는 개별 모듈, 통합 테스트는 모듈 간 연결, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 관점의 요구 충족을 확인한다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 업무 요구 충족을 확인한다. 블랙박스 테스트는 내부 코드보다 요구사항의 입력·출력을 기준으로 설계한다. 동등 분할은 같은 방식으로 처리될 입력 그룹에서 대표값을 선택하고 경계값 분석은 최소·최대 경계와 주변 값을 검사한다. 화이트박스는 문장·분기·조건 커버리지를 확인한다. 커버리지가 높다고 테스트가 충분하다는 뜻은 아니며 실제 결과를 검증하는 assertion과 테스트 데이터 품질이 중요하다.\n\n테스트 케이스는 입력·사전 조건·수행 절차·기대 결과를 명확히 정의한다. 회귀 테스트는 변경으로 기존 기능이 깨지지 않았는지 확인하고 스모크 테스트는 빌드가 기본 기능을 수행할 수 있는지 빠르게 확인한다. 목(mock)은 외부 의존성을 대체해 특정 동작을 통제하고 스텁(stub)은 호출에 정해진 응답을 제공한다. 테스트 자동화는 반복 검증을 빠르게 하지만 테스트가 실제 사용자 요구를 대표하는지 지속적으로 검토해야 한다.\n\n결함을 조기에 발견하고 변경에 따른 회귀 오류를 줄인다.\n\n블랙박스는 입력·출력과 요구사항 중심, 화이트박스는 코드 구조와 내부 경로를 고려한다.\n\n단위 테스트는 개별 모듈, 통합 테스트는 모듈 간 연결, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 관점의 요구 충족을 확인한다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다.","결함을 조기에 발견하고 변경에 따른 회귀 오류를 줄인다.","단위 테스트는 개별 모듈, 통합 테스트는 모듈 간 연결, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 관점의 요구 충족을 확인한다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["블랙박스와 화이트박스 차이는?","검증과 확인 차이는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 개발 생명주기와 프로세스 모델","소프트웨어 개발은 요구사항 분석, 설계, 구현, 테스트, 배포, 유지보수 단계로 진행된다. 폭포수 모델은 단계별 순차 진행, 애자일은 짧은 반복과 피드백을 강조하며 프로토타이핑은 초기 모델을 통해 요구를 구체화한다.\n\nSDLC는 요구사항 분석부터 설계·구현·테스트·배포·운영·유지보수까지 소프트웨어가 만들어지고 변화하는 전 과정이다. 요구사항에서는 사용자 목표와 제약을 확인하고 설계에서는 구조와 인터페이스를 정하며 구현 후 테스트로 요구 충족을 검증한다. 생명주기는 반드시 한 번 순차적으로 끝나는 절차가 아니며 폭포수·V모델·반복 개발·나선형·애자일 등은 요구사항 안정성·위험·규제·팀 규모에 따라 선택한다. 단계별 산출물과 검증, 변경 영향 추적이 핵심이다.\n\n프로젝트의 불확실성, 규모, 위험, 변경 빈도에 따라 개발 프로세스를 선택해야 한다.\n\n애자일에서도 계획과 문서는 필요하며, 계획을 고정하기보다 반복적으로 검토하고 조정한다는 점이 차이다.\n\n소프트웨어 개발은 요구사항 분석, 설계, 구현, 테스트, 배포, 유지보수 단계로 진행된다. 애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다.","프로젝트의 불확실성, 규모, 위험, 변경 빈도에 따라 개발 프로세스를 선택해야 한다.","소프트웨어 개발은 요구사항 분석, 설계, 구현, 테스트, 배포, 유지보수 단계로 진행된다. 폭포수 모델은 단계별 순차 진행, 애자일은 짧은 반복과 피드백을 강조하며 프로토타이핑은 초기 모델을 통해 요구를 구체화한다.  폭포수 모델은 요구사항, 설계, 구현, 시험, 운영 단계를 순차적으로 진행하는 방식이다. 산출물과 단계별 승인 기준이 명확해 규제·계약 환경에서 관리하기 쉽지만, 후반에 요구사항 변경이 발생하면 비용이 커지고 사용자 피드백이 늦게 반영될 수 있다.\n\n애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다. 스크럼은 스프린트, 제품 백로그, 스프린트 계획·리뷰·회고 등을 사용한다. 애자일은 계획이나 문서를 없애는 방식이 아니라 변화에 맞춰 계획과 협업을 지속하는 접근이다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["애자일이 계획을 세우지 않는다는 뜻인가?","폭포수 모델이 적합한 상황은?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["요구사항 분석과 명세","요구사항은 시스템이 제공해야 할 기능적 요구사항과 성능·보안·사용성 등 품질 특성을 규정하는 비기능적 요구사항으로 나눌 수 있다. 요구사항 명세는 이해관계자와 개발팀이 합의한 기준이 된다.\n\n기능 요구사항은 시스템이 제공해야 하는 기능과 사용자 작업을 표현하고 비기능 요구사항은 응답 시간·가용성·보안·접근성·확장성 등 품질 속성과 제약을 표현한다. '빠르게 동작해야 한다'는 모호하므로 특정 부하에서 응답시간 p95가 몇 초 이내인지처럼 측정 가능한 기준으로 구체화해야 한다. 요구사항 분석은 이해관계자 인터뷰·관찰·문서 분석으로 요구를 수집하고 충돌과 우선순위를 조정한다. 추적성은 요구가 설계·코드·테스트에 어떻게 반영되었는지 연결해 변경 영향과 누락을 확인한다.\n\n요구사항은 기능뿐 아니라 사용자의 목표·업무 규칙·법적 제약·성능·보안·운영 환경을 포함한다. 이해관계자마다 요구가 충돌할 수 있으므로 우선순위와 수용 기준을 협의한다. 사용자 스토리는 사용자 유형·필요 기능·가치를 짧게 표현하고 acceptance criteria는 완료 여부를 검증할 구체 조건을 정의한다. 요구 변경은 설계·코드·테스트·일정·비용에 미치는 영향을 분석하고 승인 이력을 남겨야 한다.\n\n요구사항이 모호하면 설계·구현·테스트의 기준이 흔들리고 변경 비용이 커진다.\n\n예를 들어 빠르게 응답한다는 표현보다 정상 부하에서 95%의 요청을 2초 이내 처리한다처럼 검증 가능한 기준으로 표현한다.\n\n요구사항은 시스템이 제공해야 할 기능적 요구사항과 성능·보안·사용성 등 품질 특성을 규정하는 비기능적 요구사항으로 나눌 수 있다. 개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다.","요구사항이 모호하면 설계·구현·테스트의 기준이 흔들리고 변경 비용이 커진다.","요구사항은 시스템이 제공해야 할 기능적 요구사항과 성능·보안·사용성 등 품질 특성을 규정하는 비기능적 요구사항으로 나눌 수 있다. 요구사항 명세는 이해관계자와 개발팀이 합의한 기준이 된다.  개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["요구사항 추적성이란?","비기능적 요구사항을 측정 가능하게 작성하는 예시는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["UML과 소프트웨어 설계","UML은 시스템 구조와 동작을 시각화하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 관점 기능, 시퀀스 다이어그램은 객체 간 시간 순서 메시지를 표현한다.\n\nUML은 시스템 구조와 동작을 시각적으로 표현하는 모델링 언어다. 클래스 다이어그램은 클래스·속성·메서드·관계를 나타내고 유스케이스는 액터와 시스템 기능, 시퀀스 다이어그램은 시간에 따른 객체 메시지, 활동 다이어그램은 업무 흐름을 표현한다. 연관·일반화·의존·집합·합성 관계를 구분한다. UML은 코드 그 자체가 아니라 요구사항을 이해하고 설계 대안을 검토하며 팀 간 의사소통을 돕는 모델이다.\n\n유스케이스는 시스템 경계 밖의 액터가 달성하려는 목표를 중심으로 기능을 표현한다. 시퀀스 다이어그램은 객체의 생명선과 메시지 순서를 통해 특정 시나리오의 협력을 보여준다. 클래스 다이어그램은 정적 구조를 보여주므로 실제 실행 순서를 설명하기에는 적합하지 않다. 하나의 시스템을 모든 다이어그램으로 표현할 필요는 없고, 의사소통 목적과 설계 위험에 맞는 모델을 선택해야 한다.\n\n복잡한 시스템을 여러 관점에서 표현해 이해관계자 간 의사소통을 돕는다.\n\n다이어그램은 목적에 맞게 필요한 수준으로 작성해야 하며, 그림 자체가 설계의 정확성을 보장하지는 않는다.","복잡한 시스템을 여러 관점에서 표현해 이해관계자 간 의사소통을 돕는다.","UML은 시스템 구조와 동작을 시각화하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 관점 기능, 시퀀스 다이어그램은 객체 간 시간 순서 메시지를 표현한다.  UML은 시스템의 구조와 동작을 표현하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 목표와 시스템 기능, 시퀀스 다이어그램은 객체 간 시간 순서 메시지, 활동 다이어그램은 업무 흐름을 표현한다. 다이어그램은 코드 자체가 아니라 의사소통과 설계 검토 도구다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["클래스 다이어그램과 객체 다이어그램의 차이는?","유스케이스 다이어그램의 액터란?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 테스트와 테스트 수준","테스트는 결함을 발견하고 요구사항 충족 여부를 확인하는 활동이다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 간 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 요구 충족 여부를 확인한다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 업무 요구 충족을 확인한다. 블랙박스 테스트는 내부 코드보다 요구사항의 입력·출력을 기준으로 설계한다. 동등 분할은 같은 방식으로 처리될 입력 그룹에서 대표값을 선택하고 경계값 분석은 최소·최대 경계와 주변 값을 검사한다. 화이트박스는 문장·분기·조건 커버리지를 확인한다. 커버리지가 높다고 테스트가 충분하다는 뜻은 아니며 실제 결과를 검증하는 assertion과 테스트 데이터 품질이 중요하다.\n\n테스트 케이스는 입력·사전 조건·수행 절차·기대 결과를 명확히 정의한다. 회귀 테스트는 변경으로 기존 기능이 깨지지 않았는지 확인하고 스모크 테스트는 빌드가 기본 기능을 수행할 수 있는지 빠르게 확인한다. 목(mock)은 외부 의존성을 대체해 특정 동작을 통제하고 스텁(stub)은 호출에 정해진 응답을 제공한다. 테스트 자동화는 반복 검증을 빠르게 하지만 테스트가 실제 사용자 요구를 대표하는지 지속적으로 검토해야 한다.\n\n테스트를 개발 후 마지막 단계로만 보지 않고 전 과정에 포함해야 결함 수정 비용을 줄일 수 있다.\n\n회귀 테스트는 변경 이후 기존 기능이 깨지지 않았는지 확인하는 테스트다. 자동화 테스트와 지속적 통합 환경에서 중요하다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 간 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 요구 충족 여부를 확인한다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다.","테스트를 개발 후 마지막 단계로만 보지 않고 전 과정에 포함해야 결함 수정 비용을 줄일 수 있다.","테스트는 결함을 발견하고 요구사항 충족 여부를 확인하는 활동이다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 간 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자 요구 충족 여부를 확인한다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["화이트박스와 블랙박스 테스트의 차이는?","회귀 테스트란?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 품질과 유지보수","소프트웨어 품질은 기능 적합성, 신뢰성, 성능 효율성, 사용성, 보안성, 유지보수성, 이식성 등 다양한 특성으로 평가할 수 있다. 유지보수는 오류 수정, 환경 변화 대응, 성능 개선, 기능 확장 등을 포함한다.\n\n소프트웨어 품질은 기능 적합성·성능·호환성·사용성·신뢰성·보안성·유지보수성·이식성 등으로 평가한다. 품질 속성은 충돌할 수 있어 성능을 높이는 캐시가 데이터 일관성이나 복잡도에 영향을 줄 수 있다. 유지보수는 결함 수정, 환경 변화 대응, 기능 개선, 잠재 문제 예방 등으로 구분한다. 기술 부채는 단기 편의를 위해 선택한 설계·코드·테스트의 타협이 미래 변경 비용으로 누적되는 현상이다. 영향과 비용을 평가해 리팩터링 우선순위를 정하고 자동 테스트로 변경 위험을 낮춘다.\n\n품질 속성은 측정 가능한 시나리오로 구체화할 수 있다. 예를 들어 1,000명의 동시 사용자에서 p95 응답 시간이 2초 이내라는 성능 요구는 시험으로 검증할 수 있다. 유지보수성은 모듈 응집도·결합도·테스트 가능성·문서화에 영향을 받는다. 기술 부채는 무조건 나쁜 코드라는 뜻이 아니라 의도적으로 선택한 단기 타협과 그에 따른 미래 비용을 의미한다. 부채를 기록하고 이자 비용과 변경 위험을 근거로 상환 우선순위를 정한다.\n\n소프트웨어는 배포 이후에도 운영 환경과 요구가 변하므로 지속적인 관리가 필요하다.\n\n기술 부채는 단기 편의를 위해 선택한 설계·구현이 장기적으로 변경 비용과 위험을 증가시키는 상태를 비유한다.","소프트웨어는 배포 이후에도 운영 환경과 요구가 변하므로 지속적인 관리가 필요하다.","소프트웨어 품질은 기능 적합성, 신뢰성, 성능 효율성, 사용성, 보안성, 유지보수성, 이식성 등 다양한 특성으로 평가할 수 있다. 유지보수는 오류 수정, 환경 변화 대응, 성능 개선, 기능 확장 등을 포함한다.  개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["기술 부채란 무엇인가?","유지보수성이 중요한 이유는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["형상관리·버전관리·협업","형상관리는 소프트웨어 산출물의 변경을 식별·통제·기록하는 활동이다. Git은 분산 버전관리 시스템으로 커밋, 브랜치, 병합 등을 통해 변경 이력을 관리한다. 코드 리뷰와 이슈 추적도 협업 품질을 높인다.\n\n형상관리는 소스 코드뿐 아니라 요구사항·설계·테스트·빌드 설정 등 산출물의 변경을 식별하고 통제한다. Git은 분산 버전 관리 시스템으로 commit은 변경 스냅샷, branch는 독립 작업 흐름, merge는 분기 변경 통합을 수행한다. rebase는 커밋 기반을 옮겨 이력을 재구성한다. 충돌은 같은 부분을 서로 다르게 수정해 자동 병합할 수 없는 상황이다. 브랜치 전략·코드 리뷰·커밋 메시지·보호 브랜치는 협업 품질과 변경 추적성을 높인다.\n\n버전 관리에서 merge는 두 분기의 변경을 합치고 rebase는 커밋을 새로운 기반 위에 다시 적용해 이력을 재작성한다. 이미 공유한 커밋을 rebase하면 다른 개발자의 이력과 충돌할 수 있으므로 협업 규칙이 필요하다. 태그는 특정 커밋에 릴리스 이름을 붙이고 cherry-pick은 특정 커밋만 다른 브랜치에 적용한다. 저장소에는 빌드 결과물과 비밀키를 무분별하게 커밋하지 않도록 .gitignore와 secret scanning을 활용한다.\n\n여러 사람이 동시에 개발할 때 변경 충돌과 책임 추적 문제를 줄인다.\n\nGit은 버전관리 도구이고 GitHub는 Git 저장소 호스팅과 협업 기능을 제공하는 플랫폼이다.\n\nGit은 분산 버전관리 시스템으로 커밋, 브랜치, 병합 등을 통해 변경 이력을 관리한다.","여러 사람이 동시에 개발할 때 변경 충돌과 책임 추적 문제를 줄인다.","형상관리는 소프트웨어 산출물의 변경을 식별·통제·기록하는 활동이다. Git은 분산 버전관리 시스템으로 커밋, 브랜치, 병합 등을 통해 변경 이력을 관리한다. 코드 리뷰와 이슈 추적도 협업 품질을 높인다.  Git은 파일 변경 이력을 커밋 단위로 기록하는 분산 버전 관리 시스템이다. 브랜치로 독립 작업을 진행하고 병합으로 통합하며, 충돌은 같은 부분을 다르게 수정했을 때 사람이 의도를 확인해 해결한다. 커밋은 변경 목적이 드러나도록 작고 의미 있게 구성하는 것이 좋다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["Git과 GitHub의 차이는?","병합 충돌은 왜 발생하고 어떻게 해결하는가?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["요구사항 분석과 기능·비기능 요구사항","기능 요구사항은 시스템이 수행해야 할 기능을, 비기능 요구사항은 성능·보안·사용성·가용성·확장성 등 품질 제약을 설명한다. 요구사항은 명확하고 검증 가능하게 작성해야 한다.\n\n기능 요구사항은 시스템이 제공해야 하는 기능과 사용자 작업을 표현하고 비기능 요구사항은 응답 시간·가용성·보안·접근성·확장성 등 품질 속성과 제약을 표현한다. '빠르게 동작해야 한다'는 모호하므로 특정 부하에서 응답시간 p95가 몇 초 이내인지처럼 측정 가능한 기준으로 구체화해야 한다. 요구사항 분석은 이해관계자 인터뷰·관찰·문서 분석으로 요구를 수집하고 충돌과 우선순위를 조정한다. 추적성은 요구가 설계·코드·테스트에 어떻게 반영되었는지 연결해 변경 영향과 누락을 확인한다.\n\n요구사항은 기능뿐 아니라 사용자의 목표·업무 규칙·법적 제약·성능·보안·운영 환경을 포함한다. 이해관계자마다 요구가 충돌할 수 있으므로 우선순위와 수용 기준을 협의한다. 사용자 스토리는 사용자 유형·필요 기능·가치를 짧게 표현하고 acceptance criteria는 완료 여부를 검증할 구체 조건을 정의한다. 요구 변경은 설계·코드·테스트·일정·비용에 미치는 영향을 분석하고 승인 이력을 남겨야 한다.\n\n개발의 출발점에서 무엇을 만들고 어떤 품질을 만족할지 구분할 수 있다.\n\n요구사항 추적성은 요구사항이 설계·구현·테스트에 어떻게 반영됐는지 연결해 변경 누락을 줄이는 활동이다.\n\n기능 요구사항은 시스템이 수행해야 할 기능을, 비기능 요구사항은 성능·보안·사용성·가용성·확장성 등 품질 제약을 설명한다. 개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다.","개발의 출발점에서 무엇을 만들고 어떤 품질을 만족할지 구분할 수 있다.","기능 요구사항은 시스템이 수행해야 할 기능을, 비기능 요구사항은 성능·보안·사용성·가용성·확장성 등 품질 제약을 설명한다. 요구사항은 명확하고 검증 가능하게 작성해야 한다.  개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["비기능 요구사항을 테스트 가능한 문장으로 바꿔보세요.","요구사항 추적성이란?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["애자일·스크럼과 반복 개발","애자일은 짧은 피드백 주기와 협업을 통해 변화하는 요구에 대응하는 개발 가치와 원칙이다. 스크럼은 스프린트, 제품 백로그, 스프린트 계획·리뷰·회고 등의 구조를 제공한다.\n\n폭포수는 요구사항·설계·구현·시험·운영을 순차 진행해 산출물과 승인 기준이 명확하지만 후반 변경 비용이 크고 피드백이 늦다. 애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백과 변경을 반영한다. 스크럼은 제품 백로그에서 작업을 선택해 스프린트 동안 완료하고 리뷰에서 결과를 확인하며 회고에서 작업 방식을 개선한다. 애자일은 계획·문서를 없애는 방식이 아니라 변화에 대응하면서 가치 있는 결과를 자주 전달하는 접근이다.\n\n스크럼에서 제품 책임자는 제품 가치와 백로그 우선순위를 관리하고 스크럼 마스터는 팀이 스크럼을 이해하고 장애물을 제거하도록 돕는다. 개발자는 스프린트 목표를 달성할 실행 계획을 만든다. 스프린트 리뷰는 결과물과 이해관계자 피드백을 확인하고 회고는 협업·도구·절차를 개선한다. 스프린트는 고정된 기간이며 진행 중 범위 변경은 스프린트 목표를 위협하지 않도록 관리한다.\n\n계획 중심 개발과 반복적 개발의 차이를 설명할 수 있다.\n\n애자일에서도 필요한 문서와 품질 기준은 유지하며, 변화에 대응하는 데 필요한 수준으로 문서화를 수행한다.\n\n애자일은 짧은 피드백 주기와 협업을 통해 변화하는 요구에 대응하는 개발 가치와 원칙이다. 애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다. 애자일은 계획이나 문서를 없애는 방식이 아니라 변화에 맞춰 계획과 협업을 지속하는 접근이다.","계획 중심 개발과 반복적 개발의 차이를 설명할 수 있다.","애자일은 짧은 피드백 주기와 협업을 통해 변화하는 요구에 대응하는 개발 가치와 원칙이다. 스크럼은 스프린트, 제품 백로그, 스프린트 계획·리뷰·회고 등의 구조를 제공한다.  애자일은 짧은 반복 주기로 동작하는 소프트웨어를 만들고 고객 피드백을 반영해 요구사항 변화에 대응한다. 스크럼은 스프린트, 제품 백로그, 스프린트 계획·리뷰·회고 등을 사용한다. 애자일은 계획이나 문서를 없애는 방식이 아니라 변화에 맞춰 계획과 협업을 지속하는 접근이다.",["애자일은 문서화를 하지 않는 방법인가?","스크럼 리뷰와 회고의 차이는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["UML과 시스템 모델링","UML은 시스템의 구조와 동작을 시각적으로 표현하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 목표, 시퀀스 다이어그램은 객체 간 시간 순서 메시지를 나타낸다.\n\nUML은 시스템 구조와 동작을 시각적으로 표현하는 모델링 언어다. 클래스 다이어그램은 클래스·속성·메서드·관계를 나타내고 유스케이스는 액터와 시스템 기능, 시퀀스 다이어그램은 시간에 따른 객체 메시지, 활동 다이어그램은 업무 흐름을 표현한다. 연관·일반화·의존·집합·합성 관계를 구분한다. UML은 코드 그 자체가 아니라 요구사항을 이해하고 설계 대안을 검토하며 팀 간 의사소통을 돕는 모델이다.\n\n유스케이스는 시스템 경계 밖의 액터가 달성하려는 목표를 중심으로 기능을 표현한다. 시퀀스 다이어그램은 객체의 생명선과 메시지 순서를 통해 특정 시나리오의 협력을 보여준다. 클래스 다이어그램은 정적 구조를 보여주므로 실제 실행 순서를 설명하기에는 적합하지 않다. 하나의 시스템을 모든 다이어그램으로 표현할 필요는 없고, 의사소통 목적과 설계 위험에 맞는 모델을 선택해야 한다.\n\n복잡한 시스템을 이해관계자와 공유하고 설계를 검토하는 데 유용하다.\n\n모델은 구현을 대체하는 것이 아니라 복잡성을 줄이고 의사소통과 설계 검토를 돕는 수단이다.","복잡한 시스템을 이해관계자와 공유하고 설계를 검토하는 데 유용하다.","UML은 시스템의 구조와 동작을 시각적으로 표현하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 목표, 시퀀스 다이어그램은 객체 간 시간 순서 메시지를 나타낸다.  UML은 시스템의 구조와 동작을 표현하는 표준 모델링 언어다. 클래스 다이어그램은 정적 구조, 유스케이스 다이어그램은 사용자 목표와 시스템 기능, 시퀀스 다이어그램은 객체 간 시간 순서 메시지, 활동 다이어그램은 업무 흐름을 표현한다. 다이어그램은 코드 자체가 아니라 의사소통과 설계 검토 도구다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["클래스 다이어그램과 객체 다이어그램 차이는?","모델링을 먼저 하는 이유는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["테스트 설계: 경계값·동등 분할·커버리지","동등 분할은 입력을 같은 방식으로 처리될 것으로 예상되는 그룹으로 나누고, 경계값 분석은 오류가 자주 생기는 경계 주변을 집중 검사한다. 커버리지는 테스트가 코드나 요구사항을 얼마나 실행·검증했는지 나타낸다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 업무 요구 충족을 확인한다. 블랙박스 테스트는 내부 코드보다 요구사항의 입력·출력을 기준으로 설계한다. 동등 분할은 같은 방식으로 처리될 입력 그룹에서 대표값을 선택하고 경계값 분석은 최소·최대 경계와 주변 값을 검사한다. 화이트박스는 문장·분기·조건 커버리지를 확인한다. 커버리지가 높다고 테스트가 충분하다는 뜻은 아니며 실제 결과를 검증하는 assertion과 테스트 데이터 품질이 중요하다.\n\n테스트 케이스는 입력·사전 조건·수행 절차·기대 결과를 명확히 정의한다. 회귀 테스트는 변경으로 기존 기능이 깨지지 않았는지 확인하고 스모크 테스트는 빌드가 기본 기능을 수행할 수 있는지 빠르게 확인한다. 목(mock)은 외부 의존성을 대체해 특정 동작을 통제하고 스텁(stub)은 호출에 정해진 응답을 제공한다. 테스트 자동화는 반복 검증을 빠르게 하지만 테스트가 실제 사용자 요구를 대표하는지 지속적으로 검토해야 한다.\n\n테스트 케이스를 무작위가 아니라 근거 있게 설계할 수 있다.\n\n분기 커버리지는 조건문의 참·거짓 경로를 모두 실행했는지 확인하지만 모든 입력 조합을 검증하는 것은 아니다.\n\n동등 분할은 입력을 같은 방식으로 처리될 것으로 예상되는 그룹으로 나누고, 경계값 분석은 오류가 자주 생기는 경계 주변을 집중 검사한다. 단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 경계값 분석은 오류가 자주 발생하는 입력 범위의 경계와 그 주변 값을 집중적으로 검사한다. 동등 분할은 같은 방식으로 처리될 것으로 예상되는 입력 집합을 나누고 대표값을 선택한다. 두 기법은 테스트 케이스 수를 줄이면서 오류 발견 가능성을 높이는 블랙박스 기법이다.","테스트 케이스를 무작위가 아니라 근거 있게 설계할 수 있다.","동등 분할은 입력을 같은 방식으로 처리될 것으로 예상되는 그룹으로 나누고, 경계값 분석은 오류가 자주 생기는 경계 주변을 집중 검사한다. 커버리지는 테스트가 코드나 요구사항을 얼마나 실행·검증했는지 나타낸다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다.\n\n경계값 분석은 오류가 자주 발생하는 입력 범위의 경계와 그 주변 값을 집중적으로 검사한다. 동등 분할은 같은 방식으로 처리될 것으로 예상되는 입력 집합을 나누고 대표값을 선택한다. 두 기법은 테스트 케이스 수를 줄이면서 오류 발견 가능성을 높이는 블랙박스 기법이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["문장 길이 1~10을 허용한다면 경계값 테스트는?","문장 커버리지와 분기 커버리지 차이는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["CI/CD와 배포 자동화","지속적 통합(CI)은 변경 코드를 자주 통합하고 자동 빌드·테스트로 문제를 조기에 발견한다. 지속적 전달·배포(CD)는 검증된 변경을 배포 가능한 상태로 유지하거나 자동으로 운영 환경에 반영한다.\n\nCI는 코드를 자주 통합하고 자동 빌드·테스트를 수행해 통합 문제를 조기에 발견한다. Continuous Delivery는 승인 후 배포할 수 있는 상태를 유지하고 Continuous Deployment는 검증 통과 변경을 자동으로 운영 배포한다. 파이프라인은 빌드·정적 분석·단위/통합 테스트·보안 검사·아티팩트 생성·스테이징·운영 배포로 구성할 수 있다. 자동화는 반복 작업을 줄이지만 테스트 부실이나 비밀키 노출 위험도 자동으로 확산시킬 수 있으므로 승인·롤백·모니터링·공급망 보안이 필요하다.\n\n현대 소프트웨어 개발과 운영의 자동화 흐름을 이해할 수 있다.\n\n카나리 배포는 일부 사용자나 서버에 먼저 배포해 지표를 관찰한 뒤 범위를 확대하는 방식이다.","현대 소프트웨어 개발과 운영의 자동화 흐름을 이해할 수 있다.","지속적 통합(CI)은 변경 코드를 자주 통합하고 자동 빌드·테스트로 문제를 조기에 발견한다. 지속적 전달·배포(CD)는 검증된 변경을 배포 가능한 상태로 유지하거나 자동으로 운영 환경에 반영한다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["CI만 도입해도 배포가 자동화되는가?","롤백과 카나리 배포의 목적은?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 개발 생명주기와 개발 모델","소프트웨어 개발은 요구 분석, 설계, 구현, 테스트, 배포, 유지보수의 활동으로 이루어진다. 폭포수 모델은 단계별 진행을 강조하고 반복·점진 모델은 짧은 주기로 결과를 개선한다.\n\nSDLC는 요구사항 분석부터 설계·구현·테스트·배포·운영·유지보수까지 소프트웨어가 만들어지고 변화하는 전 과정이다. 요구사항에서는 사용자 목표와 제약을 확인하고 설계에서는 구조와 인터페이스를 정하며 구현 후 테스트로 요구 충족을 검증한다. 생명주기는 반드시 한 번 순차적으로 끝나는 절차가 아니며 폭포수·V모델·반복 개발·나선형·애자일 등은 요구사항 안정성·위험·규제·팀 규모에 따라 선택한다. 단계별 산출물과 검증, 변경 영향 추적이 핵심이다.\n\n개발 모델을 프로젝트의 요구 변경 가능성, 위험, 검증 방식에 맞춰 선택하는 관점을 설명할 수 있다.\n\n운영 환경의 변경과 보안 취약점, 사용자 요구 변화 때문에 배포 이후에도 지속적인 유지보수가 필요하다.\n\n소프트웨어 개발은 요구 분석, 설계, 구현, 테스트, 배포, 유지보수의 활동으로 이루어진다.","개발 모델을 프로젝트의 요구 변경 가능성, 위험, 검증 방식에 맞춰 선택하는 관점을 설명할 수 있다.","소프트웨어 개발은 요구 분석, 설계, 구현, 테스트, 배포, 유지보수의 활동으로 이루어진다. 폭포수 모델은 단계별 진행을 강조하고 반복·점진 모델은 짧은 주기로 결과를 개선한다.  폭포수 모델은 요구사항, 설계, 구현, 시험, 운영 단계를 순차적으로 진행하는 방식이다. 산출물과 단계별 승인 기준이 명확해 규제·계약 환경에서 관리하기 쉽지만, 후반에 요구사항 변경이 발생하면 비용이 커지고 사용자 피드백이 늦게 반영될 수 있다.\n\n단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["폭포수 모델과 애자일의 장단점은?","유지보수가 개발 생명주기에서 중요한 이유는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 품질 속성과 기술 부채","품질 속성에는 신뢰성, 성능 효율성, 보안성, 유지보수성, 사용성, 이식성 등이 있다. 기술 부채는 단기 편의를 위해 선택한 설계·구현이 장기적으로 추가 변경 비용을 만드는 상태다.\n\n소프트웨어 품질은 기능 적합성·성능·호환성·사용성·신뢰성·보안성·유지보수성·이식성 등으로 평가한다. 품질 속성은 충돌할 수 있어 성능을 높이는 캐시가 데이터 일관성이나 복잡도에 영향을 줄 수 있다. 유지보수는 결함 수정, 환경 변화 대응, 기능 개선, 잠재 문제 예방 등으로 구분한다. 기술 부채는 단기 편의를 위해 선택한 설계·코드·테스트의 타협이 미래 변경 비용으로 누적되는 현상이다. 영향과 비용을 평가해 리팩터링 우선순위를 정하고 자동 테스트로 변경 위험을 낮춘다.\n\n품질 속성은 측정 가능한 시나리오로 구체화할 수 있다. 예를 들어 1,000명의 동시 사용자에서 p95 응답 시간이 2초 이내라는 성능 요구는 시험으로 검증할 수 있다. 유지보수성은 모듈 응집도·결합도·테스트 가능성·문서화에 영향을 받는다. 기술 부채는 무조건 나쁜 코드라는 뜻이 아니라 의도적으로 선택한 단기 타협과 그에 따른 미래 비용을 의미한다. 부채를 기록하고 이자 비용과 변경 위험을 근거로 상환 우선순위를 정한다.\n\n기능이 동작하는 것만으로 좋은 소프트웨어라고 할 수 없는 이유를 설명할 수 있다.\n\n기술 부채는 의도적으로 감수할 수 있지만 규모와 위험을 파악하고 상환 시점과 우선순위를 관리해야 한다.\n\n품질 속성에는 신뢰성, 성능 효율성, 보안성, 유지보수성, 사용성, 이식성 등이 있다. 기술 부채는 단기 편의를 위해 선택한 설계·구현이 장기적으로 추가 변경 비용을 만드는 상태다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다.","기능이 동작하는 것만으로 좋은 소프트웨어라고 할 수 없는 이유를 설명할 수 있다.","품질 속성에는 신뢰성, 성능 효율성, 보안성, 유지보수성, 사용성, 이식성 등이 있다. 기술 부채는 단기 편의를 위해 선택한 설계·구현이 장기적으로 추가 변경 비용을 만드는 상태다.  개발 방법론은 프로젝트 규모, 위험, 규제, 팀 경험, 요구사항 변화 정도에 따라 선택한다. 어떤 방법론도 성공을 자동 보장하지 않으며 요구사항 추적, 품질 기준, 피드백, 변경 관리가 실제로 수행되는지가 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["비기능 요구사항을 어떻게 검증하는가?","기술 부채를 무조건 없애야 하는가?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["형상관리·버전관리와 Git 협업","형상관리는 소프트웨어 산출물의 변경을 식별·통제·추적하는 활동이다. Git은 분산 버전관리 시스템으로 커밋, 브랜치, 병합을 통해 변경 이력을 관리하고 협업을 지원한다.\n\n형상관리는 소스 코드뿐 아니라 요구사항·설계·테스트·빌드 설정 등 산출물의 변경을 식별하고 통제한다. Git은 분산 버전 관리 시스템으로 commit은 변경 스냅샷, branch는 독립 작업 흐름, merge는 분기 변경 통합을 수행한다. rebase는 커밋 기반을 옮겨 이력을 재구성한다. 충돌은 같은 부분을 서로 다르게 수정해 자동 병합할 수 없는 상황이다. 브랜치 전략·코드 리뷰·커밋 메시지·보호 브랜치는 협업 품질과 변경 추적성을 높인다.\n\n버전 관리에서 merge는 두 분기의 변경을 합치고 rebase는 커밋을 새로운 기반 위에 다시 적용해 이력을 재작성한다. 이미 공유한 커밋을 rebase하면 다른 개발자의 이력과 충돌할 수 있으므로 협업 규칙이 필요하다. 태그는 특정 커밋에 릴리스 이름을 붙이고 cherry-pick은 특정 커밋만 다른 브랜치에 적용한다. 저장소에는 빌드 결과물과 비밀키를 무분별하게 커밋하지 않도록 .gitignore와 secret scanning을 활용한다.\n\n여러 개발자가 동시에 작업할 때 변경 충돌과 추적성 문제를 관리하는 방법을 설명할 수 있다.\n\nGit은 버전관리 도구이고 GitHub는 Git 저장소를 호스팅하며 이슈·리뷰·협업 기능을 제공하는 서비스다.\n\nGit은 분산 버전관리 시스템으로 커밋, 브랜치, 병합을 통해 변경 이력을 관리하고 협업을 지원한다. Git은 파일 변경 이력을 커밋 단위로 기록하는 분산 버전 관리 시스템이다.","여러 개발자가 동시에 작업할 때 변경 충돌과 추적성 문제를 관리하는 방법을 설명할 수 있다.","형상관리는 소프트웨어 산출물의 변경을 식별·통제·추적하는 활동이다. Git은 분산 버전관리 시스템으로 커밋, 브랜치, 병합을 통해 변경 이력을 관리하고 협업을 지원한다.  Git은 파일 변경 이력을 커밋 단위로 기록하는 분산 버전 관리 시스템이다. 브랜치로 독립 작업을 진행하고 병합으로 통합하며, 충돌은 같은 부분을 다르게 수정했을 때 사람이 의도를 확인해 해결한다. 커밋은 변경 목적이 드러나도록 작고 의미 있게 구성하는 것이 좋다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["Git과 GitHub의 차이는?","병합 충돌은 왜 발생하고 어떻게 해결하는가?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]],["소프트웨어 보안 개발 생명주기","보안 개발은 요구사항 단계의 위협 모델링, 설계 단계의 보안 원칙, 구현 단계의 안전한 코딩, 테스트 단계의 취약점 점검, 운영 단계의 패치와 모니터링을 포함한다.\n\nSDLC는 요구사항 분석부터 설계·구현·테스트·배포·운영·유지보수까지 소프트웨어가 만들어지고 변화하는 전 과정이다. 요구사항에서는 사용자 목표와 제약을 확인하고 설계에서는 구조와 인터페이스를 정하며 구현 후 테스트로 요구 충족을 검증한다. 생명주기는 반드시 한 번 순차적으로 끝나는 절차가 아니며 폭포수·V모델·반복 개발·나선형·애자일 등은 요구사항 안정성·위험·규제·팀 규모에 따라 선택한다. 단계별 산출물과 검증, 변경 영향 추적이 핵심이다.\n\n보안을 개발 이후의 점검이 아니라 전 과정에 반영해야 하는 품질 속성으로 설명할 수 있다.\n\n시큐어 코딩은 취약점이 생기지 않도록 구현하는 활동이고 진단은 이미 만들어진 시스템의 약점을 찾아 검증하는 활동이다.","보안을 개발 이후의 점검이 아니라 전 과정에 반영해야 하는 품질 속성으로 설명할 수 있다.","보안 개발은 요구사항 단계의 위협 모델링, 설계 단계의 보안 원칙, 구현 단계의 안전한 코딩, 테스트 단계의 취약점 점검, 운영 단계의 패치와 모니터링을 포함한다.  단위 테스트는 작은 모듈, 통합 테스트는 모듈 사이 인터페이스, 시스템 테스트는 전체 시스템, 인수 테스트는 사용자·업무 요구 충족을 확인한다. 블랙박스는 내부 구현보다 입력·출력 명세를, 화이트박스는 코드 구조와 경로를 기준으로 테스트를 설계한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["위협 모델링은 언제 수행하는가?","시큐어 코딩과 취약점 진단의 차이는?"],"",[["ACM/IEEE CS2023 지식 영역","https://csed.acm.org/knowledge-areas/"],["OWASP Cheat Sheet Series","https://cheatsheetseries.owasp.org/"]]]]],["🛡️","정보보안","보안 원리·암호·접근통제·침해대응",[["정보보안의 CIA 3요소","기밀성은 허가된 사람만 접근, 무결성은 부당한 변경 방지, 가용성은 필요할 때 정보와 시스템을 사용할 수 있도록 하는 것이다.\n\n기밀성은 허가되지 않은 주체가 정보를 읽지 못하게 하는 성질로 암호화·접근통제가 활용된다. 무결성은 정보가 허가되지 않게 변경·삭제되지 않고 정확성과 완전성을 유지하는 성질로 해시·전자서명·변경 이력이 활용된다. 가용성은 권한 있는 사용자가 필요할 때 시스템과 정보에 접근할 수 있는 성질로 이중화·백업·장애 대응·DDoS 방어가 관련된다. 세 목표는 서로 다른 위험을 다루므로 보안 설계에서는 자산·위협·취약점·영향을 분석해 통제를 조합한다.\n\nCIA 목표는 사고의 영향을 분류하는 데 활용할 수 있다. 계정 정보가 외부로 유출되면 기밀성 침해이고, 데이터베이스 값이 변조되면 무결성 침해이며, 랜섬웨어나 DDoS로 서비스를 사용할 수 없으면 가용성 침해다. 한 사고가 여러 목표를 동시에 훼손할 수 있다. 보안 통제의 우선순위는 자산 중요도와 업무 영향, 법적 의무, 위협 가능성을 고려해 결정한다.\n\n보안 대책과 사고 영향을 평가하는 기본 기준이다.\n\n랜섬웨어는 가용성을 저해하고 정보 유출을 동반하면 기밀성에도 영향을 줄 수 있다.","보안 대책과 사고 영향을 평가하는 기본 기준이다.","기밀성은 허가된 사람만 접근, 무결성은 부당한 변경 방지, 가용성은 필요할 때 정보와 시스템을 사용할 수 있도록 하는 것이다.  기밀성은 허가되지 않은 열람 방지, 무결성은 허가되지 않은 변경·파괴 방지, 가용성은 필요할 때 시스템과 정보를 사용할 수 있도록 보장하는 목표다. 하나의 보안 대책이 세 목표 모두를 같은 수준으로 보장하지 않으므로 자산·위협·영향을 분석해 통제 수단을 조합한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["랜섬웨어는 CIA 중 무엇에 영향을 주나요?","백업이 중요한 이유는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["암호화·해시·전자서명","대칭키는 같은 비밀키로 암·복호화하고 공개키 방식은 공개키·개인키 쌍을 쓴다. 해시는 입력을 고정 길이 값으로 요약한다. 전자서명은 개인키로 서명하고 공개키로 검증한다.\n\n대칭키 암호는 같은 비밀키로 암·복호화하므로 빠르고 대량 데이터에 적합하지만 키 공유가 어렵다. 공개키 방식은 공개키·개인키 쌍을 사용해 키 합의·인증·전자서명에 활용한다. 실제 통신은 공개키 방식으로 키를 합의하고 대칭키로 데이터를 보호하는 하이브리드 방식을 사용한다. 해시는 임의 길이 입력을 고정 길이로 요약하며 복호화하는 암호화가 아니다. 비밀번호 저장은 salt와 Argon2·bcrypt 같은 전용 KDF를 사용한다. 전자서명은 개인키로 서명하고 공개키로 검증해 무결성과 서명자 인증 근거를 제공하지만 기밀성은 제공하지 않는다.\n\n암호화 알고리즘만 강하다고 시스템이 안전한 것은 아니다. 키 생성·보관·교체·폐기, 난수 품질, 모드와 nonce 관리, 인증서 검증이 함께 중요하다. AES-GCM 같은 AEAD는 기밀성과 무결성을 함께 제공하며 nonce 재사용은 치명적인 보안 문제를 일으킬 수 있다. 해시의 충돌 저항성은 서로 다른 입력이 같은 해시를 찾기 어렵다는 성질이고 비밀번호 저장은 빠른 해시가 아니라 느린 KDF를 사용해야 한다. 전자서명은 서명 대상 데이터의 무결성과 키 소유 증거를 제공하지만 개인키가 탈취되면 신뢰가 무너진다.\n\n정보 보호, 상대 인증, 변조 확인에 활용한다.\n\n전자서명의 핵심은 기밀성이 아니라 인증·무결성·부인방지이며 기밀성은 별도 암호화가 필요하다.\n\n대칭키는 같은 비밀키로 암·복호화하고 공개키 방식은 공개키·개인키 쌍을 쓴다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 전자서명은 개인키로 메시지 또는 해시값에 서명하고 공개키로 검증해 서명자 인증과 무결성, 부인 방지의 근거를 제공한다. 공개키가 실제 서명자에게 속하는지는 인증서와 PKI 등으로 연결해야 하며, 개인키 유출 시 신뢰가 무너질 수 있다.","정보 보호, 상대 인증, 변조 확인에 활용한다.","대칭키는 같은 비밀키로 암·복호화하고 공개키 방식은 공개키·개인키 쌍을 쓴다. 해시는 입력을 고정 길이 값으로 요약한다. 전자서명은 개인키로 서명하고 공개키로 검증한다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.\n\n전자서명은 개인키로 메시지 또는 해시값에 서명하고 공개키로 검증해 서명자 인증과 무결성, 부인 방지의 근거를 제공한다. 공개키가 실제 서명자에게 속하는지는 인증서와 PKI 등으로 연결해야 하며, 개인키 유출 시 신뢰가 무너질 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["암호화와 해시의 차이는?","전자서명이 기밀성을 제공하나요?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["인증·인가·접근통제","인증은 사용자가 누구인지 확인하고 인가는 인증된 사용자가 어떤 자원에 어떤 작업을 할 수 있는지 결정한다.\n\n식별은 신원을 주장하고 인증은 그 주장을 증명하며 인가는 인증된 주체의 자원 접근 권한을 결정한다. 비밀번호는 지식, 보안키는 소유, 지문은 생체 요소다. MFA는 서로 다른 종류의 요소를 결합한다. DAC는 소유자 재량, MAC은 보안 등급과 중앙 정책, RBAC는 역할, ABAC는 사용자·자원·환경 속성으로 권한을 결정한다. 최소 권한·기본 거부·직무 분리·정기 권한 검토로 과도한 권한을 줄인다.\n\n인증 이후 세션을 안전하게 관리하는 것도 중요하다. 세션 ID는 예측하기 어려워야 하고 로그인 후 재발급해 세션 고정 공격을 막으며 로그아웃·만료·권한 변경 시 무효화해야 한다. 권한 검사는 서버 측에서 매 요청마다 수행해야 하며 화면에서 버튼을 숨기는 것만으로 인가가 되지 않는다. 수평 권한 상승은 같은 권한 수준의 다른 사용자 자원에 접근하는 것이고 수직 권한 상승은 관리자 기능 등 더 높은 권한을 얻는 것이다.\n\n최소 권한 원칙으로 계정 탈취와 권한 오남용 위험을 줄인다.\n\nRBAC는 역할에 권한을 부여하고 사용자에게 역할을 할당한다. MFA는 서로 다른 유형의 인증 요소를 둘 이상 조합한다.\n\n인증은 사용자가 누구인지 확인하고 인가는 인증된 사용자가 어떤 자원에 어떤 작업을 할 수 있는지 결정한다. 인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 최소 권한 원칙에 따라 업무에 필요한 권한만 부여하고, 기본 거부·권한 분리·주기적 검토로 과도한 권한을 줄인다.","최소 권한 원칙으로 계정 탈취와 권한 오남용 위험을 줄인다.","인증은 사용자가 누구인지 확인하고 인가는 인증된 사용자가 어떤 자원에 어떤 작업을 할 수 있는지 결정한다.  인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\n인가는 인증된 주체가 어떤 자원에 어떤 작업을 수행할 수 있는지 결정한다. 최소 권한 원칙에 따라 업무에 필요한 권한만 부여하고, 기본 거부·권한 분리·주기적 검토로 과도한 권한을 줄인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인증과 인가 차이는?","MFA가 필요한 이유는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["방화벽·IDS·IPS·WAF","방화벽은 정책에 따라 트래픽을 허용·차단한다. IDS는 침입 징후를 탐지하고 IPS는 차단 기능까지 수행할 수 있다. WAF는 웹 요청을 분석해 웹 공격을 방어한다.\n\n방화벽은 IP·포트·프로토콜 또는 연결 상태를 기준으로 트래픽을 허용·차단한다. IDS는 의심스러운 트래픽·행위를 탐지해 경보하고 IPS는 탐지 결과에 따라 차단한다. 시그니처 탐지는 알려진 패턴에 강하지만 새로운 변종을 놓칠 수 있고 이상 행위 탐지는 오탐이 늘 수 있다. WAF는 HTTP 요청과 웹 애플리케이션 계층을 검사해 SQL 인젝션·XSS 등 웹 공격을 방어한다. 네트워크 방화벽과 WAF는 보호 계층과 검사 대상이 달라 대체재가 아니다.\n\n탐지 시스템은 시그니처·이상 행위·프로토콜 분석 등 여러 방식을 조합한다. 시그니처는 알려진 공격에 정확할 수 있지만 변형 공격을 놓치고, 이상 탐지는 새로운 행위를 찾을 수 있지만 정상 변동을 오탐할 수 있다. 인라인 IPS는 차단 효과가 있지만 오탐 시 정상 서비스까지 중단시킬 수 있으므로 차단 정책과 예외, 장애 시 fail-open/fail-close 동작을 설계해야 한다. SIEM은 이벤트를 수집·정규화하고 시간·계정·자산을 연결해 분석한다.\n\n네트워크 경계와 웹 서비스 등 여러 계층에서 공격을 탐지·차단한다.\n\n암호화 트래픽, 우회 경로, 오탐·미탐, 정책 관리 등도 고려해야 한다.\n\n패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. IDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. IPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다.","네트워크 경계와 웹 서비스 등 여러 계층에서 공격을 탐지·차단한다.","방화벽은 정책에 따라 트래픽을 허용·차단한다. IDS는 침입 징후를 탐지하고 IPS는 차단 기능까지 수행할 수 있다. WAF는 웹 요청을 분석해 웹 공격을 방어한다.  방화벽은 네트워크 트래픽을 정책에 따라 허용하거나 차단한다. 패킷 필터링은 주소·포트·프로토콜, 상태 기반 방화벽은 연결 상태, 차세대 방화벽은 응용 계층 식별과 추가 보안 기능을 활용할 수 있다. 방화벽 통과가 곧 내부 시스템의 안전을 뜻하지는 않는다.\n\nIDS는 네트워크나 호스트의 이벤트를 관찰해 의심 행위를 탐지하고 경보를 생성하는 시스템이다. 시그니처 기반은 알려진 패턴에 강하고 이상 행위 기반은 기준선에서 벗어난 행위를 찾지만 오탐·미탐이 생길 수 있다. 일반적인 IDS는 직접 차단보다 탐지·경보에 초점을 둔다.\n\nIPS는 탐지 결과를 바탕으로 패킷 차단, 세션 종료 등 예방 조치를 인라인으로 수행할 수 있다. 실시간 차단이 가능하지만 오탐이 정상 트래픽을 막을 수 있어 정책 튜닝, 예외 관리, 장애 시 우회 정책이 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["IDS와 IPS 차이는?","방화벽만으로 웹 공격을 모두 막을 수 있나요?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["대표 웹 취약점","SQL Injection은 입력이 SQL 구문에 영향을 주는 취약점, XSS는 공격 스크립트가 브라우저에서 실행되는 취약점, CSRF는 인증 상태를 악용해 원치 않는 요청을 보내게 하는 공격이다.\n\nSQL 인젝션은 입력값이 SQL 구문으로 해석되어 의도하지 않은 조회·변경을 수행하는 취약점이다. 문자열 결합 대신 매개변수화 쿼리를 사용해 입력과 SQL 구조를 분리한다. XSS는 공격 스크립트가 다른 사용자의 브라우저에서 실행되는 취약점이며 저장형·반사형·DOM 기반으로 구분한다. 출력 문맥에 맞는 인코딩과 안전한 DOM API, CSP가 방어 수단이다. CSRF는 인증된 사용자가 공격자가 유도한 요청을 실행하게 만드는 공격으로 CSRF 토큰·SameSite 쿠키·출처 검증 등을 조합한다.\n\n웹은 외부 입력과 인증 상태를 다루므로 안전한 입력·출력·요청 검증이 중요하다.\n\n단순 입력 필터링만으로 충분하지 않으며 서버 측 권한 검증과 다층 방어가 필요하다.\n\nSQL Injection은 입력이 SQL 구문에 영향을 주는 취약점, XSS는 공격 스크립트가 브라우저에서 실행되는 취약점, CSRF는 인증 상태를 악용해 원치 않는 요청을 보내게 하는 공격이다. XSS는 신뢰할 수 없는 입력이 브라우저에서 실행 가능한 스크립트로 해석되어 다른 사용자의 브라우저에서 실행되는 취약점이다.","웹은 외부 입력과 인증 상태를 다루므로 안전한 입력·출력·요청 검증이 중요하다.","SQL Injection은 입력이 SQL 구문에 영향을 주는 취약점, XSS는 공격 스크립트가 브라우저에서 실행되는 취약점, CSRF는 인증 상태를 악용해 원치 않는 요청을 보내게 하는 공격이다.  인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다.\n\nXSS는 신뢰할 수 없는 입력이 브라우저에서 실행 가능한 스크립트로 해석되어 다른 사용자의 브라우저에서 실행되는 취약점이다. 저장형·반사형·DOM 기반으로 구분한다. 출력 문맥에 맞는 인코딩, 안전한 DOM API, 콘텐츠 보안 정책 등을 적용하며 입력 필터만을 유일한 방어로 삼지 않는다.\n\nCSRF는 사용자가 로그인된 상태에서 공격자가 유도한 요청이 사용자의 권한으로 처리되도록 하는 공격이다. 예측 불가능한 CSRF 토큰, SameSite 쿠키, 중요 작업의 재인증과 출처 검증 등으로 방어한다. GET 요청은 상태 변경에 사용하지 않는 것이 원칙이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["SQL Injection의 근본 원인은?","XSS와 CSRF의 차이는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["보안관제와 침해사고 대응","보안관제는 보안 장비와 시스템의 로그·이벤트를 분석해 위협을 탐지하고 대응한다. 흐름은 탐지, 분석, 영향 확인, 차단·격리, 복구, 사후 분석이다.\n\n보안관제는 시스템·네트워크·보안 장비 로그를 수집·분석해 위협을 탐지하고 대응한다. 경보 하나만 보고 공격으로 단정하지 않고 자산 중요도·탐지 룰·출발지/목적지·포트·프로토콜·시간·계정·행위를 함께 본다. 이벤트 상관분석은 여러 장비의 로그를 시간·IP·계정·호스트 등으로 연결해 공격 흐름을 재구성한다. IOC는 악성 IP·도메인·해시 등 관찰 가능한 침해 단서이고 MITRE ATT&CK는 공격 전술·기술을 분류하는 지식 기반이다. 사고 대응은 준비·탐지/분석·억제·제거·복구·사후 교훈으로 이어지며 원본 로그·시간 정보·수집 경로를 보존해야 한다.\n\n보안관제 분석에서는 탐지 이벤트를 정상·오탐·의심·침해로 분류할 때 근거를 기록해야 한다. 출발지 IP가 내부 프록시나 NAT 주소인지, 목적지 서버가 실제 운영 자산인지, 포트와 프로토콜이 서비스와 일치하는지, 인증 실패 뒤 성공 로그가 이어지는지 등 맥락을 확인한다. 사고 보고에는 발생 시각, 영향 자산, 관찰 증거, 판단 근거, 조치, 잔여 위험과 후속 권고를 포함해야 한다. 경보를 닫는 것과 사고를 해결하는 것은 다르다.\n\n개별 경보만 보지 않고 여러 로그를 연계해 실제 위협 여부와 범위를 판단해야 한다.\n\n증거 보존, 시간 동기화, 영향 시스템 식별, 차단 부작용 검토, 보고 체계 준수가 중요하다.\n\n보안관제는 보안 장비와 시스템의 로그·이벤트를 분석해 위협을 탐지하고 대응한다.","개별 경보만 보지 않고 여러 로그를 연계해 실제 위협 여부와 범위를 판단해야 한다.","보안관제는 보안 장비와 시스템의 로그·이벤트를 분석해 위협을 탐지하고 대응한다. 흐름은 탐지, 분석, 영향 확인, 차단·격리, 복구, 사후 분석이다.",["오탐과 미탐의 차이는?","초동 대응에서 중요한 것은?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["정보보안의 3대 목표와 위험 관리","정보보안의 기본 목표는 기밀성, 무결성, 가용성(CIA)이다. 위험은 일반적으로 자산, 위협, 취약점, 발생 가능성, 영향도를 고려해 평가하고 통제 대책을 선택한다.\n\n위협은 손실을 일으킬 잠재 원인이고 취약점은 위협이 악용할 약점이며 위험은 발생 가능성과 영향도를 고려한 판단이다. 위험 처리는 회피·완화·이전·수용으로 나눌 수 있다. 통제는 관리적(정책·교육), 물리적(출입 통제·시설 보호), 기술적(암호화·접근통제·탐지) 조치로 구분한다. 개인정보 보호는 목적·최소 수집·이용 범위·보유 기간·파기·정보주체 권리·접근기록을 포함하며 기술 조치뿐 아니라 업무 절차와 책임 관리가 필요하다.\n\n위험 평가는 자산 가치와 위협 가능성, 취약점, 기존 통제의 효과를 고려해 우선순위를 정한다. 정성 평가는 높음·중간·낮음으로, 정량 평가는 예상 손실과 발생 빈도 등을 수치화할 수 있다. 위험 수용은 책임 있는 승인과 모니터링을 전제로 해야 하며 방치와 다르다. 정책은 책임자·적용 범위·예외·위반 대응을 명확히 하고 교육과 감사로 실제 이행 여부를 확인한다.\n\n보안은 장비를 설치하는 것만이 아니라 조직의 자산과 업무 영향을 고려해 위험을 관리하는 활동이다.\n\n강한 접근 통제로 가용성이 떨어질 수 있으므로 업무 중요도와 위험 수준에 맞는 균형이 필요하다.\n\n위험은 일반적으로 자산, 위협, 취약점, 발생 가능성, 영향도를 고려해 평가하고 통제 대책을 선택한다.","보안은 장비를 설치하는 것만이 아니라 조직의 자산과 업무 영향을 고려해 위험을 관리하는 활동이다.","정보보안의 기본 목표는 기밀성, 무결성, 가용성(CIA)이다. 위험은 일반적으로 자산, 위협, 취약점, 발생 가능성, 영향도를 고려해 평가하고 통제 대책을 선택한다.  기밀성은 허가되지 않은 열람 방지, 무결성은 허가되지 않은 변경·파괴 방지, 가용성은 필요할 때 시스템과 정보를 사용할 수 있도록 보장하는 목표다. 하나의 보안 대책이 세 목표 모두를 같은 수준으로 보장하지 않으므로 자산·위협·영향을 분석해 통제 수단을 조합한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["위협·취약점·위험의 차이는?","가용성과 보안이 충돌하는 사례는?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["대칭키·공개키·해시·전자서명","대칭키 암호는 같은 비밀키로 암·복호화해 빠르지만 키 공유가 어렵다. 공개키 암호는 공개키와 개인키 쌍을 사용한다. 해시는 임의 길이 입력을 고정 길이 값으로 변환하며, 전자서명은 개인키 서명과 공개키 검증으로 무결성과 서명자 인증을 지원한다.\n\n대칭키 암호는 같은 비밀키로 암·복호화하므로 빠르고 대량 데이터에 적합하지만 키 공유가 어렵다. 공개키 방식은 공개키·개인키 쌍을 사용해 키 합의·인증·전자서명에 활용한다. 실제 통신은 공개키 방식으로 키를 합의하고 대칭키로 데이터를 보호하는 하이브리드 방식을 사용한다. 해시는 임의 길이 입력을 고정 길이로 요약하며 복호화하는 암호화가 아니다. 비밀번호 저장은 salt와 Argon2·bcrypt 같은 전용 KDF를 사용한다. 전자서명은 개인키로 서명하고 공개키로 검증해 무결성과 서명자 인증 근거를 제공하지만 기밀성은 제공하지 않는다.\n\n암호화 알고리즘만 강하다고 시스템이 안전한 것은 아니다. 키 생성·보관·교체·폐기, 난수 품질, 모드와 nonce 관리, 인증서 검증이 함께 중요하다. AES-GCM 같은 AEAD는 기밀성과 무결성을 함께 제공하며 nonce 재사용은 치명적인 보안 문제를 일으킬 수 있다. 해시의 충돌 저항성은 서로 다른 입력이 같은 해시를 찾기 어렵다는 성질이고 비밀번호 저장은 빠른 해시가 아니라 느린 KDF를 사용해야 한다. 전자서명은 서명 대상 데이터의 무결성과 키 소유 증거를 제공하지만 개인키가 탈취되면 신뢰가 무너진다.\n\n암호화, 무결성 검증, 인증은 서로 다른 보안 목적이며 기술을 혼동하지 않아야 한다.\n\n전자서명은 기본적으로 서명자 인증과 무결성, 부인방지에 활용되며 내용 자체를 숨기려면 별도의 암호화가 필요하다.\n\n해시는 임의 길이 입력을 고정 길이 값으로 변환하며, 전자서명은 개인키 서명과 공개키 검증으로 무결성과 서명자 인증을 지원한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 전자서명은 개인키로 메시지 또는 해시값에 서명하고 공개키로 검증해 서명자 인증과 무결성, 부인 방지의 근거를 제공한다. 공개키가 실제 서명자에게 속하는지는 인증서와 PKI 등으로 연결해야 하며, 개인키 유출 시 신뢰가 무너질 수 있다.","암호화, 무결성 검증, 인증은 서로 다른 보안 목적이며 기술을 혼동하지 않아야 한다.","대칭키 암호는 같은 비밀키로 암·복호화해 빠르지만 키 공유가 어렵다. 공개키 암호는 공개키와 개인키 쌍을 사용한다. 해시는 임의 길이 입력을 고정 길이 값으로 변환하며, 전자서명은 개인키 서명과 공개키 검증으로 무결성과 서명자 인증을 지원한다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.\n\n전자서명은 개인키로 메시지 또는 해시값에 서명하고 공개키로 검증해 서명자 인증과 무결성, 부인 방지의 근거를 제공한다. 공개키가 실제 서명자에게 속하는지는 인증서와 PKI 등으로 연결해야 하며, 개인키 유출 시 신뢰가 무너질 수 있다.\n\n인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시와 암호화의 차이는?","전자서명이 기밀성도 제공하는가?"],"",[["NIST 정보보안 용어집","https://csrc.nist.gov/glossary/term/information_security"],["OWASP Top Ten·Cheat Sheets","https://cheatsheetseries.owasp.org/IndexTopTen"]]],["인증·인가·접근통제 모델","인증은 사용자의 신원을 확인하고 인가는 확인된 주체가 수행할 수 있는 작업을 결정한다. 접근통제 모델에는 DAC, MAC, RBAC, ABAC 등이 있으며 최소 권한 원칙과 직무 분리가 중요하다.\n\n식별은 신원을 주장하고 인증은 그 주장을 증명하며 인가는 인증된 주체의 자원 접근 권한을 결정한다. 비밀번호는 지식, 보안키는 소유, 지문은 생체 요소다. MFA는 서로 다른 종류의 요소를 결합한다. DAC는 소유자 재량, MAC은 보안 등급과 중앙 정책, RBAC는 역할, ABAC는 사용자·자원·환경 속성으로 권한을 결정한다. 최소 권한·기본 거부·직무 분리·정기 권한 검토로 과도한 권한을 줄인다.\n\n인증 이후 세션을 안전하게 관리하는 것도 중요하다. 세션 ID는 예측하기 어려워야 하고 로그인 후 재발급해 세션 고정 공격을 막으며 로그아웃·만료·권한 변경 시 무효화해야 한다. 권한 검사는 서버 측에서 매 요청마다 수행해야 하며 화면에서 버튼을 숨기는 것만으로 인가가 되지 않는다. 수평 권한 상승은 같은 권한 수준의 다른 사용자 자원에 접근하는 것이고 수직 권한 상승은 관리자 기능 등 더 높은 권한을 얻는 것이다.\n\n계정 탈취 이후에도 피해 범위를 제한하고 업무별 권한을 적절히 통제할 수 있다.\n\nMFA는 지식·소유·생체 등 서로 다른 인증 요소를 조합한다. 동일한 유형의 비밀번호를 여러 개 요구하는 것과는 다르다.\n\n인증은 사용자의 신원을 확인하고 인가는 확인된 주체가 수행할 수 있는 작업을 결정한다. 접근통제 모델에는 DAC, MAC, RBAC, ABAC 등이 있으며 최소 권한 원칙과 직무 분리가 중요하다. 인증은 주체가 누구인지 확인하는 절차이며 지식(비밀번호), 소유(보안키·기기), 생체(지문 등) 요소를 사용할 수 있다. 다중요소 인증은 서로 다른 종류의 요소를 결합해야 하며, 비밀번호 두 개처럼 같은 종류를 두 번 쓰는 것은 일반적으로 MFA가 아니다. 최소 권한 원칙에 따라 업무에 필요한 권한만 부여하고, 기본 거부·권한 분리·주기적 검토로 과도한 권한을 줄인다.","계정 탈취 이후에도 피해 범위를 제한하고 업무별 권한을 적절히 통제할 수 있다.","인증은 사용자의 신원을 확인하고 인가는 확인된 주체가 수행할 수
