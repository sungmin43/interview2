결 확인이 O(1)이지만 희소 그래프에서는 공간 낭비가 크다. 인접 리스트는 각 정점의 이웃만 저장해 O(V+E) 공간을 사용한다. BFS는 큐를 사용해 시작점에서 간선 수가 적은 순서로 탐색하고 비가중 그래프의 최단 간선 수 경로를 구한다. DFS는 스택이나 재귀로 한 경로를 깊게 탐색하며 연결 요소·사이클·위상 정렬 등에 활용한다.\n\nBFS는 큐에 시작 정점을 넣고 방문 처리한 뒤 인접 정점을 발견 순서대로 큐에 넣는다. 방문 처리를 큐에 넣는 시점에 해야 같은 정점이 여러 번 삽입되는 것을 막을 수 있다. DFS는 재귀 호출 또는 명시적 스택으로 탐색하며 방문 상태를 미방문·진행 중·완료로 구분하면 방향 그래프의 사이클을 찾는 데 도움이 된다. 연결 요소를 모두 찾으려면 모든 정점을 순회하며 아직 방문하지 않은 정점에서 새 탐색을 시작한다. 인접 리스트에서는 두 탐색 모두 O(V+E)다.\n\n네트워크·지도·친구 관계 등 복잡한 관계를 나타낸다.\n\n가중치 그래프의 최단 경로에는 다익스트라 등 문제 조건에 맞는 알고리즘을 사용한다.\n\n인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.","네트워크·지도·친구 관계 등 복잡한 관계를 나타낸다.","그래프는 정점과 간선으로 객체 간 관계를 표현한다. BFS는 큐로 가까운 정점부터, DFS는 스택 또는 재귀로 깊게 탐색한다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인접 행렬과 리스트 차이는?","BFS와 DFS 차이는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["해시 테이블","키를 해시 함수에 넣어 저장 위치를 계산하는 구조다. 평균 검색·삽입·삭제는 O(1)에 가까울 수 있다.\n\n해시 테이블은 키를 해시 함수에 넣어 배열 인덱스 또는 버킷을 계산하고 값을 저장·검색한다. 키가 고르게 분산되면 평균 탐색·삽입·삭제가 O(1)에 가깝지만 서로 다른 키가 같은 위치로 가는 충돌은 피할 수 없다. 체이닝은 버킷마다 리스트 등 자료구조를 두고, 개방 주소법은 테이블 안의 다른 빈 칸을 탐사한다. 선형 탐사는 다음 칸을 순서대로 확인하고 제곱 탐사는 간격을 제곱수로 늘리며 이중 해싱은 두 번째 해시값을 탐사 간격으로 사용한다. 적재율이 높아지면 충돌이 늘어나 재해싱이 필요할 수 있다. 개방 주소법의 삭제는 탐색 경로를 끊지 않도록 tombstone 표시를 사용할 수 있다.\n\n해시 함수는 같은 키에는 항상 같은 해시값을 내야 하며 가능한 한 키를 고르게 분산해야 한다. 충돌이 많으면 평균 O(1)의 기대 성능이 무너져 최악 O(n)에 가까워질 수 있다. 해시 테이블은 키의 순서를 보장하지 않는 경우가 많으므로 범위 검색과 정렬 순회에는 트리 기반 인덱스가 더 적합하다. 공격자가 충돌을 유도할 수 있는 입력을 통제하지 않으면 해시 충돌 공격으로 서비스 지연이 발생할 수 있어 무작위화 해시나 안전한 해시 설계를 고려한다.\n\n키를 이용해 데이터를 빠르게 찾을 수 있다.\n\n해시 함수는 빠르고 키를 고르게 분산해야 하며 적재율이 높아지면 충돌이 증가할 수 있다.\n\n역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.","키를 이용해 데이터를 빠르게 찾을 수 있다.","키를 해시 함수에 넣어 저장 위치를 계산하는 구조다. 평균 검색·삽입·삭제는 O(1)에 가까울 수 있다.  암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시 충돌이란?","좋은 해시 함수의 조건은?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["시간복잡도와 공간복잡도","알고리즘이 입력 크기 n에 따라 사용하는 연산량을 시간복잡도, 추가 메모리 사용량을 공간복잡도라고 한다. Big-O는 점근적 상한을 나타내며 O(1), O(log n), O(n), O(n log n), O(n²) 등이 자주 등장한다.\n\n시간복잡도는 입력 크기 n에 따라 기본 연산 횟수가 어떻게 증가하는지, 공간복잡도는 추가 메모리 사용량이 어떻게 증가하는지 나타낸다. Big-O는 점근적 상한, Big-Ω는 하한, Big-Θ는 상·하한이 같은 차수를 나타낸다. O(1)은 상수 시간, O(log n)은 매 단계 탐색 범위가 일정 비율로 줄어드는 경우, O(n)은 모든 원소를 한 번씩 확인하는 경우다. Big-O 자체가 항상 최악 시간이라는 뜻은 아니므로 최선·평균·최악 조건을 구분해야 한다. 재귀 호출 스택과 보조 배열도 공간복잡도에 포함한다.\n\n입력 규모가 커질 때 자료구조와 알고리즘 선택이 성능에 미치는 영향을 비교할 수 있다.\n\n공간복잡도에는 입력 저장 공간과 알고리즘이 추가로 사용하는 보조 공간을 구분해 볼 수 있다.\n\n알고리즘이 입력 크기 n에 따라 사용하는 연산량을 시간복잡도, 추가 메모리 사용량을 공간복잡도라고 한다.","입력 규모가 커질 때 자료구조와 알고리즘 선택이 성능에 미치는 영향을 비교할 수 있다.","알고리즘이 입력 크기 n에 따라 사용하는 연산량을 시간복잡도, 추가 메모리 사용량을 공간복잡도라고 한다. Big-O는 점근적 상한을 나타내며 O(1), O(log n), O(n), O(n log n), O(n²) 등이 자주 등장한다.  연산의 시간복잡도는 자료구조 이름만으로 결정되지 않고 구현 방식과 현재 상태, 입력 분포에 따라 달라진다. 탐색·삽입·삭제·순회 중 어떤 연산이 중요한지, 메모리 오버헤드와 캐시 지역성은 어떤지 함께 고려해 선택해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["O(n log n)과 O(n²)은 입력이 커질수록 어떻게 차이 나는가?","시간복잡도와 실제 실행 시간은 같은가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["해시 테이블과 충돌 해결","해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산하고 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치에 매핑되는 충돌은 체이닝이나 개방 주소법으로 해결한다.\n\n해시 테이블은 키를 해시 함수에 넣어 배열 인덱스 또는 버킷을 계산하고 값을 저장·검색한다. 키가 고르게 분산되면 평균 탐색·삽입·삭제가 O(1)에 가깝지만 서로 다른 키가 같은 위치로 가는 충돌은 피할 수 없다. 체이닝은 버킷마다 리스트 등 자료구조를 두고, 개방 주소법은 테이블 안의 다른 빈 칸을 탐사한다. 선형 탐사는 다음 칸을 순서대로 확인하고 제곱 탐사는 간격을 제곱수로 늘리며 이중 해싱은 두 번째 해시값을 탐사 간격으로 사용한다. 적재율이 높아지면 충돌이 늘어나 재해싱이 필요할 수 있다. 개방 주소법의 삭제는 탐색 경로를 끊지 않도록 tombstone 표시를 사용할 수 있다.\n\n해시 함수는 같은 키에는 항상 같은 해시값을 내야 하며 가능한 한 키를 고르게 분산해야 한다. 충돌이 많으면 평균 O(1)의 기대 성능이 무너져 최악 O(n)에 가까워질 수 있다. 해시 테이블은 키의 순서를 보장하지 않는 경우가 많으므로 범위 검색과 정렬 순회에는 트리 기반 인덱스가 더 적합하다. 공격자가 충돌을 유도할 수 있는 입력을 통제하지 않으면 해시 충돌 공격으로 서비스 지연이 발생할 수 있어 무작위화 해시나 안전한 해시 설계를 고려한다.\n\n검색 성능이 중요할 때 유용하지만 해시 함수 품질, 적재율, 충돌 처리 방식에 따라 성능이 달라진다.\n\n적재율이 높아지면 충돌 가능성이 커지므로 일정 기준에서 테이블 크기를 늘리고 재해싱할 수 있다.\n\n해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산하고 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치에 매핑되는 충돌은 체이닝이나 개방 주소법으로 해결한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.","검색 성능이 중요할 때 유용하지만 해시 함수 품질, 적재율, 충돌 처리 방식에 따라 성능이 달라진다.","해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산하고 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치에 매핑되는 충돌은 체이닝이나 개방 주소법으로 해결한다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시 충돌은 왜 발생하는가?","해시 테이블이 항상 O(1)인가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["힙과 우선순위 큐","힙은 부모와 자식 사이에 최대·최소 관계를 유지하는 완전 이진 트리 기반 자료구조다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 부모가 자식보다 작거나 같다. 우선순위 큐는 우선순위가 높은 원소를 먼저 꺼내는 추상 자료형이다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조다. push는 삽입, pop은 제거, peek는 최상단 확인이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행하며 작업 대기열과 BFS에 사용한다. 덱은 양쪽 끝에서 삽입·삭제가 가능하다. 우선순위 큐는 도착 순서가 아니라 우선순위로 원소를 꺼내며 보통 힙으로 구현한다. 이들은 동작을 정의하는 ADT이고 배열·연결 리스트·원형 버퍼 등으로 구현할 수 있다.\n\n힙을 배열로 저장할 때 0부터 시작하는 인덱스 기준으로 왼쪽 자식은 2i+1, 오른쪽 자식은 2i+2, 부모는 (i-1)//2다. 힙 생성(heapify)은 아래쪽 내부 노드부터 sift-down을 수행해 O(n)에 만들 수 있으며 원소를 하나씩 삽입하는 O(n log n)보다 효율적이다. 우선순위 큐에서 우선순위가 바뀐 항목을 갱신해야 하는 경우 인덱스 맵을 함께 관리하거나 오래된 항목을 큐에서 꺼낼 때 무시하는 lazy deletion을 사용할 수 있다.\n\n최댓값·최솟값을 반복해서 꺼내야 하는 작업과 작업 스케줄링에 효율적이다.\n\n힙 정렬은 배열을 힙으로 구성한 뒤 루트 원소를 반복적으로 제거해 정렬하며 O(n log n) 시간복잡도를 가진다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.","최댓값·최솟값을 반복해서 꺼내야 하는 작업과 작업 스케줄링에 효율적이다.","힙은 부모와 자식 사이에 최대·최소 관계를 유지하는 완전 이진 트리 기반 자료구조다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 부모가 자식보다 작거나 같다. 우선순위 큐는 우선순위가 높은 원소를 먼저 꺼내는 추상 자료형이다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["힙과 이진 탐색 트리의 차이는?","힙 정렬의 원리는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["그래프 표현과 탐색","그래프는 정점과 간선으로 관계를 표현한다. 방향·무방향, 가중치 유무에 따라 유형이 나뉜다. 인접 행렬은 정점 간 연결을 표로, 인접 리스트는 각 정점의 이웃 목록으로 저장한다. DFS는 깊이 우선, BFS는 너비 우선 탐색이다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 방향·무방향, 가중·비가중 그래프로 나뉘며 도로망·소셜 네트워크·선수 과목 관계 등을 모델링한다. 인접 행렬은 V×V 공간을 사용해 두 정점의 연결 확인이 O(1)이지만 희소 그래프에서는 공간 낭비가 크다. 인접 리스트는 각 정점의 이웃만 저장해 O(V+E) 공간을 사용한다. BFS는 큐를 사용해 시작점에서 간선 수가 적은 순서로 탐색하고 비가중 그래프의 최단 간선 수 경로를 구한다. DFS는 스택이나 재귀로 한 경로를 깊게 탐색하며 연결 요소·사이클·위상 정렬 등에 활용한다.\n\nBFS는 큐에 시작 정점을 넣고 방문 처리한 뒤 인접 정점을 발견 순서대로 큐에 넣는다. 방문 처리를 큐에 넣는 시점에 해야 같은 정점이 여러 번 삽입되는 것을 막을 수 있다. DFS는 재귀 호출 또는 명시적 스택으로 탐색하며 방문 상태를 미방문·진행 중·완료로 구분하면 방향 그래프의 사이클을 찾는 데 도움이 된다. 연결 요소를 모두 찾으려면 모든 정점을 순회하며 아직 방문하지 않은 정점에서 새 탐색을 시작한다. 인접 리스트에서는 두 탐색 모두 O(V+E)다.\n\n네트워크, 지도 경로, 친구 관계, 과목 선수 관계 등 다양한 관계형 문제를 표현한다.\n\n인접 행렬은 간선 존재 여부 확인이 O(1)이지만 공간을 O(V²) 사용한다. 인접 리스트는 희소 그래프에서 공간 효율적이다.\n\n인접 행렬은 정점 간 연결을 표로, 인접 리스트는 각 정점의 이웃 목록으로 저장한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 모든 간선의 가중치가 같거나 없을 때 최단 간선 수 경로를 구할 수 있으며 시간복잡도는 인접 리스트 기준 O(V+E)다. 깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다.","네트워크, 지도 경로, 친구 관계, 과목 선수 관계 등 다양한 관계형 문제를 표현한다.","그래프는 정점과 간선으로 관계를 표현한다. 방향·무방향, 가중치 유무에 따라 유형이 나뉜다. 인접 행렬은 정점 간 연결을 표로, 인접 리스트는 각 정점의 이웃 목록으로 저장한다. DFS는 깊이 우선, BFS는 너비 우선 탐색이다.  그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n너비 우선 탐색은 시작 정점에서 가까운 정점부터 큐로 방문한다. 모든 간선의 가중치가 같거나 없을 때 최단 간선 수 경로를 구할 수 있으며 시간복잡도는 인접 리스트 기준 O(V+E)다. 방문 여부를 기록하지 않으면 사이클에서 무한 반복할 수 있다.\n\n깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 재귀 깊이가 큰 입력에서는 호출 스택 한계를 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["인접 행렬과 인접 리스트의 공간복잡도는?","DFS와 BFS의 차이와 활용은?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["트리 순회와 균형 트리","트리 순회에는 전위(루트-왼쪽-오른쪽), 중위(왼쪽-루트-오른쪽), 후위(왼쪽-오른쪽-루트), 레벨 순회가 있다. 균형 이진 탐색 트리는 높이를 제한해 탐색·삽입·삭제가 O(log n)에 가깝도록 유지한다.\n\n트리는 노드와 간선으로 이루어진 계층 구조이며 루트·부모·자식·잎·깊이·높이·서브트리로 설명한다. 이진 트리는 각 노드가 최대 두 자식을 갖는다. 이진 탐색 트리는 왼쪽 서브트리 키가 현재 키보다 작고 오른쪽은 크도록 유지해 비교 결과에 따라 탐색 방향을 줄인다. 균형 트리에서는 높이가 O(log n)이므로 탐색·삽입·삭제가 O(log n)이지만 정렬된 순서로 삽입되면 한쪽으로 기울어 O(n)이 될 수 있다. AVL은 서브트리 높이 차이를 엄격히 제한하고 레드블랙 트리는 색 규칙으로 높이를 제한해 갱신과 탐색의 균형을 맞춘다. 회전은 BST의 키 순서를 유지하면서 트리 모양을 바꾸는 연산이다.\n\nBST의 삭제는 자식이 없는 노드, 자식 하나인 노드, 자식 둘인 노드로 나누어 처리한다. 자식 둘이면 오른쪽 서브트리의 최솟값(중위 후속자) 또는 왼쪽 서브트리의 최댓값으로 대체한 뒤 해당 노드를 제거할 수 있다. AVL 회전은 LL·RR·LR·RL 네 유형으로 설명하며 불균형 방향에 따라 단일 또는 이중 회전을 수행한다. 균형 트리는 검색 성능을 보장하지만 회전과 높이·색 정보 갱신으로 삽입·삭제 구현이 복잡해진다.\n\n트리 구조는 계층 데이터와 탐색·색인에 널리 사용되며 균형 여부가 성능을 좌우한다.\n\n균형 트리는 회전 등의 재구성 연산으로 높이를 관리한다. 실제 라이브러리와 데이터베이스 인덱스에서 균형 트리 계열이 활용된다.\n\n트리 순회에는 전위(루트-왼쪽-오른쪽), 중위(왼쪽-루트-오른쪽), 후위(왼쪽-오른쪽-루트), 레벨 순회가 있다. 균형 이진 탐색 트리는 높이를 제한해 탐색·삽입·삭제가 O(log n)에 가깝도록 유지한다. 이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다.","트리 구조는 계층 데이터와 탐색·색인에 널리 사용되며 균형 여부가 성능을 좌우한다.","트리 순회에는 전위(루트-왼쪽-오른쪽), 중위(왼쪽-루트-오른쪽), 후위(왼쪽-오른쪽-루트), 레벨 순회가 있다. 균형 이진 탐색 트리는 높이를 제한해 탐색·삽입·삭제가 O(log n)에 가깝도록 유지한다.  이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["이진 탐색 트리가 편향되면 어떤 문제가 생기는가?","AVL 트리와 레드블랙 트리의 공통 목적은?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["스택·큐·덱과 추상 자료형","스택은 후입선출, 큐는 선입선출 구조이며 덱은 양쪽 끝에서 삽입과 삭제가 가능하다. 추상 자료형은 자료의 내부 구현보다 제공하는 연산과 동작 규칙을 정의한다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조다. push는 삽입, pop은 제거, peek는 최상단 확인이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행하며 작업 대기열과 BFS에 사용한다. 덱은 양쪽 끝에서 삽입·삭제가 가능하다. 우선순위 큐는 도착 순서가 아니라 우선순위로 원소를 꺼내며 보통 힙으로 구현한다. 이들은 동작을 정의하는 ADT이고 배열·연결 리스트·원형 버퍼 등으로 구현할 수 있다.\n\n자료구조를 구현과 사용 관점으로 구분해 설명하는 기초다.\n\n함수 호출 스택, 괄호 검사, BFS의 큐, 작업 대기열 등이 대표 사례다.\n\n스택은 후입선출, 큐는 선입선출 구조이며 덱은 양쪽 끝에서 삽입과 삭제가 가능하다. 스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.","자료구조를 구현과 사용 관점으로 구분해 설명하는 기초다.","스택은 후입선출, 큐는 선입선출 구조이며 덱은 양쪽 끝에서 삽입과 삭제가 가능하다. 추상 자료형은 자료의 내부 구현보다 제공하는 연산과 동작 규칙을 정의한다.  스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조이며 push, pop, peek가 핵심 연산이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소 등에 사용한다. 깊은 재귀는 스택 오버플로를 일으킬 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["스택은 어떤 문제에 활용되는가?","큐와 우선순위 큐의 차이는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["연결 리스트와 배열의 비교","배열은 연속된 메모리에 저장해 인덱스 접근이 빠르지만 중간 삽입·삭제에 원소 이동이 필요할 수 있다. 연결 리스트는 노드가 포인터로 연결되어 삽입·삭제가 유리할 수 있지만 임의 위치 접근은 순차 탐색이 필요하다.\n\n배열은 원소를 연속된 메모리에 저장한다. 시작 주소와 원소 크기를 이용해 i번째 주소를 계산하므로 임의 인덱스 접근은 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 뒤쪽 원소 이동이 필요해 O(n)이다. 동적 배열은 용량이 차면 더 큰 공간을 할당하고 복사하며 개별 확장은 O(n)이지만 여러 번 삽입의 분할 상환 비용은 평균 O(1)로 설명할 수 있다. 연결 리스트는 각 노드가 데이터와 다음 노드 주소를 가진다. 특정 위치 검색은 O(n)이지만 삽입·삭제할 노드 참조를 이미 알고 있으면 링크 변경만으로 O(1)에 처리할 수 있다. 노드별 포인터 공간과 비연속 메모리로 인한 캐시 비지역성은 단점이다.\n\n배열의 연속 배치는 인덱스 계산과 캐시 활용에 유리하지만 크기 변경과 중간 삽입 비용이 크다. 동적 배열은 여유 용량을 확보해 append를 대부분 O(1)에 처리하고 가득 찰 때 용량을 늘린다. 연결 리스트는 노드가 흩어져 있을 수 있어 포인터 추적과 캐시 미스가 발생하지만 노드 참조가 이미 주어진 경우 링크 수정이 간단하다. 따라서 '삽입·삭제가 많으면 연결 리스트'라는 규칙만으로 선택하지 말고 실제로 삽입 위치를 알고 있는지, 순차 탐색이 얼마나 많은지, 메모리 지역성이 중요한지 확인해야 한다.\n\n자료의 접근 패턴과 메모리 비용에 따라 구조를 선택하는 근거가 된다.\n\n삽입할 위치의 노드를 이미 알고 있을 때 연결 리스트의 연결 변경은 O(1)이지만, 위치 탐색 비용은 별도다.\n\n연결 리스트는 노드가 포인터로 연결되어 삽입·삭제가 유리할 수 있지만 임의 위치 접근은 순차 탐색이 필요하다. 연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다.","자료의 접근 패턴과 메모리 비용에 따라 구조를 선택하는 근거가 된다.","배열은 연속된 메모리에 저장해 인덱스 접근이 빠르지만 중간 삽입·삭제에 원소 이동이 필요할 수 있다. 연결 리스트는 노드가 포인터로 연결되어 삽입·삭제가 유리할 수 있지만 임의 위치 접근은 순차 탐색이 필요하다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다. 포인터 공간과 캐시 비지역성은 단점이다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["배열과 연결 리스트 중 메모리 효율이 더 좋은 것은?","연결 리스트가 항상 삽입에 유리한가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["이진 탐색 트리와 균형 유지","이진 탐색 트리는 왼쪽 하위 트리의 키가 작고 오른쪽 하위 트리의 키가 큰 순서 관계를 갖는다. 입력 순서가 나쁘면 한쪽으로 치우쳐 연결 리스트처럼 성능이 저하될 수 있다.\n\n트리는 노드와 간선으로 이루어진 계층 구조이며 루트·부모·자식·잎·깊이·높이·서브트리로 설명한다. 이진 트리는 각 노드가 최대 두 자식을 갖는다. 이진 탐색 트리는 왼쪽 서브트리 키가 현재 키보다 작고 오른쪽은 크도록 유지해 비교 결과에 따라 탐색 방향을 줄인다. 균형 트리에서는 높이가 O(log n)이므로 탐색·삽입·삭제가 O(log n)이지만 정렬된 순서로 삽입되면 한쪽으로 기울어 O(n)이 될 수 있다. AVL은 서브트리 높이 차이를 엄격히 제한하고 레드블랙 트리는 색 규칙으로 높이를 제한해 갱신과 탐색의 균형을 맞춘다. 회전은 BST의 키 순서를 유지하면서 트리 모양을 바꾸는 연산이다.\n\nBST의 삭제는 자식이 없는 노드, 자식 하나인 노드, 자식 둘인 노드로 나누어 처리한다. 자식 둘이면 오른쪽 서브트리의 최솟값(중위 후속자) 또는 왼쪽 서브트리의 최댓값으로 대체한 뒤 해당 노드를 제거할 수 있다. AVL 회전은 LL·RR·LR·RL 네 유형으로 설명하며 불균형 방향에 따라 단일 또는 이중 회전을 수행한다. 균형 트리는 검색 성능을 보장하지만 회전과 높이·색 정보 갱신으로 삽입·삭제 구현이 복잡해진다.\n\n탐색 구조에서 평균과 최악의 성능 차이를 이해할 수 있다.\n\n균형 트리는 높이를 제한해 최악의 탐색 성능을 관리한다.\n\n이진 탐색 트리는 왼쪽 하위 트리의 키가 작고 오른쪽 하위 트리의 키가 큰 순서 관계를 갖는다. 연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다. 이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.","탐색 구조에서 평균과 최악의 성능 차이를 이해할 수 있다.","이진 탐색 트리는 왼쪽 하위 트리의 키가 작고 오른쪽 하위 트리의 키가 큰 순서 관계를 갖는다. 입력 순서가 나쁘면 한쪽으로 치우쳐 연결 리스트처럼 성능이 저하될 수 있다.  연결 리스트는 각 노드가 데이터와 다음 노드(이중 연결이면 이전 노드)의 참조를 가진다. 특정 위치를 찾는 데 O(n)이지만, 삽입·삭제할 노드의 위치를 이미 알고 있으면 연결만 바꾸어 O(1)에 수행할 수 있다. 포인터 공간과 캐시 비지역성은 단점이다.\n\n이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["중위 순회가 정렬 순서가 되는 이유는?","AVL 회전은 왜 필요한가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["트라이와 문자열 탐색","트라이는 문자열의 공통 접두사를 노드 경로로 공유하는 트리 구조다. 사전 검색, 자동완성, IP 라우팅의 최장 접두사 검색 등에 활용할 수 있다.\n\n트라이는 문자열의 접두사를 공유하는 트리다. 루트에서 문자 간선을 따라가며 단어를 표현하고 단어 끝 표시를 두어 단어 자체와 접두사를 구분한다. 길이 L 문자열의 검색은 O(L)로 설명할 수 있어 자동 완성·사전 검색·IP 최장 접두사 매칭에 활용된다. 문자 집합 크기만큼 포인터를 미리 두면 메모리 낭비가 커질 수 있어 자식 맵이나 압축 트라이를 사용한다. 대소문자·유니코드 정규화 규칙도 검색 결과에 영향을 준다.\n\n문자열 사전에서 접두사 검색을 수행할 때 해시 테이블은 전체 키 일치 검색에는 빠르지만 특정 접두사로 시작하는 모든 단어를 찾으려면 별도 구조가 필요하다. 트라이는 접두사 경로를 공유하므로 자동 완성 후보를 해당 노드의 하위 트리에서 열거할 수 있다. 압축 트라이는 자식이 하나뿐인 연속 경로를 하나의 간선 라벨로 합쳐 노드 수를 줄인다. 단어 끝 표시를 생략하면 'app'과 'apple'처럼 한 단어가 다른 단어의 접두사인 경우를 구분하지 못한다.\n\n문자열 검색과 접두사 기반 문제에 특화된 자료구조를 이해할 수 있다.\n\n메모리 절약을 위해 자식 노드를 해시맵이나 압축 트라이로 관리하기도 한다.\n\n탐색·삽입·삭제·순회 중 어떤 연산이 중요한지, 메모리 오버헤드와 캐시 지역성은 어떤지 함께 고려해 선택해야 한다.","문자열 검색과 접두사 기반 문제에 특화된 자료구조를 이해할 수 있다.","트라이는 문자열의 공통 접두사를 노드 경로로 공유하는 트리 구조다. 사전 검색, 자동완성, IP 라우팅의 최장 접두사 검색 등에 활용할 수 있다.  연산의 시간복잡도는 자료구조 이름만으로 결정되지 않고 구현 방식과 현재 상태, 입력 분포에 따라 달라진다. 탐색·삽입·삭제·순회 중 어떤 연산이 중요한지, 메모리 오버헤드와 캐시 지역성은 어떤지 함께 고려해 선택해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시 테이블과 트라이의 차이는?","자동완성에 트라이가 적합한 이유는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["분리 집합(Union-Find)","분리 집합은 원소들이 어떤 집합에 속하는지 관리하고 두 집합을 합치는 자료구조다. 경로 압축과 union by rank/size 최적화를 적용하면 연산의 상각 시간은 매우 작아진다.\n\n분리 집합(DSU)은 서로소 집합들의 모음을 관리한다. find(x)는 x가 속한 집합의 대표를 찾고 union(x,y)는 두 집합을 합친다. 대표가 같으면 이미 같은 연결 요소이므로 간선을 추가할 때 사이클이 생길 수 있다. 크루스칼에서 사이클 판정에 쓰인다. 경로 압축은 find 경로의 부모를 대표로 바꾸고 union by size/rank는 작은 트리를 큰 트리 아래 붙인다. 두 최적화를 함께 쓰면 연산의 분할 상환 비용은 역 아커만 함수 수준으로 매우 작다. 기본 DSU는 집합 합치기에 최적화되어 임의 원소 삭제나 집합 분리는 지원하지 않는다.\n\nDSU의 parent 배열은 각 원소의 부모를 나타내며 루트는 parent[x]=x인 원소다. find는 루트까지 부모를 따라가고 경로 압축으로 방문한 노드를 루트에 직접 연결한다. union by size는 루트별 집합 크기를 저장해 작은 트리를 큰 트리에 붙인다. 이 자료구조는 연결 여부와 집합 병합에 효율적이지만 연결 간선 삭제가 필요하면 동적 연결성 같은 더 복잡한 자료구조가 필요하다. 크루스칼에서는 정점 집합이 합쳐지는 순서를 추적해 사이클을 피한다.\n\n연결 요소 판별, 크루스칼 알고리즘 등에서 효율적으로 사용된다.\n\n사이클을 만들지 않고 간선을 선택하는지 확인할 때 두 정점이 이미 같은 집합인지 검사한다.\n\n분리 집합은 원소들이 어떤 집합에 속하는지 관리하고 두 집합을 합치는 자료구조다.","연결 요소 판별, 크루스칼 알고리즘 등에서 효율적으로 사용된다.","분리 집합은 원소들이 어떤 집합에 속하는지 관리하고 두 집합을 합치는 자료구조다. 경로 압축과 union by rank/size 최적화를 적용하면 연산의 상각 시간은 매우 작아진다.  연산의 시간복잡도는 자료구조 이름만으로 결정되지 않고 구현 방식과 현재 상태, 입력 분포에 따라 달라진다. 탐색·삽입·삭제·순회 중 어떤 연산이 중요한지, 메모리 오버헤드와 캐시 지역성은 어떤지 함께 고려해 선택해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["크루스칼 알고리즘에서 왜 필요한가?","경로 압축은 무엇을 개선하는가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["해시 테이블과 충돌 해결","해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산해 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치를 가리키는 충돌은 체이닝이나 개방 주소법 등으로 해결한다.\n\n해시 테이블은 키를 해시 함수에 넣어 배열 인덱스 또는 버킷을 계산하고 값을 저장·검색한다. 키가 고르게 분산되면 평균 탐색·삽입·삭제가 O(1)에 가깝지만 서로 다른 키가 같은 위치로 가는 충돌은 피할 수 없다. 체이닝은 버킷마다 리스트 등 자료구조를 두고, 개방 주소법은 테이블 안의 다른 빈 칸을 탐사한다. 선형 탐사는 다음 칸을 순서대로 확인하고 제곱 탐사는 간격을 제곱수로 늘리며 이중 해싱은 두 번째 해시값을 탐사 간격으로 사용한다. 적재율이 높아지면 충돌이 늘어나 재해싱이 필요할 수 있다. 개방 주소법의 삭제는 탐색 경로를 끊지 않도록 tombstone 표시를 사용할 수 있다.\n\n해시 함수는 같은 키에는 항상 같은 해시값을 내야 하며 가능한 한 키를 고르게 분산해야 한다. 충돌이 많으면 평균 O(1)의 기대 성능이 무너져 최악 O(n)에 가까워질 수 있다. 해시 테이블은 키의 순서를 보장하지 않는 경우가 많으므로 범위 검색과 정렬 순회에는 트리 기반 인덱스가 더 적합하다. 공격자가 충돌을 유도할 수 있는 입력을 통제하지 않으면 해시 충돌 공격으로 서비스 지연이 발생할 수 있어 무작위화 해시나 안전한 해시 설계를 고려한다.\n\n빠른 검색 구조의 원리와 최악의 경우 성능이 저하되는 이유를 설명할 수 있다.\n\n키가 한 버킷에 집중되면 최악 O(n)이 될 수 있으며 적절한 해시 함수와 부하율 관리, 리사이징이 중요하다.\n\n해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산해 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치를 가리키는 충돌은 체이닝이나 개방 주소법 등으로 해결한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다.","빠른 검색 구조의 원리와 최악의 경우 성능이 저하되는 이유를 설명할 수 있다.","해시 테이블은 키를 해시 함수에 넣어 배열 위치를 계산해 평균적으로 빠른 탐색·삽입·삭제를 제공한다. 서로 다른 키가 같은 위치를 가리키는 충돌은 체이닝이나 개방 주소법 등으로 해결한다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n암호학적 해시 함수는 임의 길이 입력을 고정 길이 다이제스트로 변환한다. 역산이 어렵고 충돌을 찾기 어려워야 하며, 비밀번호 저장에는 일반 해시만 빠르게 적용하기보다 salt와 반복 비용을 갖춘 Argon2, bcrypt, scrypt 등 전용 비밀번호 해시를 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["해시 함수가 좋아야 하는 이유는?","해시 테이블의 최악 시간복잡도는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["힙과 우선순위 큐","힙은 부모와 자식 사이에 최댓값 또는 최솟값의 순서 조건을 유지하는 완전 이진 트리다. 우선순위 큐는 우선순위가 높은 원소를 먼저 꺼내는 추상 자료형이며 힙으로 효율적으로 구현할 수 있다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조다. push는 삽입, pop은 제거, peek는 최상단 확인이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행하며 작업 대기열과 BFS에 사용한다. 덱은 양쪽 끝에서 삽입·삭제가 가능하다. 우선순위 큐는 도착 순서가 아니라 우선순위로 원소를 꺼내며 보통 힙으로 구현한다. 이들은 동작을 정의하는 ADT이고 배열·연결 리스트·원형 버퍼 등으로 구현할 수 있다.\n\n힙을 배열로 저장할 때 0부터 시작하는 인덱스 기준으로 왼쪽 자식은 2i+1, 오른쪽 자식은 2i+2, 부모는 (i-1)//2다. 힙 생성(heapify)은 아래쪽 내부 노드부터 sift-down을 수행해 O(n)에 만들 수 있으며 원소를 하나씩 삽입하는 O(n log n)보다 효율적이다. 우선순위 큐에서 우선순위가 바뀐 항목을 갱신해야 하는 경우 인덱스 맵을 함께 관리하거나 오래된 항목을 큐에서 꺼낼 때 무시하는 lazy deletion을 사용할 수 있다.\n\n작업 예약, 이벤트 처리, 다익스트라 알고리즘 등에서 우선순위에 따른 선택을 효율적으로 수행할 수 있다.\n\n힙은 부모·자식 사이의 부분 순서만 보장하므로 임의의 값을 찾는 데는 일반적으로 O(n)이 걸린다.\n\n우선순위 큐는 우선순위가 높은 원소를 먼저 꺼내는 추상 자료형이며 힙으로 효율적으로 구현할 수 있다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.","작업 예약, 이벤트 처리, 다익스트라 알고리즘 등에서 우선순위에 따른 선택을 효율적으로 수행할 수 있다.","힙은 부모와 자식 사이에 최댓값 또는 최솟값의 순서 조건을 유지하는 완전 이진 트리다. 우선순위 큐는 우선순위가 높은 원소를 먼저 꺼내는 추상 자료형이며 힙으로 효율적으로 구현할 수 있다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["힙과 이진 탐색 트리의 차이는?","힙에서 임의 원소 탐색이 빠른가?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["그래프 표현: 인접 행렬과 인접 리스트","인접 행렬은 정점 쌍의 연결 여부를 2차원 배열에 저장하고 인접 리스트는 각 정점에 연결된 이웃 목록을 저장한다. 행렬은 간선 확인이 빠르고 리스트는 희소 그래프에서 공간 효율이 좋다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 방향·무방향, 가중·비가중 그래프로 나뉘며 도로망·소셜 네트워크·선수 과목 관계 등을 모델링한다. 인접 행렬은 V×V 공간을 사용해 두 정점의 연결 확인이 O(1)이지만 희소 그래프에서는 공간 낭비가 크다. 인접 리스트는 각 정점의 이웃만 저장해 O(V+E) 공간을 사용한다. BFS는 큐를 사용해 시작점에서 간선 수가 적은 순서로 탐색하고 비가중 그래프의 최단 간선 수 경로를 구한다. DFS는 스택이나 재귀로 한 경로를 깊게 탐색하며 연결 요소·사이클·위상 정렬 등에 활용한다.\n\nBFS는 큐에 시작 정점을 넣고 방문 처리한 뒤 인접 정점을 발견 순서대로 큐에 넣는다. 방문 처리를 큐에 넣는 시점에 해야 같은 정점이 여러 번 삽입되는 것을 막을 수 있다. DFS는 재귀 호출 또는 명시적 스택으로 탐색하며 방문 상태를 미방문·진행 중·완료로 구분하면 방향 그래프의 사이클을 찾는 데 도움이 된다. 연결 요소를 모두 찾으려면 모든 정점을 순회하며 아직 방문하지 않은 정점에서 새 탐색을 시작한다. 인접 리스트에서는 두 탐색 모두 O(V+E)다.\n\n그래프의 밀도와 알고리즘 특성에 따라 적절한 표현을 선택할 수 있다.\n\n인접 리스트를 사용한 BFS·DFS는 일반적으로 O(V+E) 시간에 수행된다.\n\n인접 행렬은 정점 쌍의 연결 여부를 2차원 배열에 저장하고 인접 리스트는 각 정점에 연결된 이웃 목록을 저장한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.","그래프의 밀도와 알고리즘 특성에 따라 적절한 표현을 선택할 수 있다.","인접 행렬은 정점 쌍의 연결 여부를 2차원 배열에 저장하고 인접 리스트는 각 정점에 연결된 이웃 목록을 저장한다. 행렬은 간선 확인이 빠르고 리스트는 희소 그래프에서 공간 효율이 좋다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["희소 그래프와 밀집 그래프에서 어떤 표현이 적합한가?","BFS에서 인접 리스트를 쓰면 시간복잡도는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["트리 순회와 이진 탐색 트리의 활용","전위 순회는 루트-왼쪽-오른쪽, 중위 순회는 왼쪽-루트-오른쪽, 후위 순회는 왼쪽-오른쪽-루트 순으로 방문한다. 레벨 순회는 큐를 이용해 깊이 순서로 방문한다.\n\n트리는 노드와 간선으로 이루어진 계층 구조이며 루트·부모·자식·잎·깊이·높이·서브트리로 설명한다. 이진 트리는 각 노드가 최대 두 자식을 갖는다. 이진 탐색 트리는 왼쪽 서브트리 키가 현재 키보다 작고 오른쪽은 크도록 유지해 비교 결과에 따라 탐색 방향을 줄인다. 균형 트리에서는 높이가 O(log n)이므로 탐색·삽입·삭제가 O(log n)이지만 정렬된 순서로 삽입되면 한쪽으로 기울어 O(n)이 될 수 있다. AVL은 서브트리 높이 차이를 엄격히 제한하고 레드블랙 트리는 색 규칙으로 높이를 제한해 갱신과 탐색의 균형을 맞춘다. 회전은 BST의 키 순서를 유지하면서 트리 모양을 바꾸는 연산이다.\n\nBST의 삭제는 자식이 없는 노드, 자식 하나인 노드, 자식 둘인 노드로 나누어 처리한다. 자식 둘이면 오른쪽 서브트리의 최솟값(중위 후속자) 또는 왼쪽 서브트리의 최댓값으로 대체한 뒤 해당 노드를 제거할 수 있다. AVL 회전은 LL·RR·LR·RL 네 유형으로 설명하며 불균형 방향에 따라 단일 또는 이중 회전을 수행한다. 균형 트리는 검색 성능을 보장하지만 회전과 높이·색 정보 갱신으로 삽입·삭제 구현이 복잡해진다.\n\n트리 구조를 재귀적으로 처리하는 원리와 순회 결과의 차이를 설명할 수 있다.\n\n레벨 순회는 먼저 발견한 같은 깊이의 노드를 먼저 처리하므로 선입선출 큐가 적합하다.\n\n전위 순회는 루트-왼쪽-오른쪽, 중위 순회는 왼쪽-루트-오른쪽, 후위 순회는 왼쪽-오른쪽-루트 순으로 방문한다. 이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.","트리 구조를 재귀적으로 처리하는 원리와 순회 결과의 차이를 설명할 수 있다.","전위 순회는 루트-왼쪽-오른쪽, 중위 순회는 왼쪽-루트-오른쪽, 후위 순회는 왼쪽-오른쪽-루트 순으로 방문한다. 레벨 순회는 큐를 이용해 깊이 순서로 방문한다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\n이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["전위·중위·후위 순회의 차이는?","레벨 순회에 큐를 사용하는 이유는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["원형 큐와 큐의 공간 재사용","원형 큐는 배열의 마지막 인덱스 다음을 처음 인덱스로 연결한 것처럼 인덱스를 순환시켜 큐를 구현한다. 선형 배열 큐에서 앞쪽 공간이 비어도 뒤쪽 끝에 도달하면 삽입이 막히는 문제를 완화한다.\n\n스택은 마지막에 넣은 원소를 먼저 꺼내는 LIFO 구조다. push는 삽입, pop은 제거, peek는 최상단 확인이다. 함수 호출 스택, 괄호 검사, 후위 표기식 계산, 실행 취소에 사용한다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행하며 작업 대기열과 BFS에 사용한다. 덱은 양쪽 끝에서 삽입·삭제가 가능하다. 우선순위 큐는 도착 순서가 아니라 우선순위로 원소를 꺼내며 보통 힙으로 구현한다. 이들은 동작을 정의하는 ADT이고 배열·연결 리스트·원형 버퍼 등으로 구현할 수 있다.\n\n고정 크기 버퍼와 운영체제·네트워크의 생산자 소비자 구조에서 공간을 효율적으로 재사용할 수 있다.\n\n버퍼 크기가 고정되어 있고 데이터가 순서대로 들어오고 나가는 상황에서 유용하다.\n\n원형 큐는 배열의 마지막 인덱스 다음을 처음 인덱스로 연결한 것처럼 인덱스를 순환시켜 큐를 구현한다. 선형 배열 큐에서 앞쪽 공간이 비어도 뒤쪽 끝에 도달하면 삽입이 막히는 문제를 완화한다. 배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다.","고정 크기 버퍼와 운영체제·네트워크의 생산자 소비자 구조에서 공간을 효율적으로 재사용할 수 있다.","원형 큐는 배열의 마지막 인덱스 다음을 처음 인덱스로 연결한 것처럼 인덱스를 순환시켜 큐를 구현한다. 선형 배열 큐에서 앞쪽 공간이 비어도 뒤쪽 끝에 도달하면 삽입이 막히는 문제를 완화한다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n인덱스는 검색 조건에 맞는 행을 빠르게 찾도록 검색 키와 데이터 위치를 별도로 관리하는 구조다. 조회는 빨라질 수 있지만 저장 공간을 사용하고 INSERT·UPDATE·DELETE 때 유지 비용이 발생한다. 선택도, 복합 인덱스의 컬럼 순서, 실제 실행 계획을 확인해 설계해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["원형 큐가 선형 큐보다 효율적인 이유는?","원형 큐에서 가득 참과 비어 있음을 어떻게 구분합니까?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]],["AVL 트리와 레드블랙 트리","AVL 트리와 레드블랙 트리는 이진 탐색 트리의 한쪽 편향을 방지하는 자기 균형 이진 탐색 트리다. 일반 이진 탐색 트리는 입력이 정렬된 순서로 들어오면 높이가 O(n)이 되어 탐색·삽입·삭제가 O(n)까지 느려질 수 있다.\n\n트리는 노드와 간선으로 이루어진 계층 구조이며 루트·부모·자식·잎·깊이·높이·서브트리로 설명한다. 이진 트리는 각 노드가 최대 두 자식을 갖는다. 이진 탐색 트리는 왼쪽 서브트리 키가 현재 키보다 작고 오른쪽은 크도록 유지해 비교 결과에 따라 탐색 방향을 줄인다. 균형 트리에서는 높이가 O(log n)이므로 탐색·삽입·삭제가 O(log n)이지만 정렬된 순서로 삽입되면 한쪽으로 기울어 O(n)이 될 수 있다. AVL은 서브트리 높이 차이를 엄격히 제한하고 레드블랙 트리는 색 규칙으로 높이를 제한해 갱신과 탐색의 균형을 맞춘다. 회전은 BST의 키 순서를 유지하면서 트리 모양을 바꾸는 연산이다.\n\nBST의 삭제는 자식이 없는 노드, 자식 하나인 노드, 자식 둘인 노드로 나누어 처리한다. 자식 둘이면 오른쪽 서브트리의 최솟값(중위 후속자) 또는 왼쪽 서브트리의 최댓값으로 대체한 뒤 해당 노드를 제거할 수 있다. AVL 회전은 LL·RR·LR·RL 네 유형으로 설명하며 불균형 방향에 따라 단일 또는 이중 회전을 수행한다. 균형 트리는 검색 성능을 보장하지만 회전과 높이·색 정보 갱신으로 삽입·삭제 구현이 복잡해진다.\n\nAVL 트리와 레드블랙 트리는 이진 탐색 트리의 한쪽 편향을 방지하는 자기 균형 이진 탐색 트리다. 일반 이진 탐색 트리는 입력이 정렬된 순서로 들어오면 높이가 O(n)이 되어 탐색·삽입·삭제가 O(n)까지 느려질 수 있다. AVL 트리는 각 노드의 왼쪽·오른쪽 서브트리 높이 차이인 균형 인수가 -1, 0, 1 중 하나가 되도록 유지한다. 삽입·삭제 후 균형이 깨지면 LL, RR, LR, RL 유형에 따라 회전한다. 엄격하게 균형을 유지하므로 탐색 성능이 안정적이지만 갱신 시 회전과 높이 관리 비용이 발생할 수 있다. 레드블랙 트리는 각 노드에 색을 부여하고 루트·레드 노드의 자식·경로의 블랙 노드 수 등에 관한 규칙을 유지한다. AVL보다 균형 조건이 느슨하지만 높이가 O(log n)으로 제한되어 탐색·삽입·삭제가 O(log n)이다. 일반적으로 삽입·삭제가 잦은 상황에서 회전 횟수 측면의 이점이 있을 수 있다. 이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. AVL 트리는 모든 노드에서 왼쪽과 오른쪽 서브트리 높이 차이를 제한하는 자가 균형 이진 탐색 트리다. 삽입·삭제 후 LL, RR, LR, RL 불균형을 회전으로 복구해 높이를 O(log n)으로 유지한다. 레드블랙 트리는 노드 색상 규칙을 이용해 경로 높이가 과도하게 커지지 않도록 하는 자가 균형 이진 탐색 트리다. AVL보다 균형이 느슨해 갱신이 많은 상황에서 회전 부담을 줄일 수 있으며, 탐색·삽입·삭제는 O(log n)을 보장한다.","","AVL 트리와 레드블랙 트리는 이진 탐색 트리의 한쪽 편향을 방지하는 자기 균형 이진 탐색 트리다. 일반 이진 탐색 트리는 입력이 정렬된 순서로 들어오면 높이가 O(n)이 되어 탐색·삽입·삭제가 O(n)까지 느려질 수 있다.\n\nAVL 트리는 각 노드의 왼쪽·오른쪽 서브트리 높이 차이인 균형 인수가 -1, 0, 1 중 하나가 되도록 유지한다. 삽입·삭제 후 균형이 깨지면 LL, RR, LR, RL 유형에 따라 회전한다. 엄격하게 균형을 유지하므로 탐색 성능이 안정적이지만 갱신 시 회전과 높이 관리 비용이 발생할 수 있다.\n\n레드블랙 트리는 각 노드에 색을 부여하고 루트·레드 노드의 자식·경로의 블랙 노드 수 등에 관한 규칙을 유지한다. AVL보다 균형 조건이 느슨하지만 높이가 O(log n)으로 제한되어 탐색·삽입·삭제가 O(log n)이다. 일반적으로 삽입·삭제가 잦은 상황에서 회전 횟수 측면의 이점이 있을 수 있다.  이진 탐색 트리는 각 노드의 왼쪽 서브트리 값이 작고 오른쪽 서브트리 값이 큰 순서 관계를 유지한다. 탐색·삽입·삭제는 트리 높이에 비례하며 균형이 좋으면 O(log n), 한쪽으로 치우치면 O(n)이 된다. 중위 순회는 정렬된 순서로 값을 출력한다.\n\nAVL 트리는 모든 노드에서 왼쪽과 오른쪽 서브트리 높이 차이를 제한하는 자가 균형 이진 탐색 트리다. 삽입·삭제 후 LL, RR, LR, RL 불균형을 회전으로 복구해 높이를 O(log n)으로 유지한다. 균형 조건이 엄격해 탐색은 빠르지만 회전 관리가 필요하다.\n\n레드블랙 트리는 노드 색상 규칙을 이용해 경로 높이가 과도하게 커지지 않도록 하는 자가 균형 이진 탐색 트리다. AVL보다 균형이 느슨해 갱신이 많은 상황에서 회전 부담을 줄일 수 있으며, 탐색·삽입·삭제는 O(log n)을 보장한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["AVL 트리의 균형 인수란?","AVL과 레드블랙 트리의 차이는?"],"",[["OpenDSA 전자교재·시각화","https://opendsa.org/"],["MIT 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"]]]]],["🧭","알고리즘","문제 해결 절차와 효율성 분석",[["알고리즘과 시간복잡도","알고리즘은 문제 해결을 위한 명확하고 유한한 절차다. 시간복잡도는 입력 크기에 따라 연산량이 증가하는 정도이며 Big-O로 점근적 증가율을 비교한다.\n\n알고리즘은 입력을 받아 유한한 단계 안에 요구된 출력을 만드는 명확한 절차다. 정확성은 모든 유효한 입력에서 결과가 맞는지, 종료성은 반드시 끝나는지, 효율성은 시간과 메모리를 얼마나 쓰는지로 평가한다. 점근 분석은 입력 크기 n이 커질 때 연산량 증가율을 비교한다. O(n²)은 n이 두 배가 되면 연산량이 대략 네 배가 될 수 있고 O(n log n)은 더 완만하게 증가한다. Big-O는 상한 표기이며 항상 최악 시간과 같은 뜻은 아니다. 최선·평균·최악 조건과 입력 가정을 명시해야 한다.\n\n입력이 커질 때 프로그램이 감당 가능한지 판단하고 해결 방법을 비교한다.\n\n공간복잡도는 실행에 필요한 메모리 증가량을 분석한다. Big-O는 상수 계수 등을 생략하므로 실제 초 단위 시간과 같지 않다.\n\n시간복잡도는 입력 크기에 따라 연산량이 증가하는 정도이며 Big-O로 점근적 증가율을 비교한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다.","입력이 커질 때 프로그램이 감당 가능한지 판단하고 해결 방법을 비교한다.","알고리즘은 문제 해결을 위한 명확하고 유한한 절차다. 시간복잡도는 입력 크기에 따라 연산량이 증가하는 정도이며 Big-O로 점근적 증가율을 비교한다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["O(n)과 O(n²)의 차이는?","Big-O와 실제 실행시간은 같은가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["정렬 알고리즘","버블·선택·삽입 정렬은 구현이 단순하지만 보통 O(n²)이다. 병합 정렬은 O(n log n)을 보장하고 퀵 정렬은 평균 O(n log n)이지만 최악 O(n²)일 수 있다.\n\n버블 정렬은 인접 원소를 비교해 교환하고 선택 정렬은 매 단계 최솟값을 앞으로 보내며 삽입 정렬은 정렬된 앞부분에 원소를 끼워 넣는다. 세 방식은 보통 O(n²)이지만 구현이 단순하고 삽입 정렬은 거의 정렬된 입력에서 효율적이다. 병합 정렬은 절반으로 나누고 정렬 결과를 병합해 O(n log n)을 보장하지만 보조 배열이 필요하다. 퀵 정렬은 피벗 기준으로 분할해 평균 O(n log n), 최악 O(n²)이며 피벗 선택이 중요하다. 힙 정렬은 O(n log n)을 보장하고 추가 배열 없이 구현할 수 있지만 보통 안정 정렬은 아니다. 안정 정렬은 키가 같은 레코드의 기존 상대 순서를 유지해 다중 기준 정렬에 유용하다.\n\n정렬 알고리즘은 비교 기반인지 비비교 기반인지도 구분할 수 있다. 비교 기반 정렬은 원소 간 대소 비교만으로 정렬하므로 일반적인 모델에서 최악 O(n log n)보다 빠른 비교 횟수를 보장할 수 없다. 계수 정렬은 키 범위가 작고 정수인 경우 빈도를 세어 O(n+k)에 정렬할 수 있고, 기수 정렬은 자릿수별 안정 정렬을 반복한다. 이들은 키 범위나 자릿수에 대한 가정을 활용하므로 모든 입력에 비교 정렬보다 유리한 것은 아니다. 실무 정렬은 작은 구간에 삽입 정렬을 섞거나 안정성과 최악 성능을 고려한 하이브리드 방식을 사용한다.\n\n정렬은 탐색과 후속 데이터 처리를 효율적으로 한다.\n\n안정 정렬은 같은 키를 가진 원소들의 기존 상대 순서를 유지한다.\n\n병합 정렬은 O(n log n)을 보장하고 퀵 정렬은 평균 O(n log n)이지만 최악 O(n²)일 수 있다. 병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균·최악 O(n²)이지만 거의 정렬된 작은 입력에서는 이동량이 적고 구현이 간단하다.","정렬은 탐색과 후속 데이터 처리를 효율적으로 한다.","버블·선택·삽입 정렬은 구현이 단순하지만 보통 O(n²)이다. 병합 정렬은 O(n log n)을 보장하고 퀵 정렬은 평균 O(n log n)이지만 최악 O(n²)일 수 있다.  병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 외부 정렬에도 활용된다.\n\n퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균 O(n log n), 최악 O(n²)이며 피벗 선택과 분할 균형이 성능을 좌우한다. 제자리 정렬 구현이 가능하고 캐시 효율이 좋아 실무에서 널리 쓰인다.\n\n삽입 정렬은 정렬된 앞부분에 다음 원소를 알맞은 위치로 삽입한다. 평균·최악 O(n²)이지만 거의 정렬된 작은 입력에서는 이동량이 적고 구현이 간단하다. 일반적인 구현은 안정 정렬이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["병합 정렬과 퀵 정렬 차이는?","안정 정렬이란?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["선형 탐색과 이진 탐색","선형 탐색은 순서대로 비교해 O(n), 이진 탐색은 정렬된 데이터에서 범위를 절반씩 줄여 O(log n)이다.\n\n선형 탐색은 첫 원소부터 차례로 비교하므로 정렬 여부와 관계없이 쓸 수 있지만 최악 O(n)이다. 이진 탐색은 정렬된 배열에서 중간값과 비교해 탐색 범위를 절반씩 줄여 O(log n)을 얻는다. `low`, `high`, `mid`의 범위를 일관되게 정의해야 경계 누락과 무한 반복을 막는다. 배열은 중간 원소 접근이 O(1)이지만 연결 리스트는 중간 접근 자체가 O(n)이므로 이진 탐색의 장점이 줄어든다.\n\n이진 탐색은 정확한 중간 인덱스를 찾는 것 외에도 lower_bound(처음으로 값 이상인 위치), upper_bound(처음으로 값보다 큰 위치)를 찾는 데 활용된다. 중복 원소가 있을 때 단순히 일치하는 원소를 찾는 것과 첫 번째·마지막 위치를 찾는 것은 다른 문제다. 이진 탐색의 핵심은 매 반복에서 탐색 구간을 줄이는 불변식을 유지하는 것이다. 정렬된 배열 외에도 단조 증가·감소하는 조건이나 참에서 거짓으로 한 번만 바뀌는 판정 함수의 경계값을 찾을 때 적용할 수 있다.\n\n데이터 정렬 여부와 크기에 따라 효율적인 탐색을 선택한다.\n\n이진 탐색은 중간 원소로 바로 이동할 수 있는 배열 등 임의 접근 구조에 적합하다.\n\n선형 탐색은 순서대로 비교해 O(n), 이진 탐색은 정렬된 데이터에서 범위를 절반씩 줄여 O(log n)이다. 이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.","데이터 정렬 여부와 크기에 따라 효율적인 탐색을 선택한다.","선형 탐색은 순서대로 비교해 O(n), 이진 탐색은 정렬된 데이터에서 범위를 절반씩 줄여 O(log n)이다.  이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["이진 탐색을 정렬되지 않은 배열에 적용할 수 있나요?","연결 리스트에 이진 탐색이 비효율적인 이유는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["재귀와 분할 정복","재귀는 함수가 자기 자신을 호출하는 방식이며 종료 조건이 필요하다. 분할 정복은 문제를 작은 하위 문제로 나누고 결과를 결합한다.\n\n재귀는 문제를 더 작은 같은 형태의 문제로 줄여 자기 자신을 호출한다. 기저 사례가 있어야 종료하고 각 호출에서 입력 크기가 기저 사례에 가까워져야 한다. 분할 정복은 문제를 부분 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 병합 정렬의 점화식은 `T(n)=2T(n/2)+O(n)`으로 두 절반을 정렬하고 O(n) 병합을 수행하므로 O(n log n)이다. 동적 계획법은 부분 문제가 겹쳐 계산 결과를 저장한다는 점에서 서로 독립적인 부분 문제를 푸는 분할 정복과 구분된다.\n\n복잡한 문제를 구조적으로 나눠 해결한다.\n\n단순 피보나치 재귀는 중복 계산이 많아 메모이제이션이나 동적 계획법으로 개선할 수 있다.\n\n분할 정복은 문제를 독립적인 작은 하위 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 분할·정복·결합 단계로 설명하며 병합 정렬, 퀵 정렬, 이진 탐색이 대표적이다.","복잡한 문제를 구조적으로 나눠 해결한다.","재귀는 함수가 자기 자신을 호출하는 방식이며 종료 조건이 필요하다. 분할 정복은 문제를 작은 하위 문제로 나누고 결과를 결합한다.  분할 정복은 문제를 독립적인 작은 하위 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 분할·정복·결합 단계로 설명하며 병합 정렬, 퀵 정렬, 이진 탐색이 대표적이다. 점화식과 마스터 정리로 시간복잡도를 분석할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["재귀와 반복문의 차이는?","재귀 사용 시 주의점은?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["탐욕법과 동적 계획법","탐욕법은 매 단계에서 가장 좋아 보이는 선택을 한다. 동적 계획법은 겹치는 하위 문제의 결과를 저장해 재사용한다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 되돌리지 않는다. 구현이 간결하지만 지역 최선이 전역 최적을 보장하지는 않는다. 정당성을 보이려면 탐욕 선택 속성과 최적 부분 구조를 증명해야 한다. 교환 논증은 최적해의 선택을 탐욕 선택으로 바꾸어도 해가 나빠지지 않음을 보이는 방식이다. 최소 신장 트리의 컷 속성은 컷을 가로지르는 최소 간선이 어떤 MST에 포함될 수 있음을 설명한다. 반례가 있으면 DP 등 다른 전략을 검토해야 한다.\n\nDP 상태는 문제의 미래 선택을 결정하는 데 필요한 정보만 포함해야 한다. 상태에 정보가 부족하면 서로 다른 상황을 같은 상태로 취급해 오답이 되고, 불필요한 정보가 많으면 상태 수가 폭발한다. 점화식의 모든 참조 상태가 이미 계산되도록 순서를 정해야 한다. 경로 복원은 최적값만 저장하는 것과 별도로 어떤 선택을 했는지 predecessor나 선택 배열을 보관한다. 공간 최적화는 이전 상태만 필요할 때 가능하지만 갱신 순서를 바꾸면 0-1 배낭이 무한 배낭처럼 바뀌는 등 의미가 달라질 수 있다.\n\n문제 구조에 맞는 전략을 선택하면 불필요한 전체 탐색을 줄일 수 있다.\n\n메모이제이션은 필요할 때 저장하는 하향식, 타뷸레이션은 작은 문제부터 채우는 상향식 방식이다.\n\n동적 계획법은 문제를 겹치는 부분 문제로 나누고 각 부분 문제의 결과를 저장해 중복 계산을 제거한다.","문제 구조에 맞는 전략을 선택하면 불필요한 전체 탐색을 줄일 수 있다.","탐욕법은 매 단계에서 가장 좋아 보이는 선택을 한다. 동적 계획법은 겹치는 하위 문제의 결과를 저장해 재사용한다.  동적 계획법은 문제를 겹치는 부분 문제로 나누고 각 부분 문제의 결과를 저장해 중복 계산을 제거한다. 상태 정의, 점화식, 초기값, 계산 순서가 설계의 핵심이다. 작은 문제부터 채우는 상향식과 재귀 결과를 캐시하는 하향식 메모이제이션이 있다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 이를 되돌리지 않는다. 항상 최적해를 얻는 것은 아니며, 탐욕 선택 속성과 최적 부분 구조 등을 근거로 정당성을 증명해야 한다. 활동 선택, 허프만 부호화, 일부 최소 신장 트리 문제 등이 대표 사례다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["탐욕법은 항상 최적해를 보장하나요?","메모이제이션과 타뷸레이션 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["정렬 알고리즘 비교","버블·선택·삽입 정렬은 단순하지만 평균적으로 O(n²)인 경우가 많다. 병합 정렬은 O(n log n)이며 추가 공간을 사용하고, 퀵 정렬은 평균 O(n log n)이지만 피벗 선택에 따라 최악 O(n²)이 될 수 있다. 힙 정렬은 O(n log n)을 보장한다.\n\n버블 정렬은 인접 원소를 비교해 교환하고 선택 정렬은 매 단계 최솟값을 앞으로 보내며 삽입 정렬은 정렬된 앞부분에 원소를 끼워 넣는다. 세 방식은 보통 O(n²)이지만 구현이 단순하고 삽입 정렬은 거의 정렬된 입력에서 효율적이다. 병합 정렬은 절반으로 나누고 정렬 결과를 병합해 O(n log n)을 보장하지만 보조 배열이 필요하다. 퀵 정렬은 피벗 기준으로 분할해 평균 O(n log n), 최악 O(n²)이며 피벗 선택이 중요하다. 힙 정렬은 O(n log n)을 보장하고 추가 배열 없이 구현할 수 있지만 보통 안정 정렬은 아니다. 안정 정렬은 키가 같은 레코드의 기존 상대 순서를 유지해 다중 기준 정렬에 유용하다.\n\n정렬 알고리즘은 비교 기반인지 비비교 기반인지도 구분할 수 있다. 비교 기반 정렬은 원소 간 대소 비교만으로 정렬하므로 일반적인 모델에서 최악 O(n log n)보다 빠른 비교 횟수를 보장할 수 없다. 계수 정렬은 키 범위가 작고 정수인 경우 빈도를 세어 O(n+k)에 정렬할 수 있고, 기수 정렬은 자릿수별 안정 정렬을 반복한다. 이들은 키 범위나 자릿수에 대한 가정을 활용하므로 모든 입력에 비교 정렬보다 유리한 것은 아니다. 실무 정렬은 작은 구간에 삽입 정렬을 섞거나 안정성과 최악 성능을 고려한 하이브리드 방식을 사용한다.\n\n데이터 크기, 이미 정렬된 정도, 안정성, 메모리 제약에 따라 적절한 정렬을 선택해야 한다.\n\n안정 정렬은 정렬 키가 같은 원소들의 기존 상대적 순서를 유지하는 정렬이다.\n\n병합 정렬은 O(n log n)이며 추가 공간을 사용하고, 퀵 정렬은 평균 O(n log n)이지만 피벗 선택에 따라 최악 O(n²)이 될 수 있다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다.","데이터 크기, 이미 정렬된 정도, 안정성, 메모리 제약에 따라 적절한 정렬을 선택해야 한다.","버블·선택·삽입 정렬은 단순하지만 평균적으로 O(n²)인 경우가 많다. 병합 정렬은 O(n log n)이며 추가 공간을 사용하고, 퀵 정렬은 평균 O(n log n)이지만 피벗 선택에 따라 최악 O(n²)이 될 수 있다. 힙 정렬은 O(n log n)을 보장한다.  이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.\n\n병합 정렬은 배열을 절반씩 분할하고 각 부분을 정렬한 뒤 두 정렬된 부분을 병합한다. 입력에 관계없이 O(n log n)을 보장하고 안정 정렬로 구현할 수 있지만, 배열 구현은 보조 메모리 O(n)이 필요하다. 외부 정렬에도 활용된다.\n\n퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균 O(n log n), 최악 O(n²)이며 피벗 선택과 분할 균형이 성능을 좌우한다. 제자리 정렬 구현이 가능하고 캐시 효율이 좋아 실무에서 널리 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["안정 정렬이란 무엇인가?","병합 정렬과 퀵 정렬의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["탐욕법·분할정복·동적계획법","분할정복은 문제를 작은 독립 하위 문제로 나누고 결과를 결합한다. 탐욕법은 매 단계에서 가장 좋아 보이는 선택을 하고, 동적계획법은 중복되는 하위 문제의 결과를 저장해 재사용한다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 되돌리지 않는다. 구현이 간결하지만 지역 최선이 전역 최적을 보장하지는 않는다. 정당성을 보이려면 탐욕 선택 속성과 최적 부분 구조를 증명해야 한다. 교환 논증은 최적해의 선택을 탐욕 선택으로 바꾸어도 해가 나빠지지 않음을 보이는 방식이다. 최소 신장 트리의 컷 속성은 컷을 가로지르는 최소 간선이 어떤 MST에 포함될 수 있음을 설명한다. 반례가 있으면 DP 등 다른 전략을 검토해야 한다.\n\n문제의 구조에 맞는 설계 전략을 선택해야 정확성과 효율성을 함께 얻을 수 있다.\n\n동적계획법은 메모이제이션(하향식) 또는 테이블을 채우는 타뷸레이션(상향식)으로 구현할 수 있다.\n\n탐욕법은 매 단계에서 가장 좋아 보이는 선택을 하고, 동적계획법은 중복되는 하위 문제의 결과를 저장해 재사용한다.","문제의 구조에 맞는 설계 전략을 선택해야 정확성과 효율성을 함께 얻을 수 있다.","분할정복은 문제를 작은 독립 하위 문제로 나누고 결과를 결합한다. 탐욕법은 매 단계에서 가장 좋아 보이는 선택을 하고, 동적계획법은 중복되는 하위 문제의 결과를 저장해 재사용한다.  탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 이를 되돌리지 않는다. 항상 최적해를 얻는 것은 아니며, 탐욕 선택 속성과 최적 부분 구조 등을 근거로 정당성을 증명해야 한다. 활동 선택, 허프만 부호화, 일부 최소 신장 트리 문제 등이 대표 사례다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["동적계획법을 적용할 수 있는 조건은?","탐욕법이 실패하는 사례를 들 수 있는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["재귀와 점화식","재귀는 함수가 자기 자신을 호출해 문제를 작은 형태로 해결하는 방식이다. 종료 조건이 반드시 필요하며, 실행 비용은 점화식으로 표현해 분석할 수 있다.\n\n재귀는 문제를 더 작은 같은 형태의 문제로 줄여 자기 자신을 호출한다. 기저 사례가 있어야 종료하고 각 호출에서 입력 크기가 기저 사례에 가까워져야 한다. 분할 정복은 문제를 부분 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 병합 정렬의 점화식은 `T(n)=2T(n/2)+O(n)`으로 두 절반을 정렬하고 O(n) 병합을 수행하므로 O(n log n)이다. 동적 계획법은 부분 문제가 겹쳐 계산 결과를 저장한다는 점에서 서로 독립적인 부분 문제를 푸는 분할 정복과 구분된다.\n\n재귀 구조는 트리 탐색, 분할정복, 백트래킹 등을 이해하는 데 중요하다.\n\n재귀 호출은 호출 스택을 사용하므로 깊이가 큰 문제에서는 반복문이나 명시적 스택으로 바꾸는 방법도 고려한다.\n\n종료 조건이 반드시 필요하며, 실행 비용은 점화식으로 표현해 분석할 수 있다.","재귀 구조는 트리 탐색, 분할정복, 백트래킹 등을 이해하는 데 중요하다.","재귀는 함수가 자기 자신을 호출해 문제를 작은 형태로 해결하는 방식이다. 종료 조건이 반드시 필요하며, 실행 비용은 점화식으로 표현해 분석할 수 있다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["재귀와 반복문의 장단점은?","T(n)=2T(n/2)+n의 의미는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["그래프 최단 경로와 최소 신장 트리","다익스트라 알고리즘은 음수 가중치가 없는 그래프에서 한 시작점으로부터 최단 거리를 구한다. 벨만-포드는 음수 간선을 처리하고 음수 사이클을 탐지할 수 있다. 크루스칼과 프림은 모든 정점을 연결하는 최소 신장 트리를 구한다.\n\n최단 경로는 시작 정점에서 다른 정점까지 간선 가중치 합이 최소인 경로다. 다익스트라는 시작점 거리를 0으로 두고 나머지는 무한대로 초기화한 뒤, 현재 알려진 거리 중 가장 작은 정점을 확정하고 인접 간선으로 거리를 완화한다. 모든 간선 가중치가 0 이상이면 가장 작은 거리로 선택된 정점에 이후 더 짧은 경로가 생기지 않는 탐욕적 성질이 성립한다. 음수 간선에서는 이 성질이 깨진다. 인접 리스트와 이진 힙은 보통 O((V+E)log V)이며 parent를 저장하면 경로를 역추적할 수 있다.\n\n최단 경로 알고리즘은 출력 범위와 가중치 조건을 기준으로 선택한다. 비가중 그래프의 단일 시작점은 BFS, 음수 간선이 없는 단일 시작점은 다익스트라, 음수 간선과 음수 사이클 검출은 벨만-포드, 모든 정점 쌍은 플로이드-워셜이 후보가 된다. 다익스트라는 우선순위 큐에서 오래된 거리 후보를 제거해야 중복 삽입 구현이 정확하고 효율적이다. 벨만-포드의 음수 사이클 판정은 시작점에서 도달 가능한 사이클만 대상으로 한다. 플로이드-워셜은 dist 행렬을 초기화할 때 자기 자신은 0, 간선이 없으면 무한대로 설정한다.\n\n최단 경로와 최소 신장 트리는 목적이 다르므로 문제 조건에 따라 알고리즘을 구분해야 한다.\n\n다익스트라는 이미 확정한 최단 거리가 이후에 더 작아지지 않는다는 성질을 이용한다.\n\n다익스트라 알고리즘은 음수 가중치가 없는 그래프에서 한 시작점으로부터 최단 거리를 구한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다. 벨만-포드는 시작 정점에서 도달 가능한 모든 간선을 최대 V-1회 반복해 완화한다. 최단 경로는 음수 사이클이 없으면 단순 경로로 표현할 수 있어 최대 V-1개의 간선을 사용한다. 한 번 더 완화가 가능하면 도달 가능한 음수 사이클을 탐지할 수 있으며 시간복잡도는 O(VE)다.","최단 경로와 최소 신장 트리는 목적이 다르므로 문제 조건에 따라 알고리즘을 구분해야 한다.","다익스트라 알고리즘은 음수 가중치가 없는 그래프에서 한 시작점으로부터 최단 거리를 구한다. 벨만-포드는 음수 간선을 처리하고 음수 사이클을 탐지할 수 있다. 크루스칼과 프림은 모든 정점을 연결하는 최소 신장 트리를 구한다.  그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다.\n\n벨만-포드는 시작 정점에서 도달 가능한 모든 간선을 최대 V-1회 반복해 완화한다. 최단 경로는 음수 사이클이 없으면 단순 경로로 표현할 수 있어 최대 V-1개의 간선을 사용한다. 한 번 더 완화가 가능하면 도달 가능한 음수 사이클을 탐지할 수 있으며 시간복잡도는 O(VE)다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["다익스트라에서 음수 간선을 사용할 수 없는 이유는?","최단 경로와 최소 신장 트리의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["탐색 전략: 백트래킹과 가지치기","백트래킹은 선택을 하나씩 진행하다가 조건을 만족할 수 없으면 이전 단계로 돌아가 다른 선택을 시도하는 탐색 방법이다. 가지치기는 더 살펴볼 필요가 없는 상태를 조기에 제외한다.\n\n백트래킹은 선택을 하나씩 시도하며 부분 해를 확장하고, 현재 선택으로 유효한 완전 해를 만들 수 없으면 이전 단계로 돌아간다. N-Queen은 퀸을 한 행씩 놓으면서 같은 열·대각선 충돌이 있으면 해당 가지를 중단한다. 가지치기는 불가능한 후보를 일찍 제거하는 것이며 유효한 해를 잘못 제거하지 않는다는 근거가 있어야 한다. 분기 한정법은 최적화 문제에서 현재 부분 해의 상한·하한을 계산해 이미 찾은 최적해보다 좋아질 수 없는 가지를 제거한다.\n\n백트래킹은 상태 공간 트리를 탐색하는 것으로 볼 수 있다. 각 노드는 부분 선택이고 자식은 다음 선택을 추가한 상태다. 유망성 검사는 현재 부분 상태가 제약을 만족하는지 또는 완전 해로 확장될 수 있는지 판단한다. N-Queen에서는 열과 두 대각선 점유 여부를 배열로 관리해 매번 모든 퀸을 비교하는 비용을 줄일 수 있다. 최악 시간복잡도는 지수적일 수 있지만 가지치기가 강하면 실제 탐색량을 크게 줄인다. 가지치기 조건은 해를 제거하지 않는다는 논리적 근거가 필요하다.\n\n경우의 수가 많은 조합·순열·퍼즐 문제를 체계적으로 탐색할 수 있다.\n\n가지치기 조건은 해당 경로에서 해답이 나올 수 없다는 근거가 있어야 한다.\n\n백트래킹은 선택을 하나씩 진행하다가 조건을 만족할 수 없으면 이전 단계로 돌아가 다른 선택을 시도하는 탐색 방법이다. 백트래킹은 가능한 선택을 하나씩 시도하고, 현재 부분 상태가 제약을 위반하거나 해가 될 가능성이 없으면 해당 탐색 가지를 되돌아가는 완전 탐색 기법이다.","경우의 수가 많은 조합·순열·퍼즐 문제를 체계적으로 탐색할 수 있다.","백트래킹은 선택을 하나씩 진행하다가 조건을 만족할 수 없으면 이전 단계로 돌아가 다른 선택을 시도하는 탐색 방법이다. 가지치기는 더 살펴볼 필요가 없는 상태를 조기에 제외한다.  백트래킹은 가능한 선택을 하나씩 시도하고, 현재 부분 상태가 제약을 위반하거나 해가 될 가능성이 없으면 해당 탐색 가지를 되돌아가는 완전 탐색 기법이다. 상태 공간 트리를 탐색하며 가지치기로 불필요한 경우를 줄인다. 최악 시간복잡도는 지수적일 수 있어 탐색 순서와 가지치기 조건이 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["완전탐색과 백트래킹의 차이는?","가지치기가 정답을 누락하지 않으려면?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["알고리즘 정확성·종료성·불변식","알고리즘은 유한한 단계 안에 종료하고 명세된 입력에 대해 올바른 결과를 내야 한다. 반복문 불변식은 반복 전후에 유지되는 성질을 이용해 알고리즘의 정확성을 설명하는 방법이다.\n\n알고리즘은 입력을 받아 유한한 단계 안에 요구된 출력을 만드는 명확한 절차다. 정확성은 모든 유효한 입력에서 결과가 맞는지, 종료성은 반드시 끝나는지, 효율성은 시간과 메모리를 얼마나 쓰는지로 평가한다. 점근 분석은 입력 크기 n이 커질 때 연산량 증가율을 비교한다. O(n²)은 n이 두 배가 되면 연산량이 대략 네 배가 될 수 있고 O(n log n)은 더 완만하게 증가한다. Big-O는 상한 표기이며 항상 최악 시간과 같은 뜻은 아니다. 최선·평균·최악 조건과 입력 가정을 명시해야 한다.\n\n빠른 프로그램이라도 잘못된 결과를 내면 좋은 알고리즘이 아니다. 정확성과 효율성을 함께 평가해야 한다.\n\n교육에서는 정답 코드만 제시하기보다 학생이 알고리즘의 근거와 예외 상황을 설명하도록 하는 것이 중요하다.\n\n반복문 불변식은 반복 전후에 유지되는 성질을 이용해 알고리즘의 정확성을 설명하는 방법이다. 알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다.","빠른 프로그램이라도 잘못된 결과를 내면 좋은 알고리즘이 아니다. 정확성과 효율성을 함께 평가해야 한다.","알고리즘은 유한한 단계 안에 종료하고 명세된 입력에 대해 올바른 결과를 내야 한다. 반복문 불변식은 반복 전후에 유지되는 성질을 이용해 알고리즘의 정확성을 설명하는 방법이다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["시간복잡도가 낮아도 잘못된 알고리즘일 수 있는가?","반복문 불변식의 세 단계는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["이진 탐색과 탐색 공간 축소","이진 탐색은 정렬된 데이터에서 중간 원소와 비교해 탐색 범위를 절반씩 줄이는 알고리즘이다. 시간복잡도는 O(log n)이지만 정렬 상태라는 전제와 경계 조건 처리가 중요하다.\n\n선형 탐색은 첫 원소부터 차례로 비교하므로 정렬 여부와 관계없이 쓸 수 있지만 최악 O(n)이다. 이진 탐색은 정렬된 배열에서 중간값과 비교해 탐색 범위를 절반씩 줄여 O(log n)을 얻는다. `low`, `high`, `mid`의 범위를 일관되게 정의해야 경계 누락과 무한 반복을 막는다. 배열은 중간 원소 접근이 O(1)이지만 연결 리스트는 중간 접근 자체가 O(n)이므로 이진 탐색의 장점이 줄어든다.\n\n이진 탐색은 정확한 중간 인덱스를 찾는 것 외에도 lower_bound(처음으로 값 이상인 위치), upper_bound(처음으로 값보다 큰 위치)를 찾는 데 활용된다. 중복 원소가 있을 때 단순히 일치하는 원소를 찾는 것과 첫 번째·마지막 위치를 찾는 것은 다른 문제다. 이진 탐색의 핵심은 매 반복에서 탐색 구간을 줄이는 불변식을 유지하는 것이다. 정렬된 배열 외에도 단조 증가·감소하는 조건이나 참에서 거짓으로 한 번만 바뀌는 판정 함수의 경계값을 찾을 때 적용할 수 있다.\n\n효율적인 탐색의 원리와 전제 조건을 명확히 설명할 수 있다.\n\n중복 원소가 있을 때 첫 위치나 마지막 위치를 찾으려면 경계 탐색 방식으로 변형할 수 있다.\n\n이진 탐색은 정렬된 데이터에서 중간 원소와 비교해 탐색 범위를 절반씩 줄이는 알고리즘이다. 시간복잡도는 O(log n)이지만 정렬 상태라는 전제와 경계 조건 처리가 중요하다. 이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다.","효율적인 탐색의 원리와 전제 조건을 명확히 설명할 수 있다.","이진 탐색은 정렬된 데이터에서 중간 원소와 비교해 탐색 범위를 절반씩 줄이는 알고리즘이다. 시간복잡도는 O(log n)이지만 정렬 상태라는 전제와 경계 조건 처리가 중요하다.  이진 탐색은 정렬된 탐색 범위의 중간값과 목표를 비교해 절반을 버리는 알고리즘이다. 반복마다 탐색 범위가 절반이 되어 O(log n)이지만 데이터가 정렬되어 있어야 하고, 배열처럼 중간 원소에 빠르게 접근할 수 있는 구조에 적합하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["정렬되지 않은 데이터에 바로 사용할 수 있는가?","이진 탐색에서 무한 루프가 생기는 이유는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["최소 신장 트리: 크루스칼과 프림","최소 신장 트리(MST)는 연결된 무방향 가중치 그래프에서 모든 정점을 연결하고 사이클을 포함하지 않으면서 선택한 간선 가중치의 합이 최소인 트리다. 정점이 V개인 신장 트리는 간선이 V-1개다. 네트워크·도로·전력망을 전체 연결 비용이 최소가 되도록 구축하는 문제에 활용한다.\n\n최소 신장 트리는 연결된 무방향 가중 그래프의 모든 정점을 사이클 없이 연결하는 간선 집합 중 가중치 합이 최소인 트리다. 정점 V개인 신장 트리는 V-1개 간선을 가진다. 네트워크 케이블·전력망처럼 전체 연결 비용을 줄이는 데 활용한다. MST는 한 시작점에서 다른 정점까지의 최단 경로 트리와 다르다. MST의 두 정점 사이 경로가 원래 그래프의 최단 경로라는 보장은 없다. 그래프가 비연결이면 최소 신장 트리가 아니라 각 연결 요소의 최소 신장 숲을 구한다.\n\nMST의 컷 속성은 정점을 두 집합으로 나누는 컷을 가로지르는 최소 가중치 간선이 어떤 MST에 포함될 수 있음을 말한다. 크루스칼은 전체 간선을 정렬하고 DSU로 사이클을 확인하므로 간선이 적은 희소 그래프에 적합하다. 프림은 현재 트리 경계의 최소 간선을 반복 선택해 성장하므로 인접 행렬 기반의 조밀 그래프 구현에서 O(V²)을 사용할 수 있다. 두 알고리즘은 모두 음수 간선 가중치를 허용한다. 간선 가중치가 같으면 MST가 여러 개일 수 있지만 최소 비용은 동일하다.\n\n최소 신장 트리(MST)는 연결된 무방향 가중치 그래프에서 모든 정점을 연결하고 사이클을 포함하지 않으면서 선택한 간선 가중치의 합이 최소인 트리다. 네트워크·도로·전력망을 전체 연결 비용이 최소가 되도록 구축하는 문제에 활용한다. 모든 간선을 가중치 오름차순으로 정렬하고 가장 작은 간선부터 선택하되, 사이클을 만드는 간선은 제외한다. 두 정점의 대표가 같으면 이미 같은 연결 요소에 있으므로 간선을 추가하지 않고, 다르면 간선을 선택한 뒤 두 집합을 합친다. 임의의 정점에서 시작해 현재 트리에 속한 정점과 속하지 않은 정점을 연결하는 간선 중 최소 가중치 간선을 선택해 새 정점을 추가한다. 우선순위 큐와 인접 리스트를 사용하면 O(E log V)로 구현할 수 있다. MST는 특정 두 정점 사이의 최단 경로를 구하는 문제와 다르며, 그래프가 연결되지 않았다면 최소 신장 숲을 구한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다.\n\n```text\n간선을 가중치 오름차순으로 정렬\n각 간선 (u, v, w)에 대해:\n    find(u) != find(v)이면 간선 선택\n    union(u, v) 수행\n    선택 간선이 V-1개면 종료\n```","","최소 신장 트리(MST)는 연결된 무방향 가중치 그래프에서 모든 정점을 연결하고 사이클을 포함하지 않으면서 선택한 간선 가중치의 합이 최소인 트리다. 정점이 V개인 신장 트리는 간선이 V-1개다. 네트워크·도로·전력망을 전체 연결 비용이 최소가 되도록 구축하는 문제에 활용한다.\n\n크루스칼은 간선 중심 알고리즘이다. 모든 간선을 가중치 오름차순으로 정렬하고 가장 작은 간선부터 선택하되, 사이클을 만드는 간선은 제외한다. 사이클 판별에는 유니온 파인드를 사용한다. 두 정점의 대표가 같으면 이미 같은 연결 요소에 있으므로 간선을 추가하지 않고, 다르면 간선을 선택한 뒤 두 집합을 합친다. 시간복잡도는 O(E log E)다.\n\n프림은 정점 중심 알고리즘이다. 임의의 정점에서 시작해 현재 트리에 속한 정점과 속하지 않은 정점을 연결하는 간선 중 최소 가중치 간선을 선택해 새 정점을 추가한다. 우선순위 큐와 인접 리스트를 사용하면 O(E log V)로 구현할 수 있다.\n\n크루스칼은 간선을 정렬해 선택하고 프림은 하나의 트리를 계속 확장한다. 두 알고리즘 모두 연결된 무방향 가중치 그래프에서 MST를 구한다. MST는 특정 두 정점 사이의 최단 경로를 구하는 문제와 다르며, 그래프가 연결되지 않았다면 최소 신장 숲을 구한다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 유니온 파인드로 두 정점이 이미 같은 집합인지 확인하고, 다르면 합친다. 정렬이 지배해 O(E log E)에 동작하며 희소 그래프에서 자주 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["크루스칼에서 유니온 파인드를 사용하는 이유는?","프림과 크루스칼의 차이는?","MST와 최단 경로의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["동적계획법의 상태·점화식·초기값","동적계획법은 문제를 상태로 정의하고 상태 사이의 관계를 점화식으로 표현한 뒤 작은 문제부터 계산하거나 결과를 저장한다. 상태 정의, 전이, 초기값, 계산 순서가 핵심이다.\n\n재귀는 문제를 더 작은 같은 형태의 문제로 줄여 자기 자신을 호출한다. 기저 사례가 있어야 종료하고 각 호출에서 입력 크기가 기저 사례에 가까워져야 한다. 분할 정복은 문제를 부분 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 병합 정렬의 점화식은 `T(n)=2T(n/2)+O(n)`으로 두 절반을 정렬하고 O(n) 병합을 수행하므로 O(n log n)이다. 동적 계획법은 부분 문제가 겹쳐 계산 결과를 저장한다는 점에서 서로 독립적인 부분 문제를 푸는 분할 정복과 구분된다.\n\nDP 문제를 외우는 것이 아니라 스스로 설계하는 절차를 설명할 수 있다.\n\n상태 정의가 지나치게 단순하면 필요한 정보가 빠지고 지나치게 복잡하면 메모리와 시간 사용량이 커진다.\n\n동적계획법은 문제를 상태로 정의하고 상태 사이의 관계를 점화식으로 표현한 뒤 작은 문제부터 계산하거나 결과를 저장한다.","DP 문제를 외우는 것이 아니라 스스로 설계하는 절차를 설명할 수 있다.","동적계획법은 문제를 상태로 정의하고 상태 사이의 관계를 점화식으로 표현한 뒤 작은 문제부터 계산하거나 결과를 저장한다. 상태 정의, 전이, 초기값, 계산 순서가 핵심이다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["메모이제이션과 타뷸레이션의 차이는?","DP 상태를 잘못 정의하면 어떤 문제가 생기는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["탐욕 알고리즘의 정당성 증명","탐욕 알고리즘은 매 단계에서 현재 가장 유리해 보이는 선택을 하고 이를 되돌리지 않는 알고리즘 설계 기법이다. 국소적으로 좋은 선택이 전체 최적해를 보장하는 것은 아니므로 적용 가능성을 증명해야 한다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 유리해 보이는 선택을 하고 이를 되돌리지 않는 알고리즘 설계 기법이다. 국소적으로 좋은 선택이 전체 최적해를 보장하는 것은 아니므로 적용 가능성을 증명해야 한다. 교환 논증은 탐욕 선택을 포함하지 않는 최적해가 있다고 가정한 뒤, 그 해의 일부 선택을 탐욕 선택으로 교체해도 유효성과 최적성이 유지됨을 보이는 방식이다. 반면 0-1 배낭 문제에서 가치/무게 비율이 높은 물건부터 고르는 탐욕법은 일반적으로 최적해를 보장하지 않는다. 따라서 알고리즘 설계에서는 문제의 구조를 확인하고 탐욕법, DP, 분할 정복 중 적절한 방법을 선택해야 한다. 탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 이를 되돌리지 않는다. 항상 최적해를 얻는 것은 아니며, 탐욕 선택 속성과 최적 부분 구조 등을 근거로 정당성을 증명해야 한다.","","탐욕 알고리즘은 매 단계에서 현재 가장 유리해 보이는 선택을 하고 이를 되돌리지 않는 알고리즘 설계 기법이다. 국소적으로 좋은 선택이 전체 최적해를 보장하는 것은 아니므로 적용 가능성을 증명해야 한다.\n\n교환 논증은 탐욕 선택을 포함하지 않는 최적해가 있다고 가정한 뒤, 그 해의 일부 선택을 탐욕 선택으로 교체해도 유효성과 최적성이 유지됨을 보이는 방식이다. 이 과정을 반복해 탐욕 선택을 포함하는 최적해가 존재함을 증명한다. 최소 신장 트리에서는 컷 속성이 사용된다. 정점을 두 집합으로 나누는 컷을 가로지르는 최소 가중치 간선은 어떤 MST에 포함될 수 있다는 성질이다.\n\n반면 0-1 배낭 문제에서 가치/무게 비율이 높은 물건부터 고르는 탐욕법은 일반적으로 최적해를 보장하지 않는다. 따라서 알고리즘 설계에서는 문제의 구조를 확인하고 탐욕법, DP, 분할 정복 중 적절한 방법을 선택해야 한다.  0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 방식으로 무게 제한 안에서 가치를 최대화한다. dp[i][w]를 i번째 물건까지 고려해 용량 w에서 얻는 최대 가치로 정의하면 선택하지 않는 경우와 선택하는 경우의 최댓값을 비교한다. 1차원 배열 최적화 시 같은 물건을 한 번만 쓰도록 용량을 내림차순으로 갱신한다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 이를 되돌리지 않는다. 항상 최적해를 얻는 것은 아니며, 탐욕 선택 속성과 최적 부분 구조 등을 근거로 정당성을 증명해야 한다. 활동 선택, 허프만 부호화, 일부 최소 신장 트리 문제 등이 대표 사례다.\n\n분할 정복은 문제를 독립적인 작은 하위 문제로 나누고 각각 해결한 뒤 결과를 결합한다. 분할·정복·결합 단계로 설명하며 병합 정렬, 퀵 정렬, 이진 탐색이 대표적이다. 점화식과 마스터 정리로 시간복잡도를 분석할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["탐욕법이 항상 최적해를 보장하지 않는 이유는?","교환 논증과 컷 속성은 무엇인가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["그래프 위상 정렬과 사이클","위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 앞에 오도록 정점을 나열하는 것이다. 진입 차수를 이용한 큐 방식이나 DFS로 구현할 수 있다.\n\n위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 먼저 오도록 정점을 나열한다. 선수 과목·빌드 의존성·작업 순서에 사용한다. Kahn 알고리즘은 진입 차수가 0인 정점을 큐에 넣고 하나씩 꺼내 결과에 추가하면서 이웃의 진입 차수를 줄인다. 결과에 포함된 정점 수가 V보다 작으면 사이클이 존재한다. DFS 방식은 방문 중인 정점을 다시 만나는지 확인해 사이클을 찾고 종료 순서의 역순을 출력한다. 인접 리스트에서 O(V+E)다.\n\n과목 선수 관계, 빌드 순서, 작업 의존성 등 순서 제약 문제에 활용된다.\n\n서로 의존성이 없는 정점의 순서는 여러 가지가 될 수 있으므로 결과가 여러 개 존재할 수 있다.\n\n위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 앞에 오도록 정점을 나열하는 것이다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다.\n\n```text\n모든 정점의 진입 차수 계산\n진입 차수가 0인 정점을 큐에 삽입\n큐가 빌 때까지:\n    u를 꺼내 결과에 추가\n    u에서 나가는 간선의 이웃 진입 차수 감소\n    0이 된 이웃을 큐에 삽입\n결과 정점 수가 V보다 작으면 사이클 존재\n```","과목 선수 관계, 빌드 순서, 작업 의존성 등 순서 제약 문제에 활용된다.","위상 정렬은 방향 비순환 그래프(DAG)에서 모든 간선 u→v에 대해 u가 v보다 앞에 오도록 정점을 나열하는 것이다. 진입 차수를 이용한 큐 방식이나 DFS로 구현할 수 있다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n깊이 우선 탐색은 한 경로를 가능한 깊게 따라간 뒤 더 진행할 수 없으면 되돌아온다. 재귀 또는 명시적 스택으로 구현하며 연결 요소, 사이클 탐지, 위상 정렬, 백트래킹의 기반이 된다. 재귀 깊이가 큰 입력에서는 호출 스택 한계를 고려한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["위상 정렬이 가능한 그래프 조건은?","위상 정렬 결과는 항상 하나인가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["정렬 알고리즘과 안정성","버블·선택·삽입 정렬은 단순하지만 평균적으로 O(n²)인 경우가 많고, 병합·힙·퀵 정렬은 일반적으로 더 큰 데이터에 효율적이다. 안정 정렬은 같은 키를 가진 원소의 상대적 순서를 보존한다.\n\n버블 정렬은 인접 원소를 비교해 교환하고 선택 정렬은 매 단계 최솟값을 앞으로 보내며 삽입 정렬은 정렬된 앞부분에 원소를 끼워 넣는다. 세 방식은 보통 O(n²)이지만 구현이 단순하고 삽입 정렬은 거의 정렬된 입력에서 효율적이다. 병합 정렬은 절반으로 나누고 정렬 결과를 병합해 O(n log n)을 보장하지만 보조 배열이 필요하다. 퀵 정렬은 피벗 기준으로 분할해 평균 O(n log n), 최악 O(n²)이며 피벗 선택이 중요하다. 힙 정렬은 O(n log n)을 보장하고 추가 배열 없이 구현할 수 있지만 보통 안정 정렬은 아니다. 안정 정렬은 키가 같은 레코드의 기존 상대 순서를 유지해 다중 기준 정렬에 유용하다.\n\n정렬 알고리즘은 비교 기반인지 비비교 기반인지도 구분할 수 있다. 비교 기반 정렬은 원소 간 대소 비교만으로 정렬하므로 일반적인 모델에서 최악 O(n log n)보다 빠른 비교 횟수를 보장할 수 없다. 계수 정렬은 키 범위가 작고 정수인 경우 빈도를 세어 O(n+k)에 정렬할 수 있고, 기수 정렬은 자릿수별 안정 정렬을 반복한다. 이들은 키 범위나 자릿수에 대한 가정을 활용하므로 모든 입력에 비교 정렬보다 유리한 것은 아니다. 실무 정렬은 작은 구간에 삽입 정렬을 섞거나 안정성과 최악 성능을 고려한 하이브리드 방식을 사용한다.\n\n정렬 알고리즘의 시간·공간복잡도와 데이터 특성에 따른 선택 기준을 비교할 수 있다.\n\n학생 성적을 점수순으로 정렬한 뒤 같은 점수 학생의 기존 이름순을 유지해야 한다면 안정 정렬이 유용하다.\n\n버블·선택·삽입 정렬은 단순하지만 평균적으로 O(n²)인 경우가 많고, 병합·힙·퀵 정렬은 일반적으로 더 큰 데이터에 효율적이다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균·최악 O(n²)이지만 거의 정렬된 작은 입력에서는 이동량이 적고 구현이 간단하다.","정렬 알고리즘의 시간·공간복잡도와 데이터 특성에 따른 선택 기준을 비교할 수 있다.","버블·선택·삽입 정렬은 단순하지만 평균적으로 O(n²)인 경우가 많고, 병합·힙·퀵 정렬은 일반적으로 더 큰 데이터에 효율적이다. 안정 정렬은 같은 키를 가진 원소의 상대적 순서를 보존한다.  이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.\n\n퀵 정렬은 피벗을 정해 작은 값과 큰 값으로 분할한 뒤 각 부분을 재귀 정렬한다. 평균 O(n log n), 최악 O(n²)이며 피벗 선택과 분할 균형이 성능을 좌우한다. 제자리 정렬 구현이 가능하고 캐시 효율이 좋아 실무에서 널리 쓰인다.\n\n삽입 정렬은 정렬된 앞부분에 다음 원소를 알맞은 위치로 삽입한다. 평균·최악 O(n²)이지만 거의 정렬된 작은 입력에서는 이동량이 적고 구현이 간단하다. 일반적인 구현은 안정 정렬이다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["안정 정렬이 필요한 사례는?","퀵 정렬의 최악 시간복잡도는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["시간복잡도·공간복잡도와 점근 표기법","시간복잡도는 입력 크기에 따라 연산량이 어떻게 증가하는지, 공간복잡도는 필요한 추가 메모리가 어떻게 증가하는지 나타낸다. Big-O는 점근적 상한을 표현하며 실제 실행 시간과 동일한 값은 아니다.\n\n알고리즘은 입력을 받아 유한한 단계 안에 요구된 출력을 만드는 명확한 절차다. 정확성은 모든 유효한 입력에서 결과가 맞는지, 종료성은 반드시 끝나는지, 효율성은 시간과 메모리를 얼마나 쓰는지로 평가한다. 점근 분석은 입력 크기 n이 커질 때 연산량 증가율을 비교한다. O(n²)은 n이 두 배가 되면 연산량이 대략 네 배가 될 수 있고 O(n log n)은 더 완만하게 증가한다. Big-O는 상한 표기이며 항상 최악 시간과 같은 뜻은 아니다. 최선·평균·최악 조건과 입력 가정을 명시해야 한다.\n\n알고리즘의 효율성을 입력 규모 관점에서 비교하고 현실적인 제약을 판단할 수 있다.\n\n같은 O(n) 알고리즘이라도 상수 계수, 캐시 효율, 입력 분포에 따라 실제 속도는 달라질 수 있다.\n\n시간복잡도는 입력 크기에 따라 연산량이 어떻게 증가하는지, 공간복잡도는 필요한 추가 메모리가 어떻게 증가하는지 나타낸다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다.","알고리즘의 효율성을 입력 규모 관점에서 비교하고 현실적인 제약을 판단할 수 있다.","시간복잡도는 입력 크기에 따라 연산량이 어떻게 증가하는지, 공간복잡도는 필요한 추가 메모리가 어떻게 증가하는지 나타낸다. Big-O는 점근적 상한을 표현하며 실제 실행 시간과 동일한 값은 아니다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["O(n log n)과 O(n²)은 큰 입력에서 어떻게 차이가 나는가?","시간복잡도와 실제 수행 시간은 항상 비례하는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["백트래킹과 가지치기","백트래킹은 선택 가능한 후보를 탐색하면서 조건을 만족하지 않는 경로를 조기에 중단하는 탐색 기법이다. 완전 탐색을 기반으로 하지만 가지치기로 불필요한 경우를 줄인다.\n\n백트래킹은 선택을 하나씩 시도하며 부분 해를 확장하고, 현재 선택으로 유효한 완전 해를 만들 수 없으면 이전 단계로 돌아간다. N-Queen은 퀸을 한 행씩 놓으면서 같은 열·대각선 충돌이 있으면 해당 가지를 중단한다. 가지치기는 불가능한 후보를 일찍 제거하는 것이며 유효한 해를 잘못 제거하지 않는다는 근거가 있어야 한다. 분기 한정법은 최적화 문제에서 현재 부분 해의 상한·하한을 계산해 이미 찾은 최적해보다 좋아질 수 없는 가지를 제거한다.\n\n백트래킹은 상태 공간 트리를 탐색하는 것으로 볼 수 있다. 각 노드는 부분 선택이고 자식은 다음 선택을 추가한 상태다. 유망성 검사는 현재 부분 상태가 제약을 만족하는지 또는 완전 해로 확장될 수 있는지 판단한다. N-Queen에서는 열과 두 대각선 점유 여부를 배열로 관리해 매번 모든 퀸을 비교하는 비용을 줄일 수 있다. 최악 시간복잡도는 지수적일 수 있지만 가지치기가 강하면 실제 탐색량을 크게 줄인다. 가지치기 조건은 해를 제거하지 않는다는 논리적 근거가 필요하다.\n\n순열·조합·스도쿠·N-퀸 등 제약 조건이 있는 탐색 문제를 설명할 수 있다.\n\n가지치기 조건은 해당 경로 아래에 유효한 해가 존재할 수 없음을 보장해야 한다.","순열·조합·스도쿠·N-퀸 등 제약 조건이 있는 탐색 문제를 설명할 수 있다.","백트래킹은 선택 가능한 후보를 탐색하면서 조건을 만족하지 않는 경로를 조기에 중단하는 탐색 기법이다. 완전 탐색을 기반으로 하지만 가지치기로 불필요한 경우를 줄인다.  백트래킹은 가능한 선택을 하나씩 시도하고, 현재 부분 상태가 제약을 위반하거나 해가 될 가능성이 없으면 해당 탐색 가지를 되돌아가는 완전 탐색 기법이다. 상태 공간 트리를 탐색하며 가지치기로 불필요한 경우를 줄인다. 최악 시간복잡도는 지수적일 수 있어 탐색 순서와 가지치기 조건이 중요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["백트래킹과 DFS의 관계는?","가지치기가 정답을 놓치지 않으려면?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["P와 NP, 계산 가능성과 난해성","P는 다항 시간에 풀 수 있는 결정 문제의 집합이고 NP는 제시된 해답을 다항 시간에 검증할 수 있는 문제의 집합이다. P가 NP에 포함된다는 것은 알려져 있지만 P와 NP가 같은지는 미해결 문제다.\n\nP는 결정 문제 중 다항 시간에 풀 수 있는 문제의 집합이고 NP는 '예'인 답의 증명서를 다항 시간에 검증할 수 있는 문제의 집합이다. P가 NP에 포함되는 것은 알려져 있지만 P=NP인지는 미해결이다. NP-hard는 NP의 모든 문제가 다항 시간 환원될 만큼 어려운 문제이며 반드시 NP에 속할 필요는 없다. NP-complete는 NP에 속하면서 NP-hard인 문제다. 어려운 최적화 문제에서는 근사 알고리즘·휴리스틱·제한된 입력의 정확 알고리즘 등을 활용한다.\n\n다항 시간 환원은 한 문제의 입력을 다른 문제의 입력으로 효율적으로 변환해 해답을 보존하는 방법이다. A가 B로 다항 시간 환원되고 B를 빠르게 풀 수 있다면 A도 빠르게 풀 수 있다. NP-완전성을 보이려면 해당 문제가 NP에 속함을 보이고 이미 알려진 NP-완전 문제를 그 문제로 환원해 NP-hard임을 보인다. NP-hard는 최적화 문제나 결정 불가능 문제에도 적용될 수 있으므로 NP와 동일하지 않다. 복잡도 분류는 특정 구현의 속도 측정이 아니라 문제 규모가 커질 때 필요한 자원의 이론적 증가를 다룬다.\n\n모든 문제를 빠르게 해결할 수 있는 것은 아니며 근사·휴리스틱이 필요한 이유를 이해할 수 있다.\n\nNP-완전은 NP에 속하는 조건이 있고, NP-난해는 NP에 속하지 않는 문제까지 포함할 수 있다.","모든 문제를 빠르게 해결할 수 있는 것은 아니며 근사·휴리스틱이 필요한 이유를 이해할 수 있다.","P는 다항 시간에 풀 수 있는 결정 문제의 집합이고 NP는 제시된 해답을 다항 시간에 검증할 수 있는 문제의 집합이다. P가 NP에 포함된다는 것은 알려져 있지만 P와 NP가 같은지는 미해결 문제다.  알고리즘의 정확성은 모든 유효한 입력에서 요구한 결과를 내는지로 판단하고, 효율성은 시간·공간 자원으로 분석한다. 최악·평균·최선 시간복잡도는 서로 다른 관점이므로 문제 조건과 입력 특성에 맞게 제시해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["P와 NP의 차이를 쉽게 설명해보세요.","NP-완전과 NP-난해는 어떻게 다른가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["다익스트라 알고리즘과 최단 경로","다익스트라(Dijkstra)는 모든 간선 가중치가 0 이상인 그래프에서 하나의 시작 정점으로부터 다른 모든 정점까지의 최단 거리를 구하는 탐욕 알고리즘이다. 시작 정점의 거리를 0, 나머지를 무한대로 초기화하고, 아직 확정되지 않은 정점 중 현재 거리가 가장 작은 정점을 선택한다.\n\n최단 경로는 시작 정점에서 다른 정점까지 간선 가중치 합이 최소인 경로다. 다익스트라는 시작점 거리를 0으로 두고 나머지는 무한대로 초기화한 뒤, 현재 알려진 거리 중 가장 작은 정점을 확정하고 인접 간선으로 거리를 완화한다. 모든 간선 가중치가 0 이상이면 가장 작은 거리로 선택된 정점에 이후 더 짧은 경로가 생기지 않는 탐욕적 성질이 성립한다. 음수 간선에서는 이 성질이 깨진다. 인접 리스트와 이진 힙은 보통 O((V+E)log V)이며 parent를 저장하면 경로를 역추적할 수 있다.\n\n최단 경로 알고리즘은 출력 범위와 가중치 조건을 기준으로 선택한다. 비가중 그래프의 단일 시작점은 BFS, 음수 간선이 없는 단일 시작점은 다익스트라, 음수 간선과 음수 사이클 검출은 벨만-포드, 모든 정점 쌍은 플로이드-워셜이 후보가 된다. 다익스트라는 우선순위 큐에서 오래된 거리 후보를 제거해야 중복 삽입 구현이 정확하고 효율적이다. 벨만-포드의 음수 사이클 판정은 시작점에서 도달 가능한 사이클만 대상으로 한다. 플로이드-워셜은 dist 행렬을 초기화할 때 자기 자신은 0, 간선이 없으면 무한대로 설정한다.\n\n다익스트라(Dijkstra)는 모든 간선 가중치가 0 이상인 그래프에서 하나의 시작 정점으로부터 다른 모든 정점까지의 최단 거리를 구하는 탐욕 알고리즘이다. 시작 정점의 거리를 0, 나머지를 무한대로 초기화하고, 아직 확정되지 않은 정점 중 현재 거리가 가장 작은 정점을 선택한다. 선택한 정점 u에서 인접한 정점 v로 가는 간선의 가중치가 w라면 dist[u]+w가 기존 dist[v]보다 작은지 확인한다. 더 작으면 dist[v]를 갱신하는데 이를 간선 완화(relaxation)라고 한다. 우선순위 큐를 사용하면 가장 작은 거리를 가진 정점을 효율적으로 선택할 수 있다. 인접 리스트와 이진 힙을 사용하는 구현은 O((V+E)log V), 배열로 매번 최소 정점을 찾는 구현은 O(V²)이다. 모든 가중치가 음수가 아니어야 하는 이유는, 가장 작은 거리의 정점을 선택한 순간 그 정점의 거리가 최종 최단 거리라고 확정하기 때문이다. 음수 간선이 있으면 나중에 더 짧은 경로가 발견될 수 있어 이 성질이 성립하지 않는다. 음수 간선이 있으면 벨만-포드를 사용하고, 모든 정점 쌍의 최단 거리를 구하려면 플로이드-워셜을 고려한다. 최단 경로 자체를 출력하려면 거리가 갱신될 때 이전 정점을 predecessor 배열에 저장한 뒤 목적지에서 시작점까지 역으로 추적한다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.\n\n```text\n거리[start] = 0\n우선순위 큐에 (0, start) 삽입\n큐가 빌 때까지:\n    (d, u) = 최솟값 추출\n    d != 거리[u]이면 오래된 후보이므로 건너뜀\n    각 간선 (u, v, w)에 대해:\n        거리[u] + w < 거리[v]이면 거리[v] 갱신\n        parent[v] = u 기록 후 큐에 삽입\n```\n모든 간선 가중치가 0 이상이어야 한다.","","다익스트라(Dijkstra)는 모든 간선 가중치가 0 이상인 그래프에서 하나의 시작 정점으로부터 다른 모든 정점까지의 최단 거리를 구하는 탐욕 알고리즘이다. 시작 정점의 거리를 0, 나머지를 무한대로 초기화하고, 아직 확정되지 않은 정점 중 현재 거리가 가장 작은 정점을 선택한다.\n\n선택한 정점 u에서 인접한 정점 v로 가는 간선의 가중치가 w라면 dist[u]+w가 기존 dist[v]보다 작은지 확인한다. 더 작으면 dist[v]를 갱신하는데 이를 간선 완화(relaxation)라고 한다. 우선순위 큐를 사용하면 가장 작은 거리를 가진 정점을 효율적으로 선택할 수 있다. 인접 리스트와 이진 힙을 사용하는 구현은 O((V+E)log V), 배열로 매번 최소 정점을 찾는 구현은 O(V²)이다.\n\n모든 가중치가 음수가 아니어야 하는 이유는, 가장 작은 거리의 정점을 선택한 순간 그 정점의 거리가 최종 최단 거리라고 확정하기 때문이다. 음수 간선이 있으면 나중에 더 짧은 경로가 발견될 수 있어 이 성질이 성립하지 않는다. 음수 간선이 있으면 벨만-포드를 사용하고, 모든 정점 쌍의 최단 거리를 구하려면 플로이드-워셜을 고려한다.\n\n최단 경로 자체를 출력하려면 거리가 갱신될 때 이전 정점을 predecessor 배열에 저장한 뒤 목적지에서 시작점까지 역으로 추적한다. 도달할 수 없는 정점은 거리가 무한대로 남는다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["다익스트라에서 음수 간선을 허용하지 않는 이유는?","간선 완화란 무엇인가?","다익스트라와 벨만-포드의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["벨만-포드 알고리즘","벨만-포드는 단일 시작점에서 모든 정점까지의 최단 거리를 구하며 음수 가중치 간선을 허용한다. 음수 간선이 있어도 동작하는 이유는 다익스트라처럼 정점을 한 번 확정하지 않고, 모든 간선을 반복해서 완화하기 때문이다. 시작점 거리를 0, 나머지를 무한대로 초기화한 뒤 모든 간선 (u,v,w)에 대해 dist[u]가 유한하면 dist[v]=min(dist[v],dist[u]+w)로 갱신한다.\n\n벨만-포드는 음수 가중치 간선이 있는 그래프의 단일 시작점 최단 경로를 계산한다. 간선 (u,v,w)에 대해 `dist[u]+w < dist[v]`이면 dist[v]를 갱신하는 완화를 수행한다. 시작점에서 도달 가능한 음수 사이클이 없으면 최단 경로를 단순 경로로 만들 수 있고 정점 V개인 단순 경로는 최대 V-1개 간선을 사용한다. 따라서 모든 간선을 V-1회 완화한 뒤 한 번 더 완화가 가능하면 도달 가능한 음수 사이클이 존재한다. 시간복잡도는 O(VE)이며 도달 불가능한 정점의 무한대 거리에서 완화하지 않도록 주의한다.\n\n최단 경로 알고리즘은 출력 범위와 가중치 조건을 기준으로 선택한다. 비가중 그래프의 단일 시작점은 BFS, 음수 간선이 없는 단일 시작점은 다익스트라, 음수 간선과 음수 사이클 검출은 벨만-포드, 모든 정점 쌍은 플로이드-워셜이 후보가 된다. 다익스트라는 우선순위 큐에서 오래된 거리 후보를 제거해야 중복 삽입 구현이 정확하고 효율적이다. 벨만-포드의 음수 사이클 판정은 시작점에서 도달 가능한 사이클만 대상으로 한다. 플로이드-워셜은 dist 행렬을 초기화할 때 자기 자신은 0, 간선이 없으면 무한대로 설정한다.\n\n벨만-포드는 단일 시작점에서 모든 정점까지의 최단 거리를 구하며 음수 가중치 간선을 허용한다. 벨만-포드는 시작 정점에서 도달 가능한 모든 간선을 최대 V-1회 반복해 완화한다.\n\n```text\n거리[start] = 0, 나머지는 무한대\nV-1회 반복:\n    모든 간선 (u, v, w)을 확인\n    거리[u]가 유한하고 거리[u]+w < 거리[v]이면 갱신\n한 번 더 확인해 갱신 가능하면\n시작점에서 도달 가능한 음수 사이클이 존재\n```","","벨만-포드는 단일 시작점에서 모든 정점까지의 최단 거리를 구하며 음수 가중치 간선을 허용한다. 음수 간선이 있어도 동작하는 이유는 다익스트라처럼 정점을 한 번 확정하지 않고, 모든 간선을 반복해서 완화하기 때문이다. 시작점 거리를 0, 나머지를 무한대로 초기화한 뒤 모든 간선 (u,v,w)에 대해 dist[u]가 유한하면 dist[v]=min(dist[v],dist[u]+w)로 갱신한다.\n\n음수 사이클이 없다면 최단 경로는 단순 경로로 표현할 수 있고, 단순 경로는 최대 V-1개의 간선을 사용한다. 따라서 모든 간선을 V-1회 반복해 완화하면 최단 거리를 구할 수 있다. 그 뒤 한 번 더 완화가 가능하다면 시작점에서 도달 가능한 음수 사이클이 존재한다. 음수 사이클을 반복해서 통과하면 경로 비용을 계속 줄일 수 있어 유한한 최단 거리가 존재하지 않는다.\n\n시간복잡도는 O(VE), 공간복잡도는 O(V)다. 다익스트라보다 느리지만 음수 간선과 음수 사이클 검출을 지원한다. 도달할 수 없는 음수 사이클은 해당 시작점의 최단 거리 계산에 영향을 주지 않는다는 점도 구분해야 한다.  다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다.\n\n벨만-포드는 시작 정점에서 도달 가능한 모든 간선을 최대 V-1회 반복해 완화한다. 최단 경로는 음수 사이클이 없으면 단순 경로로 표현할 수 있어 최대 V-1개의 간선을 사용한다. 한 번 더 완화가 가능하면 도달 가능한 음수 사이클을 탐지할 수 있으며 시간복잡도는 O(VE)다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["V-1회 완화하는 이유는?","음수 사이클은 어떻게 검출하는가?","다익스트라와의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["플로이드-워셜 알고리즘","플로이드-워셜은 모든 정점 쌍 사이의 최단 거리를 구하는 동적 계획법 알고리즘이다. dist[i][j]를 i에서 j까지의 현재 최단 거리로 정의한다. 초기에는 직접 연결된 간선의 가중치를 저장하고, 자기 자신까지의 거리는 0, 연결되지 않은 쌍은 무한대로 둔다.\n\n플로이드-워셜은 모든 정점 쌍의 최단 거리를 구하는 DP다. dist[i][j]를 현재 i에서 j까지 거리로 두고 중간 정점 k를 허용할 때 기존 경로와 i→k→j 경로 중 작은 값을 선택한다. 점화식은 `dist[i][j]=min(dist[i][j],dist[i][k]+dist[k][j])`다. k가 바깥 반복문이어야 단계별 상태의 의미가 유지된다. 시간복잡도 O(V³), 공간복잡도 O(V²)다. 음수 간선은 허용하지만 음수 사이클이 있으면 최단 거리가 정의되지 않으며 계산 후 dist[i][i]<0으로 검사할 수 있다.\n\n최단 경로 알고리즘은 출력 범위와 가중치 조건을 기준으로 선택한다. 비가중 그래프의 단일 시작점은 BFS, 음수 간선이 없는 단일 시작점은 다익스트라, 음수 간선과 음수 사이클 검출은 벨만-포드, 모든 정점 쌍은 플로이드-워셜이 후보가 된다. 다익스트라는 우선순위 큐에서 오래된 거리 후보를 제거해야 중복 삽입 구현이 정확하고 효율적이다. 벨만-포드의 음수 사이클 판정은 시작점에서 도달 가능한 사이클만 대상으로 한다. 플로이드-워셜은 dist 행렬을 초기화할 때 자기 자신은 0, 간선이 없으면 무한대로 설정한다.\n\n플로이드-워셜은 모든 정점 쌍 사이의 최단 거리를 구하는 동적 계획법 알고리즘이다.\n\n```text\nfor k in 정점:\n    for i in 정점:\n        for j in 정점:\n            dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])\n```\nk가 바깥 반복문이어야 DP 상태의 의미가 유지된다.","","플로이드-워셜은 모든 정점 쌍 사이의 최단 거리를 구하는 동적 계획법 알고리즘이다. dist[i][j]를 i에서 j까지의 현재 최단 거리로 정의한다. 초기에는 직접 연결된 간선의 가중치를 저장하고, 자기 자신까지의 거리는 0, 연결되지 않은 쌍은 무한대로 둔다.\n\n중간 정점으로 k를 허용할 때 i에서 j로 가는 최단 거리는 기존 경로와 i→k→j 경로 중 작은 값이다. 점화식은 dist[i][j]=min(dist[i][j], dist[i][k]+dist[k][j])이다. k를 바깥 반복문으로 두고 모든 i,j 쌍을 갱신한다. 경로 자체를 복원하려면 next 또는 predecessor 행렬을 별도로 관리한다.\n\n시간복잡도는 O(V³), 공간복잡도는 O(V²)다. 음수 간선은 허용하지만 음수 사이클이 있으면 최단 거리가 정의되지 않는다. 알고리즘 후 dist[i][i]<0인 정점이 있으면 음수 사이클이 존재한다. 단일 시작점 최단 경로를 구하는 다익스트라와 달리 모든 정점 쌍을 대상으로 한다.  다익스트라는 간선 가중치가 음수가 아닌 그래프에서 한 시작 정점으로부터 모든 정점까지의 최단 거리를 구한다. 현재 최단 거리가 가장 작은 정점을 확정하고 인접 간선을 완화(relaxation)한다. 우선순위 큐와 인접 리스트를 사용하면 보통 O((V+E)log V)이며 음수 간선이 있으면 정확성을 보장하지 않는다.\n\n플로이드-워셜은 모든 정점 쌍의 최단 거리를 동적 계획법으로 계산한다. 중간 정점 k를 허용했을 때 i에서 j까지의 거리와 i→k→j 경로를 비교해 갱신하며 시간 O(V³), 공간 O(V²)이다. 음수 간선은 처리할 수 있지만 음수 사이클이 있으면 최단 경로가 정의되지 않는다.\n\n동적 계획법은 문제를 겹치는 부분 문제로 나누고 각 부분 문제의 결과를 저장해 중복 계산을 제거한다. 상태 정의, 점화식, 초기값, 계산 순서가 설계의 핵심이다. 작은 문제부터 채우는 상향식과 재귀 결과를 캐시하는 하향식 메모이제이션이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["플로이드-워셜의 점화식을 설명해보세요.","다익스트라와 적용 범위가 어떻게 다른가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["최소 신장 트리(MST)","신장 트리는 연결된 무방향 그래프의 모든 정점을 포함하고 사이클이 없는 부분 그래프다. 정점이 V개인 트리는 간선이 정확히 V-1개다. 최소 신장 트리(MST)는 간선 가중치 합이 최소인 신장 트리다. 통신망·도로·전력망처럼 모든 지점을 연결하되 전체 설치 비용을 최소화하는 문제에 활용한다.\n\n최소 신장 트리는 연결된 무방향 가중 그래프의 모든 정점을 사이클 없이 연결하는 간선 집합 중 가중치 합이 최소인 트리다. 정점 V개인 신장 트리는 V-1개 간선을 가진다. 네트워크 케이블·전력망처럼 전체 연결 비용을 줄이는 데 활용한다. MST는 한 시작점에서 다른 정점까지의 최단 경로 트리와 다르다. MST의 두 정점 사이 경로가 원래 그래프의 최단 경로라는 보장은 없다. 그래프가 비연결이면 최소 신장 트리가 아니라 각 연결 요소의 최소 신장 숲을 구한다.\n\nMST의 컷 속성은 정점을 두 집합으로 나누는 컷을 가로지르는 최소 가중치 간선이 어떤 MST에 포함될 수 있음을 말한다. 크루스칼은 전체 간선을 정렬하고 DSU로 사이클을 확인하므로 간선이 적은 희소 그래프에 적합하다. 프림은 현재 트리 경계의 최소 간선을 반복 선택해 성장하므로 인접 행렬 기반의 조밀 그래프 구현에서 O(V²)을 사용할 수 있다. 두 알고리즘은 모두 음수 간선 가중치를 허용한다. 간선 가중치가 같으면 MST가 여러 개일 수 있지만 최소 비용은 동일하다.\n\n신장 트리는 연결된 무방향 그래프의 모든 정점을 포함하고 사이클이 없는 부분 그래프다. 통신망·도로·전력망처럼 모든 지점을 연결하되 전체 설치 비용을 최소화하는 문제에 활용한다. MST는 전체 네트워크의 간선 비용 합을 최소화할 뿐, MST 내부에서 임의의 두 정점을 잇는 경로가 원래 그래프의 최단 경로라는 보장은 없다. 대표 알고리즘은 간선을 정렬해 선택하는 크루스칼과 현재 트리를 확장하는 프림이다. 그래프가 연결되지 않았다면 하나의 신장 트리는 존재하지 않고 각 연결 요소의 최소 신장 트리를 모은 최소 신장 숲을 구한다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 프림은 임의의 시작 정점에서 출발해 현재 트리에 연결되는 간선 중 가장 가벼운 간선을 반복 선택해 정점을 확장한다. 우선순위 큐로 구현할 수 있고, 크루스칼과 달리 간선 전체를 정렬하기보다 하나의 트리를 키워 나간다.","","신장 트리는 연결된 무방향 그래프의 모든 정점을 포함하고 사이클이 없는 부분 그래프다. 정점이 V개인 트리는 간선이 정확히 V-1개다. 최소 신장 트리(MST)는 간선 가중치 합이 최소인 신장 트리다. 통신망·도로·전력망처럼 모든 지점을 연결하되 전체 설치 비용을 최소화하는 문제에 활용한다.\n\nMST는 특정 두 정점 사이의 최단 경로를 구하는 문제와 다르다. MST는 전체 네트워크의 간선 비용 합을 최소화할 뿐, MST 내부에서 임의의 두 정점을 잇는 경로가 원래 그래프의 최단 경로라는 보장은 없다. 대표 알고리즘은 간선을 정렬해 선택하는 크루스칼과 현재 트리를 확장하는 프림이다.\n\n그래프가 연결되지 않았다면 하나의 신장 트리는 존재하지 않고 각 연결 요소의 최소 신장 트리를 모은 최소 신장 숲을 구한다. 가중치가 같은 간선이 있으면 MST가 여러 개 존재할 수 있다.  그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 유니온 파인드로 두 정점이 이미 같은 집합인지 확인하고, 다르면 합친다. 정렬이 지배해 O(E log E)에 동작하며 희소 그래프에서 자주 사용한다.\n\n프림은 임의의 시작 정점에서 출발해 현재 트리에 연결되는 간선 중 가장 가벼운 간선을 반복 선택해 정점을 확장한다. 우선순위 큐로 구현할 수 있고, 크루스칼과 달리 간선 전체를 정렬하기보다 하나의 트리를 키워 나간다. 연결된 무향 가중 그래프의 최소 신장 트리를 구한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["MST와 최단 경로의 차이는?","트리의 간선이 V-1개인 이유는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["크루스칼 알고리즘","크루스칼은 최소 신장 트리를 구하는 탐욕 알고리즘이다. 모든 간선을 가중치 오름차순으로 정렬한 뒤 가장 작은 간선부터 살펴보고, 해당 간선을 추가해도 사이클이 생기지 않을 때 선택한다. 간선을 V-1개 선택하면 MST가 완성된다.\n\n크루스칼은 간선을 가중치 오름차순으로 정렬하고 작은 간선부터 선택하되 이미 같은 연결 요소를 잇는 간선은 건너뛴다. 같은 연결 요소 안의 두 정점을 다시 연결하면 사이클이 생긴다. 유니온 파인드의 find로 대표를 비교하고 대표가 다르면 간선을 선택한 뒤 union한다. V-1개 간선을 선택하면 MST가 완성된다. 정렬이 지배하므로 시간복잡도는 O(E log E)이며 희소 그래프에서 구현하기 편리하다.\n\nMST의 컷 속성은 정점을 두 집합으로 나누는 컷을 가로지르는 최소 가중치 간선이 어떤 MST에 포함될 수 있음을 말한다. 크루스칼은 전체 간선을 정렬하고 DSU로 사이클을 확인하므로 간선이 적은 희소 그래프에 적합하다. 프림은 현재 트리 경계의 최소 간선을 반복 선택해 성장하므로 인접 행렬 기반의 조밀 그래프 구현에서 O(V²)을 사용할 수 있다. 두 알고리즘은 모두 음수 간선 가중치를 허용한다. 간선 가중치가 같으면 MST가 여러 개일 수 있지만 최소 비용은 동일하다.\n\n모든 간선을 가중치 오름차순으로 정렬한 뒤 가장 작은 간선부터 살펴보고, 해당 간선을 추가해도 사이클이 생기지 않을 때 선택한다. 간선 (u,v)을 선택하기 전에 find(u)와 find(v)가 같다면 이미 같은 연결 요소에 있으므로 간선을 추가하면 사이클이 생긴다. 크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 경로 압축과 union by rank/size를 함께 쓰면 연산의 상각 시간은 사실상 상수에 가까워 크루스칼과 연결성 판정에 유용하다.\n\n```text\n간선을 가중치 오름차순으로 정렬\n각 간선 (u, v, w)에 대해:\n    find(u) != find(v)이면 간선 선택\n    union(u, v) 수행\n    선택 간선이 V-1개면 종료\n```","","크루스칼은 최소 신장 트리를 구하는 탐욕 알고리즘이다. 모든 간선을 가중치 오름차순으로 정렬한 뒤 가장 작은 간선부터 살펴보고, 해당 간선을 추가해도 사이클이 생기지 않을 때 선택한다. 간선을 V-1개 선택하면 MST가 완성된다.\n\n사이클 여부는 유니온 파인드(분리 집합)로 효율적으로 판별한다. find(x)는 x가 속한 집합의 대표를 찾고 union(a,b)는 두 집합을 합친다. 간선 (u,v)을 선택하기 전에 find(u)와 find(v)가 같다면 이미 같은 연결 요소에 있으므로 간선을 추가하면 사이클이 생긴다. 대표가 다르면 간선을 선택하고 두 집합을 합친다.\n\n경로 압축은 find 과정에서 방문한 노드의 부모를 대표로 바꾸고, union by rank/size는 작은 트리를 큰 트리에 붙인다. 두 최적화를 함께 사용하면 유니온 파인드 연산은 상각 O(α(V))이다. 전체 시간복잡도는 간선 정렬이 지배하는 O(E log E)다.  크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 유니온 파인드로 두 정점이 이미 같은 집합인지 확인하고, 다르면 합친다. 정렬이 지배해 O(E log E)에 동작하며 희소 그래프에서 자주 사용한다.\n\n유니온 파인드는 원소가 어느 서로소 집합에 속하는지 관리한다. find는 대표 원소를 찾고 union은 두 집합을 합친다. 경로 압축과 union by rank/size를 함께 쓰면 연산의 상각 시간은 사실상 상수에 가까워 크루스칼과 연결성 판정에 유용하다.\n\n탐욕 알고리즘은 매 단계에서 현재 가장 좋아 보이는 선택을 하고 이를 되돌리지 않는다. 항상 최적해를 얻는 것은 아니며, 탐욕 선택 속성과 최적 부분 구조 등을 근거로 정당성을 증명해야 한다. 활동 선택, 허프만 부호화, 일부 최소 신장 트리 문제 등이 대표 사례다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["유니온 파인드로 사이클을 어떻게 판별하는가?","경로 압축과 union by size의 역할은?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["프림 알고리즘","프림은 임의의 시작 정점에서 출발해 현재 MST에 포함된 정점 집합을 하나씩 확장하는 탐욕 알고리즘이다. 현재 트리와 트리 밖의 정점을 연결하는 간선 중 가중치가 가장 작은 간선을 선택해 새 정점을 추가한다. 이 과정을 모든 정점이 포함될 때까지 반복한다.\n\n프림은 임의의 시작 정점에서 출발해 현재 MST에 포함된 정점과 바깥 정점을 잇는 간선 중 최소 비용 간선을 선택하며 트리를 확장한다. 크루스칼은 전체 간선을 정렬해 선택하지만 프림은 하나의 트리를 성장시킨다. 인접 행렬 구현은 O(V²), 인접 리스트와 우선순위 큐 구현은 보통 O(E log V)다. 우선순위 큐에는 각 정점을 현재 트리에 연결하는 최소 간선 비용을 저장하고 더 싼 간선을 발견하면 갱신한다.\n\nMST의 컷 속성은 정점을 두 집합으로 나누는 컷을 가로지르는 최소 가중치 간선이 어떤 MST에 포함될 수 있음을 말한다. 크루스칼은 전체 간선을 정렬하고 DSU로 사이클을 확인하므로 간선이 적은 희소 그래프에 적합하다. 프림은 현재 트리 경계의 최소 간선을 반복 선택해 성장하므로 인접 행렬 기반의 조밀 그래프 구현에서 O(V²)을 사용할 수 있다. 두 알고리즘은 모두 음수 간선 가중치를 허용한다. 간선 가중치가 같으면 MST가 여러 개일 수 있지만 최소 비용은 동일하다.\n\n프림은 임의의 시작 정점에서 출발해 현재 MST에 포함된 정점 집합을 하나씩 확장하는 탐욕 알고리즘이다. 현재 트리와 트리 밖의 정점을 연결하는 간선 중 가중치가 가장 작은 간선을 선택해 새 정점을 추가한다. 구현에서는 각 정점에 대해 현재 트리와 연결하는 최소 간선 비용 key[v]를 저장한다. 우선순위 큐에서 key가 가장 작은 정점을 꺼내고, 인접 정점의 연결 비용이 더 작아지면 key와 부모 정점을 갱신한다. 인접 행렬 기반 프림은 밀집 그래프에서 단순하고, 크루스칼은 간선 수가 적은 희소 그래프에서 자주 사용된다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n```text\n시작 정점의 key = 0\n최소 우선순위 큐에 시작 정점 삽입\n큐에서 최소 key 정점 u를 꺼냄\nu를 MST에 포함\n인접 정점 v에 더 싼 연결 간선이 있으면\nkey[v], parent[v] 갱신\n```","","프림은 임의의 시작 정점에서 출발해 현재 MST에 포함된 정점 집합을 하나씩 확장하는 탐욕 알고리즘이다. 현재 트리와 트리 밖의 정점을 연결하는 간선 중 가중치가 가장 작은 간선을 선택해 새 정점을 추가한다. 이 과정을 모든 정점이 포함될 때까지 반복한다.\n\n구현에서는 각 정점에 대해 현재 트리와 연결하는 최소 간선 비용 key[v]를 저장한다. 우선순위 큐에서 key가 가장 작은 정점을 꺼내고, 인접 정점의 연결 비용이 더 작아지면 key와 부모 정점을 갱신한다. 인접 리스트와 이진 힙을 사용하면 O(E log V), 인접 행렬을 사용하면 O(V²)로 구현할 수 있다.\n\n프림은 정점 중심으로 확장하고 크루스칼은 간선 중심으로 선택한다. 두 알고리즘 모두 연결된 무방향 가중치 그래프의 MST를 구한다. 인접 행렬 기반 프림은 밀집 그래프에서 단순하고, 크루스칼은 간선 수가 적은 희소 그래프에서 자주 사용된다.  큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 구조로 enqueue와 dequeue를 수행한다. 작업 스케줄링, 프린터 대기열, 너비 우선 탐색에 사용한다. 배열 기반 큐는 앞쪽 공간을 재사용하지 못하면 낭비가 생겨 원형 큐로 보완할 수 있다.\n\n이진 힙은 완전 이진 트리 형태를 배열로 표현하고 부모와 자식 사이의 우선순위 관계를 유지한다. 최대 힙은 부모가 자식보다 크거나 같고, 최소 힙은 반대다. 최댓값·최솟값 확인은 O(1), 삽입과 삭제는 O(log n)이며 우선순위 큐와 힙 정렬에 쓰인다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["프림은 어떤 기준으로 다음 정점을 선택하는가?","프림과 크루스칼의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["유니온 파인드(분리 집합)","유니온 파인드는 서로 겹치지 않는 집합들의 모음을 관리하는 자료구조다. find(x)는 x가 속한 집합의 대표 원소를 반환하고, union(a,b)는 두 원소가 속한 집합을 합친다. 처음에는 각 원소가 자기 자신만 포함하는 집합이므로 parent[x]=x로 초기화한다.\n\n유니온 파인드는 서로소 집합을 관리하는 구조다. find는 원소가 속한 집합의 대표를 찾고 union은 두 집합을 합친다. 크루스칼에서 두 정점이 이미 같은 연결 요소인지 확인해 사이클을 피한다. 경로 압축은 find 중 만난 노드의 부모를 대표로 바꾸고 union by size/rank는 작은 트리를 큰 트리 아래 붙인다. 두 최적화를 함께 사용하면 분할 상환 연산 비용이 역 아커만 함수 수준으로 작다. 기본 DSU는 집합 병합에 최적화되어 임의 원소 삭제·집합 분리는 지원하지 않는다.\n\nfind(x)는 x가 속한 집합의 대표 원소를 반환하고, union(a,b)는 두 원소가 속한 집합을 합친다. 처음에는 각 원소가 자기 자신만 포함하는 집합이므로 parent[x]=x로 초기화한다. union by rank는 트리 높이의 근사값이 작은 쪽을 큰 쪽에 붙이고, union by size는 원소 수가 적은 집합을 큰 집합에 붙인다. 기본 DSU는 집합 합치기는 효율적으로 처리하지만 임의의 원소를 집합에서 분리하는 연산은 지원하지 않는다.","","유니온 파인드는 서로 겹치지 않는 집합들의 모음을 관리하는 자료구조다. find(x)는 x가 속한 집합의 대표 원소를 반환하고, union(a,b)는 두 원소가 속한 집합을 합친다. 처음에는 각 원소가 자기 자신만 포함하는 집합이므로 parent[x]=x로 초기화한다.\n\nparent 배열을 이용해 각 집합을 트리 형태로 표현한다. 대표 원소는 자기 자신을 부모로 가진다. 단순 구현은 트리가 한쪽으로 길어져 find가 O(n)에 가까워질 수 있다. 경로 압축은 find 도중 방문한 노드의 부모를 대표로 직접 연결해 이후 탐색을 빠르게 한다. union by rank는 트리 높이의 근사값이 작은 쪽을 큰 쪽에 붙이고, union by size는 원소 수가 적은 집합을 큰 집합에 붙인다.\n\n두 최적화를 함께 적용하면 연산의 상각 시간복잡도는 O(α(n))으로 사실상 상수에 가깝다. 크루스칼의 사이클 판별, 무방향 그래프의 연결 요소 확인 등에 사용한다. 기본 DSU는 집합 합치기는 효율적으로 처리하지만 임의의 원소를 집합에서 분리하는 연산은 지원하지 않는다.  배열은 원소를 연속된 메모리 공간에 저장하므로 인덱스 접근이 O(1)이고 캐시 지역성이 좋다. 중간 삽입·삭제는 원소 이동이 필요해 O(n)이 될 수 있으며, 고정 크기 배열은 크기 변경이 어렵다. 동적 배열은 용량을 늘릴 때 재할당과 복사가 발생할 수 있다.\n\n그래프는 정점과 간선으로 관계를 표현한다. 간선은 방향·가중치 유무에 따라 유향/무향, 가중/무가중 그래프로 나뉜다. 인접 행렬은 두 정점 연결 확인이 O(1)이지만 공간 O(V²), 인접 리스트는 O(V+E) 공간으로 희소 그래프에 유리하다.\n\n크루스칼은 간선을 가중치 오름차순으로 정렬한 뒤 사이클을 만들지 않는 간선만 선택해 최소 신장 트리를 구성한다. 유니온 파인드로 두 정점이 이미 같은 집합인지 확인하고, 다르면 합친다. 정렬이 지배해 O(E log E)에 동작하며 희소 그래프에서 자주 사용한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["find와 union의 역할은?","경로 압축은 무엇을 개선하는가?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["동적 계획법(DP)의 설계 절차","동적 계획법은 중복되는 부분 문제를 반복 계산하지 않도록 결과를 저장하는 알고리즘 설계 기법이다. 일반적으로 최적 부분 구조와 중복 부분 문제가 있을 때 적용한다. 최적 부분 구조는 전체 최적해가 부분 문제의 최적해로 구성되는 성질이고, 중복 부분 문제는 동일한 부분 문제가 여러 경로에서 반복되는 성질이다.\n\n동적 계획법은 겹치는 부분 문제의 계산 결과를 저장해 재사용한다. 최적 부분 구조는 전체 최적해가 부분 문제의 최적해로 구성되는 성질이고 중복 부분 문제는 같은 상태가 여러 번 계산되는 현상이다. 상태가 무엇을 뜻하는지 정의하고 점화식, 기저값, 계산 순서를 정한다. 메모이제이션은 재귀 결과를 저장하는 하향식이고 타뷸레이션은 작은 상태부터 표를 채우는 상향식이다. 점화식만 외우면 안 되고 상태의 의미와 최종 답의 위치, 선택 경로 복원 방법까지 이해해야 한다.\n\nDP 상태는 문제의 미래 선택을 결정하는 데 필요한 정보만 포함해야 한다. 상태에 정보가 부족하면 서로 다른 상황을 같은 상태로 취급해 오답이 되고, 불필요한 정보가 많으면 상태 수가 폭발한다. 점화식의 모든 참조 상태가 이미 계산되도록 순서를 정해야 한다. 경로 복원은 최적값만 저장하는 것과 별도로 어떤 선택을 했는지 predecessor나 선택 배열을 보관한다. 공간 최적화는 이전 상태만 필요할 때 가능하지만 갱신 순서를 바꾸면 0-1 배낭이 무한 배낭처럼 바뀌는 등 의미가 달라질 수 있다.\n\n동적 계획법은 중복되는 부분 문제를 반복 계산하지 않도록 결과를 저장하는 알고리즘 설계 기법이다. 예를 들어 dp[i]가 'i번째 원소까지 고려했을 때의 최적값'인지, 'i번째 원소에서 끝나는 최적값'인지 명확해야 한다. 피보나치 수열의 단순 재귀는 동일한 F(k)를 여러 번 계산하지만 DP는 각 상태를 한 번 계산해 O(n)에 해결한다. 일반적인 DP 시간복잡도는 상태 수 × 상태 하나를 계산하는 전이 비용으로 분석한다. 동적 계획법은 문제를 겹치는 부분 문제로 나누고 각 부분 문제의 결과를 저장해 중복 계산을 제거한다.","","동적 계획법은 중복되는 부분 문제를 반복 계산하지 않도록 결과를 저장하는 알고리즘 설계 기법이다. 일반적으로 최적 부분 구조와 중복 부분 문제가 있을 때 적용한다. 최적 부분 구조는 전체 최적해가 부분 문제의 최적해로 구성되는 성질이고, 중복 부분 문제는 동일한 부분 문제가 여러 경로에서 반복되는 성질이다.\n\nDP 설계의 첫 단계는 상태(state)의 의미를 정확히 정의하는 것이다. 예를 들어 dp[i]가 'i번째 원소까지 고려했을 때의 최적값'인지, 'i번째 원소에서 끝나는 최적값'인지 명확해야 한다. 두 번째는 현재 상태를 이전 상태로 표현하는 점화식(recurrence)을 세우는 것이다. 세 번째는 빈 입력이나 가장 작은 크기의 문제에 대한 기저 조건(base case)을 정하는 것이다. 마지막으로 메모이제이션 또는 타뷸레이션으로 계산한다.\n\n메모이제이션은 재귀적으로 필요한 상태를 계산하면서 결과를 캐시에 저장하는 하향식 방식이다. 타뷸레이션은 작은 상태부터 반복문으로 채우는 상향식 방식이다. 피보나치 수열의 단순 재귀는 동일한 F(k)를 여러 번 계산하지만 DP는 각 상태를 한 번 계산해 O(n)에 해결한다. 일반적인 DP 시간복잡도는 상태 수 × 상태 하나를 계산하는 전이 비용으로 분석한다.  캐시는 CPU와 상대적으로 느린 메모리 사이에 최근 또는 가까운 데이터를 임시 보관해 평균 접근 시간을 줄인다. 캐시 적중률이 높을수록 효과가 크며, 블록 단위로 데이터를 가져오므로 공간 지역성과 시간 지역성이 중요하다. 캐시 용량·연관도·블록 크기는 적중률과 지연시간 사이의 절충 요소다.\n\n동적 계획법은 문제를 겹치는 부분 문제로 나누고 각 부분 문제의 결과를 저장해 중복 계산을 제거한다. 상태 정의, 점화식, 초기값, 계산 순서가 설계의 핵심이다. 작은 문제부터 채우는 상향식과 재귀 결과를 캐시하는 하향식 메모이제이션이 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["DP 적용의 핵심 성질 두 가지는?","메모이제이션과 타뷸레이션의 차이는?"],"",[["MIT 6.006 알고리즘 강의 노트","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2008/pages/lecture-notes/"],["OpenDSA","https://opendsa.org/"]]],["0-1 배낭 문제","0-1 배낭 문제는 각 물건을 선택하거나 선택하지 않는 조건에서 배낭의 용량을 넘지 않으면서 가치 합을 최대화하는 문제다. 물건을 쪼갤 수 없고 각 물건은 최대 한 번만 선택할 수 있다.\n\n0-1 배낭은 각 물건을 넣거나 넣지 않는 선택으로 용량 W를 넘지 않으면서 총 가치를 최대화한다. `dp[i][c]`를 앞의 i개 물건과 용량 c에서 얻는 최대 가치라고 정의하면 i번째 물건을 넣지 않는 경
