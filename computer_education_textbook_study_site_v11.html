 과정에서 지식과 기능을 보여준다. 프로그래밍에서는 최종 코드뿐 아니라 문제 정의·알고리즘 설계·테스트·오류 수정·협업·성찰도 증거가 된다. 루브릭은 평가 요소와 수준별 관찰 가능한 기준을 제시해 기대와 평가 일관성을 높인다. 과정 중심 평가는 결과를 배제하는 것이 아니라 과정과 결과를 함께 해석하는 것이다.\n\n형성평가의 증거는 퀴즈 점수뿐 아니라 학생의 설명·코드·질문·오류 수정 기록·동료 피드백에서 얻을 수 있다. 피드백은 무엇을 잘못했는지 지적하는 데서 끝나지 않고 다음에 어떤 전략을 사용해야 하는지 알려야 한다. 루브릭의 수준 설명은 '우수함'처럼 추상적 표현보다 조건 분기 누락 없이 경계 사례를 처리한다처럼 관찰 가능한 행동으로 작성한다. 평가 결과는 학생에게 다음 학습 목표를 제시하고 교사에게 수업 조정 정보를 제공한다.\n\n수업이 흥미로운 활동에만 치우치지 않고 실제 학습 목표를 달성하도록 설계할 수 있다.\n\n프로젝트 과정 기록, 개인 설명, 동료 피드백 등을 함께 수집해 목표 달성의 증거를 다양하게 확보한다.\n\n백워드 설계는 먼저 기대하는 학습 결과를 정하고, 그 성취를 보여줄 평가 증거를 설계한 다음, 학습 활동을 계획하는 방식이다. 백워드 설계는 먼저 학습 목표와 기대 결과를 정하고, 목표 달성을 보여줄 평가 증거를 설계한 뒤, 그 증거를 만들 학습 경험과 수업 활동을 구성한다. 목표·평가·수업 활동의 정렬이 핵심이며 활동 자체가 재미있다는 이유만으로 목표와 무관하게 배치하지 않는다.","수업이 흥미로운 활동에만 치우치지 않고 실제 학습 목표를 달성하도록 설계할 수 있다.","백워드 설계는 먼저 기대하는 학습 결과를 정하고, 그 성취를 보여줄 평가 증거를 설계한 다음, 학습 활동을 계획하는 방식이다. 목표·평가·교수학습 활동의 정렬이 핵심이다.  백워드 설계는 먼저 학습 목표와 기대 결과를 정하고, 목표 달성을 보여줄 평가 증거를 설계한 뒤, 그 증거를 만들 학습 경험과 수업 활동을 구성한다. 목표·평가·수업 활동의 정렬이 핵심이며 활동 자체가 재미있다는 이유만으로 목표와 무관하게 배치하지 않는다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["수업 목표와 평가가 어긋난 사례는?","프로젝트 결과물만 평가하면 어떤 문제가 있는가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["형성평가·피드백·학습 증거","형성평가는 수업 중 학생의 이해 상태를 파악해 교수·학습을 조정하는 평가다. 효과적인 피드백은 현재 수준, 목표와의 차이, 다음 행동을 구체적으로 알려준다.\n\n형성평가는 수업 중 학습 상태를 확인해 교수·학습을 조정하고 총괄평가는 일정 기간 학습 결과를 종합한다. 수행평가는 학생이 실제 문제를 해결하거나 산출물을 만드는 과정에서 지식과 기능을 보여준다. 프로그래밍에서는 최종 코드뿐 아니라 문제 정의·알고리즘 설계·테스트·오류 수정·협업·성찰도 증거가 된다. 루브릭은 평가 요소와 수준별 관찰 가능한 기준을 제시해 기대와 평가 일관성을 높인다. 과정 중심 평가는 결과를 배제하는 것이 아니라 과정과 결과를 함께 해석하는 것이다.\n\n형성평가의 증거는 퀴즈 점수뿐 아니라 학생의 설명·코드·질문·오류 수정 기록·동료 피드백에서 얻을 수 있다. 피드백은 무엇을 잘못했는지 지적하는 데서 끝나지 않고 다음에 어떤 전략을 사용해야 하는지 알려야 한다. 루브릭의 수준 설명은 '우수함'처럼 추상적 표현보다 조건 분기 누락 없이 경계 사례를 처리한다처럼 관찰 가능한 행동으로 작성한다. 평가 결과는 학생에게 다음 학습 목표를 제시하고 교사에게 수업 조정 정보를 제공한다.\n\n학생의 오개념을 조기에 발견하고 개별 성장을 지원하는 교사의 역할과 연결된다.\n\n퀴즈, 출구 티켓, 코드 설명, 디버깅 과정 관찰 등 다양한 학습 증거를 활용할 수 있다.\n\n형성평가는 수업 중 학생의 이해 상태를 파악해 교수·학습을 조정하는 평가다. 효과적인 피드백은 현재 수준, 목표와의 차이, 다음 행동을 구체적으로 알려준다. 정답 여부뿐 아니라 풀이 과정, 질문, 토론, 코드 실행 결과를 살펴 오개념을 파악하고 구체적인 피드백을 제공한다.","학생의 오개념을 조기에 발견하고 개별 성장을 지원하는 교사의 역할과 연결된다.","형성평가는 수업 중 학생의 이해 상태를 파악해 교수·학습을 조정하는 평가다. 효과적인 피드백은 현재 수준, 목표와의 차이, 다음 행동을 구체적으로 알려준다.  형성평가는 수업 중 학습 증거를 수집해 교수·학습을 조정하는 평가다. 정답 여부뿐 아니라 풀이 과정, 질문, 토론, 코드 실행 결과를 살펴 오개념을 파악하고 구체적인 피드백을 제공한다. 성적 산출만을 위한 평가와 목적이 다르다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["형성평가와 총괄평가의 차이는?","좋은 피드백의 조건은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["프로그래밍 오개념과 디버깅 지도","초보 학습자는 변수의 갱신, 반복문의 실행 순서, 조건식의 참·거짓, 함수 호출과 반환 등을 오해하기 쉽다. 교사는 실행 추적표, 순서도, 코드 읽기, 예측-실행-설명 활동으로 사고를 드러내도록 돕는다.\n\n프로그래밍 학습은 문제 이해·알고리즘 설계·코드 구현·테스트·디버깅·성찰의 순환을 경험하게 해야 한다. 오류 원인은 문법뿐 아니라 문제 해석·알고리즘 누락·자료형·경계 조건·실행 환경 등 다양하다. 교사는 정답 코드를 바로 주기보다 오류 메시지와 예상/실제 출력을 비교하고 작은 입력으로 실행을 추적하도록 질문한다. 반복문 off-by-one 오류는 시작값·종료 조건·갱신을 표로 추적하게 할 수 있다. 짝 프로그래밍은 작성자와 검토자 역할을 바꾸며 논리 설명과 협력을 촉진한다.\n\n초보자는 코드 한 줄과 실행 결과 사이의 인과관계를 파악하기 어려우므로 변수 추적표·메모리 그림·순서도·실행 단계 시각화가 도움이 된다. 교사는 예측-실행-설명 활동을 통해 학생이 코드 결과를 먼저 예상하게 하고 실행 결과와 비교하도록 한다. 오류를 고칠 때는 정답 코드를 복사하는 것보다 오류가 발생한 조건과 수정 이유를 설명하게 해야 전이가 일어난다. 학생의 오개념은 다음 수업의 예제와 질문을 설계하는 진단 자료가 된다.\n\n학생이 단순히 정답 코드를 복사하지 않고 프로그램의 상태 변화를 이해하도록 지도할 수 있다.\n\n비계는 처음에는 구체적인 힌트와 예시를 제공하고 학생이 익숙해지면 지원을 점차 줄이는 방식이다.","학생이 단순히 정답 코드를 복사하지 않고 프로그램의 상태 변화를 이해하도록 지도할 수 있다.","초보 학습자는 변수의 갱신, 반복문의 실행 순서, 조건식의 참·거짓, 함수 호출과 반환 등을 오해하기 쉽다. 교사는 실행 추적표, 순서도, 코드 읽기, 예측-실행-설명 활동으로 사고를 드러내도록 돕는다.",["반복문을 어려워하는 학생에게 어떻게 설명할 것인가?","오류 메시지를 읽지 않는 학생을 어떻게 지도할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["정보교육에서 피지컬 컴퓨팅·언플러그드 활동","언플러그드 활동은 컴퓨터 없이 카드·놀이·역할 수행 등으로 알고리즘과 자료 표현을 경험하게 한다. 피지컬 컴퓨팅은 센서·마이크로컨트롤러·출력 장치를 프로그래밍해 현실 세계와 상호작용하는 활동이다.\n\n언플러그드 활동은 컴퓨터 없이 카드·보드·신체 활동·역할 놀이로 컴퓨터 과학 원리를 경험하게 한다. 학생이 정렬 규칙에 따라 줄을 서거나 한 학생이 명령어를 말하고 다른 학생이 로봇처럼 움직이면 순차·조건·반복을 체험할 수 있다. 활동 후 어떤 규칙을 사용했는지 설명하고 순서도·의사코드·실제 프로그램으로 연결해야 추상화와 전이가 일어난다. 언플러그드는 실제 구현·디버깅을 대체하기보다 개념 도입을 보완한다.\n\n언플러그드 수업은 컴퓨터 없이 원리를 체험하게 하지만 활동과 개념 사이 연결을 명시해야 한다. 학생이 사람을 정렬하는 활동을 했다면 어떤 비교 규칙이 사용됐는지, 비교 횟수가 데이터 수에 따라 어떻게 증가하는지 토론하고 실제 정렬 알고리즘으로 표현한다. 활동이 끝난 뒤 학습자가 원리를 설명하거나 다른 문제에 적용하는지 확인해야 재미있는 체험이 개념 학습으로 이어진다.\n\n추상적인 개념을 학생의 경험과 연결하고 다양한 학습 접근을 제공할 수 있다.\n\n기기 조작 자체가 목표가 되지 않도록 활동 전후에 핵심 개념을 말과 그림, 코드로 정리하도록 한다.\n\n언플러그드 활동은 컴퓨터 없이 카드·놀이·역할 수행 등으로 알고리즘과 자료 표현을 경험하게 한다. 피지컬 컴퓨팅은 센서·마이크로컨트롤러·출력 장치를 프로그래밍해 현실 세계와 상호작용하는 활동이다. 언플러그드 활동은 컴퓨터 없이 카드·신체 활동·놀이 등으로 알고리즘과 정보 개념을 경험하게 한다. 추상적인 개념을 구체적 조작으로 먼저 경험할 수 있지만, 활동 뒤 실제 컴퓨터 개념·표현·코딩으로 연결해 전이하도록 정리해야 한다. 피지컬 컴퓨팅은 센서로 환경의 데이터를 입력받고 프로그램이 판단해 LED·모터 등 출력 장치를 제어하는 상호작용 시스템을 만드는 활동이다.","추상적인 개념을 학생의 경험과 연결하고 다양한 학습 접근을 제공할 수 있다.","언플러그드 활동은 컴퓨터 없이 카드·놀이·역할 수행 등으로 알고리즘과 자료 표현을 경험하게 한다. 피지컬 컴퓨팅은 센서·마이크로컨트롤러·출력 장치를 프로그래밍해 현실 세계와 상호작용하는 활동이다.\n\n언플러그드 활동은 컴퓨터 없이 카드·신체 활동·놀이 등으로 알고리즘과 정보 개념을 경험하게 한다. 추상적인 개념을 구체적 조작으로 먼저 경험할 수 있지만, 활동 뒤 실제 컴퓨터 개념·표현·코딩으로 연결해 전이하도록 정리해야 한다.\n\n피지컬 컴퓨팅은 센서로 환경의 데이터를 입력받고 프로그램이 판단해 LED·모터 등 출력 장치를 제어하는 상호작용 시스템을 만드는 활동이다. 입력-처리-출력 구조, 반복·조건, 센서 값의 잡음과 임계값을 함께 학습할 수 있다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["언플러그드 활동의 장점과 한계는?","피지컬 컴퓨팅 수업에서 안전과 비용 문제를 어떻게 고려할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["디지털 격차·접근성·보편적 학습 설계","디지털 격차는 기기·네트워크 접근뿐 아니라 활용 역량과 결과의 차이까지 포함한다. 접근성은 장애나 환경 차이와 관계없이 학습 자료와 도구를 이용할 수 있도록 설계하는 것이다.\n\n학습자 차이는 선행 지식·언어·추상적 사고·디지털 경험·학습 속도·접근성 요구에서 발생한다. UDL은 다양한 학생이 참여하도록 정보 제시·참여·학습 결과 표현 방식을 유연하게 설계한다. 블록/텍스트 코딩, 시각 자료/설명 글, 단계별 힌트/확장 과제를 함께 제공할 수 있다. 비계 설정은 일시적 지원을 제공하고 숙련될수록 줄여 독립 수행으로 이동시키는 것이다. 지원은 목표를 낮추는 것이 아니라 목표에 도달하는 경로를 다양하게 하는 것이다.\n\n접근성은 시각·청각·운동·인지 특성에 관계없이 학습 자료와 도구를 사용할 수 있게 하는 설계다. 이미지에는 대체 텍스트, 영상에는 자막, 키보드만으로 조작할 수 있는 인터페이스, 충분한 색 대비와 읽기 쉬운 글꼴을 고려한다. 코딩 도구는 화면 낭독기 호환과 블록의 색 외 구분 기호를 제공할 수 있다. UDL은 사후에 예외 학생을 위한 대책을 추가하는 것보다 처음부터 다양한 접근 경로를 설계하는 데 초점을 둔다.\n\n모든 학생이 참여할 수 있는 정보 수업을 설계하는 교육적 관점을 보여준다.\n\nUDL은 처음부터 다양한 학습자에게 접근 가능한 선택지를 설계하고, 개별 지원은 필요에 따라 추가로 제공한다.\n\n디지털 격차는 기기·네트워크 접근뿐 아니라 활용 역량과 결과의 차이까지 포함한다. 접근성은 장애나 환경 차이와 관계없이 학습 자료와 도구를 이용할 수 있도록 설계하는 것이다. 보편적 학습 설계(UDL)는 학습자의 다양성을 전제로 참여, 정보 제시, 행동·표현의 여러 선택지를 수업 설계 단계부터 제공한다. 동일한 목표에 도달하는 경로를 다양하게 하되 학습 목표와 평가 기준 자체를 임의로 낮추는 것과는 구분한다.","모든 학생이 참여할 수 있는 정보 수업을 설계하는 교육적 관점을 보여준다.","디지털 격차는 기기·네트워크 접근뿐 아니라 활용 역량과 결과의 차이까지 포함한다. 접근성은 장애나 환경 차이와 관계없이 학습 자료와 도구를 이용할 수 있도록 설계하는 것이다.  보편적 학습 설계(UDL)는 학습자의 다양성을 전제로 참여, 정보 제시, 행동·표현의 여러 선택지를 수업 설계 단계부터 제공한다. 동일한 목표에 도달하는 경로를 다양하게 하되 학습 목표와 평가 기준 자체를 임의로 낮추는 것과는 구분한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["기기 접근성이 다른 학생이 함께하는 수업은?","UDL과 개별화 교육은 어떻게 다른가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["컴퓨터교육에서 협력학습과 짝 프로그래밍","짝 프로그래밍은 두 학생이 하나의 작업을 함께 수행하며 한 명은 코드를 작성하는 드라이버, 다른 한 명은 검토·방향 제시를 하는 네비게이터 역할을 맡는 방식이다. 역할을 교대하면 참여와 설명 기회를 높일 수 있다.\n\n짝 프로그래밍에서 드라이버는 키보드를 조작하고 네비게이터는 다음 단계와 오류 가능성을 검토한다. 역할은 일정 시간마다 교대해 한 학생이 계속 지시하거나 다른 학생이 수동적으로 따라가지 않도록 한다. 협력학습의 개별 책무성을 확보하려면 각 학생에게 코드의 특정 부분을 설명하게 하거나 개인별 짧은 과제를 수행하게 할 수 있다. 동료 피드백은 코드의 정답 여부뿐 아니라 변수명·가독성·테스트 사례도 다룰 수 있다.\n\n협업이 특정 학생의 코딩 독점으로 흐르지 않도록 수업 구조를 설계할 수 있다.\n\n개인별 구두 설명, 역할 교대 기록, 개별 수정 과제 등을 함께 활용해 협력 과정과 개인 학습을 모두 확인한다.\n\n짝 프로그래밍은 두 학생이 하나의 작업을 함께 수행하며 한 명은 코드를 작성하는 드라이버, 다른 한 명은 검토·방향 제시를 하는 네비게이터 역할을 맡는 방식이다.","협업이 특정 학생의 코딩 독점으로 흐르지 않도록 수업 구조를 설계할 수 있다.","짝 프로그래밍은 두 학생이 하나의 작업을 함께 수행하며 한 명은 코드를 작성하는 드라이버, 다른 한 명은 검토·방향 제시를 하는 네비게이터 역할을 맡는 방식이다. 역할을 교대하면 참여와 설명 기회를 높일 수 있다.",["개인별 성취는 어떻게 평가할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["교직 윤리·학생 개인정보·AI 활용 원칙","교사는 학생의 개인정보와 학습 기록을 목적에 맞게 최소한으로 다루고, 평가의 공정성과 학생 존엄성을 지켜야 한다. AI 도구 사용 시에는 민감정보 입력을 피하고 결과 검증과 사용 기준을 명확히 해야 한다.\n\n디지털 시민성은 디지털 환경에서 권리와 책임을 이해하고 안전하고 존중하는 방식으로 기술을 활용하는 역량이다. 개인정보 보호·저작권·정보 신뢰성 평가·사이버 폭력 예방·디지털 발자국 관리가 포함된다. AI 윤리는 공정성·설명 가능성·책임성·개인정보·안전성을 고려한다. 학습 데이터 편향은 모델 결과에 반영될 수 있고 생성형 AI는 틀린 정보를 그럴듯하게 만들 수 있으므로 교차 검증과 출처 확인이 필요하다. 학교에서는 학생 개인정보 입력 범위·저작권·평가 공정성·AI 사용 공개 기준을 정해야 한다.\n\n컴퓨터교육 교사가 기술을 교육적으로 책임 있게 활용하는 관점을 보여준다.\n\n학교와 교육청의 승인된 도구·정책을 확인하고, 학생 식별 정보나 민감한 정보를 입력하지 않으며, 학습 과정과 학생의 설명을 평가에 반영한다.","컴퓨터교육 교사가 기술을 교육적으로 책임 있게 활용하는 관점을 보여준다.","교사는 학생의 개인정보와 학습 기록을 목적에 맞게 최소한으로 다루고, 평가의 공정성과 학생 존엄성을 지켜야 한다. AI 도구 사용 시에는 민감정보 입력을 피하고 결과 검증과 사용 기준을 명확히 해야 한다.  수업 설계에서는 교육 목표, 학습 활동, 평가가 서로 일치해야 한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["학생 데이터를 외부 AI 서비스에 입력할 때 주의할 점은?","AI가 만든 과제를 어떻게 평가할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["컴퓨팅 사고력의 구성 요소","컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 평가를 들 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터 과학의 개념과 원리로 분석하고 실행 가능한 해결 절차로 표현하는 사고 방식이다. 분해는 복잡한 문제를 작은 하위 문제로 나누고, 패턴 인식은 반복 구조를 찾으며, 추상화는 핵심 정보와 관계만 남기고, 알고리즘 설계는 명확한 해결 절차를 구성한다. 학교 급식 대기 문제라면 시간대별 인원과 배식 처리량을 추상화해 대기열 분리 규칙을 설계할 수 있다. 컴퓨팅 사고력은 코딩 문법을 많이 아는 것과 동일하지 않으며 언플러그드 활동으로도 기를 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있도록 표현하는 데서 끝나지 않고 해결 과정의 정확성과 효율성을 검토하는 과정도 포함한다. 알고리즘을 설계한 뒤 대표 입력과 경계 입력으로 테스트하고 예상 결과와 실제 결과를 비교해 수정한다. 추상화는 모든 현실 요소를 모델에 넣는 것이 아니라 목적에 필요한 요소를 선택하는 판단이다. 따라서 같은 현실 문제도 목표가 바뀌면 추상화 모델과 알고리즘이 달라질 수 있다.\n\n컴퓨터교육의 목표가 특정 프로그래밍 언어 문법 습득에 한정되지 않는다는 점을 설명할 수 있다.\n\n학교 급식 대기 문제를 분석할 때 대기 인원·처리 시간·동선으로 나누고 병목을 찾아 절차를 개선하는 사례를 활용할 수 있다.\n\n컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 평가를 들 수 있다. 컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다.","컴퓨터교육의 목표가 특정 프로그래밍 언어 문법 습득에 한정되지 않는다는 점을 설명할 수 있다.","컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결하는 사고 과정이다. 대표 요소로 문제 분해, 패턴 인식, 추상화, 알고리즘 설계와 평가를 들 수 있다.  컴퓨팅 사고력은 문제를 컴퓨터가 처리할 수 있는 형태로 표현하고 해결 절차를 설계하는 사고 방식이다. 문제 분해는 복잡한 문제를 작은 부분으로 나누고, 패턴 인식은 반복 구조를 찾고, 추상화는 핵심 요소만 남기며, 알고리즘 설계는 해결 절차를 명확히 표현한다. 단순히 코딩을 잘하는 능력과 동일하지 않다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["컴퓨팅 사고력과 코딩 능력의 차이는?","일상생활의 문제를 분해하는 예를 들어보세요."],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["행동주의·인지주의·구성주의 학습이론","행동주의는 자극과 반응, 강화에 주목하고 인지주의는 정보 처리와 기억·인지 구조를 강조한다. 구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 구성하며 사회적 상호작용과 맥락을 중시한다.\n\n구성주의는 학습자가 기존 지식과 경험으로 새로운 의미를 능동적으로 구성한다고 본다. 문제중심학습은 복잡한 실제 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다. 프로젝트 기반 학습은 일정 기간 탐구·설계·제작을 진행해 의미 있는 산출물을 만들고 공유한다. 문제중심학습은 문제 해결 과정의 지식 습득과 추론을, 프로젝트 기반 학습은 장기간 산출물과 공개적 결과 공유를 강조하는 경향이 있다. 활동 뒤 핵심 개념 정리·중간 피드백·성찰이 필요하다.\n\n수업 방법을 선택할 때 학습자의 인지 과정과 경험, 상호작용을 고려하는 교육학적 근거를 제시할 수 있다.\n\n기초 문법은 짧은 연습과 피드백으로 익히고, 개념 구조를 시각화하며, 실제 문제 프로젝트에서 협력적으로 적용하게 할 수 있다.\n\n행동주의는 자극과 반응, 강화에 주목하고 인지주의는 정보 처리와 기억·인지 구조를 강조한다. 구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 구성하며 사회적 상호작용과 맥락을 중시한다. 구성주의는 학습자가 기존 지식과 경험을 바탕으로 능동적으로 의미를 구성한다고 본다.","수업 방법을 선택할 때 학습자의 인지 과정과 경험, 상호작용을 고려하는 교육학적 근거를 제시할 수 있다.","행동주의는 자극과 반응, 강화에 주목하고 인지주의는 정보 처리와 기억·인지 구조를 강조한다. 구성주의는 학습자가 기존 지식과 경험을 바탕으로 의미를 구성하며 사회적 상호작용과 맥락을 중시한다.  구성주의는 학습자가 기존 지식과 경험을 바탕으로 능동적으로 의미를 구성한다고 본다. 교사는 정답을 일방 전달하기보다 탐구 과제, 협력, 피드백, 성찰을 설계한다. 다만 학습자의 선개념과 인지 부담을 고려한 적절한 안내가 필요하다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["구성주의 수업에서 교사의 역할은?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["피아제와 비고츠키: 인지 발달과 사회적 상호작용","피아제는 학습자가 환경과 상호작용하며 도식의 동화와 조절을 통해 인지 구조를 발달시킨다고 보았다. 비고츠키는 사회문화적 상호작용과 근접발달영역, 비계 설정의 중요성을 강조했다.\n\n피아제의 동화는 새 경험을 기존 도식으로 이해하는 과정이고 조절은 기존 도식을 수정하는 과정이며 평형화는 둘 사이 균형을 찾는 과정이다. 비고츠키는 사회적 상호작용과 언어를 인지 발달의 중요한 요인으로 보았다. 근접발달영역은 혼자 해결 가능한 수준과 성인·또래의 도움으로 해결 가능한 수준 사이 영역이다. 비계 설정은 힌트·질문·예시 등 일시적 지원을 제공하고 능력이 향상되면 줄이는 것이다. 프로그래밍 수업에서 완성 코드를 주기보다 오류를 찾는 질문과 작은 힌트를 줄 수 있다.\n\n학습 이론은 수업 방법을 기계적으로 결정하는 처방이 아니라 학습자의 사고와 상호작용을 해석하는 관점이다. 피아제 관점에서는 학생이 기존 도식으로 설명할 수 없는 사례를 만나 인지 갈등을 경험하고 개념을 재구성하도록 할 수 있다. 비고츠키 관점에서는 또래 토론과 교사의 질문, 단계별 도움으로 혼자서는 어려운 과제를 수행하게 할 수 있다. 교사는 도움을 언제 제공하고 언제 줄일지 학생의 수행 증거를 바탕으로 판단한다.\n\n학생의 현재 수준과 도움을 통해 도달할 수 있는 수준을 고려한 수업 설계를 설명할 수 있다.\n\n학생이 익숙해지면 힌트와 예시를 줄여 독립적으로 문제를 해결하도록 지원을 점진적으로 제거한다.\n\n피아제는 학습자가 환경과 상호작용하며 도식의 동화와 조절을 통해 인지 구조를 발달시킨다고 보았다. 비고츠키는 사회문화적 상호작용과 근접발달영역, 비계 설정의 중요성을 강조했다. 비고츠키는 사회적 상호작용과 언어가 인지 발달에 중요한 역할을 한다고 보았다. 피아제는 아동이 환경과 상호작용하며 인지 구조를 능동적으로 발달시킨다고 보았다.","학생의 현재 수준과 도움을 통해 도달할 수 있는 수준을 고려한 수업 설계를 설명할 수 있다.","피아제는 학습자가 환경과 상호작용하며 도식의 동화와 조절을 통해 인지 구조를 발달시킨다고 보았다. 비고츠키는 사회문화적 상호작용과 근접발달영역, 비계 설정의 중요성을 강조했다.  비고츠키는 사회적 상호작용과 언어가 인지 발달에 중요한 역할을 한다고 보았다. 근접발달영역(ZPD)은 혼자 해결하는 수준과 도움을 받으면 해결할 수 있는 수준 사이이며, 교사나 또래의 비계 설정(scaffolding)이 점차 독립 수행으로 이어지도록 돕는다.\n\n피아제는 아동이 환경과 상호작용하며 인지 구조를 능동적으로 발달시킨다고 보았다. 동화는 기존 도식에 새 경험을 맞추는 과정, 조절은 기존 도식을 수정하는 과정, 평형화는 둘 사이의 균형을 찾는 과정이다. 발달 단계는 수업 내용을 기계적으로 제한하는 기준이 아니라 학습자 이해를 위한 이론적 관점으로 활용해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["근접발달영역이란?","비계를 점차 줄이는 이유는?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["프로젝트 기반 학습과 문제 중심 학습","프로젝트 기반 학습은 의미 있는 산출물을 만들기 위해 일정 기간 탐구·설계·제작·공유하는 학습이다. 문제 중심 학습은 복잡하고 실제적인 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다.\n\n구성주의는 학습자가 기존 지식과 경험으로 새로운 의미를 능동적으로 구성한다고 본다. 문제중심학습은 복잡한 실제 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다. 프로젝트 기반 학습은 일정 기간 탐구·설계·제작을 진행해 의미 있는 산출물을 만들고 공유한다. 문제중심학습은 문제 해결 과정의 지식 습득과 추론을, 프로젝트 기반 학습은 장기간 산출물과 공개적 결과 공유를 강조하는 경향이 있다. 활동 뒤 핵심 개념 정리·중간 피드백·성찰이 필요하다.\n\n정보 교과의 프로그래밍·데이터·AI 수업에서 실제 문제를 중심으로 학습을 설계하는 방법을 설명할 수 있다.\n\n역할 분담과 중간 점검, 개인별 설명, 과정 기록을 함께 평가해 일부 학생에게 작업이 집중되는 문제를 줄인다.\n\n프로젝트 기반 학습은 의미 있는 산출물을 만들기 위해 일정 기간 탐구·설계·제작·공유하는 학습이다. 문제 중심 학습은 복잡하고 실제적인 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다.","정보 교과의 프로그래밍·데이터·AI 수업에서 실제 문제를 중심으로 학습을 설계하는 방법을 설명할 수 있다.","프로젝트 기반 학습은 의미 있는 산출물을 만들기 위해 일정 기간 탐구·설계·제작·공유하는 학습이다. 문제 중심 학습은 복잡하고 실제적인 문제를 출발점으로 필요한 지식을 탐색하고 해결안을 구성한다.  수업 설계에서는 교육 목표, 학습 활동, 평가가 서로 일치해야 한다. 학습자의 사전 지식과 접근성 차이를 고려하고, 정답 결과뿐 아니라 문제 정의·전략 선택·오류 수정·성찰 과정에서 학습 증거를 수집해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["프로젝트 결과물만 평가하면 안 되는 이유는?","수준 차이가 큰 모둠을 어떻게 운영할 것인가?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["언플러그드 활동과 알고리즘 교육","언플러그드 활동은 컴퓨터나 프로그래밍 환경 없이 카드, 보드, 신체 활동, 역할 놀이 등을 통해 컴퓨터 과학 개념을 경험하도록 하는 교수 방법이다. 알고리즘의 순서, 조건, 반복, 정보 표현, 네트워크 전달 등을 활동으로 모델링할 수 있다.\n\n언플러그드 활동은 컴퓨터 없이 카드·보드·신체 활동·역할 놀이로 컴퓨터 과학 원리를 경험하게 한다. 학생이 정렬 규칙에 따라 줄을 서거나 한 학생이 명령어를 말하고 다른 학생이 로봇처럼 움직이면 순차·조건·반복을 체험할 수 있다. 활동 후 어떤 규칙을 사용했는지 설명하고 순서도·의사코드·실제 프로그램으로 연결해야 추상화와 전이가 일어난다. 언플러그드는 실제 구현·디버깅을 대체하기보다 개념 도입을 보완한다.\n\n언플러그드 수업은 컴퓨터 없이 원리를 체험하게 하지만 활동과 개념 사이 연결을 명시해야 한다. 학생이 사람을 정렬하는 활동을 했다면 어떤 비교 규칙이 사용됐는지, 비교 횟수가 데이터 수에 따라 어떻게 증가하는지 토론하고 실제 정렬 알고리즘으로 표현한다. 활동이 끝난 뒤 학습자가 원리를 설명하거나 다른 문제에 적용하는지 확인해야 재미있는 체험이 개념 학습으로 이어진다.\n\n기기 접근성이 낮거나 추상 개념을 처음 배우는 학습자에게 개념의 핵심 원리를 구체적으로 경험하게 한다.\n\n언플러그드 활동은 개념 도입과 사고 과정 체험에 유용하지만 실제 프로그래밍 구현·디버깅 경험과 연결될 때 학습이 완성된다.\n\n언플러그드 활동은 컴퓨터나 프로그래밍 환경 없이 카드, 보드, 신체 활동, 역할 놀이 등을 통해 컴퓨터 과학 개념을 경험하도록 하는 교수 방법이다. 언플러그드 활동은 컴퓨터 없이 카드·신체 활동·놀이 등으로 알고리즘과 정보 개념을 경험하게 한다.","기기 접근성이 낮거나 추상 개념을 처음 배우는 학습자에게 개념의 핵심 원리를 구체적으로 경험하게 한다.","언플러그드 활동은 컴퓨터나 프로그래밍 환경 없이 카드, 보드, 신체 활동, 역할 놀이 등을 통해 컴퓨터 과학 개념을 경험하도록 하는 교수 방법이다. 알고리즘의 순서, 조건, 반복, 정보 표현, 네트워크 전달 등을 활동으로 모델링할 수 있다.\n\n언플러그드 활동은 컴퓨터 없이 카드·신체 활동·놀이 등으로 알고리즘과 정보 개념을 경험하게 한다. 추상적인 개념을 구체적 조작으로 먼저 경험할 수 있지만, 활동 뒤 실제 컴퓨터 개념·표현·코딩으로 연결해 전이하도록 정리해야 한다. 따라서 적용 상황에서는 장점뿐 아니라 전제 조건과 한계를 함께 고려해야 한다.",["언플러그드 활동이 코딩 교육을 대체할 수 있습니까?","활동 후 추상화 단계가 필요한 이유는?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]],["2022 개정 교육과정과 정보 교과","2022 개정 교육과정은 디지털 전환과 인공지능 등 사회 변화에 대응해 학생 주도성, 깊이 있는 학습, 디지털 기초 소양 등을 강조한다. 정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 정보과학의 핵심 개념과 역량을 다룬다.\n\n정보 교과는 디지털 도구 사용을 넘어 컴퓨팅 원리를 이해하고 데이터·알고리즘·프로그래밍으로 문제를 해결하며 디지털 사회에 책임 있게 참여하는 역량을 기른다. 교육과정은 목표·내용·교수학습·평가를 연결하는 기준이다. 2022 개정 교육과정은 디지털 전환과 AI 등 사회 변화에 대응해 디지털 기초 소양, 학생 주도성, 깊이 있는 학습 등을 강조한다. 세부 성취기준은 학교급·과목별 교육과정 별책 원문으로 확인해야 한다.\n\n교육과정의 성취기준은 학생이 학습 후 보여야 할 지식·기능·태도 수준을 구체화한다. 교사는 성취기준을 분석해 수업 목표와 평가 기준을 만들고 학생의 선행 지식과 학교 환경을 고려해 학습 활동을 설계한다. 교육과정은 단원 순서를 그대로 전달하는 문서가 아니라 학교와 교사가 수업·평가를 설계할 때 기준으로 삼는 틀이다. 면접에서는 교육과정의 정확한 문구와 적용 학년·과목을 원문으로 확인해야 한다.\n\n컴퓨터교육 대학원 면접에서 교육과정의 방향과 교과 수업 설계를 연결해 설명할 수 있다.\n\n면접 직전에는 교육부 고시 원문과 지원 대학이 안내하는 학교급·과목별 교육과정 및 최신 성취기준을 직접 확인해야 한다.","컴퓨터교육 대학원 면접에서 교육과정의 방향과 교과 수업 설계를 연결해 설명할 수 있다.","2022 개정 교육과정은 디지털 전환과 인공지능 등 사회 변화에 대응해 학생 주도성, 깊이 있는 학습, 디지털 기초 소양 등을 강조한다. 정보 교과는 컴퓨팅 시스템, 데이터, 알고리즘과 프로그래밍, 인공지능, 디지털 문화 등 정보과학의 핵심 개념과 역량을 다룬다.",["2022 개정 교육과정에서 정보 교과를 어떻게 이해하고 있습니까?","교육과정 성취기준과 수업 활동·평가를 어떻게 연결합니까?"],"",[["교육부 2022 개정 교육과정 고시","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0&statusYN=W"],["서울시교육청 교육과정 안내","https://www.sen.go.kr/www/eduinfo/edumaterial/curriculum/curriculum_1.jsp"],["ACM/IEEE CS2023","https://csed.acm.org/knowledge-areas/"]]]]]],"subjectGuides":{"컴퓨터구조":{"context":"컴퓨터구조는 프로그램이 실행될 때 하드웨어 내부에서 정보가 어떻게 표현되고 이동하며 처리되는지를 다룹니다. 소프트웨어의 명령은 결국 CPU의 연산과 메모리 접근, 입출력 동작으로 이어집니다. 따라서 각 부품의 이름만 외우기보다 데이터가 어디에서 출발해 어떤 경로를 거쳐 결과가 되는지 연결해서 이해해야 합니다.","example":"프로그램에서 두 수를 더하는 상황을 생각해 보세요. 명령어가 메모리에서 인출되고, 제어장치가 연산을 해석하며, 레지스터에 값이 준비되고, ALU가 계산한 결과가 레지스터나 메모리에 저장됩니다. 실제 성능은 CPU의 연산 속도뿐 아니라 캐시 적중 여부와 메모리 접근 시간에도 영향을 받습니다.","focus":"명령어 실행 경로, 데이터 경로와 제어 경로, 저장장치 계층, 성능 지표를 서로 연결해 보세요."},"운영체제":{"context":"운영체제는 여러 프로그램이 CPU·메모리·저장장치·입출력 장치를 안전하고 효율적으로 나누어 사용하도록 관리하는 시스템 소프트웨어입니다. 프로그램이 실행되면 프로세스나 스레드가 되고, 운영체제는 실행 순서와 메모리 공간, 파일 접근 권한 등을 관리합니다.","example":"웹 브라우저와 음악 재생 프로그램을 동시에 실행하면 운영체제는 CPU 시간을 나누고 각 프로세스의 상태를 관리합니다. 한 프로그램이 입출력을 기다리는 동안 다른 프로그램을 실행할 수 있어 자원을 효율적으로 사용할 수 있습니다.","focus":"프로세스·스레드, 스케줄링, 동기화, 가상 메모리, 파일 시스템이 각각 어떤 자원 문제를 해결하는지 연결하세요."},"자료구조":{"context":"자료구조는 데이터를 어떤 형태로 저장하고 어떤 연산을 빠르게 수행할지 결정하는 방법입니다. 같은 데이터라도 배열, 연결 리스트, 스택, 큐, 트리, 해시 등 어떤 구조를 선택하는지에 따라 탐색·삽입·삭제 비용과 메모리 사용량이 달라집니다.","example":"학생 번호로 학생 정보를 자주 찾는다면 키를 이용해 빠르게 접근하는 해시 구조가 유리할 수 있습니다. 반면 최근에 들어온 작업부터 처리하거나 되돌리기 기능을 구현한다면 스택이 자연스럽습니다. 중요한 것은 구조의 이름보다 필요한 연산과 데이터의 특성에 맞춰 선택하는 것입니다.","focus":"각 구조가 보장하는 순서, 접근 방식, 삽입·삭제·탐색의 시간복잡도를 비교하세요."},"알고리즘":{"context":"알고리즘은 주어진 문제를 해결하기 위한 유한하고 명확한 절차입니다. 좋은 알고리즘은 정답을 내는 것뿐 아니라 모든 유효한 입력에서 올바르게 동작해야 하고, 시간과 메모리 자원을 합리적으로 사용해야 합니다.","example":"여러 지점 사이의 최단 이동 경로를 구할 때 단순히 가능한 모든 경로를 확인하면 경우의 수가 급격히 증가할 수 있습니다. 문제의 조건에 따라 BFS, 다익스트라, 동적 계획법 등 적합한 전략을 선택하고, 그 전략이 정답을 보장하는 이유를 설명해야 합니다.","focus":"문제 조건 파악 → 알고리즘 선택 → 정확성 근거 → 시간·공간복잡도 분석의 순서로 정리하세요."},"컴퓨터네트워크":{"context":"컴퓨터네트워크는 서로 다른 장치와 시스템이 규칙에 따라 데이터를 주고받는 구조입니다. 통신은 한 가지 기술로 이루어지는 것이 아니라 물리적 전송, 주소 지정, 경로 선택, 전송 신뢰성, 응용 서비스 등 여러 계층의 프로토콜이 협력해 이루어집니다.","example":"브라우저에 웹사이트 주소를 입력하면 이름 해석을 위해 DNS를 이용하고, 목적지 IP로 패킷을 보내며, 필요하면 TCP 연결을 수립한 뒤 HTTP 요청과 응답을 주고받습니다. 각 단계가 서로 다른 계층의 기능이라는 점을 이해하면 장애 로그도 계층별로 분석할 수 있습니다.","focus":"계층별 역할, 캡슐화, 주소와 포트의 차이, 연결 설정과 데이터 전달 과정을 흐름으로 설명하세요."},"데이터베이스":{"context":"데이터베이스는 데이터를 일관되고 안전하게 저장하고 필요한 정보를 효율적으로 검색·수정하기 위한 체계입니다. 데이터 모델링은 현실의 정보를 구조화하고, SQL은 데이터를 정의·조회·변경하며, 트랜잭션은 여러 작업을 하나의 논리적 단위로 관리합니다.","example":"학교 수강 신청 시스템에서는 학생, 과목, 수강 신청 정보를 각각 관리하고 학생과 과목의 관계를 수강 신청 테이블로 표현할 수 있습니다. 중복 저장을 줄이는 정규화와 빠른 조회를 위한 인덱스, 동시 신청에서 데이터가 꼬이지 않도록 하는 트랜잭션이 함께 필요합니다.","focus":"데이터 모델 → 테이블과 제약조건 → SQL 처리 → 인덱스와 실행 계획 → 트랜잭션의 흐름으로 연결하세요."},"프로그래밍 언어":{"context":"프로그래밍 언어는 문제 해결 절차를 컴퓨터가 실행할 수 있도록 표현하는 형식 체계입니다. 문법뿐 아니라 자료형, 이름과 범위, 메모리 관리, 함수 호출, 예외 처리, 실행 방식 등이 프로그램의 의미와 안정성에 영향을 줍니다.","example":"학생 점수를 처리하는 프로그램을 만든다면 입력값의 자료형과 유효 범위를 확인하고, 기능을 함수로 나누며, 잘못된 입력에 대한 예외 처리를 해야 합니다. 프로그램이 커질수록 변수의 범위와 객체 간 책임을 명확히 하는 것이 유지보수에 중요합니다.","focus":"문법과 의미의 차이, 정적·동적 타입, 컴파일·실행 과정, 추상화와 모듈화의 관계를 이해하세요."},"소프트웨어공학":{"context":"소프트웨어공학은 소프트웨어를 개인의 코딩 작업이 아니라 요구사항부터 설계·구현·테스트·배포·유지보수까지 체계적으로 개발하는 분야입니다. 여러 사람이 협업하고 변경을 관리하며 품질과 비용, 일정을 균형 있게 다루는 것이 핵심입니다.","example":"학교 시간표 서비스를 개발한다면 먼저 학생·교사·관리자의 요구를 조사하고, 기능과 제약을 명세한 뒤 구조를 설계합니다. 구현 후에는 정상 입력뿐 아니라 충돌 시간표 같은 예외를 테스트하고, 배포 뒤에도 오류 수정과 요구 변경을 관리해야 합니다.","focus":"개발 생명주기의 각 단계가 필요한 이유와 요구사항 변경·테스트·형상관리의 연결을 설명하세요."},"정보보안":{"context":"정보보안은 정보와 시스템의 기밀성·무결성·가용성을 보호하기 위해 위험을 식별하고 적절한 통제를 적용하는 활동입니다. 단일 장비나 제품만으로 모든 위협을 막을 수 없으므로 사람·절차·기술을 결합한 다층 방어와 지속적인 모니터링이 필요합니다.","example":"보안관제에서 비정상적인 웹 요청이 탐지되면 로그의 출발지·목적지·요청 패턴과 자산 중요도를 확인하고, 방화벽이나 WAF 정책으로 확산을 억제할 수 있습니다. 다만 차단만으로 원인이 제거되는 것은 아니므로 취약점 패치, 계정 점검, 침해 범위 분석과 재발 방지가 뒤따라야 합니다.","focus":"자산·위협·취약점·위험의 관계, 예방·탐지·대응 통제, 로그를 통한 근거 기반 판단을 연결하세요."},"인공지능·데이터 과학":{"context":"인공지능과 데이터 과학은 데이터를 바탕으로 패턴을 찾거나 예측·생성·의사결정을 수행하는 방법을 다룹니다. 모델의 성능은 알고리즘만으로 결정되지 않고 데이터 품질, 학습 목표, 평가 방법, 실제 사용 환경과 윤리적 고려에 영향을 받습니다.","example":"스팸 메일 분류 모델을 만든다면 정상·스팸 사례를 수집하고 학습·검증·테스트 데이터로 나누어 학습합니다. 정확도만 보면 스팸이 매우 적은 데이터에서 성능을 오해할 수 있으므로 정밀도와 재현율도 함께 살펴야 합니다.","focus":"데이터 → 전처리 → 학습 → 검증 → 평가 → 실제 적용과 모니터링의 흐름을 이해하세요."},"컴퓨터교육론":{"context":"컴퓨터교육은 학생이 디지털 도구를 사용하는 데 그치지 않고 컴퓨팅 원리와 사고 과정을 이해하며 문제를 해결하고 책임 있게 기술을 활용하도록 돕는 교육입니다. 교육 목표, 학습자 수준, 내용, 교수·학습 방법, 평가가 서로 일관되게 설계되어야 합니다.","example":"학생들에게 반복문을 가르칠 때 문법을 먼저 외우게 하기보다 반복되는 일상 문제를 찾아 절차를 표현하고, 순서도나 블록 코딩으로 반복 구조를 경험하게 한 뒤 텍스트 코드로 연결할 수 있습니다. 학생의 오류를 정답 여부만으로 판단하지 않고 사고 과정을 파악하는 자료로 활용하는 것이 중요합니다.","focus":"무엇을 배우게 할지(목표), 어떤 경험을 제공할지(수업), 무엇으로 확인할지(평가)를 일관되게 연결하세요."}},"sourceCounts":{"originalS":62,"EXTRA":67,"ADVANCED":58,"EXTRA2":44,"preservedOriginalTotal":231,"newSupplementaryTopics":15,"finalTotal":246},"additionalTopics":{"컴퓨터구조":["폰 노이만 구조와 하버드 구조 비교","CPU 레지스터와 프로그램 실행 상태"],"운영체제":["파일 시스템과 파일 접근 권한"],"자료구조":["원형 큐와 큐의 공간 재사용"],"알고리즘":["다익스트라 알고리즘과 최단 경로"],"컴퓨터네트워크":["TCP 3-way handshake와 4-way handshake","TLS와 HTTPS의 보안 통신 과정"],"데이터베이스":["동시성 제어와 격리 수준"],"프로그래밍 언어":["함수 호출과 재귀 호출의 실행 구조"],"소프트웨어공학":["UML과 시스템 모델링"],"정보보안":["악성코드와 랜섬웨어","로그 분석과 보안 이벤트 상관분석"],"인공지능·데이터 과학":["CNN·RNN·트랜스포머의 특징","머신러닝 평가 지표와 데이터 분리"],"컴퓨터교육론":["언플러그드 활동과 알고리즘 교육","2022 개정 교육과정과 정보 교과"]}};

</script>

const DATA=window.STUDY_DATA;if(!DATA||!Array.isArray(DATA.subjects)){document.querySelector('main').innerHTML='<p class="panel">학습 데이터 파일(study-data.js)을 찾을 수 없습니다. index.html과 같은 폴더에 있는지 확인하세요.</p>';return;}
const subjects=DATA.subjects, guides=DATA.subjectGuides||{}, $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}};
let done=load('csStudyDone',{}), last=load('csStudyLast',null), currentSubject=0,currentTopic=0,view='home',query='';
const allTopics=()=>subjects.flatMap((s,si)=>s[3].map((t,ti)=>({s,si,t,ti,key:`${si}-${ti}`})));
const count=()=>allTopics().length, doneCount=()=>allTopics().filter(x=>done[x.key]).length, pct=()=>count()?Math.round(doneCount()/count()*100):0;
function save(){localStorage.setItem('csStudyDone',JSON.stringify(done));localStorage.setItem('csStudyLast',JSON.stringify(last));}
function progressUI(){let p=pct(),n=doneCount();$('#topProgress').textContent=`학습 진도 ${p}%`;$('#sideProgressBar').style.width=p+'%';$('#sideProgressText').textContent=`${n}/${count()}개 개념 완료 · ${p}%`;}
function show(v){view=v;['home','subject','detail','search','progress'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',(v==='home'&&b.dataset.action==='home')||(v==='progress'&&b.dataset.action==='progress')||(v!=='home'&&v!=='progress'&&Number(b.dataset.subject)===currentSubject)));$('#sidebar').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});}
function subjectNav(){ $('#sideSubjects').innerHTML=subjects.map((s,i)=>`<button class="nav" data-subject="${i}">${String(i+1).padStart(2,'0')}　${esc(s[1])}</button>`).join(''); }
function home(){progressUI();let lastItem=last&&subjects[last.si]?.[3]?.[last.ti];$('#homeView').innerHTML=`<div class="hero"><div class="eyebrow">COMPUTER SCIENCE · ORAL INTERVIEW</div><h1>개념을 이해하고,<br>내 말로 설명하는 면접 준비.</h1><p>컴퓨터공학 기초부터 정보교육의 교수·학습 관점까지. 개념의 배경과 구성 요소, 처리 원리, 실제 사례, 심화 질문을 독립된 학습 페이지에서 공부하세요.</p><div class="chips"><span>기초 → 원리 → 심화 → 교육적 활용</span><span>개념별 상세 학습</span><span>구술 답변·꼬리 질문</span><span>진도 자동 저장</span><span>모바일 최적화</span></div></div><div class="stats"><div class="stat"><strong>11</strong><span>전체 과목</span></div><div class="stat"><strong>${count()}</strong><span>전체 개념</span></div><div class="stat"><strong>${doneCount()}</strong><span>학습 완료</span></div><div class="stat"><strong>${pct()}%</strong><span>전체 학습 진도</span></div></div>${lastItem?`<div class="panel"><div class="section-kicker">CONTINUE STUDYING</div><h3>이어서 공부하기</h3><p><b>${esc(subjects[last.si][1])}</b> · ${esc(lastItem[0])}</p><button class="btn primary" id="resumeBtn">마지막 학습 위치로 이동</button></div>`:''}<h2>전공별 학습하기</h2><p class="muted">과목을 선택하면 전체 개념 목차가 열립니다. 원하는 개념을 선택해 상세 학습 페이지로 이동하세요.</p><div class="subject-grid">${subjects.map((s,i)=>{let n=s[3].filter((t,j)=>done[`${i}-${j}`]).length,p=Math.round(n/s[3].length*100);return `<article class="subject-card" data-open-subject="${i}"><span class="icon">${esc(s[0])}</span><h3>${String(i+1).padStart(2,'0')}. ${esc(s[1])}</h3><p>${esc(s[2])}</p><div class="card-foot"><span>${n}/${s[3].length}개 완료</span><div class="mini-bar"><i style="width:${p}%"></i></div><b>${p}%</b></div></article>`}).join('')}</div><div class="panel"><h3>추천 학습 순서</h3><p class="muted">개념을 읽은 뒤 화면을 가리고 30~60초 동안 설명하고, 꼬리 질문에 답한 다음 학습 완료를 체크하세요. 정답 문장을 외우기보다 정의·원리·비교·사례를 연결해 말하는 연습이 중요합니다.</p></div>`;}
function openSubject(si){currentSubject=si;show('subject');renderSubject();}
function renderSubject(){let s=subjects[currentSubject],n=s[3].filter((t,i)=>done[`${currentSubject}-${i}`]).length;$('#subjectView').innerHTML=`<div class="row"><button class="btn" data-action="home">← 전체 과목</button><span class="muted">${esc(s[2])}</span></div><div class="subject-head"><div><h2>${esc(s[0])} ${esc(s[1])}</h2><p class="muted">${s[3].length}개 개념 · ${n}개 학습 완료</p></div><div class="muted">${Math.round(n/s[3].length*100)}%</div></div><div class="mini-bar" style="height:8px"><i style="width:${n/s[3].length*100}%"></i></div><p class="muted" style="margin-top:14px">개념을 선택하면 별도의 상세 학습 화면으로 이동합니다. 각 개념 페이지에서 이전·다음 개념으로 이동할 수 있습니다.</p><div class="topic-list">${s[3].map((t,i)=>`<article class="topic-card"><button class="topic-open" data-open-topic="${i}"><span class="topic-number">${String(i+1).padStart(2,'0')}</span><span class="topic-meta"><strong>${esc(t[0])}</strong><small>${esc(t[1].slice(0,105))}${t[1].length>105?'…':''}</small></span><span class="status">${done[`${currentSubject}-${i}`]?'✓ 완료':'학습하기　›'}</span></button></article>`).join('')}</div>`;}
function sentenceList(text){return String(text||'').split(/(?<=[.!?。])\s+/).map(x=>x.trim()).filter(Boolean).slice(0,5)}
function flowFor(title,base){let x=(title+' '+base).toLowerCase();if(/명령어 사이클|fetch|인출/.test(x))return ['프로그램 카운터(PC)가 다음 명령어의 주소를 제공한다.','CPU가 해당 주소의 명령어를 메모리에서 읽어 명령어 레지스터(IR)에 저장한다.','제어장치가 연산 코드와 피연산자 정보를 해독한다.','필요한 레지스터·메모리 값을 가져와 ALU 또는 해당 실행 장치가 작업을 수행한다.','결과를 레지스터나 메모리에 기록하고 다음 명령어 실행을 준비한다.'];if(/3-way|handshake|tcp 연결/.test(x))return ['클라이언트가 SYN을 보내 연결을 요청한다.','서버가 SYN과 ACK를 함께 보내 요청을 수락하고 자신의 초기 순서 번호를 알린다.','클라이언트가 ACK를 보내면 연결 설정이 완료된다.','데이터를 송수신하는 동안 순서 번호와 확인 응답 등을 이용해 신뢰성을 관리한다.','종료 시에는 양쪽 송신 방향을 각각 정리하는 FIN·ACK 절차를 수행한다.'];if(/dns|도메인/.test(x))return ['사용자가 브라우저에 도메인 이름을 입력한다.','브라우저와 운영체제의 캐시에서 유효한 결과가 있는지 확인한다.','필요하면 재귀 DNS 서버에 질의하고 루트·최상위 도메인·권한 네임서버를 따라 조회한다.','IP 주소 등 응답을 받아 캐시에 저장한다.','브라우저는 얻은 주소를 사용해 대상 서버와 통신한다.'];if(/트랜잭션|acid/.test(x))return ['트랜잭션이 수행할 작업과 필요한 데이터를 확인한다.','DBMS가 잠금이나 버전 관리 등 동시성 제어 규칙을 적용한다.','각 SQL 작업을 실행하고 제약조건 및 무결성을 확인한다.','모든 작업이 정상이라면 COMMIT으로 결과를 확정하고, 오류가 발생하면 ROLLBACK으로 취소한다.','커밋 결과는 장애 복구 정책에 따라 지속성을 보장하도록 로그·저장장치에 반영된다.'];if(/다익스트라|최단 경로/.test(x))return ['시작 정점의 거리를 0으로, 나머지 정점의 거리를 무한대로 초기화한다.','현재까지 거리가 가장 짧은 미확정 정점을 선택한다.','선택한 정점에서 인접 정점으로 이동하는 비용을 계산해 더 짧으면 거리를 갱신한다.','갱신된 후보를 우선순위 큐 등에 반영하고 다음 정점을 선택한다.','더 이상 처리할 정점이 없거나 목적지의 최단 거리가 확정되면 종료한다.'];if(/페이지 폴트|페이징|가상 메모리/.test(x))return ['프로세스가 가상 주소를 참조하면 MMU와 페이지 테이블을 통해 물리 주소 변환을 시도한다.','해당 페이지가 메모리에 있으면 프레임 주소를 이용해 접근을 계속한다.','페이지가 없으면 페이지 폴트 예외가 발생해 운영체제에 제어가 넘어간다.','운영체제는 접근이 유효한지 확인하고 필요하면 빈 프레임을 확보하거나 교체 대상 페이지를 선택한다.','보조기억장치에서 페이지를 적재하고 페이지 테이블을 갱신한 뒤 명령을 다시 수행한다.'];if(/sql injection|xss|csrf|웹 취약/.test(x))return ['공격자가 외부 입력이나 브라우저의 인증 상태를 악용할 수 있는 지점을 찾는다.','입력값이 서버의 SQL·HTML·스크립트 문맥 또는 요청 처리에 영향을 주는지 확인한다.','취약한 검증·인코딩·권한 확인이 있으면 의도하지 않은 명령 실행이나 요청이 발생한다.','서버는 매개변수화 쿼리, 문맥별 출력 인코딩, CSRF 토큰, 서버 측 권한 검증 등으로 위험을 줄인다.','로그와 보안 테스트로 우회 가능성을 확인하고 수정 사항을 회귀 검증한다.'];if(/지도학습|비지도학습|강화학습|머신러닝/.test(x))return ['문제와 예측·학습 목표를 정의하고 적절한 데이터를 수집한다.','결측치·오류·중복 등을 점검하고 학습에 적합한 형태로 전처리한다.','학습 방식에 맞는 모델과 손실·보상 기준을 선택한다.','학습 데이터로 모델 파라미터를 조정하고 검증 데이터로 설정을 점검한다.','독립적인 테스트 데이터와 적절한 지표로 성능·편향·일반화 가능성을 평가한다.'];return ['먼저 이 개념이 해결하려는 문제와 입력 조건을 확인한다.','개념을 구성하는 요소와 각 요소의 역할을 구분한다.','요소 사이에 어떤 정보나 제어가 전달되는지 순서대로 살펴본다.','처리 결과가 어디에 반영되고 다음 단계에 어떤 영향을 주는지 확인한다.','정상 상황뿐 아니라 예외·오류·규모 변화에서 한계와 보완 방법을 검토한다.'];}
function exampleFor(subj,t,g){let base=g?.example||'';let samples={'컴퓨터구조':'웹 브라우저에서 프로그램을 실행하면 CPU가 명령어를 인출·해독·실행하고, 캐시와 RAM에서 필요한 데이터를 가져오며, 입출력 장치가 화면과 키보드 동작을 처리한다.','운영체제':'브라우저와 음악 플레이어를 동시에 실행하면 운영체제는 각 프로그램의 프로세스·스레드에 CPU 시간을 배분하고 메모리와 파일 접근을 관리한다.','자료구조':'학교 도서 대출 시스템에서 도서 번호 검색은 해시나 트리, 대기 순서 관리는 큐, 실행 취소는 스택으로 모델링할 수 있다.','알고리즘':'학교 통학 경로를 계산할 때 교차로를 정점, 도로를 간선, 이동 시간을 가중치로 표현하고 최단 경로 알고리즘을 적용할 수 있다.','컴퓨터네트워크':'스마트폰에서 웹사이트를 열면 DNS 조회, TCP 연결, TLS 보안 협상, HTTP 요청·응답이 연속적으로 이루어진다.','데이터베이스':'학교 수강 신청에서 학생·과목·신청 정보를 테이블로 관리하고, 동시 신청과 정원 초과가 발생하지 않도록 트랜잭션과 제약조건을 적용한다.','프로그래밍 언어':'학생 성적 처리 프로그램에서 자료형으로 점수를 표현하고 조건문으로 등급을 분류하며 함수로 계산 과정을 분리할 수 있다.','소프트웨어공학':'학교 출결 시스템을 개발한다면 요구사항을 정리하고 설계·구현·테스트·배포·유지보수 순서로 관리한다.','정보보안':'학교 학사 시스템에서는 계정 권한, HTTPS, 로그 모니터링, 백업, 취약점 점검을 결합해 개인정보와 서비스 가용성을 보호한다.','인공지능·데이터 과학':'학습 플랫폼의 문제 추천은 학생의 풀이 기록을 정제하고 학습 패턴을 분석해 다음 학습 콘텐츠를 추천하는 방식으로 구현할 수 있다.','컴퓨터교육론':'학생이 교내 분리수거 문제를 해결하도록 데이터를 수집하고 규칙을 찾아 알고리즘을 설계한 뒤 간단한 프로그램이나 시뮬레이션으로 검증하게 할 수 있다.'};return `${samples[subj]||''} ${base}`.trim();}
function educationFor(subj,t){let map={'컴퓨터구조':'중학생에게는 책상 위의 작업 공간과 창고를 메모리 계층에 비유하고, 고등학생에게는 레지스터·캐시·RAM의 속도와 용량 차이를 표로 비교하게 한다. CPU가 명령어를 처리하는 과정을 역할 카드로 나누어 순서대로 재현하는 활동도 가능하다.','운영체제':'중학생에게는 여러 학생이 한 대의 프린터를 공유하는 상황으로 자원 관리와 대기열을 설명한다. 고등학생에게는 프로세스 상태 전이도나 임계영역 예제를 제공하고, 동기화 오류가 발생하는 조건을 실험하게 한다.','자료구조':'중학생에게는 접시 쌓기, 줄 서기, 교실 좌석 배치로 스택·큐·배열을 체험하게 한다. 고등학생에게는 동일한 문제를 서로 다른 자료구조로 구현하고 연산 횟수를 비교하게 한다.','알고리즘':'중학생에게는 교실 정리나 길 찾기를 단계별 규칙으로 표현하게 하고, 고등학생에게는 의사코드와 순서도로 설계한 뒤 입력 크기를 바꾸어 효율을 비교하게 한다.','컴퓨터네트워크':'중학생에게는 편지의 주소와 전달 경로로 패킷 전달을 설명한다. 고등학생에게는 계층별 프로토콜을 분석하고 브라우저 개발자 도구나 네트워크 실습으로 요청·응답 흐름을 관찰하게 한다.','데이터베이스':'중학생에게는 학생·도서 대출 카드를 표로 정리하고 중복 데이터의 문제를 찾게 한다. 고등학생에게는 관계를 설계하고 SQL JOIN 및 정규화 전후의 데이터 중복을 비교하게 한다.','프로그래밍 언어':'중학생에게는 블록 코딩으로 조건·반복을 시각화하고, 고등학생에게는 함수 분리와 객체 모델링을 적용해 작은 프로그램을 설계하게 한다.','소프트웨어공학':'중학생에게는 학급 일정 앱을 기획하고 역할을 나누어 프로토타입을 만들게 한다. 고등학생에게는 요구사항 명세, UML, 테스트 케이스, 버전관리 과정을 프로젝트 산출물로 남기게 한다.','정보보안':'중학생에게는 비밀번호와 개인정보 공개 범위를 사례 토론으로 다룬다. 고등학생에게는 허가된 실습 환경에서 입력 검증, 접근통제, 로그 분석을 수행하고 윤리적 범위를 함께 강조한다.','인공지능·데이터 과학':'중학생에게는 분류 카드 활동으로 학습 데이터와 예측 결과를 경험하게 한다. 고등학생에게는 데이터 분리, 모델 평가 지표, 편향과 개인정보 문제를 포함한 미니 프로젝트를 수행하게 한다.','컴퓨터교육론':'학생의 사전 경험을 진단하고 작은 성공 경험에서 출발해 탐구·협력·성찰로 확장한다. 결과물만이 아니라 문제 정의, 알고리즘 설계, 오류 수정, 협업 과정도 루브릭으로 평가한다.'};return map[subj]||'학습자의 사전 지식과 발달 수준을 고려해 구체적인 사례에서 출발하고, 점차 추상적인 표현과 실제 구현으로 연결한다.';}
function comparison(t){let title=t[0],m=t[5]||'';let pairs=[['프로세스와 스레드','프로세스는 독립 주소 공간을 가진 실행 단위이며, 스레드는 프로세스 내부에서 실행 흐름을 나누는 단위다.','격리와 안정성이 중요하면 프로세스 분리를, 자원 공유와 가벼운 병렬 실행이 중요하면 스레드를 고려한다.'],['TCP와 UDP','TCP는 연결 설정과 신뢰성·순서 보장을 제공하고, UDP는 연결 설정 없이 데이터그램을 전달한다.','정확한 전달과 순서가 중요하면 TCP 계열을, 낮은 지연과 응용 수준의 자체 제어가 중요하면 UDP를 고려한다.'],['HTTP와 HTTPS','HTTP는 웹 요청·응답 규약이며, HTTPS는 HTTP에 TLS를 적용해 전송 구간을 보호한다.','로그인·결제 등 민감 정보뿐 아니라 일반 웹 서비스도 전송 구간 보호를 위해 HTTPS를 사용한다.'],['대칭키와 공개키 암호','대칭키는 같은 비밀키로 암·복호화하고, 공개키 방식은 공개키와 개인키 쌍을 사용한다.','대량 데이터는 대칭키가 효율적이고, 키 합의·인증·전자서명에는 공개키 방식이 유용하다.'],['정규화와 반정규화','정규화는 중복과 이상 현상을 줄이도록 데이터를 분해하고, 반정규화는 조회 성능 등을 위해 의도적으로 중복을 허용한다.','무결성과 변경 일관성이 우선이면 정규화를, 측정된 조회 병목이 크면 신중하게 반정규화를 검토한다.'],['스택과 큐','스택은 후입선출(LIFO), 큐는 선입선출(FIFO) 구조다.','함수 호출·되돌리기는 스택, 작업 대기열·순서 처리는 큐가 자연스럽다.'],['BFS와 DFS','BFS는 가까운 정점부터 큐로 탐색하고, DFS는 한 경로를 깊게 스택 또는 재귀로 탐색한다.','가중치 없는 최단 간선 수 경로는 BFS, 경로 탐색·연결 요소·백트래킹 구조는 DFS가 유용하다.'],['컴파일러와 인터프리터','컴파일러는 코드를 다른 형태로 번역하고, 인터프리터는 실행 과정에서 코드를 해석한다. 실제 언어 구현은 두 방식을 혼합할 수 있다.','실행 방식은 언어 이름만으로 단정하지 말고 런타임·JIT·바이트코드 등 구현을 함께 봐야 한다.'],['지도학습과 비지도학습','지도학습은 정답 레이블을 이용하고, 비지도학습은 레이블 없이 데이터의 구조나 패턴을 찾는다.','정답 예제가 충분한 예측 문제는 지도학습, 군집·차원 축소·탐색 문제는 비지도학습을 고려한다.'],['뮤텍스와 세마포어','뮤텍스는 소유권을 가진 상호 배제 잠금이고, 세마포어는 카운터로 자원 수나 실행 순서를 제어한다.','하나의 공유 임계영역 보호에는 뮤텍스, 제한된 개수의 자원 관리에는 세마포어가 적합할 수 있다.']];let found=pairs.find(p=>title.includes(p[0].split('와')[0])&&title.includes(p[0].split('와')[1]));if(!found){let first=title.split(/[·,:]/)[0];return `<p>${esc(m||'이 개념과 이름이 비슷한 용어는 해결하려는 문제, 적용 계층, 처리 단위, 보장하는 속성을 기준으로 구분해야 한다.')}</p><p><b>비교 기준:</b> 목적, 입력과 출력, 처리 순서, 필요한 자원, 성능 특성, 실패 시 영향의 여섯 가지 기준으로 정리하세요.</p>`;}return `<div class="table-wrap"><table class="compare"><thead><tr><th>비교 기준</th><th>${esc(found[0])}</th><th>선택 관점</th></tr></thead><tbody><tr><th>핵심 차이</th><td>${esc(found[1])}</td><td>${esc(found[2])}</td></tr><tr><th>면접에서 말할 점</th><td colspan="2">정의만 나열하지 말고 처리 방식이 어떤 결과 차이를 만드는지, 어떤 상황에서 선택하는지까지 연결한다.</td></tr></tbody></table></div>`;}
function qas(t){let q=(t[4]||[]).slice();while(q.length<2)q.push(`${t[0]}의 핵심 원리를 설명해보세요.`);let more=t[5]||t[1];return [...q.slice(0,3),`${t[0]}의 장점과 한계, 이를 보완하는 방법은 무엇입니까?`,`이 개념을 중·고등학생에게 가르친다면 어떤 사례나 활동을 활용하겠습니까?`].map((q,i)=>({q,a:i===0?`답변 방향: ${t[1]} 핵심 정의를 먼저 말하고, 어떤 문제를 해결하기 위해 필요한지 연결합니다.`:i===1?`답변 방향: ${t[5]||t[2]} 관련 개념과 비교할 때는 목적·동작 방식·적용 조건을 기준으로 설명합니다.`:i===2?`답변 방향: ${more} 해당 개념이 적용되는 조건과 예외를 구분하고, 무조건 성립한다고 단정하지 않습니다.`:i===3?`답변 방향: ${t[2]} 장점만 말하지 말고 성능·비용·복잡도·보안·확장성 중 해당하는 한계를 설명한 뒤 보완책을 제시합니다.`:`답변 방향: ${educationFor(subjects[currentSubject][1],t)} 활동 뒤 학생이 자신의 사고 과정을 말이나 도식으로 설명하도록 합니다.`}));}

 currentSubject=si;currentTopic=ti;

 </div>`;
 $('#doneBtn').onclick=()=>{let key=`${si}-${ti}`;done[key]=!done[key];save();progressUI();detail(si,ti);};
 $('#copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(oral);$('#copyBtn').textContent='복사 완료';}catch{let ta=document.createElement('textarea');ta.value=oral;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();$('#copyBtn').textContent='복사 완료';}};
 $('#prevBtn').onclick=()=>prev&&detail(prev.si,prev.ti);$('#nextBtn').onclick=()=>next?detail(next.si,next.ti):openSubject(si);
}
function search(q){query=q;let terms=q.toLowerCase().split(/\s+/).filter(Boolean),hits=[];allTopics().forEach(x=>{let corpus=[x.s[1],x.t[0],...x.t.slice(1).flatMap(v=>Array.isArray(v)?v:[v])].join(' ').toLowerCase();let score=terms.reduce((a,w)=>a+(corpus.includes(w)?1:0),0);if(score===terms.length&&score>0)hits.push({...x,score});});hits.sort((a,b)=>b.score-a.score||a.si-b.si||a.ti-b.ti);show('search');$('#searchView').innerHTML=`<h2>검색 결과</h2><p class="muted">“${esc(q)}” 검색 · ${hits.length}개 개념</p><div class="search-results">${hits.map(x=>`<article class="result" data-result="${x.si}-${x.ti}"><strong>${esc(x.s[1])} · ${esc(x.t[0])}</strong><small>${esc(x.t[1].slice(0,180))}…</small></article>`).join('')||'<div class="empty">검색 결과가 없습니다. 다른 단어로 검색해보세요.</div>'}</div>`;}
function progressView(){let n=doneCount();show('progress');$('#progressView').innerHTML=`<h2>학습 진도와 공부 방법</h2><div class="stats"><div class="stat"><strong>${count()}</strong><span>전체 개념</span></div><div class="stat"><strong>${n}</strong><span>학습 완료</span></div><div class="stat"><strong>${pct()}%</strong><span>전체 진도율</span></div><div class="stat"><strong>${11}</strong><span>학습 과목</span></div></div><div class="panel"><h3>과목별 학습 진도</h3>${subjects.map((s,i)=>{let d=s[3].filter((t,j)=>done[`${i}-${j}`]).length,p=Math.round(d/s[3].length*100);return `<div class="progress-subject"><span>${esc(s[1])}</span><div class="mini-bar"><i style="width:${p}%"></i></div><b>${d}/${s[3].length}</b></div>`}).join('')}</div><div class="panel"><h3>추천 학습 루틴</h3><ol><li>개념의 정의와 등장 배경을 읽고 해결하려는 문제를 한 문장으로 정리합니다.</li><li>구성 요소와 처리 과정을 순서도나 간단한 그림으로 표현합니다.</li><li>실제 사례를 하나 떠올리고 관련 개념과 차이를 설명합니다.</li><li>화면을 보지 않고 30~60초 구술 답변을 말합니다.</li><li>예상 질문과 꼬리 질문에 답한 뒤 학습 완료를 체크합니다.</li></ol></div><div class="panel"><h3>학습 데이터와 저장 안내</h3><p class="muted">학습 완료 여부와 마지막 학습 위치는 이 브라우저의 localStorage에 저장됩니다. 브라우저 데이터 삭제, 시크릿 모드, 다른 기기·브라우저에서는 진도가 공유되지 않습니다.</p><button class="btn" id="resetProgress">학습 진도 초기화</button></div>`;$('#resetProgress').onclick=()=>{if(confirm('저장된 학습 진도와 마지막 위치를 모두 초기화할까요?')){done={};last=null;save();progressUI();progressView();}};}
subjectNav();home();progressUI();
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){if(b.dataset.action==='home'){show('home');home();}else if(b.dataset.action==='progress')progressView();else if(b.dataset.action==='subject'){openSubject(Number(b.dataset.subjectBack));}return;}b=e.target.closest('[data-open-subject]');if(b){openSubject(Number(b.dataset.openSubject));return;}b=e.target.closest('[data-subject]');if(b){openSubject(Number(b.dataset.subject));return;}b=e.target.closest('[data-open-topic]');if(b){detail(currentSubject,Number(b.dataset.openTopic));return;}b=e.target.closest('[data-result]');if(b){let [si,ti]=b.dataset.result.split('-').map(Number);detail(si,ti);return;}});
$('#searchInput').addEventListener('input',e=>{let q=e.target.value.trim();if(q.length>=2)search(q);else if(view==='search'){show('home');home();}});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('show');$('#resumeBtn')?.addEventListener('click',()=>last&&detail(last.si,last.ti));
})();
</script></body></html>
